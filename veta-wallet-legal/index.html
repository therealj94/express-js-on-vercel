hr{border:0;border-top:1px solid var(--linea);margin:28px 0}
code{background:var(--panel);padding:2px 6px;border-radius:5px;font-size:14px}
a{color:var(--oro)}
footer{border-top:1px solid var(--linea);padding:24px 0 40px;color:#6C918E;font-size:13.5px;text-align:center}
