<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S · Orden Global</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   J.A.R.V.I.S · rediseño 14-ago
   Tres decisiones que lo cambian todo:
   1) JERARQUÍA: una tipografía de pantalla para identidad y frases; la mono
      queda SOLO para números y datos. Un dock, no dos raíles gemelos.
   2) PRESENCIA: el núcleo es un reactor que respira cuando habla, y la
      información se materializa en tarjetas mientras la voz la nombra.
   3) PROFUNDIDAD: niebla por distancia, bloom y paralaje. El cerebro es el
      héroe y ocupa el centro sin muebles encima.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#020610; --ink:#e8f2fb; --mut:#6d8ba1; --faint:#31485c;
  --arc:#56d9ff; --arc2:#2a9fd4; --gold:#ffc46b; --red:#ff5246; --green:#4fe6a4;
  --glass:rgba(6,16,28,.72); --glass2:rgba(8,20,34,.86); --edge:rgba(86,217,255,.14);
  --disp:"Avenir Next","SF Pro Display",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{color:var(--ink);font:14px/1.5 var(--disp);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{position:fixed;inset:0;display:block}
#lienzo{touch-action:none;cursor:grab}#lienzo.gira{cursor:grabbing}

/* ── cabecera ───────────────────────────────────────────────────────────── */
.hud{position:fixed;z-index:10}
#izq{top:max(16px,env(safe-area-inset-top));left:22px}
#izq h1{font-size:17px;font-weight:600;letter-spacing:.5em;font-family:var(--disp)}
#izq h1 i{font-style:normal;color:var(--arc)}
#izq .s{font-size:9px;color:var(--mut);letter-spacing:.34em;margin-top:4px;font-weight:500}
#der{top:max(16px,env(safe-area-inset-top));right:22px;text-align:right}
#reloj{font:300 22px/1.1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.06em}
#fecha{font-size:9px;color:var(--mut);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
#act{font-size:8.5px;color:var(--faint);letter-spacing:.16em;margin-top:3px;text-transform:uppercase}

/* identidad: quién entró */
#yo{position:fixed;z-index:10;top:max(16px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--edge);border-radius:999px;
  padding:6px 16px 6px 7px;backdrop-filter:blur(14px)}
#yo .disco{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--arc2),var(--arc));color:#02131f;
  font:700 12px var(--disp)}
#yo .qn{font-size:11px;font-weight:600;letter-spacing:.14em}
#yo .qs{display:block;font-size:8px;color:var(--mut);letter-spacing:.2em}
#yo .p{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 10px var(--green);animation:late 1.6s steps(2) infinite;margin-left:4px}
@keyframes late{50%{opacity:.35}}
#yo.mal .p{background:var(--red);box-shadow:0 0 10px var(--red)}

/* ── el dock (derecha): equipo + sistemas, con jerarquía ────────────────── */
#dock{position:fixed;z-index:10;right:16px;top:50%;transform:translateY(-50%);
  width:250px;max-height:82vh;overflow-y:auto;border-radius:14px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);
  scrollbar-width:none;padding-bottom:6px}
#dock::-webkit-scrollbar{display:none}
#dock h3{font:600 9px var(--disp);letter-spacing:.3em;color:var(--mut);
  padding:12px 14px 7px;position:sticky;top:0;background:var(--glass2);z-index:2}
.fila{display:flex;align-items:center;gap:9px;padding:6px 14px;cursor:pointer;
  transition:background .15s}
.fila:hover,.fila:focus-visible{background:rgba(86,217,255,.07);outline:none}
.fila .cn{width:7px;height:7px;flex:none;border-radius:50%}
.fila .nom{font:600 10.5px var(--disp);letter-spacing:.08em}
.fila .est{display:block;font:500 8px var(--disp);letter-spacing:.14em;color:var(--mut);
  text-transform:uppercase}
.fila .met{font:10px var(--mono);color:var(--mut);margin-left:auto;text-align:right;
  max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila.mal .nom,.fila.mal .est{color:var(--red)}
.fila.avi .nom{color:var(--gold)}
.fila.habla{background:rgba(86,217,255,.12);box-shadow:inset 2px 0 0 var(--arc)}

/* ── tarjetas holográficas: lo que aparece mientras habla ───────────────── */
#tarjetas{position:fixed;z-index:9;left:22px;bottom:170px;display:flex;
  flex-direction:column;gap:10px;width:min(290px,42vw);pointer-events:none}
.tarj{background:var(--glass2);border:1px solid var(--edge);border-radius:12px;
  padding:12px 14px;backdrop-filter:blur(16px);opacity:0;transform:translateY(14px);
  transition:opacity .45s,transform .45s;border-left:3px solid var(--arc);
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tarj.viva{opacity:1;transform:none}
.tarj .cab{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.tarj img{width:20px;height:20px;border-radius:5px;object-fit:cover}
.tarj .tn{font:600 12px var(--disp);letter-spacing:.1em}
.tarj .te{margin-left:auto;font:600 8px var(--disp);letter-spacing:.16em;color:var(--mut);
  text-transform:uppercase}
.tarj .kv{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;
  border-top:1px solid rgba(86,217,255,.07)}
.tarj .kv b{font-weight:500;color:var(--mut);font-family:var(--disp)}
.tarj .kv span{font-family:var(--mono);font-size:10.5px}

/* ── la consola del asistente ───────────────────────────────────────────── */
#consola{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:10px;width:min(760px,94vw)}
#sub{text-align:center;font:400 15px/1.6 var(--disp);min-height:46px;
  color:var(--ink);text-shadow:0 2px 24px rgba(86,217,255,.25);max-width:640px}
#sub .quien{display:block;font:600 9px var(--disp);letter-spacing:.3em;color:var(--arc);
  margin-bottom:4px;text-transform:uppercase}
#oido{text-align:center;font:italic 12px var(--disp);color:var(--gold);min-height:16px}
#siono{display:none;gap:10px}
#siono.abre{display:flex}
#siono .tecla{padding:9px 26px;border-color:rgba(86,217,255,.35)}
#pistas{font:11px var(--disp);color:var(--mut);min-height:16px;text-align:center;
  transition:opacity .5s;letter-spacing:.03em}
#teclas{display:flex;gap:10px;align-items:center;justify-content:center}
.tecla{display:flex;align-items:center;gap:8px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);
  padding:11px 20px;font:600 10px var(--disp);letter-spacing:.2em;transition:all .2s}
.tecla:hover{border-color:rgba(86,217,255,.4)}
.tecla:active{transform:scale(.96)}
.tecla:focus-visible{outline:1px solid var(--arc);outline-offset:2px}
#mic{width:64px;height:64px;border-radius:50%;padding:0;justify-content:center;
  font-size:22px;border-color:rgba(86,217,255,.45);color:var(--arc);
  box-shadow:0 0 34px rgba(86,217,255,.16),inset 0 0 18px rgba(86,217,255,.06)}
#mic.on{border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 40px rgba(255,196,107,.3);animation:resp 1.6s ease-in-out infinite}
@keyframes resp{50%{transform:scale(1.06)}}
#hablar.on{border-color:var(--red);color:var(--red)}
#onda{display:inline-flex;gap:2px;align-items:center;height:11px}
#onda i{width:2px;background:currentColor;height:3px;border-radius:1px}
.on #onda i{animation:onda .6s ease-in-out infinite}
.on #onda i:nth-child(2){animation-delay:.09s}.on #onda i:nth-child(3){animation-delay:.18s}
.on #onda i:nth-child(4){animation-delay:.27s}.on #onda i:nth-child(5){animation-delay:.36s}
@keyframes onda{50%{height:11px}}

/* ajustes: voz, velocidad e idioma, fuera del medio */
#ajustes{position:fixed;z-index:15;right:16px;bottom:max(16px,env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:12px;background:var(--glass2);
  border:1px solid var(--edge);border-radius:14px;padding:16px;width:240px;
  backdrop-filter:blur(18px)}
#ajustes.abre{display:flex}
#ajustes label{font:600 8.5px var(--disp);letter-spacing:.24em;color:var(--mut)}
select{border:1px solid var(--edge);border-radius:8px;background:rgba(4,12,22,.9);
  color:var(--ink);font:12px var(--disp);padding:9px 10px;width:100%}
.vels{display:flex;gap:6px}
.vels button{flex:1;border:1px solid var(--edge);border-radius:8px;padding:8px 0;
  font:600 10px var(--disp);letter-spacing:.1em;color:var(--mut)}
.vels button.on{color:var(--arc);border-color:rgba(86,217,255,.5);
  background:rgba(86,217,255,.08)}

/* ── panel de detalle ───────────────────────────────────────────────────── */
#det{position:fixed;z-index:20;inset:0;display:none;place-items:center;
  background:rgba(2,6,16,.8);backdrop-filter:blur(10px);padding:18px}
#det.abre{display:grid}
#det article{width:min(700px,96vw);max-height:84vh;overflow-y:auto;border-radius:16px;
  border:1px solid var(--edge);background:var(--glass2);padding:26px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
#det h2{font:600 16px var(--disp);letter-spacing:.24em;margin-bottom:3px}
#det .sub2{font-size:10px;color:var(--mut);letter-spacing:.18em;margin-bottom:16px;
  text-transform:uppercase}
#det h4{font:600 9.5px var(--disp);letter-spacing:.26em;color:var(--gold);margin:18px 0 7px}
#det li{font-size:13.5px;line-height:1.75;list-style:none;color:#c9dcec}
#det li::before{content:"— ";color:var(--faint)}
#det li.mala::before{content:"✕ ";color:var(--red)}#det li.mala{color:var(--red)}
#det li.ojo::before{content:"! ";color:var(--gold)}
#det .kv{display:flex;gap:12px;font-size:12.5px;padding:4px 0;
  border-bottom:1px solid rgba(86,217,255,.06)}
#det .kv b{font-weight:500;color:var(--mut);min-width:170px}
#det .kv span{font-family:var(--mono);font-size:12px}
#cerrar{position:sticky;float:right;top:0;color:var(--mut);font-size:19px;padding:0 6px}

/* ── la puerta ──────────────────────────────────────────────────────────── */
#puerta{position:fixed;z-index:40;inset:0;display:none;place-items:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(16,52,80,.55),rgba(2,6,16,.97) 68%)}
#puerta.abre{display:grid}
#puerta .caja{text-align:center;padding:30px;max-width:520px}
#puerta h2{font:200 34px var(--disp);letter-spacing:.55em;margin-bottom:6px;
  text-shadow:0 0 40px rgba(86,217,255,.5)}
#puerta .p1{font-size:11px;color:var(--mut);letter-spacing:.3em;margin-bottom:34px;
  text-transform:uppercase}
#puerta .botones{display:flex;gap:14px;justify-content:center}
.tecla.grande{padding:18px 38px;font-size:12px;letter-spacing:.26em;border-radius:14px;
  border-color:rgba(86,217,255,.35);color:var(--arc)}
.tecla.grande:hover{background:rgba(86,217,255,.09);box-shadow:0 0 40px rgba(86,217,255,.18)}
#puerta .p2{font-size:10px;color:var(--faint);margin-top:30px;line-height:1.9}

/* ── modo presentación: contadores que suben ────────────────────────────── */
#cifras{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);
  display:none;gap:38px;pointer-events:none;text-align:center}
#cifras.abre{display:flex}
#cifras .c{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
#cifras .c.viva{opacity:1;transform:none}
#cifras .n{font:200 62px/1 var(--disp);color:var(--arc);
  text-shadow:0 0 50px rgba(86,217,255,.55);font-variant-numeric:tabular-nums}
#cifras .e{font:600 10px var(--disp);letter-spacing:.28em;color:var(--mut);
  margin-top:10px;text-transform:uppercase}

/* ── la transacción en vivo: el momento que cierra ──────────────────────── */
#vivo{position:fixed;z-index:22;inset:0;display:none;place-items:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(10,40,64,.62),rgba(2,6,16,.95) 70%);
  backdrop-filter:blur(8px)}
#vivo.abre{display:grid}
#vivo .caja{text-align:center;max-width:640px;padding:30px}
#vivo .et{font:600 10px var(--disp);letter-spacing:.32em;color:var(--mut);
  text-transform:uppercase;margin-bottom:16px}
#vivo .estado{font:200 30px var(--disp);letter-spacing:.06em;margin-bottom:26px;min-height:38px}
#vivo .hash{font:13px var(--mono);color:var(--arc);word-break:break-all;
  border:1px solid var(--edge);border-radius:10px;padding:14px;background:var(--glass2);
  line-height:1.7}
#vivo .rej{display:flex;gap:34px;justify-content:center;margin:24px 0 8px}
#vivo .rej div{text-align:center}
#vivo .rej b{display:block;font:200 34px var(--disp);color:var(--ink);
  font-variant-numeric:tabular-nums}
#vivo .rej span{font:600 9px var(--disp);letter-spacing:.22em;color:var(--mut);
  text-transform:uppercase}
#vivo a{display:inline-block;margin-top:20px;color:var(--arc);font-size:12px;
  border-bottom:1px solid rgba(86,217,255,.4);text-decoration:none;padding-bottom:2px}
#vivo .cerrar2{margin-top:26px}

/* ── el enlace de invitación ────────────────────────────────────────────── */
#invit{font:11px var(--mono);color:var(--arc);word-break:break-all;
  background:rgba(4,12,22,.9);border:1px solid var(--edge);border-radius:8px;
  padding:10px;margin-top:4px;display:none}
#invit.abre{display:block}

/* ── modo sala: para una tele o un proyector ────────────────────────────── */
body.sala #sub{font-size:24px;line-height:1.55;max-width:900px}
body.sala .fila .nom{font-size:13px}
body.sala .fila .est{font-size:10px}
body.sala .fila .met{font-size:12px}
body.sala #dock{width:320px}
body.sala #izq h1{font-size:23px}
body.sala #reloj{font-size:30px}
body.sala #cifras .n{font-size:88px}
body.sala .tarj .tn{font-size:16px}
body.sala .tarj .kv{font-size:14px}
body.sala .tarj .kv span{font-size:13.5px}
body.sala #pistas{font-size:14px}

/* en modo invitado no hay dock interno ni ajustes de fondo */
body.invitado #dock,body.invitado #btnAjustes{display:none}
body.invitado #tarjetas{left:50%;transform:translateX(-50%);bottom:150px;
  flex-direction:row;width:auto;max-width:92vw}
body.invitado .tarj{width:250px}

@media (max-width:1000px){
  #cifras{gap:20px}#cifras .n{font-size:38px}
  #dock{top:auto;bottom:172px;transform:none;right:10px;left:auto;width:230px;max-height:32vh}
  #tarjetas{bottom:172px;width:min(250px,46vw)}
  #yo .qs{display:none}
  #sub{font-size:12.5px}#reloj{font-size:15px}#izq h1{font-size:13px}
}
@media (max-width:640px){#fecha,#act{display:none}#tarjetas{display:none}}
@media (prefers-reduced-motion:reduce){#yo .p,.on #onda i,#mic.on{animation:none}}
</style>
</head>
<body>
<canvas id="fondo"></canvas>
<canvas id="lienzo"></canvas>

<div class="hud" id="izq">
  <h1>J.A.R.V.I.S<i>_</i></h1>
  <div class="s" id="lema">ORDEN GLOBAL · CONTROL CORE</div>
</div>
<div id="yo"><div class="disco" id="disco">·</div>
  <span><span class="qn" id="quienNom">ORDEN GLOBAL</span>
  <span class="qs"><span id="modo">ONLINE</span> · <span id="cuenta">— / —</span></span></span>
  <span id="pulso"><span class="p"></span></span></div>
<div class="hud" id="der"><div id="reloj">--:--:--</div><div id="fecha"></div>
  <div id="act"></div></div>

<aside id="dock">
  <h3 id="tAg">THE TEAM</h3><div id="agentes"></div>
  <h3 id="tSis">SYSTEMS</h3><div id="sistemas"></div>
</aside>
<div id="tarjetas"></div>
<div id="cifras"></div>

<div id="vivo"><div class="caja">
  <div class="et" id="vivoEt">TRANSACCIÓN EN VIVO · RED DE PRUEBAS</div>
  <div class="estado" id="vivoEstado"></div>
  <div class="rej" id="vivoRej"></div>
  <div class="hash" id="vivoHash"></div>
  <a id="vivoLink" target="_blank" rel="noopener"></a>
  <div><button class="tecla cerrar2" id="vivoCerrar">CERRAR</button></div>
</div></div>

<div id="consola">
  <div id="sub"></div>
  <div id="oido"></div>
  <div id="siono"><button class="tecla" id="btnSi">SÍ</button><button class="tecla" id="btnNo">NO</button></div>
  <div id="pistas"></div>
  <div id="teclas">
    <button class="tecla" id="hablar"><span id="onda"><i></i><i></i><i></i><i></i><i></i></span><span id="lblHablar">BRIEF ME</span></button>
    <button class="tecla" id="mic" title="speak">◉<span id="lblMic" style="display:none"></span></button>
    <button class="tecla" id="btnTexto">▤ <span id="lblTexto">REPORT</span></button>
    <button class="tecla" id="btnAyuda">?</button>
    <button class="tecla" id="btnPresenta">▶ <span id="lblPresenta">TOUR</span></button>
    <button class="tecla" id="btnVivo">◈ <span id="lblVivo">LIVE</span></button>
    <button class="tecla" id="btnAjustes">⚙</button>
  </div>
</div>

<div id="puerta">
  <div class="caja">
    <h2>J.A.R.V.I.S</h2>
    <p class="p1">Orden Global · Control Core</p>
    <div class="botones">
      <button class="tecla grande" data-idi="es">ESPAÑOL</button>
      <button class="tecla grande" data-idi="en">ENGLISH</button>
    </div>
    <p class="p2">Se mantiene en todo: la voz, las respuestas y la pantalla.<br>
       It sticks everywhere: voice, answers and screen.</p>
  </div>
</div>

<div id="ajustes">
  <label id="lblVoz">VOICE</label><select id="voces" title="voice"></select>
  <label id="lblVel">SPEED</label>
  <div class="vels">
    <button data-vel="0.82">LENTO</button><button data-vel="1">NORMAL</button><button data-vel="1.15">RÁPIDO</button>
  </div>
  <label id="lblIdi">LANGUAGE</label>
  <select id="idioma" title="language">
    <option value="en">ENGLISH</option><option value="es">ESPAÑOL</option>
  </select>
  <label id="lblSala">PRESENTACIÓN</label>
  <div class="vels otros">
    <button id="btnSala">SALA</button><button id="btnDolar">EL DÓLAR</button>
  </div>
  <label id="lblInv">INVITAR</label>
  <button class="tecla" id="btnInvitar" style="justify-content:center">CREAR ENLACE · 24 H</button>
  <div id="invit"></div>
</div>

<div id="det"><article><button id="cerrar">✕</button>
  <h2 id="detTit"></h2><div class="sub2" id="detSub"></div><div id="detCuerpo"></div>
</article></div>

<script>
/* ═══ 0 · IDIOMA ══════════════════════════════════════════════════════════
   Inglés primero, porque JARVIS habla inglés. El español está entero
   detrás del selector: no es una traducción a medias. */
let IDI = localStorage.getItem('idiomaCerebro') || 'en';
const IDIOMA_ELEGIDO = !!localStorage.getItem('idiomaCerebro');

/* Quién entró. Caddy pasa el usuario autenticado y JARVIS saluda por su
   nombre: no es lo mismo hablarle a José que a un miembro de la Junta. */
let QUIEN={usuario:'',nombre:''};
const JUNTA={jose:{es:'José',en:'sir'},leonardo:{es:'Leonardo',en:'Leonardo'},
             melany:{es:'Melany',en:'Melany'},medardo:{es:'Medardo',en:'Medardo'}};
const NOM=()=>{const q=JUNTA[QUIEN.usuario];return q?q[IDI]:(IDI==='en'?'sir':'José');};
async function quienEs(){if(INVITADO){$('#quienNom').textContent='ORDEN GLOBAL';$('#disco').textContent='◈';return;} try{
  const j=await(await fetch('/ordenes/quien',{cache:'no-store'})).json();
  QUIEN.usuario=(j.usuario||'').toLowerCase();
  const q=JUNTA[QUIEN.usuario]; QUIEN.nombre=q?q.es:'';
  if(QUIEN.nombre){$('#quienNom').textContent=QUIEN.nombre.toUpperCase();
    $('#disco').textContent=QUIEN.nombre[0].toUpperCase();}
}catch(e){}}

/* La velocidad de la voz, ajustable por voz («más despacio») y recordada. */
const velSana=v=>(isFinite(v)&&v>0)?Math.max(.55,Math.min(1.6,v)):1;

/* ═══ 2 · LA GEOMETRÍA DEL CEREBRO ════════════════════════════════════════
   Tres capas, y las tres hacen falta para que se lea como UN órgano y no
   como puntos sueltos —que era el problema del dibujo anterior—:
     · la CORTEZA, una piel de dos lóbulos con su fisura;
     · los RACIMOS, un núcleo por sistema con sus neuronas alrededor;
     · los AXONES, que unen racimo con racimo y con el centro. */
const L=document.getElementById('lienzo'), cx=L.getContext('2d');

let W,H,ESC;
function medir(){

  W=innerWidth;H=innerHeight;
  for(const c of [L,F]){c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';}
  cx.setTransform(d,0,0,d,0,0);fx.setTransform(d,0,0,d,0,0);
  ESC=Math.min(W,H)*0.36; fondo();
}
addEventListener('resize',medir);

const az=()=>Math.random();
function gauss(){let u=0,v=0;while(!u)u=az();while(!v)v=az();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);}

/* La superficie del cerebro: elipsoide alargado, aplastado arriba, con la
   fisura longitudinal que separa los dos lóbulos. */
function piel(){
  let v=[gauss(),gauss(),gauss()];
  const m=Math.hypot(...v)||1; v=v.map(x=>x/m);
  v[0]*=1.00; v[1]*=0.76; v[2]*=1.22;
  const s=v[0]>=0?1:-1;                       // la fisura: se aparta del centro
  v[0]=s*(Math.abs(v[0])*0.80+0.17);
  if(v[1]>0)v[1]*=0.88;                        // aplastado por arriba
  const r=1+0.035*Math.sin(v[2]*11)*Math.cos(v[1]*9);   // los surcos
  return v.map(x=>x*r);
}

const NEU=[];           // todas las neuronas: {p:[x,y,z], sis, nucleo}
const HILOS=[];         // enlaces finos: [i,j,alfa]
const CORTEZA=[];
for(let i=0;i<950;i++){CORTEZA.push(NEU.length);NEU.push({p:piel(),sis:null,nucleo:false});}

/* Cada racimo: un núcleo hacia dentro y sus neuronas alrededor. */
const NUCLEO={};
for(const s of SIS){
  const d=Math.hypot(...s.a)||1;
  const c=s.a.map(x=>x/d*(0.74+((s.n%3)*0.06)));
  NUCLEO[s.id]=NEU.length;
  NEU.push({p:c,sis:s.id,nucleo:true});
  for(let i=0;i<s.n;i++){
    const o=[gauss(),gauss(),gauss()];const m=Math.hypot(...o)||1;
    const r=0.13+az()*0.17;
    NEU.push({p:c.map((x,k)=>x+o[k]/m*r),sis:s.id,nucleo:false});
    HILOS.push([NUCLEO[s.id],NEU.length-1,0.5]);
  }
}
/* La piel se cose a sí misma con sus tres vecinos más cercanos. Sin esto la
   corteza es confeti; con esto es una superficie. */
for(const i of CORTEZA){
  const d=CORTEZA.map(j=>[j===i?9:dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<3;k++)if(d[k][0]<0.40)HILOS.push([i,d[k][1],0.34]);
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}
/* Y cada racimo se ancla a la corteza que tiene encima. */
for(const s of SIS){
  const i=NUCLEO[s.id];
  const d=CORTEZA.map(j=>[dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<4;k++)HILOS.push([i,d[k][1],0.2]);
}

/* ═══ 3 · IMPULSOS ═══════════════════════════════════════════════════════
   Un impulso recorre un axón de punta a punta. Salen cuando pasa algo:
   JARVIS nombra un sistema, un agente habla, llega un bloque nuevo. En
   reposo hay tráfico tenue, para que el cerebro respire sin gritar. */
const IMPULSOS=[];
function impulso(de,a,col,vel){
  IMPULSOS.push({de:NUCLEO[de],a:a==='centro'?-1:NUCLEO[a],t:0,
    vel:vel||(0.011+az()*0.006),col:col||'#5ad9ff'});
}
function disparar(id,fuerte){
  const s=S(id); if(!s)return;
  E[id].fuego=1;
  impulso(id,'centro',s.col,fuerte?0.02:0.013);
  for(const [a,b] of AXONES){
    if(a===id)impulso(a,b,s.col);
    else if(b===id)impulso(b,a,s.col);
  }
}
setInterval(()=>{                    // tráfico de fondo
  if(document.hidden)return;
  const e=AXONES[(az()*AXONES.length)|0];
  IMPULSOS.push({de:NUCLEO[e[0]],a:NUCLEO[e[1]],t:0,vel:0.006,col:'#1a7fa8',tenue:true});
},900);

/* ═══ 4 · DIBUJO ═════════════════════════════════════════════════════════ */
let rY=.55,rX=-.12,arr=null,giroLibre=true,paraX=0,paraY=0;

/* ═══ LA CÁMARA ═══════════════════════════════════════════════════════════
   Volar hasta un racimo, no girar hasta que pase por delante. Se resuelve
   qué rotación deja ese punto mirando a la cámara y se va hacia ella con
   suavizado; el zoom acompaña y lo demás se atenúa. Es la diferencia entre
   un salvapantallas y una presentación. */
let ZOOM=1, camDestino=null, FOCO=null;
function volarA(id,zoom){
  const sx=S(id); if(!sx)return;
  const [ax,ay,az]=sx.a, h=Math.hypot(ax,az)||1e-6;
  let ty=Math.atan2(ax,az)+Math.PI;            // deja el racimo de frente
  const tx=-Math.atan2(ay,h);
  while(ty-rY> Math.PI)ty-=6.283185;           // por el camino más corto
  while(ty-rY<-Math.PI)ty+=6.283185;
  camDestino={rY:ty, rX:Math.max(-1,Math.min(1,tx)), zoom:zoom||1.45};
  FOCO=id; giroLibre=false;
}
function soltarCamara(){camDestino={rY:rY,rX:-.12,zoom:1};FOCO=null;
  setTimeout(()=>{giroLibre=true;camDestino=null;},1400);}
addEventListener('pointermove',e=>{if(arr)return;
  paraX=(e.clientX/W-.5)*.09; paraY=(e.clientY/H-.5)*.05;},{passive:true});
L.addEventListener('pointerdown',e=>{arr=[e.clientX,e.clientY];L.classList.add('gira');
  L.setPointerCapture(e.pointerId);});
L.addEventListener('pointermove',e=>{if(!arr)return;giroLibre=false;
  rY+=(e.clientX-arr[0])*.005;rX=Math.max(-.9,Math.min(.9,rX+(e.clientY-arr[1])*.003));
  arr=[e.clientX,e.clientY];});
L.addEventListener('pointerup',e=>{
  if(arr&&Math.abs(e.clientX-arr[0])<4&&Math.abs(e.clientY-arr[1])<4)tocar(e.clientX,e.clientY);
  arr=null;L.classList.remove('gira');setTimeout(()=>giroLibre=true,2600);});

const pr=[];    // proyección de cada neurona, recalculada cada cuadro
function proyectar(){
  const c1=Math.cos(rY),s1=Math.sin(rY),c2=Math.cos(rX),s2=Math.sin(rX);
  for(let i=0;i<NEU.length;i++){
    const[x0,y0,z0]=NEU[i].p;
    const x=x0*c1-z0*s1, z1=x0*s1+z0*c1;
    const y=y0*c2-z1*s2, z=y0*s2+z1*c2;
    const f=2.9/(2.9+z);
    pr[i]=[W/2+x*ESC*ZOOM*f, H/2+y*ESC*ZOOM*f, f, z];
  }
}
function centro(){return [W/2,H/2,1,0];}

function fondo(){
  fx.clearRect(0,0,W,H);
  const g=fx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(12,44,68,.5)');g.addColorStop(.55,'rgba(4,16,26,.3)');
  g.addColorStop(1,'rgba(1,5,9,0)');
  fx.fillStyle=g;fx.fillRect(0,0,W,H);
}

let ultimo=0;
function cuadro(ts){
  const dt=Math.min(60,ts-ultimo)||16; ultimo=ts;
  if(giroLibre&&!document.hidden)rY+=0.00022*dt;
  if(camDestino){
    const k=1-Math.pow(0.0016,dt/1000);         // suavizado independiente del cuadro
    rY+=(camDestino.rY-rY)*k; rX+=(camDestino.rX-rX)*k;
    ZOOM+=(camDestino.zoom-ZOOM)*k;
  }else{
    rX+=((paraY-.12)-rX)*.02;                   // el cabeceo sigue al puntero
    ZOOM+=(1-ZOOM)*.02;
  }
  proyectar();
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';

  /* los hilos finos: la carne del cerebro */
  for(const[i,j,al] of HILOS){
    const A=pr[i],B=pr[j];
    if(A[3]>1.5&&B[3]>1.5)continue;
    const p=Math.max(0,Math.min(1,(A[2]+B[2])/2-.55));
    cx.strokeStyle='rgba(90,217,255,'+(al*p*1.15).toFixed(3)+')';
    cx.lineWidth=.5;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* los axones: gruesos, y se encienden con el estado del sistema */
  for(const[a,b] of AXONES){
    const A=pr[NUCLEO[a]],B=pr[NUCLEO[b]];
    const mal=E[a].mal||E[b].mal;
    const v=Math.max(E[a].fuego,E[b].fuego);
    cx.strokeStyle=mal?'rgba(255,74,61,'+(.20+v*.5).toFixed(2)+')'
                      :'rgba(90,217,255,'+(.09+v*.30).toFixed(2)+')';
    cx.lineWidth=mal?1.2:.9;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* las neuronas */
  for(let i=0;i<NEU.length;i++){
    const n=NEU[i],P=pr[i];
    if(n.sis){
      const e=E[n.sis],s=S(n.sis);
      const at=(FOCO&&n.sis!==FOCO)?0.22:1;      // profundidad de campo, a mano
      const r=(n.nucleo?3.1:1.35)*P[2]*(FOCO&&n.sis===FOCO?1.25:1);
      cx.fillStyle=e.mal?'rgba(255,74,61,'+((.55+e.fuego*.45)*at).toFixed(2)+')'
        :hexA(s.col,((n.nucleo?.55:.30)+e.fuego*.45)*at);
      if(n.nucleo){cx.shadowColor=e.mal?'#ff4a3d':s.col;cx.shadowBlur=16*e.fuego+7;}
      cx.beginPath();cx.arc(P[0],P[1],r,0,6.283);cx.fill();cx.shadowBlur=0;
    }else{
      /* niebla de profundidad: lo cercano es claro y grande, lo lejano se
         hunde en azul oscuro. Esto es lo que hace que se lea 3D. */
      const z=Math.max(0,Math.min(1,(P[2]-.55)*1.6));
      cx.fillStyle='rgba('+(90+z*90)+','+(160+z*70)+','+(210+z*45)+','+(0.04+z*0.30).toFixed(3)+')';
      cx.beginPath();cx.arc(P[0],P[1],(0.6+z*1.1),0,6.283);cx.fill();
    }
  }

  /* los impulsos: esto es lo que hace que se vea que está haciendo algo */
  for(let k=IMPULSOS.length-1;k>=0;k--){
    const m=IMPULSOS[k];
    m.t+=m.vel*dt/16;
    if(m.t>=1){IMPULSOS.splice(k,1);continue;}
    const A=pr[m.de], B=m.a<0?centro():pr[m.a];
    const x=A[0]+(B[0]-A[0])*m.t, y=A[1]+(B[1]-A[1])*m.t;
    const cola=Math.max(0,m.t-0.16);
    const xc=A[0]+(B[0]-A[0])*cola, yc=A[1]+(B[1]-A[1])*cola;
    cx.strokeStyle=hexA(m.col,m.tenue?.22:.7);
    cx.lineWidth=m.tenue?1:2;
    cx.beginPath();cx.moveTo(xc,yc);cx.lineTo(x,y);cx.stroke();
    if(!m.tenue){
      cx.fillStyle=m.col;cx.shadowColor=m.col;cx.shadowBlur=12;
      cx.beginPath();cx.arc(x,y,2.1,0,6.283);cx.fill();cx.shadowBlur=0;
    }
  }

  /* EL REACTOR. Cuando habla, respira: tres anillos concéntricos y un arco
     que gira. Es la presencia física del asistente. */
  const amp=hablando?(0.75+0.25*Math.sin(ts/95)+0.12*Math.sin(ts/41)):(0.28+0.08*Math.sin(ts/900));
  const cxx=W/2,cyy=H/2;
  cx.shadowColor='#56d9ff';
  for(const[r0,g0,a0] of [[46,26,.05],[26,14,.10],[11,30,.30]]){
    cx.fillStyle='rgba(86,217,255,'+(a0*amp*2).toFixed(3)+')';
    cx.shadowBlur=g0+amp*34;
    cx.beginPath();cx.arc(cxx,cyy,r0*(.75+amp*.5),0,6.283);cx.fill();
  }
  cx.shadowBlur=0;
  cx.strokeStyle='rgba(86,217,255,'+(.14+amp*.5).toFixed(3)+')';
  cx.lineWidth=1.6;
  cx.beginPath();cx.arc(cxx,cyy,34+amp*10,ts/700,ts/700+4.4);cx.stroke();
  cx.strokeStyle='rgba(255,196,107,'+(.06+amp*.24).toFixed(3)+')';
  cx.beginPath();cx.arc(cxx,cyy,42+amp*12,-ts/1100,-ts/1100+2.2);cx.stroke();

  cx.globalCompositeOperation='source-over';
  etiquetas();
  for(const s of SIS)E[s.id].fuego=Math.max(E[s.id].mal?.42:.12,E[s.id].fuego-0.0016*dt);
  requestAnimationFrame(cuadro);
}
function hexA(h,a){const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')';}

/* Etiquetas en el propio lienzo, y solo las que miran hacia delante. Si dos
   se pisan, gana la que está más cerca: mejor menos texto que texto ilegible. */
const cajas=[];
function etiquetas(){
  cajas.length=0;
  const orden=SIS.map(s=>[pr[NUCLEO[s.id]],s]).sort((a,b)=>a[0][3]-b[0][3]);
  cx.textBaseline='middle';
  for(const [P,s] of orden){
    if(P[3]>0.35)continue;
    const e=E[s.id];
    const nom=IDI==='en'?s.nom:s.es;
    cx.font='700 9.5px '+getComputedStyle(document.body).fontFamily;
    const w=cx.measureText(nom).width+12, x=P[0]+11, y=P[1];
    if(cajas.some(c=>x<c[0]+c[2]&&x+w>c[0]&&y-9<c[1]+c[3]&&y+9>c[1]))continue;
    cajas.push([x,y-9,w,18]);
    s._caja=[x,y-9,w,26];
    cx.fillStyle='rgba(1,5,9,.82)';cx.fillRect(x,y-9,w,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;cx.fillRect(x,y-9,1.5,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;
    cx.fillText(nom,x+7,y-1);
    cx.font='400 7.5px '+getComputedStyle(document.body).fontFamily;
    cx.fillStyle='#5d7d93';cx.fillText(e.met.slice(0,26),x+7,y+9);
  }
}
function tocar(x,y){
  for(const s of SIS){const c=s._caja;
    if(c&&x>=c[0]&&x<=c[0]+c[2]&&y>=c[1]&&y<=c[1]+c[3]){abrirSis(s);return;}}
  let mejor=null,dm=34;
  for(const s of SIS){const P=pr[NUCLEO[s.id]];
    const d=Math.hypot(P[0]-x,P[1]-y);if(d<dm){dm=d;mejor=s;}}
  if(mejor)abrirSis(mejor);
}

/* ═══ 7 · LA VOZ ═════════════════════════════════════════════════════════
   JARVIS es inglés británico, grave y sin prisa. Los agentes llevan cada
   uno una voz distinta, para que se sepa quién habla sin mirar la pantalla.
   Se elige la mejor que tenga el aparato, y la elección se recuerda. */
const JARVIS=[/Daniel/i,/Arthur/i,/Oliver/i,/George/i,/Ryan/i,/Brian/i,
  /UK English Male/i,/British/i,/en-GB/i];
const BUENAS_EN=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Alex/i,/Samantha/i];
const BUENAS_ES=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Mónica|Monica/i,/Paulina/i,
  /Jorge/i,/Juan/i,/Helena/i,/Laura/i,/Sabina/i];
/* Las voces se guardan POR NOMBRE, no por objeto. En iOS un objeto de voz
   obtenido antes de un 'voiceschanged' se queda rancio: asignarlo enmudece la
   frase sin dar ningún error. Se vuelve a buscar por nombre al hablar. */
let voces=[],nombreJarvis=null,nombreAgente={};
const vozPorNombre=n=>n?(speechSynthesis.getVoices().find(v=>v.name===n)||null):null;

/* En qué idioma está escrito ESTE texto. Los partes de los agentes vienen en
   castellano aunque el tablero esté en inglés, y leerlos con voz inglesa es
   lo que sonaba a robot. Se cuentan marcas propias de cada idioma; con la ñ,
   los acentos y los signos de apertura sobra casi siempre. */
function idiomaDe(x){
  const s=' '+String(x).toLowerCase()+' ';
  if(/[ñáéíóú¿¡]/.test(s))return 'es';
  const es=(s.match(/ (que|de|la|el|los|las|con|para|una|del|por|se|no|es|y|en|al|su|lo|sin|ya) /g)||[]).length;
  const en=(s.match(/ (the|and|of|is|to|in|for|with|that|are|was|it|on|as|at|by|from|has|not) /g)||[]).length;
  if(es===en)return IDI;
  return es>en?'es':'en';
}
/* Una voz de ese idioma, y distinta para los agentes si se puede. */
function vozDeIdioma(idi,agente){
  const todas=speechSynthesis.getVoices().filter(v=>new RegExp('^'+idi,'i').test(v.lang||''));
  if(!todas.length)return null;
  if(!agente)return todas[0];
  const k=AGENTES.findIndex(a=>a.id===agente);
  return todas[(Math.max(0,k)+1)%todas.length];
}

/* iOS exige que la PRIMERA llamada a speak() nazca dentro de un toque. No se
   desbloquea con una frase muda seguida de un cancel --eso vuelve a bloquearlo
   en iPad--: se desbloquea hablando de verdad, sin cancelar nada antes. */
let desbloqueada=false;

/* Safari y Chrome suspenden el sintetizador solos a los pocos segundos y la
   cola se queda a medias, en silencio. Esto lo despierta. */
setInterval(()=>{if(hablando&&speechSynthesis.paused&&!pausadoAdrede)speechSynthesis.resume();},2500);
function puntua(v){
  let p=0;
  if(IDI==='en'){
    JARVIS.forEach((r,i)=>{if(r.test(v.name)||r.test(v.lang))p+=60-i*4;});
    BUENAS_EN.forEach((r,i)=>{if(r.test(v.name))p+=22-i*2;});
    if(/^en/i.test(v.lang))p+=25;
    if(/en-GB/i.test(v.lang))p+=30;
  }else{
    BUENAS_ES.forEach((r,i)=>{if(r.test(v.name))p+=24-i*2;});
    if(/^es/i.test(v.lang))p+=30;
  }
  if(v.localService)p+=3;
  return p;
}
function cargarVoces(){
  const todas=speechSynthesis.getVoices();
  if(!todas.length)return;
  const idio=IDI==='en'?/^en/i:/^es/i;
  voces=todas.filter(v=>idio.test(v.lang));
  if(!voces.length)voces=todas;
  voces.sort((a,b)=>puntua(b)-puntua(a));
  /* Treinta voces del sistema en un selector es basura visual: se enseñan
     las MEJORES. Primero las conocidas buenas; si hay pocas, las mejor
     puntuadas hasta seis. */
  const FINAS=IDI==='en'
    ?[/Daniel/i,/Arthur/i,/Oliver/i,/Serena/i,/Kate/i,/Samantha/i,/Alex/i,/Ava/i,
      /Natural/i,/Neural/i,/Online/i,/Google UK/i,/Google US/i]
    :[/Mónica|Monica/i,/Paulina/i,/Marisol/i,/Angélica|Angelica/i,/Jorge/i,/Juan/i,
      /Natural/i,/Neural/i,/Online/i,/Google español/i,/Google Español/i];
  const finas=voces.filter(v=>FINAS.some(r=>r.test(v.name)));
  if(finas.length>=2)voces=finas.slice(0,6); else voces=voces.slice(0,6);
  const sel=$('#voces'); sel.innerHTML='';
  voces.forEach((v,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=v.name.replace(/Microsoft |Google /,'').slice(0,24);sel.appendChild(o);});
  const g=localStorage.getItem('vozCerebro-'+IDI);
  const idx=g!==null&&voces[g]?+g:0;
  sel.value=idx; nombreJarvis=voces[idx]?voces[idx].name:null;

/* Que la voz no lea símbolos ni siglas raras. En español "gwei" suena como
   una palabrota mexicana; en inglés se lee "gway" y tampoco es. */
function limpiar(x){
  return String(x)
    .replace(/·/g,',').replace(/—/g,',').replace(/\bgwei\b/gi,'gigawei')
    .replace(/\bRPC\b/g,IDI==='en'?'R P C':'erre pe ce')
    .replace(/\bUSD\b/g,IDI==='en'?'dollars':'dólares')
    .replace(/(\d),(\d{3})/g,'$1$2').replace(/\$/g,'').replace(/%/g,IDI==='en'?' percent':' por ciento')
    .replace(/0x[0-9a-fA-F]{6,}/g,IDI==='en'?'an address':'una dirección')
    .replace(/\s+/g,' ').trim();
}

/* AQUÍ ESTABA EL FALLO del 13-ago: `decir` llamaba a `parar`, que hace
   `speechSynthesis.cancel()`, y hablaba en el MISMO tick. Safari --y iPad
   sobre todo-- se queda en estado cancelado y se traga la frase: silencio
   absoluto, sin un solo error en la consola. Cancelar y hablar tienen que ir
   en ticks distintos, y si no había nada sonando NO se cancela nada. */
let alTerminar=null;
function decir(lineas,fin){
  alTerminar=fin||null;
  const arrancar=()=>{
    cola=lineas.filter(l=>l&&l.x);
    if(!cola.length)return;
    hablando=true; $('#hablar').classList.add('on'); $('#lblHablar').textContent=t('stop');
    siguiente();
  };
  if(!desbloqueada){         // la primera vez: directo, dentro del toque
    desbloqueada=true; arrancar(); return;
  }
  if(hablando||speechSynthesis.speaking||speechSynthesis.pending){
    hablando=false; cola=[]; speechSynthesis.cancel();
    setTimeout(arrancar,200);
  }else arrancar();
}
function siguiente(){
  if(!cola.length){parar();return;}
  const l=cola.shift();
  marcar(l.q);
  $('#sub').innerHTML='<span class="quien">'+(l.q||'JARVIS')+'</span>'+l.x;
  if(l.foco){disparar(l.foco,true);tarjetaSis(l.foco);
    if(PRESENTANDO)volarA(l.foco,l.zoom);}
  if(l.ag)tarjetaAg(l.ag);
  if(l.cifras)contadores(l.cifras); else if(l.cifras===null)ocultarContadores();

  const u=new SpeechSynthesisUtterance(limpiar(l.x));
  /* Con qué voz. NO basta con el idioma del selector: los partes de los
     agentes vienen escritos en castellano, y una voz inglesa leyendo
     castellano suena exactamente a robot --que fue justo la queja--. Se mira
     el idioma DEL TEXTO y se le pone una voz de ese idioma. */
  const idiT=idiomaDe(l.x);
  u.lang=idiT==='en'?'en-GB':'es-MX';
  /* ESTE try NO es por si acaso. Asignar `voice` LANZA una excepción si el
     objeto no es una SpeechSynthesisVoice válida --y una voz obtenida antes
     de un 'voiceschanged' deja de serlo--. Sin este try la excepción sale
     ANTES de speak(), y el asistente se queda mudo del todo sin decir por
     qué: eso fue exactamente el fallo del 13-ago. Antes que quedarse callado,
     se habla con la voz del sistema. */
  try{
    let v=vozPorNombre(l.ag?nombreAgente[l.ag]:nombreJarvis);
    if(!v||!new RegExp('^'+idiT,'i').test(v.lang||''))v=vozDeIdioma(idiT,l.ag);
    if(v){u.voice=v; if(v.lang)u.lang=v.lang;}
  }catch(e){
    $('#oido').textContent=(IDI==='en'?'Falling back to the system voice.'
                                      :'Uso la voz del sistema.');
  }
  /* La queja fue «leen súper rápido»: se baja la base y además se puede
     pedir «más despacio» o «más rápido» de viva voz; VEL se recuerda. */
  u.rate=Math.max(.55,Math.min(1.4,(l.ag?0.93:0.85)*velSana(VEL)));
  u.pitch=l.ag?1.0:0.86;
  u.volume=1;

  let arranco=false, pasado=false;
  const seguir=(ms)=>{if(pasado)return;pasado=true;
    setTimeout(()=>{if(hablando)siguiente();},ms);};
  u.onstart=()=>{arranco=true;};
  u.onend=()=>seguir(l.p||500);
  u.onerror=ev=>{
    /* Un fallo mudo es peor que un fallo ruidoso: que se vea. */
    $('#oido').textContent=(IDI==='en'?'Voice error: ':'Fallo de la voz: ')+
      ((ev&&ev.error)||'unknown');
    seguir(220);
  };
  try{ speechSynthesis.speak(u); }
  catch(e){ $('#oido').textContent=(IDI==='en'?'Voice failed: ':'La voz falló: ')+e.message;
            seguir(220); return; }

  /* Vigilante: si en dos segundos no ha empezado a sonar, no se queda la cola
     colgada en silencio para siempre. */
  setTimeout(()=>{
    if(!arranco&&hablando&&!speechSynthesis.speaking){
      $('#oido').textContent=IDI==='en'
        ? 'The voice did not start. Try another voice in the selector.'
        : 'La voz no arrancó. Prueba otra voz en el selector.';
      seguir(0);
    }
  },2000);
}

/* «Cuéntame más» amplía lo último, no repite. */
function ampliar(){
  const mapa={seguridad:'cerrajero',coste:'contador',dinero:'centinela',
              chainlist:'escudero',cadenas:'vigia'};
  const ag=mapa[ultimoTema];
  if(ag&&parteDe(ag)){
    const d=detalleDe(ag,5);
    if(d.length)return [J(en()?'The detail, then.':'El detalle, entonces.',{p:360}),...d];
  }
  const s=SIS.find(x=>x.id===ultimoTema);
  if(s)return [J(en()?'In more detail.':'Con más detalle.',{p:360}),
               ...s.det[IDI].map(x=>J(x+'.',{foco:s.id,p:340}))];
  if(ultimoTema)return tema(ultimoTema);
  return [J(en()?'More about what, '+NOM()+'?':'¿Más sobre qué, '+NOM()+'?')];
}

/* Un sistema concreto, cuando lo nombras. */
function temaSistema(s){
  ultimoTema=s.id;
  const e=E[s.id];
  return [J((en()?s.nom:s.es)+': '+e.est+'. '+e.met+'.',{foco:s.id,p:420}),
    ...s.det[IDI].slice(0,3).map(x=>J(x+'.',{foco:s.id,p:340}))];
}

/* ═══ 9 · ESCUCHAR Y ENTENDER ════════════════════════════════════════════
   Cada patrón lleva las dos lenguas dentro a propósito: Safari en el iPad
   transcribe con el idioma de dictado del aparato y no con el que se le pide,
   así que hablándole en español puede llegar texto en inglés. Reconociendo
   las dos, eso deja de importar --y la respuesta sale siempre en el idioma
   del selector.

   Preguntar es libre. ACTUAR es una lista cerrada, y está más abajo. */
const sinTildes=x=>String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

];

let oyendo=false,rec=null;
function escuchar(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){$('#oido').textContent=t('noOigo');return;}
  if(oyendo){rec&&rec.stop();return;}
  parar();
  rec=new R();
  /* El idioma se lee del selector en el momento. Aun así Safari en iPad suele
     IGNORARLO: por eso los patrones de arriba reconocen los dos idiomas. */
  const pedido=$('#idioma').value==='en'?'en-GB':'es-MX';
  rec.lang=pedido;
  rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=()=>{oyendo=true;$('#mic').classList.add('on');
    $('#lblMic').textContent=t('listening');
    $('#oido').textContent=(IDI==='en'?'Listening · ':'Escuchando · ')+pedido;};
  rec.onresult=ev=>{
    let txt='';for(const r of ev.results)txt+=r[0].transcript;
    $('#oido').textContent='“'+txt+'”';
    if(ev.results[ev.results.length-1].isFinal)atender(txt);
  };
  rec.onerror=()=>{$('#oido').textContent=IDI==='en'?'Could not hear you.':'No pude oírte.';};
  rec.onend=()=>{oyendo=false;$('#mic').classList.remove('on');$('#lblMic').textContent=t('speak');};
  rec.start();
}
/* Si lo primero que tocas es el micrófono, el sintetizador todavía está
   bloqueado. Se desbloquea con un acuse corto --que además es lo que haría
   JARVIS-- y se empieza a escuchar en cuanto termina de decirlo. */
$('#mic').addEventListener('click',()=>{
  if(oyendo||desbloqueada){escuchar();return;}
  desbloqueada=true;
  const u=new SpeechSynthesisUtterance(IDI==='en'?('Yes, '+NOM()+'?'):('¿Sí, '+NOM()+'?'));
  try{const v=vozDeIdioma(IDI)||vozPorNombre(nombreJarvis); if(v)u.voice=v;}catch(e){}
  u.lang=IDI==='en'?'en-GB':'es-MX'; u.rate=.95; u.pitch=.86;
  $('#sub').innerHTML='<span class="quien">JARVIS</span>'+u.text;
  u.onend=escuchar; u.onerror=escuchar;
  try{speechSynthesis.speak(u);}catch(e){escuchar();}
  setTimeout(()=>{if(!oyendo)escuchar();},2200);
});

/* ── conversar de verdad ──────────────────────────────────────────────────
   Si hay llave de Anthropic en el servidor, la pregunta va a Claude con el
   estado que la página ya tiene en pantalla, y contesta él. Si no hay llave,
   no hay saldo o la red falla, se cae al cerebro de reglas SIN avisar: peor
   que una respuesta menos rica es no tener respuesta. Las órdenes nunca pasan
   por aquí: se resuelven antes, en local, y siguen siendo una lista cerrada. */
let HISTORIAL=[], hayModelo=null;   // null = todavía no se sabe
function estadoParaElModelo(){
  return {
    idioma:IDI, fecha:I.fecha,
    cadenas:{pruebas5534:{bloque:V.b5534,gasGwei:V.gas,segundosDesdeElUltimoBloque:V.edad},
             vieja8532:{bloque:V.b8532,congelada:V.quieta},
             indexadosPorElExplorador:V.idx},
    chainlist:{solicitudTestnet8593:V.pr93, reservaMainnet8594:V.pr94},
    precioORIGEN:I.precio, comision:I.comision, comisionEncendida:I.comisionEncendida,
    botsDePrueba:BOTS,
    sistemas:SIS.map(s=>({nombre:s.nom, estado:E[s.id].est, dato:E[s.id].met,
                          fallando:E[s.id].mal, queEs:s.que.es, detalle:s.det.es})),
    agentes:PARTES.map(p=>({nombre:p.nombre, veredicto:p.veredicto, cuando:p.cuando,
                            resumen:p.resumen, hallazgos:p.hallazgos, escala:p.escala})),
    hechoHoy:I.hechoHoy, pendiente:I.pendiente,
    /* el mismo saber que usa el cerebro de reglas: enseñarle a uno es
       enseñarles a los dos */
    conocimiento:{queEsOrdenGlobal:SABER.ecosistema.es, aplicaciones:SABER.apps.es,
      webs:SABER.webs.es, maquinas:SABER.infra.es, tokens:SABER.tokens.es,
      flujoDelDinero:SABER.flujo.es}
  };
}
async function conversar(pregunta){
  if(INVITADO||hayModelo===false)return false;
  $('#sub').innerHTML='<span class="quien">JARVIS</span><span style="opacity:.5">…</span>';
  try{
    const r=await fetch('/ordenes/hablar',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({pregunta, idioma:IDI, historial:HISTORIAL, usuario:QUIEN.nombre||QUIEN.usuario,
                           estado:estadoParaElModelo()})});
    const j=await r.json();
    if(!r.ok||!j.respuesta){
      /* Sin llave o sin saldo no se vuelve a intentar en toda la sesión: no
         tiene sentido esperar cuarenta segundos en cada pregunta. */
      if(j.error==='sin-llave'||/credit|balance|authentication/i.test(j.error+' '+(j.detalle||'')))
        hayModelo=false;
      return false;
    }
    hayModelo=true;
    HISTORIAL.push({rol:'jose',texto:pregunta},{rol:'jarvis',texto:j.respuesta});
    if(HISTORIAL.length>12)HISTORIAL=HISTORIAL.slice(-12);
    /* Se parte en frases para que la voz respire, igual que el resto. */
    const frases=j.respuesta.split(/(?<=[.!?…])\s+/).filter(x=>x.trim());
    responderCon(frases.map(x=>J(x,{p:300})));
    return true;
  }catch(e){ return false; }
}

async function atender(txt){
  const s=sinTildes(txt);
  if(!s.trim())return;

  /* Un «sí» suelto solo significa algo si hay una pregunta en el aire. */
  if(ofrecido){
    if(/^\s*(si|s|yes|yeah|yep|ok|okay|dale|claro|por favor|please|adelante|hazlo|cuentame|tell me|go ahead)\b/i.test(s))
      return void aceptarOfrecido();
    if(/^\s*(no|nope|nah|luego|despues|ahora no|not now|later)\b/i.test(s))
      return void rechazarOfrecido();
    ofrecido=null; $('#oido').textContent=''; $('#siono').classList.remove('abre');
  }

  for(const [re,acc] of ORDENES) if(re.test(s)) return ejecutar(acc);
  if(/(stop|be quiet|silence|shut up|^para$|callate|silencio|basta)/i.test(s))return parar();

  if(await conversar(txt))return;      // si hay modelo, contesta él

  /* «explícame X»: se busca X en el conocimiento, en los temas y en los
     sistemas, y se cuenta entero. */
  const mExp=s.match(/(?:explica(?:me)?|explain|como funciona|how does|how do)\s+(?:el |la |los |las |the )?(.*)/);
  if(mExp&&mExp[1]){
    const q=mExp[1];
    const kk={ecosistema:/(ecosistema|todo|orden global|ecosystem|everything)/,
      apps:/(app|servicio|backend|service)/, webs:/(web|pagina|dominio|site|domain)/,
      infra:/(maquina|nodo|servidor|infra|machine|server|node)/,
      tokens:/(token|ondk|origen)/, flujo:/(dinero|money|flujo|flow|pago|payment)/};
    for(const k in kk)if(kk[k].test(q))return responderCon(temaSaber(k));
    const sis2=SIS.find(x=>q.includes(sinTildes(x.nom).toLowerCase())||q.includes(sinTildes(x.es).toLowerCase()));
    if(sis2)return responderCon([...temaSistema(sis2),
      ...sis2.det[IDI].slice(3).map(x=>J(x+'.',{p:340}))]);
  }

  for(const [re,id] of CONV){
    if(!re.test(s))continue;
    if(id==='PARAR')return parar();
    if(id==='PAUSA'){if(speechSynthesis.speaking){pausadoAdrede=true;speechSynthesis.pause();
      $('#oido').textContent=IDI==='en'?'Paused. Say "continue".':'En pausa. Di «continúa».';}return;}
    if(id==='SEGUIR'){pausadoAdrede=false;speechSynthesis.resume();$('#oido').textContent='';return;}
    if(id==='LENTO'){VEL=velSana(VEL-.1);localStorage.setItem('velCerebro',VEL);
      return responderCon([J(IDI==='en'?'Slower. Like this.':'Más despacio. Así.')]);}
    if(id==='RAPIDO'){VEL=velSana(VEL+.1);localStorage.setItem('velCerebro',VEL);
      return responderCon([J(IDI==='en'?'Faster. Like this.':'Más rápido. Así.')]);}
    if(id.startsWith('K:'))return responderCon(temaSaber(id.slice(2)));
    if(id==='PARTE'){ultimoTema='parte';return responderCon(guion());}
    if(id==='REPETIR')return responderCon(ultimasLineas.slice());
    if(id==='MAS')return responderCon(ampliar());
    const r=tema(id);
    if(r)return responderCon(r);
  }

  /* ¿nombras a un agente? entonces habla él */
  const ag=AGENTES.find(a=>s.includes(sinTildes(a.nom))||s.includes(a.id)||
                           s.includes(sinTildes(a.mira.es))||s.includes(sinTildes(a.mira.en)));
  if(ag&&parteDe(ag.id)){
    ultimoTema=ag.id==='cerrajero'?'seguridad':ag.id==='contador'?'coste':ag.id;
    const p=parteDe(ag.id);
    return responderCon([...citar(ag.id),...detalleDe(ag.id,3)]);
  }

  /* ¿nombras un sistema? */
  const sis=SIS.find(x=>s.includes(sinTildes(x.nom))||s.includes(sinTildes(x.es)));
  if(sis)return responderCon(temaSistema(sis));


  /* No entendido: no se calla ni suelta un error. Ofrece. */
  /* No lo sabe. No se disfraza de error: dice qué haría falta. */
  responderCon([J(IDI==='en'
    ? 'That is not something I have been taught yet.'
    : 'Eso todavía no me lo han enseñado.',{p:380}),
    J(IDI==='en'
    ? 'Note it for the next daily update and it becomes part of what I know. Meanwhile, ask me about the ecosystem, the apps, the webs, the machines, the tokens, the money flow, security, cost, the team, or what needs you.'
    : 'Apúntalo para la próxima actualización del parte y pasará a ser parte de lo que sé. Mientras, pregúntame por el ecosistema, las aplicaciones, las webs, las máquinas, los tokens, el flujo del dinero, la seguridad, el coste, el equipo, o qué te falta.')]);
}
function responderCon(lineas){
  const L=(lineas||[]).filter(Boolean);
  if(!L.length)return;
  ultimasLineas=L.slice();
  decir(L);
}
async function ejecutar(accion){
  if(accion==='refrescar'){
    responderCon([J(IDI==='en'?'Refreshing everything.':'Actualizando todo.')]);
    await todo();
    return responderCon([J(IDI==='en'?'Done. Everything is current.':'Hecho. Todo está al día.')]);
  }
  if(accion==='bots-ahora'){
    responderCon([J(IDI==='en'?'Running the test bots now.':'Lanzando los bots de prueba.',{foco:'bots'})]);
    try{
      const r=await fetch('/ordenes/bots/ahora',{method:'POST'});
      const j=await r.json();
      await verBots();
      responderCon([J(j.estado==='bien'
        ?(IDI==='en'?('Done. The transaction confirmed in block '+nf(j.bloque)+', in '+j.segundos+' seconds. '+(j.enviosQueQuedan||0)+' sends left.')
                    :('Hecho. La transacción confirmó en el bloque '+nf(j.bloque)+', en '+j.segundos+' segundos. Quedan '+(j.enviosQueQuedan||0)+' envíos.'))
        :(IDI==='en'?('The run finished as '+j.estado+'. '+(j.detalle||''))
                    :('La carrera terminó como '+j.estado+'. '+(j.detalle||''))),{foco:'bots'})]);
    }catch(e){
      responderCon([J(IDI==='en'?'I could not reach the bots.':'No pude alcanzar los bots.')]);
    }
  }
}

/* ═══ TOCAR Y QUE PREGUNTE ════════════════════════════════════════════════
   Tocas cualquier cosa del ecosistema y JARVIS te ofrece el reporte en voz.
   Se abre la ficha para que veas los datos, y él pregunta si quieres que te
   lo cuente. «Sí» dispara el reporte hablado completo; «no» lo deja estar.
   La pregunta queda ARMADA hasta que contestas o tocas otra cosa: así el
   micrófono entiende un «sí» suelto, que fuera de contexto no significa nada. */
let ofrecido=null;                       // {tipo:'sis'|'ag', id}
function ofrecer(tipo,id,nombre){
  ofrecido={tipo,id}; $('#siono').classList.add('abre');
  const q=IDI==='en' ? 'Would you like the full report on '+nombre+'?'
                     : '¿Quieres que te dé el reporte de '+nombre+'?';
  decir([J(q,{foco:tipo==='sis'?id:null, ag:tipo==='ag'?id:null, p:0})]);
  $('#oido').textContent=IDI==='en'?'Say yes or no':'Di sí o no';
}
function aceptarOfrecido(){
  const o=ofrecido; ofrecido=null; $('#oido').textContent='';
  $('#siono').classList.remove('abre');
  if(!o)return false;
  if(o.tipo==='ag'){
    ultimoTema=o.id;
    responderCon([...citar(o.id),...detalleDe(o.id,4),
      ...((parteDe(o.id)||{}).escala||[]).map(x=>({q:(parteDe(o.id)||{}).nombre,ag:o.id,x,p:360}))]);
  }else{
    const sx=S(o.id); if(!sx)return true;
    ultimoTema=o.id;
    const e=E[o.id];
    responderCon([J((IDI==='en'?sx.nom:sx.es)+': '+e.est+'. '+e.met+'.',{foco:o.id,p:420}),
      ...(e.vivo||[]).map(([k,v])=>J(k+': '+v+'.',{foco:o.id,p:300})),
      ...sx.det[IDI].map(x=>J(x+'.',{foco:o.id,p:340}))]);
  }
  return true;
}

function abrirAgente(a){
  const p=parteDe(a.id);
  const c=panel(a.nom,(IDI==='en'?'Watches ':'Vigila ')+a.mira[IDI]+' · '+a.cada[IDI],a.col);
  if(!p){li(c,IDI==='en'?'This agent has not reported yet.':'Este agente no ha reportado todavía.');return;}
  kv(c,IDI==='en'?'Verdict':'Veredicto',p.veredicto.toUpperCase(),
     p.veredicto==='falla'?'var(--red)':p.veredicto==='aviso'?'var(--gold)':a.col);
  kv(c,IDI==='en'?'Last run':'Última revisión',hace(p.cuando));
  h4(c,IDI==='en'?'SUMMARY':'RESUMEN');
  li(c,p.resumen,p.veredicto==='falla'?'mala':p.veredicto==='aviso'?'ojo':'');
  if((p.hallazgos||[]).length){h4(c,IDI==='en'?'WHAT IT MEASURED':'LO QUE MIDIÓ');
    p.hallazgos.forEach(x=>li(c,x));}
  if((p.hizo||[]).length){h4(c,IDI==='en'?'WHAT IT DID':'LO QUE HIZO');p.hizo.forEach(x=>li(c,x));}
  if((p.escala||[]).length){h4(c,t('necesita'));p.escala.forEach(x=>li(c,x,'mala'));}
  ofrecer('ag',a.id,a.nom);
}
function abrirInforme(){
  const c=panel(t('reporte'),(I.fecha||'')+' · '+(IDI==='en'?'COMPILED BY THE BRAIN':'GENERADO POR EL CEREBRO'));
  const f=fallas();
  if(f.length){h4(c,t('fallas'));f.forEach(s=>li(c,(IDI==='en'?s.nom:s.es)+' — '+E[s.id].est,'mala'));}
  h4(c,t('ahora'));
  if(V.b5534)li(c,(IDI==='en'?'Testnet: block ':'Red de pruebas: bloque ')+nf(V.b5534)+' · '+V.gas+' gwei');
  if(V.b8532)li(c,(IDI==='en'?'Legacy: block ':'Cadena vieja: bloque ')+nf(V.b8532)+(V.quieta?(IDI==='en'?' · frozen, root intact':' · congelada, raíz intacta'):' · ROOT CHANGED'));
  if(BOTS)li(c,(IDI==='en'?'Test bots: ':'Bots: ')+BOTS.estado+' · '+(BOTS.enviosQueQuedan||0)+(IDI==='en'?' sends left':' envíos restantes'));
  li(c,'ORIGEN $'+(I.precio||'—')+' · '+(I.comision||'—'));
  const esc=PARTES.flatMap(p=>(p.escala||[]).map(x=>p.nombre+' — '+x));
  if(esc.length){h4(c,t('necesita'));esc.forEach(x=>li(c,x,'mala'));}
  if(PARTES.length){h4(c,t('equipoT'));
    PARTES.forEach(p=>li(c,p.nombre+' · '+p.veredicto+' · '+hace(p.cuando)+' — '+p.resumen,
      p.veredicto==='falla'?'mala':p.veredicto==='aviso'?'ojo':''));}
  if((I.hechoHoy||[]).length){h4(c,t('hecho'));I.hechoHoy.forEach(x=>li(c,x));}
  if((I.pendiente||[]).length){h4(c,t('falta'));I.pendiente.forEach(x=>li(c,x));}
}
function abrirAyuda(){
  const c=panel(IDI==='en'?'HOW TO TALK TO ME':'CÓMO HABLARME',
    IDI==='en'?'Speak or tap. I answer with live data.':'Habla o toca. Contesto con datos vivos.');
  const B=(tit,items)=>{h4(c,tit);items.forEach(x=>li(c,x));};
  if(IDI==='en'){
    B('THE BASICS',['Press SPEAK and talk, or press BRIEF ME for the full daily picture.',
      'I greet you by name: each Board member has their own password.',
      'The language selector keeps everything — voice, answers, screen — in that language.']);
    B('ASK ME ABOUT',['the ecosystem · the apps · the webs · the machines · the tokens · the money flow',
      'the chains · the money · security · cost · the team · Chainlist · the bots · the migration · the wallet',
      'what needs me — everything waiting on the Board, most urgent first',
      'any agent by name, or any system on the right rail']);
    B('CONTROL MY VOICE',['"slower" / "faster" — I remember your preference',
      '"pause" / "continue" · "repeat" · "tell me more" goes deeper into the last thing I said',
      'Change my voice in the selector below — pick the one that sounds most natural on your device.']);
    B('WHAT I WILL NOT DO',['I never deploy, move funds, restart nodes or change configuration.',
      'The only order I take is running the test bots, on the test network.']);
  }else{
    B('LO BÁSICO',['Pulsa HABLAR y dime, o pulsa EL PARTE para el cuadro completo del día.',
      'Te saludo por tu nombre: cada miembro de la Junta tiene su propia contraseña.',
      'El selector de idioma lo mantiene todo — voz, respuestas y pantalla — en ese idioma.']);
    B('PREGÚNTAME POR',['el ecosistema · las aplicaciones · las webs · las máquinas · los tokens · el flujo del dinero',
      'las cadenas · el dinero · la seguridad · el coste · el equipo · Chainlist · los bots · la migración · la billetera',
      'qué me falta — todo lo que espera a la Junta, lo urgente primero',
      'cualquier agente por su nombre, o cualquier sistema del raíl derecho']);
    B('CONTROLA MI VOZ',['«más despacio» / «más rápido» — recuerdo tu preferencia',
      '«pausa» / «continúa» · «repite» · «cuéntame más» profundiza en lo último que dije',
      'Cambia mi voz en el selector de abajo: elige la que suene más natural en tu aparato.']);
    B('LO QUE NO HAGO',['Nunca despliego, muevo fondos, reinicio nodos ni cambio configuración.',
      'La única orden que acepto es lanzar los bots de prueba, en la red de pruebas.']);
  }
}
