<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S · Orden Global</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   J.A.R.V.I.S · rediseño 14-ago
   Tres decisiones que lo cambian todo:
   1) JERARQUÍA: una tipografía de pantalla para identidad y frases; la mono
      queda SOLO para números y datos. Un dock, no dos raíles gemelos.
   2) PRESENCIA: el núcleo es un reactor que respira cuando habla, y la
      información se materializa en tarjetas mientras la voz la nombra.
   3) PROFUNDIDAD: niebla por distancia, bloom y paralaje. El cerebro es el
      héroe y ocupa el centro sin muebles encima.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#020610; --ink:#e8f2fb; --mut:#6d8ba1; --faint:#31485c;
  --arc:#56d9ff; --arc2:#2a9fd4; --gold:#ffc46b; --red:#ff5246; --green:#4fe6a4;
  --glass:rgba(6,16,28,.72); --glass2:rgba(8,20,34,.86); --edge:rgba(86,217,255,.14);
  --disp:"Avenir Next","SF Pro Display",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{color:var(--ink);font:14px/1.5 var(--disp);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{position:fixed;inset:0;display:block}
#lienzo{touch-action:none;cursor:grab}#lienzo.gira{cursor:grabbing}

/* ── cabecera ───────────────────────────────────────────────────────────── */
.hud{position:fixed;z-index:10}
#izq{top:max(16px,env(safe-area-inset-top));left:22px}
#izq h1{font-size:17px;font-weight:600;letter-spacing:.5em;font-family:var(--disp)}
#izq h1 i{font-style:normal;color:var(--arc)}
#izq .s{font-size:9px;color:var(--mut);letter-spacing:.34em;margin-top:4px;font-weight:500}
#der{top:max(16px,env(safe-area-inset-top));right:22px;text-align:right}
#reloj{font:300 22px/1.1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.06em}
#fecha{font-size:9px;color:var(--mut);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
#act{font-size:8.5px;color:var(--faint);letter-spacing:.16em;margin-top:3px;text-transform:uppercase}

/* identidad: quién entró */
#yo{position:fixed;z-index:10;top:max(16px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--edge);border-radius:999px;
  padding:6px 16px 6px 7px;backdrop-filter:blur(14px)}
#yo .disco{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--arc2),var(--arc));color:#02131f;
  font:700 12px var(--disp)}
#yo .qn{font-size:11px;font-weight:600;letter-spacing:.14em}
#yo .qs{display:block;font-size:8px;color:var(--mut);letter-spacing:.2em}
#yo .p{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 10px var(--green);animation:late 1.6s steps(2) infinite;margin-left:4px}
@keyframes late{50%{opacity:.35}}
#yo.mal .p{background:var(--red);box-shadow:0 0 10px var(--red)}

/* ── el dock (derecha): equipo + sistemas, con jerarquía ────────────────── */
#dock{position:fixed;z-index:10;right:16px;top:50%;transform:translateY(-50%);
  width:250px;max-height:82vh;overflow-y:auto;border-radius:14px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);
  scrollbar-width:none;padding-bottom:6px}
#dock::-webkit-scrollbar{display:none}
#dock h3{font:600 9px var(--disp);letter-spacing:.3em;color:var(--mut);
  padding:12px 14px 7px;position:sticky;top:0;background:var(--glass2);z-index:2}
.fila{display:flex;align-items:center;gap:9px;padding:6px 14px;cursor:pointer;
  transition:background .15s}
.fila:hover,.fila:focus-visible{background:rgba(86,217,255,.07);outline:none}
.fila .cn{width:7px;height:7px;flex:none;border-radius:50%}
.fila .nom{font:600 10.5px var(--disp);letter-spacing:.08em}
.fila .est{display:block;font:500 8px var(--disp);letter-spacing:.14em;color:var(--mut);
  text-transform:uppercase}
.fila .met{font:10px var(--mono);color:var(--mut);margin-left:auto;text-align:right;
  max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila.mal .nom,.fila.mal .est{color:var(--red)}
.fila.avi .nom{color:var(--gold)}
.fila.habla{background:rgba(86,217,255,.12);box-shadow:inset 2px 0 0 var(--arc)}

/* ── tarjetas holográficas: lo que aparece mientras habla ───────────────── */
#tarjetas{position:fixed;z-index:9;left:22px;bottom:170px;display:flex;
  flex-direction:column;gap:10px;width:min(290px,42vw);pointer-events:none}
.tarj{background:var(--glass2);border:1px solid var(--edge);border-radius:12px;
  padding:12px 14px;backdrop-filter:blur(16px);opacity:0;transform:translateY(14px);
  transition:opacity .45s,transform .45s;border-left:3px solid var(--arc);
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tarj.viva{opacity:1;transform:none}
.tarj .cab{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.tarj img{width:20px;height:20px;border-radius:5px;object-fit:cover}
.tarj .tn{font:600 12px var(--disp);letter-spacing:.1em}
.tarj .te{margin-left:auto;font:600 8px var(--disp);letter-spacing:.16em;color:var(--mut);
  text-transform:uppercase}
.tarj .kv{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;
  border-top:1px solid rgba(86,217,255,.07)}
.tarj .kv b{font-weight:500;color:var(--mut);font-family:var(--disp)}
.tarj .kv span{font-family:var(--mono);font-size:10.5px}

/* ── la consola del asistente ───────────────────────────────────────────── */
#consola{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:10px;width:min(760px,94vw)}
#sub{text-align:center;font:400 15px/1.6 var(--disp);min-height:46px;
  color:var(--ink);text-shadow:0 2px 24px rgba(86,217,255,.25);max-width:640px}
#sub .quien{display:block;font:600 9px var(--disp);letter-spacing:.3em;color:var(--arc);
  margin-bottom:4px;text-transform:uppercase}
#oido{text-align:center;font:italic 12px var(--disp);color:var(--gold);min-height:16px}

/* ── la ruta del recorrido: dónde vas y cómo moverte ────────────────────── */
#ruta{display:none;align-items:center;gap:10px;background:var(--glass);
  border:1px solid var(--edge);border-radius:999px;padding:7px 8px;
  backdrop-filter:blur(14px);max-width:100%;flex-wrap:wrap;justify-content:center}
#ruta.abre{display:flex}
#ruta button{width:30px;height:30px;flex:none;border-radius:50%;color:var(--mut);
  font-size:11px;display:grid;place-items:center;transition:color .2s,background .2s}
#ruta button:hover,#ruta button:focus-visible{color:var(--arc);
  background:rgba(86,217,255,.1);outline:none}
#capBarra{display:flex;gap:5px;align-items:center}
#capBarra i{width:26px;height:4px;border-radius:2px;background:rgba(109,139,161,.32);
  cursor:pointer;transition:background .3s,transform .2s}
#capBarra i:hover{transform:scaleY(1.9)}
#capBarra i.hecho{background:rgba(86,217,255,.45)}
#capBarra i.aqui{background:var(--arc);box-shadow:0 0 12px rgba(86,217,255,.7)}
#capNom{font:600 8.5px var(--disp);letter-spacing:.22em;color:var(--mut);
  text-transform:uppercase;min-width:82px}
#siono{display:none;gap:10px}
#siono.abre{display:flex}
#siono .tecla{padding:9px 26px;border-color:rgba(86,217,255,.35)}
#pistas{font:11px var(--disp);color:var(--mut);min-height:16px;text-align:center;
  transition:opacity .5s;letter-spacing:.03em}
#teclas{display:flex;gap:10px;align-items:center;justify-content:center}
.tecla{display:flex;align-items:center;gap:8px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);
  padding:11px 20px;font:600 10px var(--disp);letter-spacing:.2em;transition:all .2s}
.tecla:hover{border-color:rgba(86,217,255,.4)}
.tecla:active{transform:scale(.96)}
.tecla:focus-visible{outline:1px solid var(--arc);outline-offset:2px}
#mic{width:64px;height:64px;border-radius:50%;padding:0;justify-content:center;
  font-size:22px;border-color:rgba(86,217,255,.45);color:var(--arc);
  box-shadow:0 0 34px rgba(86,217,255,.16),inset 0 0 18px rgba(86,217,255,.06)}
#mic.on{border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 40px rgba(255,196,107,.3);animation:resp 1.6s ease-in-out infinite}
@keyframes resp{50%{transform:scale(1.06)}}
#hablar.on{border-color:var(--red);color:var(--red)}
#onda{display:inline-flex;gap:2px;align-items:center;height:11px}
#onda i{width:2px;background:currentColor;height:3px;border-radius:1px}
.on #onda i{animation:onda .6s ease-in-out infinite}
.on #onda i:nth-child(2){animation-delay:.09s}.on #onda i:nth-child(3){animation-delay:.18s}
.on #onda i:nth-child(4){animation-delay:.27s}.on #onda i:nth-child(5){animation-delay:.36s}
@keyframes onda{50%{height:11px}}

/* ajustes: voz, velocidad e idioma, fuera del medio */
#ajustes{position:fixed;z-index:15;right:16px;bottom:max(16px,env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:12px;background:var(--glass2);
  border:1px solid var(--edge);border-radius:14px;padding:16px;width:240px;
  backdrop-filter:blur(18px)}
#ajustes.abre{display:flex}
#ajustes label{font:600 8.5px var(--disp);letter-spacing:.24em;color:var(--mut)}
select{border:1px solid var(--edge);border-radius:8px;background:rgba(4,12,22,.9);
  color:var(--ink);font:12px var(--disp);padding:9px 10px;width:100%}
.vels{display:flex;gap:6px}
.vels button{flex:1;border:1px solid var(--edge);border-radius:8px;padding:8px 0;
  font:600 10px var(--disp);letter-spacing:.1em;color:var(--mut)}
.vels button.on{color:var(--arc);border-color:rgba(86,217,255,.5);
  background:rgba(86,217,255,.08)}

/* ── panel de detalle ───────────────────────────────────────────────────── */
#det{position:fixed;z-index:20;inset:0;display:none;place-items:center;
  background:rgba(2,6,16,.8);backdrop-filter:blur(10px);padding:18px}
#det.abre{display:grid}
#det article{width:min(700px,96vw);max-height:84vh;overflow-y:auto;border-radius:16px;
  border:1px solid var(--edge);background:var(--glass2);padding:26px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
#det h2{font:600 16px var(--disp);letter-spacing:.24em;margin-bottom:3px}
#det .sub2{font-size:10px;color:var(--mut);letter-spacing:.18em;margin-bottom:16px;
  text-transform:uppercase}
#det h4{font:600 9.5px var(--disp);letter-spacing:.26em;color:var(--gold);margin:18px 0 7px}
#det li{font-size:13.5px;line-height:1.75;list-style:none;color:#c9dcec}
#det li::before{content:"— ";color:var(--faint)}
#det li.mala::before{content:"✕ ";color:var(--red)}#det li.mala{color:var(--red)}
#det li.ojo::before{content:"! ";color:var(--gold)}
#det .kv{display:flex;gap:12px;font-size:12.5px;padding:4px 0;
  border-bottom:1px solid rgba(86,217,255,.06)}
#det .kv b{font-weight:500;color:var(--mut);min-width:170px}
#det .kv span{font-family:var(--mono);font-size:12px}
#cerrar{position:sticky;float:right;top:0;color:var(--mut);font-size:19px;padding:0 6px}

/* ── la puerta ──────────────────────────────────────────────────────────── */
#puerta{position:fixed;z-index:40;inset:0;display:none;place-items:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(16,52,80,.55),rgba(2,6,16,.97) 68%)}
#puerta.abre{display:grid}
#puerta .caja{text-align:center;padding:30px;max-width:520px}
#puerta h2{font:200 34px var(--disp);letter-spacing:.55em;margin-bottom:6px;
  text-shadow:0 0 40px rgba(86,217,255,.5)}
#puerta .p1{font-size:11px;color:var(--mut);letter-spacing:.3em;margin-bottom:34px;
  text-transform:uppercase}
#puerta .botones{display:flex;gap:14px;justify-content:center}
#nombreVisita{display:block;width:100%;max-width:340px;margin:0 auto 22px;
  background:rgba(4,12,22,.72);border:1px solid var(--edge);border-radius:12px;
  color:var(--ink);font:15px var(--disp);letter-spacing:.04em;padding:14px 16px;
  text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
#nombreVisita::placeholder{color:var(--faint);font-size:12.5px;letter-spacing:.1em}
#nombreVisita:focus{border-color:rgba(86,217,255,.5);
  box-shadow:0 0 28px rgba(86,217,255,.14)}
.micPide{display:flex;align-items:center;gap:9px;justify-content:center;
  margin-top:22px;font-size:10.5px;color:var(--mut);line-height:1.6;
  max-width:400px;margin-left:auto;margin-right:auto;cursor:pointer}
.micPide input{width:15px;height:15px;flex:none;accent-color:var(--arc)}
@media (max-width:640px){
  #nombreVisita{font-size:16px;padding:13px 14px}   /* 16px o iOS hace zoom */
  .micPide{font-size:9.5px}
}
.tecla.grande{padding:18px 38px;font-size:12px;letter-spacing:.26em;border-radius:14px;
  border-color:rgba(86,217,255,.35);color:var(--arc)}
.tecla.grande:hover{background:rgba(86,217,255,.09);box-shadow:0 0 40px rgba(86,217,255,.18)}
#puerta .p2{font-size:10px;color:var(--faint);margin-top:30px;line-height:1.9}

/* ── modo presentación: contadores que suben ────────────────────────────── */
#cifras{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);
  display:none;gap:38px;pointer-events:none;text-align:center;
  /* Un velo detrás de la cifra. Sin él, los axones del cerebro cruzaban por
     encima de los ceros y el número --que es lo único que se recuerda de una
     presentación-- se leía a trompicones. */
  padding:26px 42px;
  background:radial-gradient(ellipse at 50% 50%,rgba(2,7,15,.88) 0%,
             rgba(2,7,15,.62) 55%,rgba(2,7,15,0) 78%)}
#cifras.abre{display:flex}
#cifras .c{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
#cifras .c.viva{opacity:1;transform:none}
#cifras .n{font:200 62px/1 var(--disp);color:var(--arc);
  text-shadow:0 0 50px rgba(86,217,255,.55);font-variant-numeric:tabular-nums}
#cifras .e{font:600 10px var(--disp);letter-spacing:.28em;color:var(--mut);
  margin-top:10px;text-transform:uppercase}
#cifras .c.oro .n{color:var(--gold);font-size:52px;letter-spacing:.02em;
  text-shadow:0 0 60px rgba(255,196,107,.5)}
#cifras .c.oro .e{color:#c79a5a}
#btnPresenta.sigue{border-color:rgba(255,196,107,.5);color:var(--gold)}

/* ── LOS PANELES: el instrumental alrededor del cerebro ─────────────────
   La referencia que trajo José es un puesto de mando: el cerebro en el
   centro y, alrededor, paneles con lo que cada zona está haciendo --su
   actividad, su pulso, su estado--. Eso es exactamente lo que le faltaba
   a esto: se veía un salvapantallas bonito, no un sistema vigilado.

   Lo que va dentro es real: el estado que devuelven los sistemas y su
   métrica del momento. La línea de actividad es historia de verdad --se
   apunta cada lectura--, no ruido decorativo. Si alguien mira de cerca,
   tiene que encontrar datos, no adornos. */
.panel{position:fixed;z-index:8;width:224px;pointer-events:none;
  opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.panel.viva{opacity:1;transform:none}
#panIzq{left:max(18px,env(safe-area-inset-left));top:104px}
#panDer{right:max(18px,env(safe-area-inset-right));top:104px}
body.narrando #panDer{top:158px}          /* deja sitio a la ficha tecnica */
.pz{position:relative;margin-bottom:12px;padding:11px 13px 11px;
  /* Opaco a proposito. Traslucido quedaba «de diseno» y era ilegible:
     el cerebro se veia a traves y las cifras se perdian. Un instrumento
     se lee de un vistazo o no sirve de nada. */
  background:linear-gradient(155deg,rgba(17,44,70,.97),rgba(9,25,44,.96));
  border:1px solid rgba(86,217,255,.42);border-radius:3px;
  /* franja del color del sistema: en la referencia cada panel se
     reconoce por su color antes de leer el titulo */
  border-left:2px solid currentColor;
  backdrop-filter:blur(16px);
  box-shadow:0 6px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(86,217,255,.12)}
.pz::before,.pz::after{content:'';position:absolute;width:11px;height:11px;
  border:1px solid currentColor;opacity:.9}
.pz::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pz::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.pz .t{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.pz .t b{font:600 11.5px var(--disp);letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 0 18px currentColor}
.pz .t i{font-style:normal;font:600 7px var(--disp);letter-spacing:.1em;
  color:currentColor;margin-left:auto;text-transform:uppercase;
  border:1px solid currentColor;border-radius:999px;padding:2px 7px;
  background:rgba(0,0,0,.25);
  white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis;flex:none}
.pz .s{font:8.5px var(--disp);letter-spacing:.09em;color:#b9d2e2;
  margin-bottom:8px;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pz .m{display:flex;justify-content:space-between;gap:10px;
  font:9.5px var(--disp);color:#b3c9da;padding:2.5px 0;align-items:baseline}
.pz .m u{text-decoration:none;color:var(--ink);font-family:var(--mono);
  font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:118px;text-align:right}
.pz .h{font:7px var(--disp);letter-spacing:.2em;color:#6d8ba1;
  margin:9px 0 3px;text-transform:uppercase}
.pz .lienzo{position:relative;height:28px;
  background:rgba(2,8,16,.5);border:1px solid rgba(86,217,255,.1);
  border-radius:2px}
.pz canvas{position:absolute;inset:0;display:block;width:100%;height:28px}
.pz.mal{border-color:rgba(255,82,70,.45)}
/* el que esta hablando se enciende: la voz y la pantalla, lo mismo */
.pz.habla{border-color:currentColor;
  box-shadow:0 0 34px rgba(86,217,255,.26),inset 0 0 22px rgba(86,217,255,.05)}

/* ── la ficha de especificaciones: el panel holográfico ─────────────────
   Un dato dicho se olvida; un dato dicho MIENTRAS se ve, no. Aquí van las
   cosas que un técnico quiere leer con calma --consenso, máquina virtual,
   identificadores de cadena-- mientras la voz cuenta lo que significan. */
#ficha{position:fixed;z-index:12;right:max(20px,env(safe-area-inset-right));
  top:50%;transform:translateY(-50%) translateX(26px);width:290px;
  opacity:0;pointer-events:none;transition:opacity .55s,transform .55s}
#ficha.abre{opacity:1;transform:translateY(-50%);pointer-events:auto}
/* La ficha y el panel derecho viven en el mismo sitio: cuando sale la
   ficha, el panel se aparta. Dos cosas encima una de otra no son dos
   cosas, son un borron. */
body.conFicha #panDer{opacity:0}
#ficha .marco{position:relative;background:linear-gradient(160deg,
    rgba(8,22,38,.92),rgba(4,12,24,.88));
  border:1px solid rgba(86,217,255,.3);border-radius:4px;
  padding:15px 16px 14px;backdrop-filter:blur(18px);
  box-shadow:0 0 60px rgba(86,217,255,.14),inset 0 1px 0 rgba(86,217,255,.14)}
/* las esquinas cortadas del panel de la referencia */
#ficha .marco::before,#ficha .marco::after{content:'';position:absolute;
  width:13px;height:13px;border:1px solid var(--arc);opacity:.85}
#ficha .marco::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
#ficha .marco::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#ficha .cab{display:flex;align-items:center;gap:9px;padding-bottom:10px;
  margin-bottom:10px;border-bottom:1px solid rgba(86,217,255,.16)}
#ficha .pip{width:16px;height:16px;border-radius:50%;flex:none;display:grid;
  place-items:center;border:1px solid var(--arc);font-size:8px;color:var(--arc)}
#ficha h4{font:600 11px var(--disp);letter-spacing:.22em;color:var(--arc);
  text-transform:uppercase}
#ficha .r{display:flex;justify-content:space-between;gap:12px;padding:4.5px 0;
  font-size:11px;align-items:baseline}
#ficha .r b{font-weight:400;color:var(--mut);white-space:nowrap}

/* ── EL TELÉFONO ─────────────────────────────────────────────────────────
   Lo que se veía mal en la captura del 14-ago, punto por punto:
   · «J.A.R.V.I.S» a la izquierda y la chapa ORDEN GLOBAL centrada se pisaban
     --con 393 px no caben las dos, y la chapa ya dice quién eres--;

     así que el de ajustes ni existía;

  #dock{right:8px;left:8px;width:auto;bottom:auto;top:64px;max-height:26vh}

     del cerebro justo cuando el cerebro es lo que hay que mirar */
  body.narrando #dock{display:none}
  /* PARAR (la voz) y PAUSAR (el recorrido) juntos es una pregunta que nadie

  body.narrando #teclas .tecla:not(#mic):not(#btnPresenta){display:none}

  #ajustes{left:12px;right:12px;width:auto;bottom:auto;top:50%;

  #ficha{right:8px;left:8px;width:auto;top:58px;transform:translateY(-14px)}

}

}
@media (prefers-reduced-motion:reduce){#yo .p,.on #onda i,#mic.on{animation:none}}

<script>
/* ═══ 0 · IDIOMA ══════════════════════════════════════════════════════════
   Inglés primero, porque JARVIS habla inglés. El español está entero
   detrás del selector: no es una traducción a medias. */
let IDI = localStorage.getItem('idiomaCerebro') || 'en';
const IDIOMA_ELEGIDO = !!localStorage.getItem('idiomaCerebro');

/* Quién entró. Caddy pasa el usuario autenticado y JARVIS saluda por su
   nombre: no es lo mismo hablarle a José que a un miembro de la Junta. */
let QUIEN={usuario:'',nombre:''};
const JUNTA={jose:{es:'José',en:'sir'},leonardo:{es:'Leonardo',en:'Leonardo'},
             melany:{es:'Melany',en:'Melany'},medardo:{es:'Medardo',en:'Medardo'}};
/* ═══ EL NOMBRE DEL INVITADO ══════════════════════════════════════════════
   A un invitado el servidor no le dice quién es --no tiene cuenta--, así que
   se lo pregunta la puerta. Y se usa TODO el rato: «Bienvenido, Carlos» y
   «Carlos, hasta aquí, ¿alguna pregunta?» no es lo mismo que un texto
   recitado. Es la diferencia entre una grabación y una conversación, y
   cuesta un campo de texto.

   Si no lo escribe, se le llama Invitado. Sin cortarle el paso: un
   formulario obligatorio en la puerta de una demostración pierde visitas. */
let VISITA=localStorage.getItem('nombreVisita')||'';
const NOM=()=>{
  if(INVITADO)return VISITA||(IDI==='en'?'guest':'invitado');
  const q=JUNTA[QUIEN.usuario];return q?q[IDI]:(IDI==='en'?'sir':'José');};
/* Vocativo: «, Carlos» o nada. Repetir el nombre en cada frase cansa, así
   que se usa donde suma --el saludo, los puntos de control, el cierre-- y
   no en medio de una explicación. */
const VOC=()=>{const n=NOM();return n?', '+n:'';};
async function quienEs(){if(INVITADO){$('#quienNom').textContent='ORDEN GLOBAL';$('#disco').textContent='◈';return;} try{
  const j=await(await fetch('/ordenes/quien',{cache:'no-store'})).json();
  QUIEN.usuario=(j.usuario||'').toLowerCase();
  const q=JUNTA[QUIEN.usuario]; QUIEN.nombre=q?q.es:'';
  if(QUIEN.nombre){$('#quienNom').textContent=QUIEN.nombre.toUpperCase();
    $('#disco').textContent=QUIEN.nombre[0].toUpperCase();}
}catch(e){}}

/* La velocidad de la voz, ajustable por voz («más despacio») y recordada. */
const velSana=v=>(isFinite(v)&&v>0)?Math.max(.55,Math.min(1.6,v)):1;
let VEL=velSana(parseFloat(localStorage.getItem('velCerebro')));
/* El tono y la respiración. La queja fue «suena robótico», y de las tres
   palancas que da el navegador la que más cambia el resultado NO es la voz:
   es la RESPIRACIÓN. Un párrafo entero en una sola frase sale plano y sin
   aire; troceado por comas y puntos, con una pausa corta en cada junta, la
   misma voz pasa por persona. Por eso HUMANA viene puesta. */
const tonoSano=v=>(isFinite(v)&&v>0)?Math.max(.6,Math.min(1.4,v)):.86;
let TONO=tonoSano(parseFloat(localStorage.getItem('tonoCerebro')));
let RESPIRA=localStorage.getItem('respiraCerebro')!=='0';

/* ═══ MODO INVITADO ═══════════════════════════════════════════════════════
   Un invitado llega por /demo con un vale en la dirección. Ve el ecosistema
   y la demostración en vivo, y NO ve nada interno: ni los partes de los
   agentes, ni los pendientes, ni los costes, ni la seguridad. Eso no se
   esconde con CSS --el servidor ya se niega a servirlo con un vale-- pero la
   página tampoco lo pide, para no dejar peticiones fallidas por ahí. */
const VALE=new URLSearchParams(location.search).get('t')||'';
/* Se entra de invitado por /demo. El VALE es opcional y solo desbloquea la
   transaccion en vivo: sin el, la presentacion se ve entera pero de solo
   lectura. Asi el enlace se puede ensenar sin miedo, y solo quien lleva vale
   puede gastar fondos de los bots. */
const INVITADO=/\/demo/.test(location.pathname)||location.search.includes('demo=1');
const PUEDE_TX=INVITADO&&!!VALE;
if(INVITADO)document.body.classList.add('invitado');
const RUTAS={tx:'bots/ahora', bots:'bots'};
const api=(r)=>INVITADO
  ? '/ordenes/demo/'+r+'?t='+encodeURIComponent(VALE)
  : '/ordenes/'+(RUTAS[r]||r);
let pausadoAdrede=false;
const T = {
  en:{equipo:'THE TEAM',sistemas:'SYSTEMS',brief:'BRIEF ME',stop:'STOP',speak:'SPEAK',
      listening:'LISTENING',report:'REPORT',online:'ONLINE',degraded:'DEGRADED',
      lema:'ORDEN GLOBAL · CONTROL CORE',reporte:'DAILY REPORT',
      estado:'Status',dentro:'WHAT IS INSIDE',vivo:'LIVE',fallas:'FAILURES',
      ahora:'RIGHT NOW',hecho:'DONE TODAY',falta:'OUTSTANDING',
      necesita:'NEEDS YOU',equipoT:'THE TEAM',hace:'ago',
      noOigo:'Voice input is not available in this browser.',
      nada:'I did not catch that. Try: status, chains, money, security, cost, team, or bots.'},
  es:{equipo:'EL EQUIPO',sistemas:'SISTEMAS',brief:'EL PARTE',stop:'PARAR',speak:'HABLAR',
      listening:'ESCUCHANDO',report:'INFORME',online:'EN LÍNEA',degraded:'CON FALLAS',
      lema:'ORDEN GLOBAL · NÚCLEO DE CONTROL',reporte:'PARTE DEL DÍA',
      estado:'Estado',dentro:'QUÉ HAY DENTRO',vivo:'EN VIVO',fallas:'FALLAS',
      ahora:'AHORA MISMO',hecho:'HECHO HOY',falta:'PENDIENTE',
      necesita:'NECESITA A JOSÉ',equipoT:'EL EQUIPO',hace:'hace',
      noOigo:'Este navegador no permite escuchar la voz.',
      nada:'No entendí. Prueba: estado, cadenas, dinero, seguridad, coste, equipo o bots.'}
};
const t = k => T[IDI][k];

/* ═══ 1 · LOS SISTEMAS ════════════════════════════════════════════════════
   `a` es la dirección del racimo dentro del cerebro; `n` cuántas neuronas
   lo forman. Los que más cosas hacen tienen más neuronas: el tamaño dice
   algo, no es decorativo. */
const SIS=[
 {id:'n5534', nom:'TESTNET 5534', es:'RED DE PRUEBAS', col:'#5ad9ff', a:[-.72,.30,.34], n:16,
  que:{en:'Besu QBFT · 4 validators',es:'Besu QBFT · 4 validadores'},
  det:{en:['Live chain, one block every 10 seconds','Two independent RPC endpoints, both HTTPS',
      'Gas floor at 93 gwei, enforced on all nodes','Shanghai activated in place, no block lost',

   es:['Cadena viva, un bloque cada 10 segundos','Dos RPC independientes, los dos con certificado',
      'Suelo de gas en 93 gwei, aplicado en todos los nodos','Shanghai activado en caliente, sin perder un bloque',
      'Los validadores corren dentro de las máquinas de la cadena vieja']}},
 {id:'g5550', nom:'MAINNET 5550', es:'RED PRINCIPAL', col:'#8affd4', a:[-.34,.62,.16], n:14,
  que:{en:'Genesis built and judged',es:'Génesis construido y juzgado'},
  det:{en:['331 accounts, 172 contracts, 1,375 storage slots','Judged against the closed chain: zero differences',
      'Total supply: one trillion ORIGEN, exact','No new machines needed — nodes 3 to 6 have room',
      'Starting it IS the cutover, and that is done with José'],
   es:['331 cuentas, 172 contratos, 1.375 ranuras','Juzgado contra la cadena cerrada: cero diferencias',
      'Emisión total: un billón de ORIGEN, exacta','No hacen falta máquinas nuevas: los nodos 3 a 6 tienen sitio',
      'Arrancarla ES el corte, y eso se hace contigo']}},
 {id:'m8532', nom:'LEGACY 8532', es:'CADENA VIEJA', col:'#7a93a8', a:[-.10,-.50,.62], n:12,
  que:{en:'Frozen · the source of truth',es:'Congelada · el origen de todo'},
  det:{en:['Frozen at block 4,178,763','State root identical to the closing snapshot',
      'The 5550 genesis was built from this exact state','One single transaction here invalidates the migration',

/* ═══ 2 · LA GEOMETRÍA DEL CEREBRO ════════════════════════════════════════
   Tres capas, y las tres hacen falta para que se lea como UN órgano y no
   como puntos sueltos —que era el problema del dibujo anterior—:
     · la CORTEZA, una piel de dos lóbulos con su fisura;
     · los RACIMOS, un núcleo por sistema con sus neuronas alrededor;
     · los AXONES, que unen racimo con racimo y con el centro. */

const az=()=>Math.random();
function gauss(){let u=0,v=0;while(!u)u=az();while(!v)v=az();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);}

/* La superficie del cerebro: elipsoide alargado, aplastado arriba, con la
   fisura longitudinal que separa los dos lóbulos. */
function piel(){
  let v=[gauss(),gauss(),gauss()];
  const m=Math.hypot(...v)||1; v=v.map(x=>x/m);
  v[0]*=1.00; v[1]*=0.76; v[2]*=1.22;
  const s=v[0]>=0?1:-1;                       // la fisura: se aparta del centro
  v[0]=s*(Math.abs(v[0])*0.80+0.17);
  if(v[1]>0)v[1]*=0.88;                        // aplastado por arriba
  const r=1+0.035*Math.sin(v[2]*11)*Math.cos(v[1]*9);   // los surcos
  return v.map(x=>x*r);
}

const NEU=[];           // todas las neuronas: {p:[x,y,z], sis, nucleo}
const HILOS=[];         // enlaces finos: [i,j,alfa]
const CORTEZA=[];
for(let i=0;i<950;i++){CORTEZA.push(NEU.length);NEU.push({p:piel(),sis:null,nucleo:false});}

/* Cada racimo: un núcleo hacia dentro y sus neuronas alrededor. */
const NUCLEO={};
for(const s of SIS){
  const d=Math.hypot(...s.a)||1;
  const c=s.a.map(x=>x/d*(0.74+((s.n%3)*0.06)));
  NUCLEO[s.id]=NEU.length;
  NEU.push({p:c,sis:s.id,nucleo:true});
  for(let i=0;i<s.n;i++){
    const o=[gauss(),gauss(),gauss()];const m=Math.hypot(...o)||1;
    const r=0.13+az()*0.17;
    NEU.push({p:c.map((x,k)=>x+o[k]/m*r),sis:s.id,nucleo:false});
    HILOS.push([NUCLEO[s.id],NEU.length-1,0.5]);
  }
}
/* La piel se cose a sí misma con sus tres vecinos más cercanos. Sin esto la
   corteza es confeti; con esto es una superficie. */
for(const i of CORTEZA){
  const d=CORTEZA.map(j=>[j===i?9:dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<3;k++)if(d[k][0]<0.40)HILOS.push([i,d[k][1],0.34]);
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}
/* Y cada racimo se ancla a la corteza que tiene encima. */
for(const s of SIS){
  const i=NUCLEO[s.id];
  const d=CORTEZA.map(j=>[dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<4;k++)HILOS.push([i,d[k][1],0.2]);
}

/* ═══ 3 · IMPULSOS ═══════════════════════════════════════════════════════
   Un impulso recorre un axón de punta a punta. Salen cuando pasa algo:
   JARVIS nombra un sistema, un agente habla, llega un bloque nuevo. En
   reposo hay tráfico tenue, para que el cerebro respire sin gritar. */
const IMPULSOS=[];
function impulso(de,a,col,vel){
  IMPULSOS.push({de:NUCLEO[de],a:a==='centro'?-1:NUCLEO[a],t:0,
    vel:vel||(0.011+az()*0.006),col:col||'#5ad9ff'});
}
function disparar(id,fuerte){
  const s=S(id); if(!s)return;
  E[id].fuego=1;
  impulso(id,'centro',s.col,fuerte?0.02:0.013);
  for(const [a,b] of AXONES){
    if(a===id)impulso(a,b,s.col);
    else if(b===id)impulso(b,a,s.col);
  }
}

},900);

                  t:0, vel:0.004+Math.random()*0.005, r:1+Math.random()*1.6});
    }

}

function dibujaLinea(cv,datos,col){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.round(cv.getBoundingClientRect().width)||198, hh=28;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(hh*dpr);}
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,hh);
  /* rejilla tenue, como en un instrumento */
  g.strokeStyle='rgba(109,139,161,.13)'; g.lineWidth=1;
  for(let y=1;y<3;y++){g.beginPath();g.moveTo(0,y*hh/3);g.lineTo(w,y*hh/3);g.stroke();}
  if(datos.length<2)return;
  const paso=w/(datos.length-1);
  const y=v=>hh-2.5-(v/100)*(hh-6);
  g.beginPath();
  datos.forEach((v,i)=>{i?g.lineTo(i*paso,y(v)):g.moveTo(i*paso,y(v));});
  g.strokeStyle=col; g.lineWidth=1.4; g.stroke();
  g.lineTo(w,hh); g.lineTo(0,hh); g.closePath();
  g.globalAlpha=.16; g.fillStyle=col; g.fill(); g.globalAlpha=1;
  /* el punto de ahora, como en la referencia */
  const ul=datos[datos.length-1];
  g.beginPath(); g.arc(w-1.5,y(ul),2,0,6.283); g.fillStyle=col; g.fill();
}

  const sx=S(id); if(!sx)return;
  const [ax,ay,az]=sx.a, h=Math.hypot(ax,az)||1e-6;
  let ty=Math.atan2(ax,az)+Math.PI;            // deja el racimo de frente
  const tx=-Math.atan2(ay,h);
  while(ty-rY> Math.PI)ty-=6.283185;           // por el camino más corto
  while(ty-rY<-Math.PI)ty+=6.283185;
  camDestino={rY:ty, rX:Math.max(-1,Math.min(1,tx)), zoom:zoom||1.45};
  FOCO=id; giroLibre=false;
}
function soltarCamara(){camDestino={rY:rY,rX:-.12,zoom:1};FOCO=null;
  setTimeout(()=>{giroLibre=true;camDestino=null;},1400);}
addEventListener('pointermove',e=>{if(arr)return;

const pr=[];    // proyección de cada neurona, recalculada cada cuadro
function proyectar(){
  const c1=Math.cos(rY),s1=Math.sin(rY),c2=Math.cos(rX),s2=Math.sin(rX);
  for(let i=0;i<NEU.length;i++){
    const[x0,y0,z0]=NEU[i].p;
    const x=x0*c1-z0*s1, z1=x0*s1+z0*c1;
    const y=y0*c2-z1*s2, z=y0*s2+z1*c2;
    const f=2.9/(2.9+z);
    pr[i]=[W/2+x*ESC*ZOOM*f, H/2+y*ESC*ZOOM*f, f, z];
  }
}
function centro(){return [W/2,H/2,1,0];}

function fondo(){
  fx.clearRect(0,0,W,H);
  const g=fx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(12,44,68,.5)');g.addColorStop(.55,'rgba(4,16,26,.3)');
  g.addColorStop(1,'rgba(1,5,9,0)');
  fx.fillStyle=g;fx.fillRect(0,0,W,H);
}

let ultimo=0;
function cuadro(ts){
  const dt=Math.min(60,ts-ultimo)||16; ultimo=ts;
  if(giroLibre&&!document.hidden)rY+=0.00022*dt;
  if(camDestino){
    const k=1-Math.pow(0.0016,dt/1000);         // suavizado independiente del cuadro
    rY+=(camDestino.rY-rY)*k; rX+=(camDestino.rX-rX)*k;
    ZOOM+=(camDestino.zoom-ZOOM)*k;
  }else{
    rX+=((paraY-.12)-rX)*.02;                   // el cabeceo sigue al puntero
    ZOOM+=(1-ZOOM)*.02;
  }
  proyectar();
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';

  /* los hilos finos: la carne del cerebro */
  for(const[i,j,al] of HILOS){
    const A=pr[i],B=pr[j];
    if(A[3]>1.5&&B[3]>1.5)continue;
    const p=Math.max(0,Math.min(1,(A[2]+B[2])/2-.55));
    cx.strokeStyle='rgba(90,217,255,'+(al*p*1.15).toFixed(3)+')';
    cx.lineWidth=.5;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* los axones: gruesos, y se encienden con el estado del sistema */
  for(const[a,b] of AXONES){
    const A=pr[NUCLEO[a]],B=pr[NUCLEO[b]];
    const mal=E[a].mal||E[b].mal;
    const v=Math.max(E[a].fuego,E[b].fuego);
    cx.strokeStyle=mal?'rgba(255,74,61,'+(.20+v*.5).toFixed(2)+')'
                      :'rgba(90,217,255,'+(.09+v*.30).toFixed(2)+')';
    cx.lineWidth=mal?1.2:.9;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* las neuronas */
  for(let i=0;i<NEU.length;i++){
    const n=NEU[i],P=pr[i];
    if(n.sis){
      const e=E[n.sis],s=S(n.sis);
      const at=(FOCO&&n.sis!==FOCO)?0.22:1;      // profundidad de campo, a mano
      const r=(n.nucleo?3.1:1.35)*P[2]*(FOCO&&n.sis===FOCO?1.25:1);
      cx.fillStyle=e.mal?'rgba(255,74,61,'+((.55+e.fuego*.45)*at).toFixed(2)+')'
        :hexA(s.col,((n.nucleo?.55:.30)+e.fuego*.45)*at);
      if(n.nucleo){cx.shadowColor=e.mal?'#ff4a3d':s.col;cx.shadowBlur=16*e.fuego+7;}
      cx.beginPath();cx.arc(P[0],P[1],r,0,6.283);cx.fill();cx.shadowBlur=0;
    }else{
      /* niebla de profundidad: lo cercano es claro y grande, lo lejano se
         hunde en azul oscuro. Esto es lo que hace que se lea 3D. */
      const z=Math.max(0,Math.min(1,(P[2]-.55)*1.6));
      cx.fillStyle='rgba('+(90+z*90)+','+(160+z*70)+','+(210+z*45)+','+(0.04+z*0.30).toFixed(3)+')';
      cx.beginPath();cx.arc(P[0],P[1],(0.6+z*1.1),0,6.283);cx.fill();
    }
  }

  /* los impulsos: esto es lo que hace que se vea que está haciendo algo */
  for(let k=IMPULSOS.length-1;k>=0;k--){
    const m=IMPULSOS[k];
    m.t+=m.vel*dt/16;
    if(m.t>=1){IMPULSOS.splice(k,1);continue;}
    const A=pr[m.de], B=m.a<0?centro():pr[m.a];
    const x=A[0]+(B[0]-A[0])*m.t, y=A[1]+(B[1]-A[1])*m.t;
    const cola=Math.max(0,m.t-0.16);
    const xc=A[0]+(B[0]-A[0])*cola, yc=A[1]+(B[1]-A[1])*cola;
    cx.strokeStyle=hexA(m.col,m.tenue?.22:.7);
    cx.lineWidth=m.tenue?1:2;
    cx.beginPath();cx.moveTo(xc,yc);cx.lineTo(x,y);cx.stroke();
    if(!m.tenue){
      cx.fillStyle=m.col;cx.shadowColor=m.col;cx.shadowBlur=12;
      cx.beginPath();cx.arc(x,y,2.1,0,6.283);cx.fill();cx.shadowBlur=0;
    }
  }

  /* las motas de ORIGEN, por encima de los impulsos */
  for(let k=MOTAS.length-1;k>=0;k--){
    const m=MOTAS[k]; m.t+=m.vel*dt/16;
    if(m.t>=1){MOTAS.splice(k,1);continue;}
    const A=pr[m.de], B=pr[m.a];
    const x=A[0]+(B[0]-A[0])*m.t, y=A[1]+(B[1]-A[1])*m.t;
    const op=Math.sin(m.t*3.1416);
    cx.fillStyle='rgba(255,196,107,'+(op*.85).toFixed(3)+')';
    cx.shadowColor='#ffc46b'; cx.shadowBlur=14*op;
    cx.beginPath();cx.arc(x,y,m.r*op+.5,0,6.283);cx.fill();cx.shadowBlur=0;
  }

  /* EL REACTOR. Cuando habla, respira: tres anillos concéntricos y un arco
     que gira. Es la presencia física del asistente. */
  const amp=hablando?(0.75+0.25*Math.sin(ts/95)+0.12*Math.sin(ts/41)):(0.28+0.08*Math.sin(ts/900));
  const cxx=W/2,cyy=H/2;
  cx.shadowColor='#56d9ff';
  for(const[r0,g0,a0] of [[46,26,.05],[26,14,.10],[11,30,.30]]){
    cx.fillStyle='rgba(86,217,255,'+(a0*amp*2).toFixed(3)+')';
    cx.shadowBlur=g0+amp*34;
    cx.beginPath();cx.arc(cxx,cyy,r0*(.75+amp*.5),0,6.283);cx.fill();
  }
  cx.shadowBlur=0;
  cx.strokeStyle='rgba(86,217,255,'+(.14+amp*.5).toFixed(3)+')';
  cx.lineWidth=1.6;
  cx.beginPath();cx.arc(cxx,cyy,34+amp*10,ts/700,ts/700+4.4);cx.stroke();
  cx.strokeStyle='rgba(255,196,107,'+(.06+amp*.24).toFixed(3)+')';
  cx.beginPath();cx.arc(cxx,cyy,42+amp*12,-ts/1100,-ts/1100+2.2);cx.stroke();

  cx.globalCompositeOperation='source-over';
  etiquetas();
  for(const s of SIS)E[s.id].fuego=Math.max(E[s.id].mal?.42:.12,E[s.id].fuego-0.0016*dt);
  requestAnimationFrame(cuadro);
}
function hexA(h,a){const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')';}

/* Etiquetas en el propio lienzo, y solo las que miran hacia delante. Si dos
   se pisan, gana la que está más cerca: mejor menos texto que texto ilegible. */
const cajas=[];
function etiquetas(){
  cajas.length=0;
  const orden=SIS.map(s=>[pr[NUCLEO[s.id]],s]).sort((a,b)=>a[0][3]-b[0][3]);
  cx.textBaseline='middle';
  const angosta=W<560;
  /* Mientras hay una cifra grande en pantalla, las etiquetas que caen encima
     no se dibujan. Con el billón de ORIGEN detrás, «MYTOKENPAY» cruzándole
     los ceros no es información: es ruido justo en el momento que más pesa. */
  let veto=null;
  const cf=$('#cifras');
  if(cf&&cf.classList.contains('abre')){
    const r=cf.getBoundingClientRect();
    if(r.width)veto=[r.left-14,r.top-10,r.right+14,r.bottom+10];
  }
  for(const [P,s] of orden){
    /* La caja de toque se borra ANTES de decidir si se dibuja: si no, una
       etiqueta que dejó de pintarse seguía siendo tocable donde ya no está. */
    s._caja=null;
    if(P[3]>0.35)continue;
    const e=E[s.id];
    const nom=IDI==='en'?s.nom:s.es;
    cx.font='700 9.5px '+getComputedStyle(document.body).fontFamily;
    const met=angosta?e.met.slice(0,14):e.met.slice(0,26);
    /* El ancho lo manda el texto MÁS LARGO de los dos, no solo el nombre: con
       el nombre solo, la línea de abajo se salía de su propia caja. */
    const wn=cx.measureText(nom).width;
    cx.font='400 7.5px '+getComputedStyle(document.body).fontFamily;
    const w=Math.max(wn,cx.measureText(met).width)+12;
    cx.font='700 9.5px '+getComputedStyle(document.body).fontFamily;
    /* En un teléfono la mitad de las etiquetas caían fuera de la pantalla y
       se leían a medias --«MYTOKE»--. Si no cabe a la derecha del nodo, se
       dibuja a su izquierda; y si tampoco, se pega al borde. */
    let x=P[0]+11;
    if(x+w>W-8) x=(P[0]-11-w>=8) ? P[0]-11-w : Math.max(8,W-8-w);
    const y=P[1];
    if(w>W-16)continue;                 // no cabe ni pegada: mejor no dibujarla
    if(veto&&x<veto[2]&&x+w>veto[0]&&y-9<veto[3]&&y+9>veto[1])continue;
    if(cajas.some(c=>x<c[0]+c[2]&&x+w>c[0]&&y-9<c[1]+c[3]&&y+9>c[1]))continue;
    cajas.push([x,y-9,w,18]);
    s._caja=[x,y-9,w,26];
    cx.fillStyle='rgba(1,5,9,.82)';cx.fillRect(x,y-9,w,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;cx.fillRect(x,y-9,1.5,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;
    cx.fillText(nom,x+7,y-1);
    cx.font='400 7.5px '+getComputedStyle(document.body).fontFamily;
    cx.fillStyle='#5d7d93';cx.fillText(met,x+7,y+9);
  }
}
function tocar(x,y){
  for(const s of SIS){const c=s._caja;
    if(c&&x>=c[0]&&x<=c[0]+c[2]&&y>=c[1]&&y<=c[1]+c[3]){abrirSis(s);return;}}
  let mejor=null,dm=34;
  for(const s of SIS){const P=pr[NUCLEO[s.id]];
    const d=Math.hypot(P[0]-x,P[1]-y);if(d<dm){dm=d;mejor=s;}}
  if(mejor)abrirSis(mejor);
}

  p.style.background=mal?'var(--red)':'var(--green)';
  p.style.boxShadow='0 0 9px '+(mal?'#ff4a3d':'#48e39b');
  $('#pulso').style.borderColor=mal?'rgba(255,74,61,.5)':'var(--edge)';
}
function railAgentes(){
  const r=$('#agentes'); r.querySelectorAll('.fila').forEach(f=>f.remove());
  for(const a of AGENTES){

    const v=p?p.veredicto:null;
    const f=document.createElement('div');

/* ═══ 7 · LA VOZ ═════════════════════════════════════════════════════════
   JARVIS es inglés británico, grave y sin prisa. Los agentes llevan cada
   uno una voz distinta, para que se sepa quién habla sin mirar la pantalla.
   Se elige la mejor que tenga el aparato, y la elección se recuerda. */
const JARVIS=[/Daniel/i,/Arthur/i,/Oliver/i,/George/i,/Ryan/i,/Brian/i,
  /UK English Male/i,/British/i,/en-GB/i];
const BUENAS_EN=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Alex/i,/Samantha/i];
const BUENAS_ES=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Mónica|Monica/i,/Paulina/i,
  /Jorge/i,/Juan/i,/Helena/i,/Laura/i,/Sabina/i];
/* Las voces se guardan POR NOMBRE, no por objeto. En iOS un objeto de voz
   obtenido antes de un 'voiceschanged' se queda rancio: asignarlo enmudece la
   frase sin dar ningún error. Se vuelve a buscar por nombre al hablar. */
let voces=[],nombreJarvis=null,nombreAgente={};
const vozPorNombre=n=>n?(speechSynthesis.getVoices().find(v=>v.name===n)||null):null;

/* En qué idioma está escrito ESTE texto. Los partes de los agentes vienen en
   castellano aunque el tablero esté en inglés, y leerlos con voz inglesa es
   lo que sonaba a robot. Se cuentan marcas propias de cada idioma; con la ñ,
   los acentos y los signos de apertura sobra casi siempre. */
function idiomaDe(x){
  const s=' '+String(x).toLowerCase()+' ';
  if(/[ñáéíóú¿¡]/.test(s))return 'es';
  const es=(s.match(/ (que|de|la|el|los|las|con|para|una|del|por|se|no|es|y|en|al|su|lo|sin|ya) /g)||[]).length;
  const en=(s.match(/ (the|and|of|is|to|in|for|with|that|are|was|it|on|as|at|by|from|has|not) /g)||[]).length;
  if(es===en)return IDI;
  return es>en?'es':'en';
}
/* Una voz de ese idioma, y distinta para los agentes si se puede. */
function vozDeIdioma(idi,agente){
  const todas=speechSynthesis.getVoices().filter(v=>new RegExp('^'+idi,'i').test(v.lang||''));
  if(!todas.length)return null;
  if(!agente)return todas[0];
  const k=AGENTES.findIndex(a=>a.id===agente);
  return todas[(Math.max(0,k)+1)%todas.length];
}

/* iOS exige que la PRIMERA llamada a speak() nazca dentro de un toque. No se
   desbloquea con una frase muda seguida de un cancel --eso vuelve a bloquearlo
   en iPad--: se desbloquea hablando de verdad, sin cancelar nada antes. */
let desbloqueada=false;

/* Safari y Chrome suspenden el sintetizador solos a los pocos segundos y la
   cola se queda a medias, en silencio. Esto lo despierta. */
setInterval(()=>{if(hablando&&speechSynthesis.paused&&!pausadoAdrede)speechSynthesis.resume();},2500);
function puntua(v){
  let p=0;
  if(IDI==='en'){
    JARVIS.forEach((r,i)=>{if(r.test(v.name)||r.test(v.lang))p+=60-i*4;});
    BUENAS_EN.forEach((r,i)=>{if(r.test(v.name))p+=22-i*2;});
    if(/^en/i.test(v.lang))p+=25;
    if(/en-GB/i.test(v.lang))p+=30;
  }else{
    BUENAS_ES.forEach((r,i)=>{if(r.test(v.name))p+=24-i*2;});
    if(/^es/i.test(v.lang))p+=30;
    /* ESPANOL LATINO, no de Espana. Cuando una frase no esta grabada habla
       el navegador, y si ahi sale una voz peninsular en mitad de una
       presentacion hecha en mexicano el corte se oye a un kilometro. Se
       premia es-MX y el resto de America, y se penaliza es-ES. */
    if(/^es[-_](mx|419|us|co|ar|cl|pe|ve)/i.test(v.lang))p+=34;
    if(/^es[-_]es/i.test(v.lang))p-=26;
    if(/(Paulina|Juan|Angelica|Ang.lica|Marisol|Jorge|Mexic|Latin)/i.test(v.name))p+=12;
  }
  /* Las voces buenas de Android y Chrome son las de RED --«Google …», las
     «Natural» y «Neural» de Microsoft--; las locales son el sintetizador
     viejo y son justo las que suenan a robot. Antes esto premiaba a las
     locales por ser más rápidas de arrancar, que es optimizar lo que no
     importa. En Apple manda otra cosa: allí las buenas SON locales (Daniel,
     Mónica), y ya las premia el nombre unas líneas más arriba. */
  const APPLE=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent||'');
  if(!APPLE&&!v.localService)p+=16;
  if(APPLE&&v.localService)p+=4;
  return p;
}
function cargarVoces(){
  const todas=speechSynthesis.getVoices();
  if(!todas.length)return;
  const idio=IDI==='en'?/^en/i:/^es/i;
  voces=todas.filter(v=>idio.test(v.lang));
  if(!voces.length)voces=todas;
  voces.sort((a,b)=>puntua(b)-puntua(a));
  /* Treinta voces del sistema en un selector es basura visual: se enseñan
     las MEJORES. Primero las conocidas buenas; si hay pocas, las mejor
     puntuadas hasta seis. */
  const FINAS=IDI==='en'
    ?[/Daniel/i,/Arthur/i,/Oliver/i,/Serena/i,/Kate/i,/Samantha/i,/Alex/i,/Ava/i,
      /Natural/i,/Neural/i,/Online/i,/Google UK/i,/Google US/i]
    :[/Paulina/i,/Angélica|Angelica/i,/Marisol/i,/Juan/i,/Jorge/i,/Mónica|Monica/i,
      /Natural/i,/Neural/i,/Online/i,/Google español/i,/Google Español/i];
  const finas=voces.filter(v=>FINAS.some(r=>r.test(v.name)));
  if(finas.length>=2)voces=finas.slice(0,6); else voces=voces.slice(0,6);
  const sel=$('#voces'); sel.innerHTML='';
  voces.forEach((v,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=v.name.replace(/Microsoft |Google /,'').slice(0,24);sel.appendChild(o);});
  const g=localStorage.getItem('vozCerebro-'+IDI);
  const idx=g!==null&&voces[g]?+g:0;
  sel.value=idx; nombreJarvis=voces[idx]?voces[idx].name:null;
  /* A cada agente, una voz distinta de las siguientes de la lista. */
  nombreAgente={};
  AGENTES.forEach((a,k)=>{const v=voces[(k+1)%Math.max(1,voces.length)];
    nombreAgente[a.id]=v?v.name:nombreJarvis;});
  diagnostico();
}
/* Si el aparato no tiene ni una voz, hay que DECIRLO. El fallo anterior fue
   justo este: silencio absoluto y ninguna pista de por qué. */
function diagnostico(){

}

/* Que la voz no lea símbolos ni siglas raras. En español "gwei" suena como
   una palabrota mexicana; en inglés se lee "gway" y tampoco es. */
function limpiar(x){
  return String(x)
    .replace(/·/g,',').replace(/—/g,',').replace(/\bgwei\b/gi,'gigawei')
    .replace(/\bRPC\b/g,IDI==='en'?'R P C':'erre pe ce')
    .replace(/\bUSD\b/g,IDI==='en'?'dollars':'dólares')
    .replace(/(\d),(\d{3})/g,'$1$2').replace(/\$/g,'').replace(/%/g,IDI==='en'?' percent':' por ciento')
    .replace(/0x[0-9a-fA-F]{6,}/g,IDI==='en'?'an address':'una dirección')
    .replace(/\s+/g,' ').trim();
}
/* ═══ LA RESPIRACIÓN ══════════════════════════════════════════════════════
   Por qué sonaba a robot, de verdad: el navegador lee una frase larga de un
   tirón, con una entonación plana de principio a fin y sin una sola pausa
   donde una persona respiraría. No hay SSML en la Web Speech API, así que la
   prosodia hay que fabricarla: se parte la frase por sus juntas naturales
   --coma, punto y coma, dos puntos, punto-- y cada trozo va como una frase
   suya, con un silencio detrás del tamaño de su signo.

   Y una segunda cosa: la DECLINACIÓN. Al hablar, el tono baja según avanza la
   oración y cae del todo en el punto final. Aquí se imita con un descenso
   pequeño por trozo. Es sutil a propósito: exagerarlo suena a locutor. */
function trozos(x){
  if(!RESPIRA)return [[x,320]];
  /* Se recorre a mano en vez de partir con lookbehind: Safari no lo entendió
     hasta la 16.4 y un iPad de hace dos años dejaría la voz muda sin decir
     por qué --que es exactamente el fallo que ya nos costó un día--. */
  const bruto=[]; let acc='';
  const s0=String(x);
  for(let i=0;i<s0.length;i++){
    acc+=s0[i];
    if('.;:,!?'.indexOf(s0[i])>=0 && (i+1>=s0.length || /\s/.test(s0[i+1]))){
      bruto.push(acc); acc='';
    }
  }
  if(acc.trim())bruto.push(acc);
  const out=[];
  for(let s of bruto){
    s=s.trim(); if(!s)continue;
    const fin=s.slice(-1);
    const espera=/[.!?]/.test(fin)?300:/[;:]/.test(fin)?190:110;
    /* Un trozo de tres letras no es una junta, es un tropiezo: se pega al
       anterior en vez de quedarse solo respirando. */
    if(out.length&&s.replace(/\W/g,'').length<8){
      out[out.length-1][0]+=' '+s; out[out.length-1][1]=espera;
    }else out.push([s,espera]);
  }
  return out.length?out:[[String(x),320]];
}
/* ═══ LA VOZ GRABADA ══════════════════════════════════════════════════════
   La presentación es un GUION: no cambia entre una reunión y la siguiente.
   Así que sus frases se graban de antemano con Piper --un modelo que corre
   en nuestras propias máquinas, sin enviar nada a nadie-- y aquí solo se
   reproducen. Sale mejor por tres razones:

     · se puede usar el modelo lento y bueno, porque tarda una vez;
     · en la reunión no hay latencia ni dependencia de la red;
     · y suena igual en todos los teléfonos, que es lo que no conseguía la
       voz del navegador --cada aparato traía la suya--.

   LA REGLA QUE NO SE ROMPE: si el fichero no está, no carga, o tarda, se
   habla con la voz del navegador y no se nota. Un audio que falla en
   silencio delante de un inversionista es peor que una voz mediocre, y ese
   error ya nos costó un día entero.

   La clave es un FNV-1a del texto ya limpio, con gemelo en rendir.py. Si el
   texto cambia una coma, la clave cambia, el audio no aparece y vuelve la
   voz del navegador. A propósito: mejor la voz de siempre que un audio
   diciendo algo distinto de lo que pone el subtítulo. */
let MANIFIESTO=null, audioActual=null;
const VOZ_GRABADA={es:'es_MX-claude-high', en:'en_GB-alan-medium'};
function claveVoz(texto,voz){
  let h=0x811c9dc5;
  const s=voz+'|'+texto;
  for(let i=0;i<s.length;i++){
    /* Se recorre por BYTES de UTF-8, como en Python: con acentos y eñes un
       recorrido por caracteres da otra clave y no encontraría nada. */
    let c=s.codePointAt(i), bs;
    if(c<0x80)bs=[c];
    else if(c<0x800)bs=[0xc0|(c>>6),0x80|(c&63)];
    else if(c<0x10000)bs=[0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)];
    else {bs=[0xf0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)];i++;}
    for(const b of bs){h^=b; h=Math.imul(h,0x01000193)>>>0;}
  }
  return ('0000000'+h.toString(16)).slice(-8);
}
function audioDe(textoLimpio){
  if(!MANIFIESTO)return null;
  const e=MANIFIESTO[claveVoz(textoLimpio,VOZ_GRABADA[idiomaDe(textoLimpio)]||'')];
  return e?'/voz/'+e.f:null;
}
/* ═══ EL NOMBRE Y LA VOZ ══════════════════════════════════════════════════
   Las frases llevan tu nombre --«Bienvenido a Orden Global, Carlos»-- y ese
   texto no puede estar grabado: no sabemos como te llamas hasta que llegas.
   Resultado: justo esas frases caian a la voz del navegador y sonaban a
   robot de Espana en mitad de la presentacion. Eso era peor que no decir el
   nombre.

   Asi que si la version con nombre no esta grabada, se usa la generica --y
   se DICE Y SE ESCRIBE la generica, las dos cosas--. Nunca un audio que
   diga algo distinto del subtitulo: esa regla no se rompe ni por esto. */
function conVoz(texto){
  const t=limpiar(texto);
  let url=audioDe(t);
  if(url)return {texto:t,url};
  const v=VOC();
  if(v){
    const gen=t.split(v).join('');
    if(gen!==t){ url=audioDe(gen); if(url)return {texto:gen,url}; }
  }
  return {texto:t,url:null};
}
(function cargarManifiesto(){
  /* Sin manifiesto no pasa nada: se habla como siempre. Por eso ni se avisa
     del fallo --no es un fallo, es el modo normal de antes--. */
  fetch('/voz/manifiesto.json',{cache:'force-cache'})
    .then(r=>r.ok?r.json():null)
    .then(j=>{if(j&&typeof j==='object')MANIFIESTO=j;})
    .catch(()=>{});
})();
/* Reproduce y avisa. Si algo va mal --o si en dos segundos no ha empezado--
   se llama a `alFallar` UNA sola vez y habla el navegador. */
function reproducir(url,mio,alAcabar,alFallar){
  let muerto=false;
  const rendirse=()=>{ if(muerto)return; muerto=true;
    try{a.pause();}catch(e){}
    if(audioActual===a)audioActual=null;
    alFallar(); };
  const a=new Audio(url);
  a.preload='auto';
  try{a.playbackRate=Math.max(.6,Math.min(1.6,velSana(VEL)));}catch(e){}
  a.onended=()=>{ if(muerto||mio!==TURNO)return; muerto=true;
                  if(audioActual===a)audioActual=null; alAcabar(); };
  a.onerror=rendirse;
  audioActual=a;
  /* El vigilante se rinde solo si el fichero NO HA LLEGADO. Antes miraba
     `currentTime`, y hay navegadores --y el headless de las pruebas-- donde
     el audio suena sin que ese contador se mueva a tiempo: el vigilante lo
     daba por muerto y se ponia a hablar ENCIMA del audio. Dos voces a la
     vez es peor que ninguna. */
  /* Que se rinda solo si el fichero NO HA LLEGADO, y ni un caso mas.
     · `currentTime` a secas no vale: hay navegadores donde suena sin que ese
       contador se mueva a tiempo, y el vigilante se ponia a hablar ENCIMA
       del audio. Dos voces a la vez es peor que ninguna.
     · Y `!paused` TAMPOCO vale, aunque lo parezca: `play()` deja `paused`
       en falso aunque el fichero se quede colgado sin llegar nunca. Con esa
       condicion el vigilante no saltaba jamas y se quedaba mudo, que es
       justo lo que existe para evitar.
     Lo que si vale es que hayan llegado datos. */
  /* Hay que separar DOS averias distintas, y confundirlas fue el error:

     1) EL FICHERO NO LLEGA --404, red colgada--. Aqui hay que rendirse
        pronto y hablar con la voz del navegador, o el asistente se queda
        mudo. Se detecta porque no llega ni la cabecera del audio.

     2) EL FICHERO LLEGA PERO NO SUENA --sin salida de audio, permiso
        denegado--. Aqui NO se puede hablar encima: sonarian las dos cosas.
        Se deja terminar y, si `onended` no llega nunca, se pasa de frase
        cuando ya deberia haber acabado. Se sigue adelante en silencio, que
        es lo unico razonable si el aparato no reproduce nada.

     `!paused` no sirve para distinguirlas, aunque lo parezca: `play()` lo
     deja en falso aunque el fichero se quede colgado sin llegar jamas. */
  let llegó=false;
  const arranque=setTimeout(()=>{if(!llegó)rendirse();},2500);
  const listo=()=>{
    if(llegó)return; llegó=true; clearTimeout(arranque);
    const dura=(isFinite(a.duration)&&a.duration>0?a.duration:12)*1000
               /Math.max(.6,velSana(VEL));
    setTimeout(()=>{ if(muerto||mio!==TURNO)return; muerto=true;
                     if(audioActual===a)audioActual=null; alAcabar(); }, dura+3000);
  };
  a.onloadedmetadata=listo; a.onloadeddata=listo; a.oncanplay=listo;
  a.onplaying=listo; a.ontimeupdate=listo;
  const pr=a.play();
  if(pr&&pr.catch)pr.catch(rendirse);
  return a;
}
function callarAudio(){
  if(!audioActual)return;
  try{audioActual.pause();audioActual.currentTime=0;}catch(e){}
  audioActual=null;
}
let cola=[],hablando=false,quienHabla=null;

/* AQUÍ ESTABA EL FALLO del 13-ago: `decir` llamaba a `parar`, que hace
   `speechSynthesis.cancel()`, y hablaba en el MISMO tick. Safari --y iPad
   sobre todo-- se queda en estado cancelado y se traga la frase: silencio
   absoluto, sin un solo error en la consola. Cancelar y hablar tienen que ir
   en ticks distintos, y si no había nada sonando NO se cancela nada. */
/* ═══ REANUDAR ═══════════════════════════════════════════════════════════
   Si te sales --a comprobar el hash en el explorador, por ejemplo-- o paras a
   mitad, lo que quedaba por decir se guarda y el botón pasa a CONTINUAR.
   Perder el sitio en una presentación de seis minutos era lo peor que podía
   pasar delante de un inversionista. */
let colaGuardada=null, finGuardado=null;
const hayPendiente=()=>!!(colaGuardada&&colaGuardada.length);
function marcarContinuar(){
  const b=$('#lblPresenta');
  if(hayPendiente()){b.textContent=IDI==='en'?'RESUME':'CONTINUAR';
    $('#btnPresenta').classList.add('sigue');}
  else{b.textContent=IDI==='en'?'TOUR':'RECORRIDO';
    $('#btnPresenta').classList.remove('sigue');}
}
function continuar(){
  if(!hayPendiente())return false;
  const c=colaGuardada, f=finGuardado;
  colaGuardada=null; finGuardado=null;
  PRESENTANDO=true; $('#btnPresenta').classList.add('on');document.body.classList.add('narrando');
  $('#btnPresenta').classList.remove('sigue');
  $('#lblPresenta').textContent=IDI==='en'?'PAUSE':'PAUSAR';
  $('#oido').textContent='';
  decir(c,f);
  pintarRecorrido();
  return true;
}
/* Al volver a la pestaña --de mirar el explorador-- se avisa sin buscar nada. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!hayPendiente())return;
  $('#oido').textContent=IDI==='en'?'Press RESUME to carry on where we left off.'
                                   :'Pulsa CONTINUAR para seguir donde lo dejamos.';
});

let alTerminar=null, lineaActual=null;
function decir(lineas,fin){
  /* Antes de pisar la cola, se guarda el sitio del recorrido. Este es el
     fallo que reinició todo: tocar un sistema llamaba a decir(), decir()
     reemplazaba la cola sin más, y los cinco minutos que quedaban de
     presentación desaparecían sin dejar rastro ni forma de volver. */
  guardarSitio();
  alTerminar=fin||null;
  const arrancar=()=>{
    /* Los puntos de control NO tienen texto --son una parada, no una
       frase-- y el filtro de siempre se los comía enteros: el recorrido
       pasaba de largo sin preguntar nunca nada. */
    cola=lineas.filter(l=>l&&(l.x||l.control));
    if(!cola.length)return;
    hablando=true; $('#hablar').classList.add('on'); $('#lblHablar').textContent=t('stop');
    siguiente();
  };
  if(!desbloqueada){         // la primera vez: directo, dentro del toque
    desbloqueada=true; arrancar(); return;
  }
  if(hablando||speechSynthesis.speaking||speechSynthesis.pending){
    hablando=false; cola=[]; TURNO++; callarAudio(); speechSynthesis.cancel();
    setTimeout(arrancar,200);
  }else arrancar();
}
/* Un turno de habla se identifica con un número. Cuando algo cancela la voz
   --tocar otra cosa, saltar de capítulo-- el turno viejo sigue recibiendo sus
   eventos `error: interrupted` un rato después; comparando el turno se sabe
   que ese error es NUESTRO y no un fallo, y ni se enseña ni hace avanzar
   nada. Ese aviso amarillo en pantalla era exactamente esto. */
let TURNO=0;
function siguiente(){
  if(!cola.length){lineaActual=null;parar();return;}
  const l=cola.shift(); lineaActual=l;
  /* Un punto de control no es una frase: es una parada. Lo que queda se
     guarda ANTES de preguntar, para que volver sea instantáneo. */
  if(l.control){
    lineaActual=null;

     abrir los nuevos, o al saltar de capítulo se quedarían dos pantallas
     contradiciéndose. */
  if(l.cap){cerrarFicha();cerrarEnlaces();}
  if(l.ficha)fichaTecnica(l.ficha[0],l.ficha[1],l.ficha[2]);
  if(l.enlaces)mostrarEnlaces(l.enlaces);
  pintarRecorrido();

  const res=conVoz(l.x);
  const texto=res.texto;
  if(texto!==limpiar(l.x))                 // se cayo a la version generica
    $('#sub').innerHTML='<span class="quien">'+(l.q||'JARVIS')+'</span>'+texto;
  const partes=trozos(texto);
  const mio=++TURNO;
  let pasado=false;
  const seguir=(ms)=>{if(pasado)return;pasado=true;
    setTimeout(()=>{if(hablando&&mio===TURNO)siguiente();},ms);};

  /* Si esta frase está grabada, se pone el fichero. Si falla por lo que sea,
     habla el navegador y nadie se entera: eso es lo único que importa. */
  const url=res.url;
  if(url){
    reproducir(url,mio,()=>seguir(l.p||500),
               ()=>{if(hablando&&mio===TURNO)hablarTrozo(partes,0,l,mio,seguir);});
    return;
  }
  hablarTrozo(partes,0,l,mio,seguir);
}
/* Dice el trozo i y encadena el siguiente cuando termina. Cada trozo es una
   frase suya para el sintetizador: por eso hay aire entre ellas. */
function hablarTrozo(partes,i,l,mio,seguir){
  if(mio!==TURNO||!hablando)return;
  /* La pausa del último trozo YA es el silencio del punto final: sumarle
     encima la pausa entre frases es silencio duplicado, y alargaba el
     recorrido casi medio minuto sin que sonara mejor. */
  if(i>=partes.length){
    seguir(RESPIRA?Math.max(140,(l.p||500)-260):(l.p||500));return;}
  const [txt,espera]=partes[i];
  const u=new SpeechSynthesisUtterance(txt);
  /* Con qué voz. NO basta con el idioma del selector: los partes de los
     agentes vienen escritos en castellano, y una voz inglesa leyendo
     castellano suena exactamente a robot --que fue justo la queja--. Se mira
     el idioma DEL TEXTO y se le pone una voz de ese idioma. */
  const idiT=idiomaDe(l.x);
  u.lang=idiT==='en'?'en-GB':'es-MX';
  /* ESTE try NO es por si acaso. Asignar `voice` LANZA una excepción si el
     objeto no es una SpeechSynthesisVoice válida --y una voz obtenida antes
     de un 'voiceschanged' deja de serlo--. Sin este try la excepción sale
     ANTES de speak(), y el asistente se queda mudo del todo sin decir por
     qué: eso fue exactamente el fallo del 13-ago. Antes que quedarse callado,
     se habla con la voz del sistema. */
  try{
    let v=vozPorNombre(l.ag?nombreAgente[l.ag]:nombreJarvis);
    if(!v||!new RegExp('^'+idiT,'i').test(v.lang||''))v=vozDeIdioma(idiT,l.ag);
    if(v){u.voice=v; if(v.lang)u.lang=v.lang;}
  }catch(e){
    $('#oido').textContent=(IDI==='en'?'Falling back to the system voice.'
                                      :'Uso la voz del sistema.');
  }
  /* La queja fue «leen súper rápido»: se baja la base y además se puede
     pedir «más despacio» o «más rápido» de viva voz; VEL se recuerda. */
  u.rate=Math.max(.55,Math.min(1.4,(l.ag?0.93:0.85)*velSana(VEL)));
  /* La declinación: el tono baja un poco por trozo, como al hablar. Poco a
     propósito --0,06 de recorrido total--: más que eso suena a locutor. */
  const base=l.ag?tonoSano(TONO)+.14:tonoSano(TONO);
  const n=Math.max(1,partes.length-1);
  u.pitch=Math.max(.6,Math.min(1.6, base + .03 - .06*(i/n) ));
  u.volume=1;

  let arranco=false;
  u.onstart=()=>{arranco=true;};
  u.onend=()=>{ if(mio!==TURNO)return;
                setTimeout(()=>hablarTrozo(partes,i+1,l,mio,seguir),
                           Math.round(espera/Math.max(.6,velSana(VEL)))); };
  u.onerror=ev=>{
    const q=(ev&&ev.error)||'unknown';
    /* interrupted y canceled los provocamos nosotros al cancelar: no son un
       fallo y no se enseñan. Cualquier otro sí, porque un fallo mudo es peor
       que uno ruidoso. */
    if(mio!==TURNO||q==='interrupted'||q==='canceled')return;
    $('#oido').textContent=(IDI==='en'?'Voice error: ':'Fallo de la voz: ')+q;
    setTimeout(()=>hablarTrozo(partes,i+1,l,mio,seguir),160);
  };
  try{ speechSynthesis.speak(u); }
  catch(e){ $('#oido').textContent=(IDI==='en'?'Voice failed: ':'La voz falló: ')+e.message;
            seguir(220); return; }

  /* Vigilante: si en dos segundos no ha empezado a sonar, no se queda la cola
     colgada en silencio para siempre. */
  setTimeout(()=>{
    if(!arranco&&hablando&&mio===TURNO&&!speechSynthesis.speaking){
      $('#oido').textContent=IDI==='en'
        ? 'The voice did not start. Try another voice in the selector.'
        : 'La voz no arrancó. Prueba otra voz en el selector.';
      seguir(0);
    }
  },2000);
}
/* Las tarjetas: cuando la voz nombra un sistema o habla un agente, su
   ficha se materializa al lado del cerebro con los datos vivos. Esto es lo

const LOGO={scan:'/img/ordenscan.ico',chainl:'/img/chainlist.ico'};
function tarjetaBase(col,titulo,estado,filas,img){
  const cont=$('#tarjetas');
  while(cont.children.length>=3)cont.firstChild.remove();
  const d=document.createElement('div');d.className='tarj';d.style.borderLeftColor=col;
  d.innerHTML='<div class="cab">'+(img?'<img src="'+img+'" onerror="this.remove()">':'')+
    '<span class="tn" style="color:'+col+'">'+titulo+'</span>'+

    filas.map(([k,v])=>'<div class="kv"><b>'+k+'</b><span>'+v+'</span></div>').join('');
  cont.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('viva'));
  setTimeout(()=>{d.classList.remove('viva');setTimeout(()=>d.remove(),500);},9000);
}

function marcar(q){

/* Guarda el sitio exacto. Se llama desde TODO lo que puede cortar la voz, no
   solo desde el botón de parar: tocar un sistema, hablarle al micrófono,
   cualquier cosa. Perder el sitio delante de un inversionista no puede
   depender de por dónde te cortaron. */
function guardarSitio(f){
  if(!PRESENTANDO)return;
  /* Contestando una pregunta de un punto de control NO se guarda nada: el
     sitio bueno ya está guardado --el del recorrido-- y guardar ahora lo
     pisaría con las frases de la respuesta. Volverías al medio de la
     contestación en vez de a donde ibas. */
  if(volverTrasResponder)return;
  /* Y SOLO se guarda lo que es del recorrido. Sin esto, cualquier cosa que
     hablara con PRESENTANDO todavia puesto se guardaba como «donde ibas»
     --la narracion de la transaccion en vivo se guardaba a si misma-- y a
     partir de ahi `parar()` veia algo pendiente y dejaba de llamar al fin.
     La demostracion se quedaba clavada en la transaccion. */
  const suyo=lineaActual||cola[0];
  if(!RECORRIDO||!suyo||RECORRIDO.lineas.indexOf(suyo)<0)return;
  /* La frase a medias vuelve a la cola: continuar en mitad de una idea no es
     continuar, es empezar la siguiente. */
  const resto=(lineaActual?[lineaActual]:[]).concat(cola);
  if(resto.length){colaGuardada=resto;finGuardado=(f!==undefined?f:alTerminar);}
}
function parar(){
  const f=alTerminar; alTerminar=null;
  TURNO++;                      // los eventos del turno en vuelo dejan de contar
  guardarSitio(f);
  hablando=false;cola=[];lineaActual=null;callarAudio();speechSynthesis.cancel();
  /* `trasResponder` es la excepción: precisamente corre CUANDO hay algo
     pendiente, porque su trabajo es volver a ello. */
  /* Normalmente el `fin` NO corre si queda algo pendiente --el recorrido se
     paro a medias y su cierre no toca todavia--. Pero hay callbacks cuyo
     trabajo es precisamente ese: retomar, o preguntar antes de retomar.
     Se marcan con `pesePendiente` en vez de listarlos aqui por nombre:
     listarlos por nombre ya me costo dos fallos identicos. */
  if(f&&(!hayPendiente()||f.pesePendiente))setTimeout(f,60);
  $('#hablar').classList.remove('on');$('#lblHablar').textContent=t('brief');
  $('#sub').textContent='';marcar(null);
  pintarRecorrido();
}
$('#hablar').addEventListener('click',()=>hablando?parar():decir(guion()));

function guion(){

  P(saludo(),{p:520});
  P(IDI==='en'?'All systems reporting. Here is where we stand.'

                :('Atención. Hay '+f.length+(f.length===1?' sistema':' sistemas')+' con falla.'),{p:400});
    f.forEach(s=>P((IDI==='en'?s.nom:s.es)+': '+E[s.id].est+'.',{foco:s.id,p:340}));
  }else{
    P(IDI==='en'?('All '+SIS.length+' systems are green. No failures.')
                :('Los '+SIS.length+' sistemas están en verde. Ninguna falla.'),{p:480});
  }

  if(V.b5534)P(IDI==='en'
    ?('The testnet is live at block '+nf(V.b5534)+', gas at '+V.gas+' gigawei. Last block '+V.edad+' seconds ago.')
    :('La red de pruebas está viva en el bloque '+nf(V.b5534)+', con el gas en '+V.gas+' gigawei. El último bloque llegó hace '+V.edad+' segundos.'),
    {foco:'n5534',p:520});
  if(V.b8532)P(V.quieta
    ?(IDI==='en'?('The legacy chain remains frozen at block '+nf(V.b8532)+', state root identical to the closing snapshot.')
                :('La cadena vieja sigue congelada en el bloque '+nf(V.b8532)+', con la raíz de estado idéntica a la del cierre.'))
    :(IDI==='en'?'Warning. The legacy chain has moved. The state root no longer matches. The migration must be rebuilt.'
                :'Atención. La cadena vieja se movió. La raíz ya no coincide. Hay que rehacer la migración.'),
    {foco:'m8532',p:520});
  if(BOTS&&BOTS.estado)P(IDI==='en'
    ?('The test bots are '+(BOTS.estado==='bien'?'running':'stalled')+'. '+(BOTS.enviosQueQuedan||0)+' sends remaining before they need refunding.')
    :('Los bots de prueba están '+(BOTS.estado==='bien'?'corriendo':'parados')+'. Les quedan '+(BOTS.enviosQueQuedan||0)+' envíos antes de que haya que rellenarlos.'),
    {foco:'bots',p:460});

  /* El equipo. Primero lo que encontró mal, que es para lo que existe. */
  if(PARTES.length){
    const mal=PARTES.filter(p=>p.veredicto==='falla'),avi=PARTES.filter(p=>p.veredicto==='aviso');
    P(IDI==='en'?'Now, the team.':'Ahora, el equipo.',{p:420});
    if(!mal.length&&!avi.length)
      P(IDI==='en'?('All '+PARTES.length+' agents reported. Nothing found.')
                  :('Los '+PARTES.length+' agentes reportaron. Sin hallazgos.'),{p:420});
    /* que hable cada agente con su propia voz */
    [...mal,...avi].forEach(p=>{
      const a=AGENTES.find(x=>x.id===p.agente)||{};
      L.push({q:p.nombre||a.nom,ag:p.agente,x:p.resumen+'.',p:400});
    });
    const esc=PARTES.flatMap(p=>(p.escala||[]).map(x=>({n:p.nombre,ag:p.agente,x})));
    if(esc.length){
      P(IDI==='en'?('There '+(esc.length===1?'is one thing':'are '+esc.length+' things')+' that need you.')
                  :('Hay '+(esc.length===1?'una cosa':esc.length+' cosas')+' que necesitan tu mano.'),{p:440});
      esc.forEach(e=>L.push({q:e.n,ag:e.ag,x:e.x+'.',p:380}));
    }
    const mudos=PARTES.filter(p=>(Date.now()-Date.parse(p.cuando))>2.6e8);
    mudos.forEach(p=>P((IDI==='en'?(p.nombre+' has been silent for days. Worth checking why.')
                                  :(p.nombre+' lleva días sin reportar. Habría que mirar por qué.')),{p:400}));
  }

  if(I.hechoHoy&&I.hechoHoy.length){
    P(IDI==='en'?'This is what was completed today.':'Esto es lo que se hizo hoy.',{p:440});
    I.hechoHoy.forEach(x=>P(x+'.',{p:290}));

    P(IDI==='en'?'And this is what is still outstanding.':'Y esto es lo que falta.',{p:440});
    I.pendiente.forEach(x=>P(x+'.',{p:290}));
  }

  return L;
}

/* «Cuéntame más» amplía lo último, no repite. */
function ampliar(){
  const mapa={seguridad:'cerrajero',coste:'contador',dinero:'centinela',
              chainlist:'escudero',cadenas:'vigia'};
  const ag=mapa[ultimoTema];
  if(ag&&parteDe(ag)){
    const d=detalleDe(ag,5);
    if(d.length)return [J(en()?'The detail, then.':'El detalle, entonces.',{p:360}),...d];
  }
  const s=SIS.find(x=>x.id===ultimoTema);
  if(s)return [J(en()?'In more detail.':'Con más detalle.',{p:360}),
               ...s.det[IDI].map(x=>J(x+'.',{foco:s.id,p:340}))];
  if(ultimoTema)return tema(ultimoTema);
  return [J(en()?'More about what, '+NOM()+'?':'¿Más sobre qué, '+NOM()+'?')];
}

    ...s.det[IDI].slice(0,3).map(x=>J(x+'.',{foco:s.id,p:340}))];
}

let oyendo=false,rec=null;
function escuchar(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){$('#oido').textContent=t('noOigo');return;}
  if(oyendo){rec&&rec.stop();return;}
  parar();
  rec=new R();
  /* El idioma se lee del selector en el momento. Aun así Safari en iPad suele
     IGNORARLO: por eso los patrones de arriba reconocen los dos idiomas. */
  const pedido=$('#idioma').value==='en'?'en-GB':'es-MX';
  rec.lang=pedido;
  rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=()=>{oyendo=true;$('#mic').classList.add('on');
    $('#lblMic').textContent=t('listening');
    $('#oido').textContent=(IDI==='en'?'Listening · ':'Escuchando · ')+pedido;};
  rec.onresult=ev=>{
    let txt='';for(const r of ev.results)txt+=r[0].transcript;
    $('#oido').textContent='“'+txt+'”';
    if(ev.results[ev.results.length-1].isFinal)atender(txt);
  };
  rec.onerror=()=>{$('#oido').textContent=IDI==='en'?'Could not hear you.':'No pude oírte.';};
  rec.onend=()=>{oyendo=false;$('#mic').classList.remove('on');$('#lblMic').textContent=t('speak');};
  rec.start();
}
/* Si lo primero que tocas es el micrófono, el sintetizador todavía está
