<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S · Orden Global</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   EL CEREBRO · núcleo de control de Orden Global
   ─────────────────────────────────────────────────────────────────────────
   El dibujo no es decoración. Cada racimo es un sistema real, cada axón una
   dependencia real, y cada impulso que viaja es algo que está pasando: una
   consulta que se resolvió, un agente que habló, una falla que apareció.
   Cuando JARVIS nombra un sistema, sale un impulso DE ESE racimo. Así se ve
   de qué está hablando sin leer nada.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --void:#010509; --ink:#dceaf5; --mut:#5d7d93; --faint:#26404f;
  --arc:#5ad9ff; --arc-deep:#1a7fa8;
  --gold:#ffb347; --red:#ff4a3d; --green:#48e39b;
  --panel:rgba(2,9,16,.9); --edge:rgba(90,217,255,.16);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{color:var(--ink);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{position:fixed;inset:0;display:block}
#lienzo{touch-action:none;cursor:grab}#lienzo.gira{cursor:grabbing}

/* ── cabecera ───────────────────────────────────────────────────────────── */
.hud{position:fixed;z-index:10;letter-spacing:.1em}
#izq{top:max(12px,env(safe-area-inset-top));left:16px}
#izq h1{font-size:13px;font-weight:800;letter-spacing:.42em}
#izq h1 i{font-style:normal;color:var(--arc)}
#izq .s{font-size:7.5px;color:var(--mut);letter-spacing:.28em;margin-top:3px}
#der{top:max(12px,env(safe-area-inset-top));right:16px;text-align:right}
#reloj{font-size:16px;font-weight:300;font-variant-numeric:tabular-nums}
#fecha{font-size:7.5px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}

#pulso{position:fixed;z-index:10;top:max(15px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:9px;
  border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(10px);
  padding:5px 15px;font-size:9px;letter-spacing:.22em;font-weight:700;white-space:nowrap}
#pulso .p{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 9px var(--green);animation:late 1.5s steps(2) infinite}
@keyframes late{50%{opacity:.3}}
#pulso .c{color:var(--mut);font-weight:400}

/* ── raíles ─────────────────────────────────────────────────────────────── */
.rail{position:fixed;z-index:10;top:50%;transform:translateY(-50%);width:224px;
  max-height:74vh;overflow-y:auto;border:1px solid var(--edge);
  background:var(--panel);backdrop-filter:blur(11px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
#agentes{left:14px}#sistemas{right:14px}
.rail h3{font-size:7.5px;letter-spacing:.3em;color:var(--mut);padding:9px 12px 6px;
  border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--panel)}
.fila{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;
  border-bottom:1px solid rgba(90,217,255,.05)}
.fila:hover,.fila:focus-visible{background:rgba(90,217,255,.08);outline:none}
.fila .cn{width:6px;height:6px;flex:none;transform:rotate(45deg)}
.fila .nom{font-size:9px;letter-spacing:.09em;font-weight:700}
.fila .est{display:block;font-size:7.5px;letter-spacing:.1em;color:var(--mut)}
.fila .met{font-size:8px;color:var(--mut);margin-left:auto;text-align:right;
  max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.fila.mal .nom,.fila.mal .est{color:var(--red)}
.fila.avi .nom{color:var(--gold)}
.fila.habla{background:rgba(90,217,255,.14);box-shadow:inset 2px 0 0 var(--arc)}

/* ── consola ────────────────────────────────────────────────────────────── */
#consola{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
  bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:8px;width:min(720px,92vw)}
#sub{text-align:center;font-size:12px;color:var(--arc);min-height:38px;line-height:1.55;
  text-shadow:0 0 18px rgba(90,217,255,.4)}
#sub .quien{color:var(--mut);font-size:9px;letter-spacing:.2em;display:block;margin-bottom:3px}
#oido{text-align:center;font-size:10.5px;color:var(--gold);min-height:16px;letter-spacing:.04em}
#teclas{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.tecla{display:flex;align-items:center;gap:7px;border:1px solid var(--edge);
  background:var(--panel);backdrop-filter:blur(10px);padding:9px 15px;
  font-size:9.5px;letter-spacing:.18em;font-weight:700}
.tecla:active{transform:scale(.97)}
.tecla:focus-visible{outline:1px solid var(--arc);outline-offset:2px}
#hablar{border-color:rgba(90,217,255,.5);color:var(--arc);box-shadow:0 0 24px rgba(90,217,255,.12)}
#hablar.on{border-color:var(--red);color:var(--red)}
#mic.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 24px rgba(255,179,71,.18)}
#onda{display:inline-flex;gap:2px;align-items:center;height:11px}
#onda i{width:2px;background:currentColor;height:3px}
.on #onda i{animation:onda .6s ease-in-out infinite}
.on #onda i:nth-child(2){animation-delay:.09s}.on #onda i:nth-child(3){animation-delay:.18s}
.on #onda i:nth-child(4){animation-delay:.27s}.on #onda i:nth-child(5){animation-delay:.36s}
@keyframes onda{50%{height:11px}}
select{border:1px solid var(--edge);background:rgba(2,9,16,.96);color:var(--ink);
  font:inherit;font-size:9px;padding:8px 9px;max-width:150px}

/* ── panel ──────────────────────────────────────────────────────────────── */
#det{position:fixed;z-index:20;inset:0;display:none;place-items:center;
  background:rgba(1,5,9,.78);backdrop-filter:blur(8px);padding:16px}
#det.abre{display:grid}
#det article{width:min(680px,96vw);max-height:84vh;overflow-y:auto;
  border:1px solid var(--edge);background:var(--panel);padding:22px 26px}
#det h2{font-size:12px;letter-spacing:.3em;margin-bottom:2px}
#det .sub2{font-size:8.5px;color:var(--mut);letter-spacing:.16em;margin-bottom:15px}
#det h4{font-size:8.5px;letter-spacing:.24em;color:var(--gold);margin:16px 0 6px}
#det li{font-size:11.5px;line-height:1.72;list-style:none}
#det li::before{content:"› ";color:var(--faint)}
#det li.mala::before{content:"✕ ";color:var(--red)}#det li.mala{color:var(--red)}
#det li.ojo::before{content:"! ";color:var(--gold)}
#det .kv{display:flex;gap:10px;font-size:11px;padding:3px 0;
  border-bottom:1px solid rgba(90,217,255,.07)}
#det .kv b{font-weight:400;color:var(--mut);min-width:158px}
#det .kv span{font-variant-numeric:tabular-nums}
#cerrar{position:sticky;float:right;top:0;color:var(--mut);font-size:18px;padding:0 6px}

@media (max-width:1000px){
  .rail{top:auto;bottom:158px;transform:none;width:auto;max-height:24vh}
  #agentes{left:8px;right:auto;width:47%}#sistemas{right:8px;width:47%}
  .fila .met{display:none}#sub{font-size:10.5px}
}
@media (max-width:640px){#fecha{display:none}#reloj{font-size:12px}#izq h1{font-size:11px}}
@media (prefers-reduced-motion:reduce){#pulso .p,.on #onda i{animation:none}}
</style>
</head>

<script>

      nada:'I did not catch that. Try: status, chains, money, security, cost, team, or bots.'},
  es:{equipo:'EL EQUIPO',sistemas:'SISTEMAS',brief:'EL PARTE',stop:'PARAR',speak:'HABLAR',
      listening:'ESCUCHANDO',report:'INFORME',online:'EN LÍNEA',degraded:'CON FALLAS',
      lema:'ORDEN GLOBAL · NÚCLEO DE CONTROL',reporte:'PARTE DEL DÍA',
      estado:'Estado',dentro:'QUÉ HAY DENTRO',vivo:'EN VIVO',fallas:'FALLAS',
      ahora:'AHORA MISMO',hecho:'HECHO HOY',falta:'PENDIENTE',
      necesita:'NECESITA A JOSÉ',equipoT:'EL EQUIPO',hace:'hace',
      noOigo:'Este navegador no permite escuchar la voz.',
      nada:'No entendí. Prueba: estado, cadenas, dinero, seguridad, coste, equipo o bots.'}
};
const t = k => T[IDI][k];

/* ═══ 1 · LOS SISTEMAS ════════════════════════════════════════════════════
   `a` es la dirección del racimo dentro del cerebro; `n` cuántas neuronas
   lo forman. Los que más cosas hacen tienen más neuronas: el tamaño dice
   algo, no es decorativo. */
const SIS=[
 {id:'n5534', nom:'TESTNET 5534', es:'RED DE PRUEBAS', col:'#5ad9ff', a:[-.72,.30,.34], n:16,
  que:{en:'Besu QBFT · 4 validators',es:'Besu QBFT · 4 validadores'},

  det:{en:['Frozen at block 4,178,763','State root identical to the closing snapshot',

  det:{en:['Send, receive, swap, card funding, USDT deposits','Keys encrypted with a 64-character secret',

 {id:'chainl', nom:'CHAINLIST',  es:'CHAINLIST',   col:'#ff4d9d', a:[-.60,.36,-.14], n:10,

  det:{en:['#8593 testnet 5534 · #8594 reserves 5550','All four CI checks pass against the submitted file',

   es:['#8593 red de pruebas 5534 · #8594 reserva del 5550','Las cuatro pruebas del CI pasan contra el archivo enviado',
      'El símbolo tenía 7 caracteres y habría fallado','Esperando a un mantenedor: hay solicitudes de julio en cola']}},
 {id:'nodos', nom:'INFRASTRUCTURE',es:'INFRAESTRUCTURA',col:'#7fb6d8',a:[-.30,-.52,-.34],n:15,
  que:{en:'10 machines · AWS',es:'10 máquinas · AWS'},
  det:{en:['Nodes 3 to 6 run BOTH chains at once','Retiring the six old machines would kill the testnet',
      'Only nodes 1 and 2 are exclusively legacy','Elastic IPs fixed, automatic restart verified'],
   es:['Los nodos 3 a 6 llevan LAS DOS cadenas a la vez','Retirar las seis máquinas viejas mataría la red de pruebas',
      'Solo los nodos 1 y 2 son exclusivamente de la vieja','IP elásticas fijas, arranque automático comprobado']}},
 {id:'tesoro',nom:'TREASURY',    es:'TESORO',      col:'#e6eef5', a:[ .00,-.64,.36], n:12,
  que:{en:'Price, fee and supply',es:'Precio, comisión y emisión'},
  det:{en:['ORIGEN = one gram of gold in dollars, divided by 55','Fee: 0.001 ORIGEN flat, whatever the amount',
      'The fee is NOT configured in production — it charges zero','Its destination is not the single wallet. Do not turn it on yet'],
   es:['ORIGEN = el gramo de oro en dólares, dividido entre 55','Comisión: 0,001 ORIGEN fijos, sea cual sea el monto',
      'La comisión NO está configurada en producción: cobra cero','Su destino no es la billetera única. No encenderla todavía']}},
 {id:'bots',  nom:'TEST BOTS',   es:'BOTS DE PRUEBA',col:'#22d3ee', a:[-.44,-.06,.66], n:9,
  que:{en:'Two wallets, every 3 hours',es:'Dos billeteras, cada 3 horas'},
  det:{en:['They use the testnet so it is not only observed, but used','Refuse to sign unless the chain is 5534',

   es:['Usan la red de pruebas: no solo se mira, se usa','Se niegan a firmar si la cadena no es la 5534',

/* Los axones: dependencias reales, no líneas bonitas. */
const AXONES=[['n5534','g5550'],['n5534','scan'],['n5534','m8532'],['g5550','m8532'],
 ['g5550','tesoro'],['wallet','gid'],['wallet','tarjeta'],['tarjeta','polygon'],
 ['wallet','n5534'],['pago','wallet'],['pago','gid'],['scan','m8532'],
 ['chainl','n5534'],['chainl','g5550'],['nodos','n5534'],['nodos','m8532'],
 ['tesoro','wallet'],['polygon','wallet'],['nodos','scan'],['bots','n5534'],
 ['bots','nodos'],['tesoro','pago']];

/* Los siete agentes. El color los distingue en el raíl y en la voz. */
const AGENTES=[
 {id:'vigia',    nom:'VIGÍA',    col:'#5ad9ff', mira:{en:'the chains',es:'las cadenas'},   cada:{en:'hourly',es:'cada hora'}},
 {id:'centinela',nom:'CENTINELA',col:'#ffd166', mira:{en:'the money',es:'el dinero'},      cada:{en:'every 2 hours',es:'cada 2 horas'}},
 {id:'escudero', nom:'ESCUDERO', col:'#ff4d9d', mira:{en:'Chainlist',es:'Chainlist'},      cada:{en:'every 6 hours',es:'cada 6 horas'}},
 {id:'cirujano', nom:'CIRUJANO', col:'#4ade80', mira:{en:'what is deployed',es:'lo desplegado'},cada:{en:'daily',es:'a diario'}},
 {id:'cronista', nom:'CRONISTA', col:'#a78bfa', mira:{en:'the daily report',es:'el parte del día'},cada:{en:'daily',es:'a diario'}},
 {id:'cerrajero',nom:'CERRAJERO',col:'#fb923c', mira:{en:'security',es:'la seguridad'},    cada:{en:'weekly',es:'cada semana'}},
 {id:'contador', nom:'CONTADOR', col:'#8affd4', mira:{en:'what it costs',es:'lo que cuesta'},cada:{en:'weekly',es:'cada semana'}},
];

const E={};for(const s of SIS)E[s.id]={est:'STANDBY',met:'—',mal:false,avi:false,fuego:.12,vivo:[]};
const S=id=>SIS.find(x=>x.id===id);

/* ═══ 2 · LA GEOMETRÍA DEL CEREBRO ════════════════════════════════════════
   Tres capas, y las tres hacen falta para que se lea como UN órgano y no
   como puntos sueltos —que era el problema del dibujo anterior—:
     · la CORTEZA, una piel de dos lóbulos con su fisura;
     · los RACIMOS, un núcleo por sistema con sus neuronas alrededor;
     · los AXONES, que unen racimo con racimo y con el centro. */
const L=document.getElementById('lienzo'), cx=L.getContext('2d');
const F=document.getElementById('fondo'),  fx=F.getContext('2d');
let W,H,ESC;
function medir(){
  const d=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  for(const c of [L,F]){c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';}
  cx.setTransform(d,0,0,d,0,0);fx.setTransform(d,0,0,d,0,0);
  ESC=Math.min(W,H)*0.36; fondo();
}
addEventListener('resize',medir);

const az=()=>Math.random();
function gauss(){let u=0,v=0;while(!u)u=az();while(!v)v=az();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);}

/* La superficie del cerebro: elipsoide alargado, aplastado arriba, con la
   fisura longitudinal que separa los dos lóbulos. */
function piel(){
  let v=[gauss(),gauss(),gauss()];
  const m=Math.hypot(...v)||1; v=v.map(x=>x/m);
  v[0]*=1.00; v[1]*=0.76; v[2]*=1.22;
  const s=v[0]>=0?1:-1;                       // la fisura: se aparta del centro
  v[0]=s*(Math.abs(v[0])*0.80+0.17);
  if(v[1]>0)v[1]*=0.88;                        // aplastado por arriba
  const r=1+0.035*Math.sin(v[2]*11)*Math.cos(v[1]*9);   // los surcos
  return v.map(x=>x*r);
}

const NEU=[];           // todas las neuronas: {p:[x,y,z], sis, nucleo}
const HILOS=[];         // enlaces finos: [i,j,alfa]
const CORTEZA=[];
for(let i=0;i<560;i++){CORTEZA.push(NEU.length);NEU.push({p:piel(),sis:null,nucleo:false});}

/* Cada racimo: un núcleo hacia dentro y sus neuronas alrededor. */
const NUCLEO={};
for(const s of SIS){
  const d=Math.hypot(...s.a)||1;
  const c=s.a.map(x=>x/d*0.62);
  NUCLEO[s.id]=NEU.length;
  NEU.push({p:c,sis:s.id,nucleo:true});
  for(let i=0;i<s.n;i++){
    const o=[gauss(),gauss(),gauss()];const m=Math.hypot(...o)||1;
    const r=0.11+az()*0.15;
    NEU.push({p:c.map((x,k)=>x+o[k]/m*r),sis:s.id,nucleo:false});
    HILOS.push([NUCLEO[s.id],NEU.length-1,0.5]);
  }
}
/* La piel se cose a sí misma con sus tres vecinos más cercanos. Sin esto la
   corteza es confeti; con esto es una superficie. */
for(const i of CORTEZA){
  const d=CORTEZA.map(j=>[j===i?9:dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<3;k++)if(d[k][0]<0.42)HILOS.push([i,d[k][1],0.14]);
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}
/* Y cada racimo se ancla a la corteza que tiene encima. */
for(const s of SIS){
  const i=NUCLEO[s.id];
  const d=CORTEZA.map(j=>[dist(NEU[i].p,NEU[j].p),j]).sort((a,b)=>a[0]-b[0]);
  for(let k=0;k<4;k++)HILOS.push([i,d[k][1],0.2]);
}

/* ═══ 3 · IMPULSOS ═══════════════════════════════════════════════════════
   Un impulso recorre un axón de punta a punta. Salen cuando pasa algo:
   JARVIS nombra un sistema, un agente habla, llega un bloque nuevo. En
   reposo hay tráfico tenue, para que el cerebro respire sin gritar. */
const IMPULSOS=[];
function impulso(de,a,col,vel){
  IMPULSOS.push({de:NUCLEO[de],a:a==='centro'?-1:NUCLEO[a],t:0,
    vel:vel||(0.011+az()*0.006),col:col||'#5ad9ff'});
}
function disparar(id,fuerte){
  const s=S(id); if(!s)return;
  E[id].fuego=1;
  impulso(id,'centro',s.col,fuerte?0.02:0.013);
  for(const [a,b] of AXONES){
    if(a===id)impulso(a,b,s.col);
    else if(b===id)impulso(b,a,s.col);
  }
}
setInterval(()=>{                    // tráfico de fondo
  if(document.hidden)return;
  const e=AXONES[(az()*AXONES.length)|0];
  IMPULSOS.push({de:NUCLEO[e[0]],a:NUCLEO[e[1]],t:0,vel:0.006,col:'#1a7fa8',tenue:true});
},900);

/* ═══ 4 · DIBUJO ═════════════════════════════════════════════════════════ */
let rY=.55,rX=-.12,arr=null,giroLibre=true;
L.addEventListener('pointerdown',e=>{arr=[e.clientX,e.clientY];L.classList.add('gira');
  L.setPointerCapture(e.pointerId);});
L.addEventListener('pointermove',e=>{if(!arr)return;giroLibre=false;
  rY+=(e.clientX-arr[0])*.005;rX=Math.max(-.9,Math.min(.9,rX+(e.clientY-arr[1])*.003));
  arr=[e.clientX,e.clientY];});
L.addEventListener('pointerup',e=>{
  if(arr&&Math.abs(e.clientX-arr[0])<4&&Math.abs(e.clientY-arr[1])<4)tocar(e.clientX,e.clientY);
  arr=null;L.classList.remove('gira');setTimeout(()=>giroLibre=true,2600);});

const pr=[];    // proyección de cada neurona, recalculada cada cuadro
function proyectar(){
  const c1=Math.cos(rY),s1=Math.sin(rY),c2=Math.cos(rX),s2=Math.sin(rX);
  for(let i=0;i<NEU.length;i++){
    const[x0,y0,z0]=NEU[i].p;
    const x=x0*c1-z0*s1, z1=x0*s1+z0*c1;
    const y=y0*c2-z1*s2, z=y0*s2+z1*c2;
    const f=2.9/(2.9+z);
    pr[i]=[W/2+x*ESC*f, H/2+y*ESC*f, f, z];
  }
}
function centro(){return [W/2,H/2,1,0];}

function fondo(){
  fx.clearRect(0,0,W,H);
  const g=fx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(12,44,68,.5)');g.addColorStop(.55,'rgba(4,16,26,.3)');
  g.addColorStop(1,'rgba(1,5,9,0)');
  fx.fillStyle=g;fx.fillRect(0,0,W,H);
}

let ultimo=0;
function cuadro(ts){
  const dt=Math.min(60,ts-ultimo)||16; ultimo=ts;
  if(giroLibre&&!document.hidden)rY+=0.00022*dt;
  proyectar();
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';

  /* los hilos finos: la carne del cerebro */
  for(const[i,j,al] of HILOS){
    const A=pr[i],B=pr[j];
    if(A[3]>1.5&&B[3]>1.5)continue;
    const p=Math.max(0,Math.min(1,(A[2]+B[2])/2-.55));
    cx.strokeStyle='rgba(90,217,255,'+(al*p*0.5).toFixed(3)+')';
    cx.lineWidth=.5;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* los axones: gruesos, y se encienden con el estado del sistema */
  for(const[a,b] of AXONES){
    const A=pr[NUCLEO[a]],B=pr[NUCLEO[b]];
    const mal=E[a].mal||E[b].mal;
    const v=Math.max(E[a].fuego,E[b].fuego);
    cx.strokeStyle=mal?'rgba(255,74,61,'+(.20+v*.5).toFixed(2)+')'
                      :'rgba(90,217,255,'+(.09+v*.30).toFixed(2)+')';
    cx.lineWidth=mal?1.2:.9;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }

  /* las neuronas */
  for(let i=0;i<NEU.length;i++){
    const n=NEU[i],P=pr[i];
    if(n.sis){
      const e=E[n.sis],s=S(n.sis);
      const r=(n.nucleo?3.1:1.35)*P[2];
      cx.fillStyle=e.mal?'rgba(255,74,61,'+(.55+e.fuego*.45).toFixed(2)+')'
        :hexA(s.col,(n.nucleo?.55:.30)+e.fuego*.45);
      if(n.nucleo){cx.shadowColor=e.mal?'#ff4a3d':s.col;cx.shadowBlur=16*e.fuego+7;}
      cx.beginPath();cx.arc(P[0],P[1],r,0,6.283);cx.fill();cx.shadowBlur=0;
    }else{
      cx.fillStyle='rgba(120,200,240,'+(0.05+P[2]*0.09).toFixed(3)+')';
      cx.beginPath();cx.arc(P[0],P[1],0.9*P[2],0,6.283);cx.fill();
    }
  }

  /* los impulsos: esto es lo que hace que se vea que está haciendo algo */
  for(let k=IMPULSOS.length-1;k>=0;k--){
    const m=IMPULSOS[k];
    m.t+=m.vel*dt/16;
    if(m.t>=1){IMPULSOS.splice(k,1);continue;}
    const A=pr[m.de], B=m.a<0?centro():pr[m.a];
    const x=A[0]+(B[0]-A[0])*m.t, y=A[1]+(B[1]-A[1])*m.t;
    const cola=Math.max(0,m.t-0.16);
    const xc=A[0]+(B[0]-A[0])*cola, yc=A[1]+(B[1]-A[1])*cola;
    cx.strokeStyle=hexA(m.col,m.tenue?.22:.7);
    cx.lineWidth=m.tenue?1:2;
    cx.beginPath();cx.moveTo(xc,yc);cx.lineTo(x,y);cx.stroke();
    if(!m.tenue){
      cx.fillStyle=m.col;cx.shadowColor=m.col;cx.shadowBlur=12;
      cx.beginPath();cx.arc(x,y,2.1,0,6.283);cx.fill();cx.shadowBlur=0;
    }
  }

  /* el núcleo: late más fuerte cuando habla */
  const lat=0.5+0.5*Math.sin(ts/620)+(hablando?0.7:0);
  cx.fillStyle='rgba(90,217,255,'+(0.08+lat*0.07).toFixed(3)+')';
  cx.shadowColor='#5ad9ff';cx.shadowBlur=30+lat*30;
  cx.beginPath();cx.arc(W/2,H/2,5+lat*3,0,6.283);cx.fill();cx.shadowBlur=0;

  cx.globalCompositeOperation='source-over';
  etiquetas();
  for(const s of SIS)E[s.id].fuego=Math.max(E[s.id].mal?.42:.12,E[s.id].fuego-0.0016*dt);
  requestAnimationFrame(cuadro);
}
function hexA(h,a){const n=parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a.toFixed(3)+')';}

/* Etiquetas en el propio lienzo, y solo las que miran hacia delante. Si dos
   se pisan, gana la que está más cerca: mejor menos texto que texto ilegible. */
const cajas=[];
function etiquetas(){
  cajas.length=0;
  const orden=SIS.map(s=>[pr[NUCLEO[s.id]],s]).sort((a,b)=>a[0][3]-b[0][3]);
  cx.textBaseline='middle';
  for(const [P,s] of orden){
    if(P[3]>0.35)continue;
    const e=E[s.id];
    const nom=IDI==='en'?s.nom:s.es;
    cx.font='700 9.5px '+getComputedStyle(document.body).fontFamily;
    const w=cx.measureText(nom).width+12, x=P[0]+11, y=P[1];
    if(cajas.some(c=>x<c[0]+c[2]&&x+w>c[0]&&y-9<c[1]+c[3]&&y+9>c[1]))continue;
    cajas.push([x,y-9,w,18]);
    s._caja=[x,y-9,w,26];
    cx.fillStyle='rgba(1,5,9,.82)';cx.fillRect(x,y-9,w,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;cx.fillRect(x,y-9,1.5,18);
    cx.fillStyle=e.mal?'#ff4a3d':s.col;
    cx.fillText(nom,x+7,y-1);
    cx.font='400 7.5px '+getComputedStyle(document.body).fontFamily;
    cx.fillStyle='#5d7d93';cx.fillText(e.met.slice(0,26),x+7,y+9);
  }
}
function tocar(x,y){
  for(const s of SIS){const c=s._caja;
    if(c&&x>=c[0]&&x<=c[0]+c[2]&&y>=c[1]&&y<=c[1]+c[3]){abrirSis(s);return;}}
  let mejor=null,dm=34;
  for(const s of SIS){const P=pr[NUCLEO[s.id]];
    const d=Math.hypot(P[0]-x,P[1]-y);if(d<dm){dm=d;mejor=s;}}
  if(mejor)abrirSis(mejor);
}

async function rpc(ruta,m,p=[]){
  const r=await fetch(ruta,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}),cache:'no-store'});
  const j=await r.json(); if(j.error)throw new Error(j.error.message); return j.result;
}
function set(id,est,met,mal=false,avi=false,vivo){
  const e=E[id]; e.est=est; e.met=met; e.mal=mal; e.avi=avi; if(vivo)e.vivo=vivo;
  railSistemas();
}

const hace=iso=>{const s=(Date.now()-Date.parse(iso))/1000;

  if(s<5400)return Math.max(1,Math.round(s/60))+' min '+t('hace');

  return Math.round(s/86400)+' d '+t('hace');};

/* ═══ 6 · LOS RAÍLES ═════════════════════════════════════════════════════ */
function railSistemas(){
  const r=$('#sistemas'); r.querySelectorAll('.fila').forEach(f=>f.remove());
  let mal=0,ok=0;
  for(const s of SIS){const e=E[s.id];
    if(e.mal)mal++;else if(e.est!=='STANDBY')ok++;
    const f=document.createElement('div');
    f.className='fila'+(e.mal?' mal':e.avi?' avi':''); f.tabIndex=0;
    f.onclick=()=>abrirSis(s); f.onkeydown=ev=>{if(ev.key==='Enter')abrirSis(s);};
    f.innerHTML='<span class="cn" style="background:'+(e.mal?'transparent':s.col)+
      ';border:1px solid '+(e.mal?'#ff4a3d':s.col)+'"></span>'+
      '<span><span class="nom" style="color:'+(e.mal?'#ff4a3d':s.col)+'">'+
      (IDI==='en'?s.nom:s.es)+'</span><span class="est">'+e.est+'</span></span>'+
      '<span class="met">'+e.met+'</span>';
    f.dataset.sis=s.id; r.appendChild(f);
  }
  $('#cuenta').textContent=ok+' / '+SIS.length;
  $('#modo').textContent=mal?t('degraded'):t('online');
  const p=$('#pulso .p');
  p.style.background=mal?'var(--red)':'var(--green)';
  p.style.boxShadow='0 0 9px '+(mal?'#ff4a3d':'#48e39b');
  $('#pulso').style.borderColor=mal?'rgba(255,74,61,.5)':'var(--edge)';
}
function railAgentes(){
  const r=$('#agentes'); r.querySelectorAll('.fila').forEach(f=>f.remove());
  for(const a of AGENTES){
    const p=parteDe(a.id);
    const v=p?p.veredicto:null;
    const f=document.createElement('div');
    f.className='fila'+(v==='falla'?' mal':v==='aviso'?' avi':''); f.tabIndex=0;
    f.dataset.ag=a.id;
    f.onclick=()=>abrirAgente(a); f.onkeydown=ev=>{if(ev.key==='Enter')abrirAgente(a);};
    f.innerHTML='<span class="cn" style="background:'+(v==='falla'?'transparent':a.col)+
      ';border:1px solid '+a.col+'"></span>'+
      '<span><span class="nom" style="color:'+a.col+'">'+a.nom+'</span>'+
      '<span class="est">'+(v?v.toUpperCase():'NO REPORT')+'</span></span>'+
      '<span class="met">'+(p?hace(p.cuando):a.cada[IDI])+'</span>';
    r.appendChild(f);
  }
}

/* ═══ 7 · LA VOZ ═════════════════════════════════════════════════════════
   JARVIS es inglés británico, grave y sin prisa. Los agentes llevan cada
   uno una voz distinta, para que se sepa quién habla sin mirar la pantalla.
   Se elige la mejor que tenga el aparato, y la elección se recuerda. */
const JARVIS=[/Daniel/i,/Arthur/i,/Oliver/i,/George/i,/Ryan/i,/Brian/i,
  /UK English Male/i,/British/i,/en-GB/i];
const BUENAS_EN=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Alex/i,/Samantha/i];
const BUENAS_ES=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Mónica|Monica/i,/Paulina/i,
  /Jorge/i,/Juan/i,/Helena/i,/Laura/i,/Sabina/i];
let voces=[],vozJarvis=null,vozAgente={};
function puntua(v){
  let p=0;
  if(IDI==='en'){
    JARVIS.forEach((r,i)=>{if(r.test(v.name)||r.test(v.lang))p+=60-i*4;});
    BUENAS_EN.forEach((r,i)=>{if(r.test(v.name))p+=22-i*2;});
    if(/^en/i.test(v.lang))p+=25;
    if(/en-GB/i.test(v.lang))p+=30;
  }else{
    BUENAS_ES.forEach((r,i)=>{if(r.test(v.name))p+=24-i*2;});
    if(/^es/i.test(v.lang))p+=30;
  }
  if(v.localService)p+=3;
  return p;
}
function cargarVoces(){
  const todas=speechSynthesis.getVoices();
  if(!todas.length)return;
  const idio=IDI==='en'?/^en/i:/^es/i;
  voces=todas.filter(v=>idio.test(v.lang));
  if(!voces.length)voces=todas;
  voces.sort((a,b)=>puntua(b)-puntua(a));
  const sel=$('#voces'); sel.innerHTML='';
  voces.forEach((v,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=v.name.replace(/Microsoft |Google /,'').slice(0,24);sel.appendChild(o);});
  const g=localStorage.getItem('vozCerebro-'+IDI);
  const idx=g!==null&&voces[g]?+g:0;
  sel.value=idx; vozJarvis=voces[idx]||null;
  /* A cada agente, una voz distinta de las siguientes de la lista. */
  vozAgente={};
  AGENTES.forEach((a,k)=>{vozAgente[a.id]=voces[(k+1)%Math.max(1,voces.length)]||vozJarvis;});
}

/* Que la voz no lea símbolos ni siglas raras. En español "gwei" suena como
   una palabrota mexicana; en inglés se lee "gway" y tampoco es. */
function limpiar(x){
  return String(x)
    .replace(/·/g,',').replace(/—/g,',').replace(/\bgwei\b/gi,'gigawei')
    .replace(/\bRPC\b/g,IDI==='en'?'R P C':'erre pe ce')
    .replace(/\bUSD\b/g,IDI==='en'?'dollars':'dólares')
    .replace(/(\d),(\d{3})/g,'$1$2').replace(/\$/g,'').replace(/%/g,IDI==='en'?' percent':' por ciento')
    .replace(/0x[0-9a-fA-F]{6,}/g,IDI==='en'?'an address':'una dirección')
    .replace(/\s+/g,' ').trim();
}
let cola=[],hablando=false,quienHabla=null;
function decir(lineas){
  parar();
  cola=lineas.filter(l=>l&&l.x);
  hablando=true; $('#hablar').classList.add('on'); $('#lblHablar').textContent=t('stop');
  siguiente();
}
function siguiente(){
  if(!cola.length){parar();return;}
  const l=cola.shift();
  marcar(l.q);
  $('#sub').innerHTML='<span class="quien">'+(l.q||'JARVIS')+'</span>'+l.x;
  if(l.foco)disparar(l.foco,true);
  const u=new SpeechSynthesisUtterance(limpiar(l.x));
  const v=l.ag?vozAgente[l.ag]:vozJarvis;
  if(v)u.voice=v;
  u.lang=(v&&v.lang)||(IDI==='en'?'en-GB':'es-MX');
  u.rate=l.ag?0.99:0.93;          // JARVIS habla más despacio: es el que manda
  u.pitch=l.ag?1.0:0.86;
  u.onend=()=>setTimeout(()=>{if(hablando)siguiente();},l.p||320);
  u.onerror=()=>setTimeout(()=>{if(hablando)siguiente();},220);
  speechSynthesis.speak(u);
}
function marcar(q){
  quienHabla=q;
  document.querySelectorAll('.fila.habla').forEach(f=>f.classList.remove('habla'));
  const a=AGENTES.find(x=>x.nom===q);
  if(a){const f=document.querySelector('.fila[data-ag="'+a.id+'"]');if(f)f.classList.add('habla');}
}
function parar(){
  hablando=false;cola=[];speechSynthesis.cancel();
  $('#hablar').classList.remove('on');$('#lblHablar').textContent=t('brief');
  $('#sub').textContent='';marcar(null);
}

/* ═══ 8 · EL PARTE HABLADO ═══════════════════════════════════════════════ */
function saludo(){
  const h=new Date().getHours();
  if(IDI==='en')return h<12?'Good morning, sir.':h<19?'Good afternoon, sir.':'Good evening, sir.';
  return h<12?'Buenos días, José.':h<19?'Buenas tardes, José.':'Buenas noches, José.';
}
function guion(){
  const L=[],f=fallas();
  const P=(x,o={})=>L.push(Object.assign({q:'JARVIS',x},o));
  P(saludo(),{p:520});
  P(IDI==='en'?'All systems reporting. Here is where we stand.'
              :'Todos los sistemas reportando. Este es el estado.',{p:520});

  if(f.length){
    P(IDI==='en'?('Attention. '+f.length+(f.length===1?' system has':' systems have')+' failed.')
                :('Atención. Hay '+f.length+(f.length===1?' sistema':' sistemas')+' con falla.'),{p:400});
    f.forEach(s=>P((IDI==='en'?s.nom:s.es)+': '+E[s.id].est+'.',{foco:s.id,p:340}));
  }else{
    P(IDI==='en'?('All '+SIS.length+' systems are green. No failures.')
                :('Los '+SIS.length+' sistemas están en verde. Ninguna falla.'),{p:480});
  }

  if(V.b5534)P(IDI==='en'
    ?('The testnet is live at block '+nf(V.b5534)+', gas at '+V.gas+' gigawei. Last block '+V.edad+' seconds ago.')
    :('La red de pruebas está viva en el bloque '+nf(V.b5534)+', con el gas en '+V.gas+' gigawei. El último bloque llegó hace '+V.edad+' segundos.'),
    {foco:'n5534',p:520});
  if(V.b8532)P(V.quieta
    ?(IDI==='en'?('The legacy chain remains frozen at block '+nf(V.b8532)+', state root identical to the closing snapshot.')
                :('La cadena vieja sigue congelada en el bloque '+nf(V.b8532)+', con la raíz de estado idéntica a la del cierre.'))
    :(IDI==='en'?'Warning. The legacy chain has moved. The state root no longer matches. The migration must be rebuilt.'
                :'Atención. La cadena vieja se movió. La raíz ya no coincide. Hay que rehacer la migración.'),
    {foco:'m8532',p:520});
  if(BOTS&&BOTS.estado)P(IDI==='en'
    ?('The test bots are '+(BOTS.estado==='bien'?'running':'stalled')+'. '+(BOTS.enviosQueQuedan||0)+' sends remaining before they need refunding.')
    :('Los bots de prueba están '+(BOTS.estado==='bien'?'corriendo':'parados')+'. Les quedan '+(BOTS.enviosQueQuedan||0)+' envíos antes de que haya que rellenarlos.'),
    {foco:'bots',p:460});

  /* El equipo. Primero lo que encontró mal, que es para lo que existe. */
  if(PARTES.length){
    const mal=PARTES.filter(p=>p.veredicto==='falla'),avi=PARTES.filter(p=>p.veredicto==='aviso');
    P(IDI==='en'?'Now, the team.':'Ahora, el equipo.',{p:420});
    if(!mal.length&&!avi.length)
      P(IDI==='en'?('All '+PARTES.length+' agents reported. Nothing found.')
                  :('Los '+PARTES.length+' agentes reportaron. Sin hallazgos.'),{p:420});
    /* que hable cada agente con su propia voz */
    [...mal,...avi].forEach(p=>{
      const a=AGENTES.find(x=>x.id===p.agente)||{};
      L.push({q:p.nombre||a.nom,ag:p.agente,x:p.resumen+'.',p:400});
    });
    const esc=PARTES.flatMap(p=>(p.escala||[]).map(x=>({n:p.nombre,ag:p.agente,x})));
    if(esc.length){
      P(IDI==='en'?('There '+(esc.length===1?'is one thing':'are '+esc.length+' things')+' that need you.')
                  :('Hay '+(esc.length===1?'una cosa':esc.length+' cosas')+' que necesitan tu mano.'),{p:440});
      esc.forEach(e=>L.push({q:e.n,ag:e.ag,x:e.x+'.',p:380}));
    }
    const mudos=PARTES.filter(p=>(Date.now()-Date.parse(p.cuando))>2.6e8);
    mudos.forEach(p=>P((IDI==='en'?(p.nombre+' has been silent for days. Worth checking why.')
                                  :(p.nombre+' lleva días sin reportar. Habría que mirar por qué.')),{p:400}));
  }

  if(I.hechoHoy&&I.hechoHoy.length){
    P(IDI==='en'?'This is what was completed today.':'Esto es lo que se hizo hoy.',{p:440});
    I.hechoHoy.forEach(x=>P(x+'.',{p:290}));
  }
  if(I.pendiente&&I.pendiente.length){
    P(IDI==='en'?'And this is what is still outstanding.':'Y esto es lo que falta.',{p:440});
    I.pendiente.forEach(x=>P(x+'.',{p:290}));
  }
  P(f.length?(IDI==='en'?'End of report. There are failures to review.':'Fin del parte. Hay fallas que revisar.')
            :(IDI==='en'?'End of report. Everything under control.':'Fin del parte. Todo bajo control.'),{p:0});
  return L;
}

/* Respuestas cortas, para cuando preguntas algo concreto. */
function responder(tema){
  const en=IDI==='en';
  const A=(x,o={})=>Object.assign({q:'JARVIS',x},o);
  switch(tema){
    case 'cadenas':return [
      A(V.b5534?(en?('Testnet at block '+nf(V.b5534)+', gas '+V.gas+' gigawei, last block '+V.edad+' seconds ago.')
                   :('Red de pruebas en el bloque '+nf(V.b5534)+', gas '+V.gas+' gigawei, último bloque hace '+V.edad+' segundos.'))
                 :(en?'No answer from the testnet.':'La red de pruebas no contesta.'),{foco:'n5534'}),
      A(V.quieta?(en?'Legacy chain frozen, state root intact.':'Cadena vieja congelada, raíz intacta.')
                :(en?'Warning: the legacy chain moved.':'Atención: la cadena vieja se movió.'),{foco:'m8532'})];
    case 'dinero':{
      const c=parteDe('centinela');
      return [A(en?('ORIGEN is one gram of gold divided by fifty five. Today, '+(I.precio||'unknown')+'.')
                  :('El ORIGEN es el gramo de oro entre cincuenta y cinco. Hoy, '+(I.precio||'sin dato')+'.'),{foco:'tesoro'}),
        A(en?('The fee is '+(I.comision||'0.001 ORIGEN')+', and it is not configured in production, so it charges nothing.')
            :('La comisión es de '+(I.comision||'cero coma cero cero uno ORIGEN')+', y no está configurada en producción, así que cobra cero.'),{foco:'tesoro'}),
        c?{q:c.nombre,ag:'centinela',x:c.resumen+'.'}:null].filter(Boolean);}
    case 'equipo':{
      if(!PARTES.length)return [A(en?'No agent has reported yet.':'Ningún agente ha reportado todavía.')];
      const mal=PARTES.filter(p=>p.veredicto==='falla').length;
      return [A(en?(PARTES.length+' agents reporting, '+mal+' with failures.')
                  :(PARTES.length+' agentes reportando, '+mal+' con fallas.')),
        ...PARTES.map(p=>({q:p.nombre,ag:p.agente,x:p.resumen+'.',p:340}))];}
    case 'seguridad':{const c=parteDe('cerrajero');
      return c?[{q:c.nombre,ag:'cerrajero',x:c.resumen+'.'},
        ...(c.escala||[]).map(x=>({q:c.nombre,ag:'cerrajero',x,p:340}))]
        :[A(en?'The locksmith has not reported yet.':'El cerrajero no ha reportado todavía.')];}
    case 'coste':{const c=parteDe('contador');
      return c?[{q:c.nombre,ag:'contador',x:c.resumen+'.'},
        ...(c.hallazgos||[]).slice(0,2).map(x=>({q:c.nombre,ag:'contador',x,p:340}))]
        :[A(en?'The accountant has not reported yet.':'El contador no ha reportado todavía.')];}
    case 'chainlist':return [A(en?('Testnet request is '+(V.pr93||'unknown')+', mainnet reservation is '+(V.pr94||'unknown')+'. All four checks pass. It is waiting for a maintainer.')
                                 :('La solicitud de pruebas está '+(V.pr93||'sin dato')+', y la reserva de la principal '+(V.pr94||'sin dato')+'. Las cuatro pruebas pasan. Espera a un mantenedor.'),{foco:'chainl'})];
    case 'bots':return [A(BOTS?(en?('The bots are '+(BOTS.estado==='bien'?'running':'stalled')+'. Last run '+hace(BOTS.cuando)+', '+(BOTS.enviosQueQuedan||0)+' sends left.')
                                  :('Los bots están '+(BOTS.estado==='bien'?'corriendo':'parados')+'. Última carrera '+hace(BOTS.cuando)+', quedan '+(BOTS.enviosQueQuedan||0)+' envíos.'))
                            :(en?'I cannot read the bots right now.':'Ahora mismo no puedo leer los bots.'),{foco:'bots'})];
    case 'pendiente':{
      const esc=PARTES.flatMap(p=>(p.escala||[]).map(x=>({q:p.nombre,ag:p.agente,x,p:360})));
      const pen=(I.pendiente||[]).map(x=>A(x+'.',{p:300}));
      if(!esc.length&&!pen.length)return [A(en?'Nothing is waiting on you.':'No hay nada esperándote.')];
      return [A(en?'These need you.':'Esto necesita tu mano.',{p:400}),...esc,...pen];}
  }
  return [A(t('nada'))];
}

/* ═══ 9 · ESCUCHAR Y OBEDECER ════════════════════════════════════════════
   Lo que se puede pedir por voz es una lista CERRADA. Preguntar es libre;
   actuar, no. Desde aquí no se despliega, no se mueven fondos, no se
   reinicia un nodo y no se cambia configuración: esta página vive en
   internet, y una consola remota sobre producción es exactamente lo que el
   Cerrajero marcaría como el peor agujero del sistema. */
const INTENCIONES=[
  [/\b(status|report|brief|everything|parte|estado general|inform)/i,'PARTE'],
  [/\b(chain|block|testnet|legacy|cadena|bloque|red)/i,'cadenas'],
  [/\b(money|price|treasury|fee|origen|dinero|precio|tesoro|comisi)/i,'dinero'],
  [/\b(team|agent|equipo|agente)/i,'equipo'],
  [/\b(secur|lock|key|segur|cerrajero|llave)/i,'seguridad'],
  [/\b(cost|spend|bill|aws|coste|costo|gasto|factura)/i,'coste'],
  [/\b(chainlist|pull request|solicitud)/i,'chainlist'],
  [/\b(bot)/i,'bots'],
  [/\b(need|pending|outstanding|falta|pendiente|necesita)/i,'pendiente'],
  [/\b(stop|quiet|silence|para|c[aá]llate|silencio)/i,'PARAR'],
];
const ORDENES=[
  [/\b(run|start|fire|corre|lanza|ejecuta).{0,14}\bbot/i,'bots-ahora'],
  [/\b(refresh|reload|update|actualiza|recarga)/i,'refrescar'],
];
let oyendo=false,rec=null;
function escuchar(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){$('#oido').textContent=t('noOigo');return;}
  if(oyendo){rec&&rec.stop();return;}
  parar();
  rec=new R(); rec.lang=IDI==='en'?'en-GB':'es-MX';
  rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=()=>{oyendo=true;$('#mic').classList.add('on');
    $('#lblMic').textContent=t('listening');$('#oido').textContent='…';};
  rec.onresult=ev=>{
    let txt='';for(const r of ev.results)txt+=r[0].transcript;
    $('#oido').textContent='“'+txt+'”';
    if(ev.results[ev.results.length-1].isFinal)atender(txt);
  };
  rec.onerror=ev=>{$('#oido').textContent=IDI==='en'?'Could not hear you.':'No pude oírte.';};
  rec.onend=()=>{oyendo=false;$('#mic').classList.remove('on');$('#lblMic').textContent=t('speak');};
  rec.start();
}
$('#mic').addEventListener('click',escuchar);

async function atender(txt){
  for(const [re,acc] of ORDENES){
    if(re.test(txt)){ejecutar(acc);return;}
  }
  for(const [re,tema] of INTENCIONES){
    if(re.test(txt)){
      if(tema==='PARAR'){parar();return;}
      if(tema==='PARTE'){decir(guion());return;}
      decir(responder(tema));return;
    }
  }
  decir([{q:'JARVIS',x:t('nada')}]);
}
async function ejecutar(accion){
  const en=IDI==='en';
  if(accion==='refrescar'){
    decir([{q:'JARVIS',x:en?'Refreshing.':'Actualizando.'}]);
    await todo(); return;
  }
  if(accion==='bots-ahora'){
    decir([{q:'JARVIS',x:en?'Running the test bots now.':'Lanzando los bots de prueba.'}]);
    try{
      const r=await fetch('/ordenes/bots/ahora',{method:'POST'});
      const j=await r.json();
      await verBots();
      decir([{q:'JARVIS',foco:'bots',x: j.estado==='bien'
        ?(en?('Done. The transaction confirmed in block '+nf(j.bloque)+', in '+j.segundos+' seconds.')
            :('Hecho. La transacción confirmó en el bloque '+nf(j.bloque)+', en '+j.segundos+' segundos.'))
        :(en?('The run finished as '+j.estado+'. '+(j.detalle||''))
            :('La carrera terminó como '+j.estado+'. '+(j.detalle||'')))}]);
    }catch(e){
      decir([{q:'JARVIS',x:en?'I could not reach the bots.':'No pude alcanzar los bots.'}]);
    }
  }
}

const h4=(c,x)=>{const h=document.createElement('h4');h.textContent=x;c.appendChild(h);};
const li=(c,x,cl)=>{const l=document.createElement('li');if(cl)l.className=cl;l.textContent=x;c.appendChild(l);};
const kv=(c,k,v,col)=>{const d=document.createElement('div');d.className='kv';
  d.innerHTML='<b>'+k+'</b><span'+(col?' style="color:'+col+'"':'')+'>'+v+'</span>';c.appendChild(d);};

function abrirSis(s){
  const e=E[s.id];
  disparar(s.id,true);
  const c=panel(IDI==='en'?s.nom:s.es,s.que[IDI],e.mal?'var(--red)':s.col);
  kv(c,t('estado'),e.est,e.mal?'var(--red)':s.col);
  if(e.vivo&&e.vivo.length){h4(c,t('vivo'));for(const[k,v] of e.vivo)kv(c,k,v);}
  h4(c,t('dentro'));for(const x of s.det[IDI])li(c,x);
}
function abrirAgente(a){
  const p=parteDe(a.id);
  const c=panel(a.nom,(IDI==='en'?'Watches ':'Vigila ')+a.mira[IDI]+' · '+a.cada[IDI],a.col);
  if(!p){li(c,IDI==='en'?'This agent has not reported yet.':'Este agente no ha reportado todavía.');return;}
  kv(c,IDI==='en'?'Verdict':'Veredicto',p.veredicto.toUpperCase(),
     p.veredicto==='falla'?'var(--red)':p.veredicto==='aviso'?'var(--gold)':a.col);
  kv(c,IDI==='en'?'Last run':'Última revisión',hace(p.cuando));
  h4(c,IDI==='en'?'SUMMARY':'RESUMEN');
  li(c,p.resumen,p.veredicto==='falla'?'mala':p.veredicto==='aviso'?'ojo':'');
  if((p.hallazgos||[]).length){h4(c,IDI==='en'?'WHAT IT MEASURED':'LO QUE MIDIÓ');
    p.hallazgos.forEach(x=>li(c,x));}
  if((p.hizo||[]).length){h4(c,IDI==='en'?'WHAT IT DID':'LO QUE HIZO');p.hizo.forEach(x=>li(c,x));}
  if((p.escala||[]).length){h4(c,t('necesita'));p.escala.forEach(x=>li(c,x,'mala'));}
}
function abrirInforme(){
  const c=panel(t('reporte'),(I.fecha||'')+' · '+(IDI==='en'?'COMPILED BY THE BRAIN':'GENERADO POR EL CEREBRO'));
  const f=fallas();
  if(f.length){h4(c,t('fallas'));f.forEach(s=>li(c,(IDI==='en'?s.nom:s.es)+' — '+E[s.id].est,'mala'));}
  h4(c,t('ahora'));
  if(V.b5534)li(c,(IDI==='en'?'Testnet: block ':'Red de pruebas: bloque ')+nf(V.b5534)+' · '+V.gas+' gwei');
  if(V.b8532)li(c,(IDI==='en'?'Legacy: block ':'Cadena vieja: bloque ')+nf(V.b8532)+(V.quieta?(IDI==='en'?' · frozen, root intact':' · congelada, raíz intacta'):' · ROOT CHANGED'));
  if(BOTS)li(c,(IDI==='en'?'Test bots: ':'Bots: ')+BOTS.estado+' · '+(BOTS.enviosQueQuedan||0)+(IDI==='en'?' sends left':' envíos restantes'));
  li(c,'ORIGEN $'+(I.precio||'—')+' · '+(I.comision||'—'));
  const esc=PARTES.flatMap(p=>(p.escala||[]).map(x=>p.nombre+' — '+x));
  if(esc.length){h4(c,t('necesita'));esc.forEach(x=>li(c,x,'mala'));}
  if(PARTES.length){h4(c,t('equipoT'));
    PARTES.forEach(p=>li(c,p.nombre+' · '+p.veredicto+' · '+hace(p.cuando)+' — '+p.resumen,
      p.veredicto==='falla'?'mala':p.veredicto==='aviso'?'ojo':''));}
  if((I.hechoHoy||[]).length){h4(c,t('hecho'));I.hechoHoy.forEach(x=>li(c,x));}
  if((I.pendiente||[]).length){h4(c,t('falta'));I.pendiente.forEach(x=>li(c,x));}
}
