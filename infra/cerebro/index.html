async function conversar(pregunta){
  if(INVITADO||hayModelo===false)return false;
  $('#sub').innerHTML='<span class="quien">JARVIS</span><span style="opacity:.5">…</span>';
  try{
    const r=await fetch('/ordenes/hablar',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({pregunta, idioma:IDI, historial:HISTORIAL, usuario:QUIEN.nombre||QUIEN.usuario,
                           estado:estadoParaElModelo()})});
    const j=await r.json();
    if(!r.ok||!j.respuesta){
      /* Sin llave o sin saldo no se vuelve a intentar en toda la sesión: no
         tiene sentido esperar cuarenta segundos en cada pregunta. */
      if(j.error==='sin-llave'||/credit|balance|authentication/i.test(j.error+' '+(j.detalle||'')))
        hayModelo=false;
      return false;
    }
    hayModelo=true;
    HISTORIAL.push({rol:'jose',texto:pregunta},{rol:'jarvis',texto:j.respuesta});
    if(HISTORIAL.length>12)HISTORIAL=HISTORIAL.slice(-12);
    /* Se parte en frases para que la voz respire, igual que el resto. */
    const frases=j.respuesta.split(/(?<=[.!?…])\s+/).filter(x=>x.trim());
    responderCon(frases.map(x=>J(x,{p:300})));
    return true;
  }catch(e){ return false; }
}

async function atender(txt){
  const s=sinTildes(txt);
  if(!s.trim())return;

  /* En un punto de control, «sigue» y «no» son del recorrido y no de otra
     cosa. Cualquier otra frase es la pregunta, y al contestarla se vuelve
     solo al sitio: por eso se marca aquí. */
  if(esperandoPregunta){
    clearTimeout(relojControl);
    if(/^\s*(sigue|siga|continua|adelante|no|nada|ninguna|todo bien|vamos|next|carry on|continue|go on|nope|nothing|all good)\b/.test(s))
      return void seguirRecorrido();
    esperandoPregunta=false; volverTrasResponder=true;
    $('#siono').classList.remove('abre'); restaurarSiNo();
  }

  /* Un «sí» suelto solo significa algo si hay una pregunta en el aire. */
  if(ofrecido){
    if(/^\s*(si|s|yes|yeah|yep|ok|okay|dale|claro|por favor|please|adelante|hazlo|cuentame|tell me|go ahead)\b/i.test(s))
      return void aceptarOfrecido();
    if(/^\s*(no|nope|nah|luego|despues|ahora no|not now|later)\b/i.test(s))
      return void rechazarOfrecido();
    ofrecido=null; $('#oido').textContent=''; $('#siono').classList.remove('abre');
  }

  for(const [re,acc] of ORDENES) if(re.test(s)) return ejecutar(acc);
  if(/(stop|be quiet|silence|shut up|^para$|callate|silencio|basta)/i.test(s))return parar();

  /* El ensayo: practicar delante del espejo antes de la reunión. Con una
     pregunta en el aire, «contesta» y «siguiente» son del ensayo y no
     significan otra cosa. */
  if(enEnsayo&&/^\s*(contesta|responde|la respuesta|answer|show me|siguiente|next|otra|another)\b/.test(s))
    return void ensayo();
  if(/(ensay|practic|rehears|preguntame|quiz|drill|hazme una pregunta|ask me)/.test(s))
    return void ensayo();
  if(/(que (te|le)? ?pueden preguntar|que preguntas|what (can|could) (they|people) ask|lista de preguntas|questions)/.test(s))
    return void listaDePreguntas();

  if(await conversar(txt))return;      // si hay modelo, contesta él

  /* ═══ LA PREGUNTA DE INVERSIONISTA VA PRIMERO ═══════════════════════════
     Antes que TODO lo general. Dos cosas se la comían:
     · el patrón de «dinero», que contestaba la fórmula del precio a
       «¿está respaldado en oro?» --verdad, pero no es esa la pregunta, y
       ahí es justo donde hay que ser preciso--;
     · y el manejador de «explícame X», cuyo patrón incluye «how do»: con
       «how do you make money» se quedaba con «you make money», veía
       «money» y soltaba el flujo del dinero en vez del modelo de negocio.
     Lo específico gana a lo general. Esa es toda la regla. */
  { const r=respuestaInversor(s); if(r)return responderCon(r); }

  /* «explícame X»: se busca X en el conocimiento, en los temas y en los
     sistemas, y se cuenta entero. */
  const mExp=s.match(/(?:explica(?:me)?|explain|como funciona|how does|how do)\s+(?:el |la |los |las |the )?(.*)/);
  if(mExp&&mExp[1]){
    const q=mExp[1];
    const kk={ecosistema:/(ecosistema|todo|orden global|ecosystem|everything)/,
      apps:/(app|servicio|backend|service)/, webs:/(web|pagina|dominio|site|domain)/,
      infra:/(maquina|nodo|servidor|infra|machine|server|node)/,
      tokens:/(token|ondk|origen)/, flujo:/(dinero|money|flujo|flow|pago|payment)/};
    for(const k in kk)if(kk[k].test(q))return responderCon(temaSaber(k));
    const sis2=SIS.find(x=>q.includes(sinTildes(x.nom).toLowerCase())||q.includes(sinTildes(x.es).toLowerCase()));
    if(sis2)return responderCon([...temaSistema(sis2),
      ...sis2.det[IDI].slice(3).map(x=>J(x+'.',{p:340}))]);
  }

  for(const [re,id] of CONV){
    if(!re.test(s))continue;
    if(id==='PARAR')return parar();
    if(id==='PAUSA'){
      /* La pausa vale para las dos voces: la grabada y la del navegador. */
      if(audioActual){pausadoAdrede=true;try{audioActual.pause();}catch(e){}}
      else if(speechSynthesis.speaking){pausadoAdrede=true;speechSynthesis.pause();}
      if(pausadoAdrede)$('#oido').textContent=IDI==='en'?'Paused. Say "continue".':'En pausa. Di «continúa».';
      return;}
    if(id==='SEGUIR'){pausadoAdrede=false;
      if(audioActual){try{audioActual.play();}catch(e){}}
      speechSynthesis.resume();$('#oido').textContent='';return;}
    if(id==='LENTO'){VEL=velSana(VEL-.1);localStorage.setItem('velCerebro',VEL);
      return responderCon([J(IDI==='en'?'Slower. Like this.':'Más despacio. Así.')]);}
    if(id==='RAPIDO'){VEL=velSana(VEL+.1);localStorage.setItem('velCerebro',VEL);
      return responderCon([J(IDI==='en'?'Faster. Like this.':'Más rápido. Así.')]);}
    if(id.startsWith('K:'))return responderCon(temaSaber(id.slice(2)));
    if(id==='PARTE'){ultimoTema='parte';return responderCon(guion());}
    if(id==='REPETIR')return responderCon(ultimasLineas.slice());
    if(id==='MAS')return responderCon(ampliar());
    const r=tema(id);
    if(r)return responderCon(r);
  }

  /* ¿nombras a un agente? entonces habla él */
  const ag=AGENTES.find(a=>s.includes(sinTildes(a.nom))||s.includes(a.id)||
                           s.includes(sinTildes(a.mira.es))||s.includes(sinTildes(a.mira.en)));
  if(ag&&parteDe(ag.id)){
    ultimoTema=ag.id==='cerrajero'?'seguridad':ag.id==='contador'?'coste':ag.id;
    const p=parteDe(ag.id);
    return responderCon([...citar(ag.id),...detalleDe(ag.id,3)]);
  }

  /* ¿nombras un sistema? */
  const sis=SIS.find(x=>s.includes(sinTildes(x.nom))||s.includes(sinTildes(x.es)));
  if(sis)return responderCon(temaSistema(sis));


  /* ═══ EL PUENTE ═══════════════════════════════════════════════════════
     Antes esto decía «eso todavía no me lo han enseñado» y se acababa la
     conversación. Delante de un inversionista, un callejón sin salida vale
     lo mismo que una respuesta mala.

     Ahora nunca es un callejón: se busca la palabra de la pregunta en todo
     lo que sí se sabe --sistemas, temas y preguntas de inversionista--, se
     contesta con lo más cercano y se ofrece seguir. Y si de verdad no hay
     nada cerca, se dice qué SÍ se puede contestar, que también es contestar.

     Lo que NO hace, a propósito: inventarse el dato. Un número inventado
     delante de alguien que va a poner dinero no es un fallo, es un fraude,
     y se descubre en la primera diligencia. */
  const cerca=loMasCercano(s);
  if(cerca)return responderCon(cerca);

  responderCon([J(IDI==='en'
    ? 'I do not have that measured, and I would rather say so than invent a number for you.'
    : 'Eso no lo tengo medido, y prefiero decírtelo antes que inventarte un número.',{p:380}),
    J(IDI==='en'
    ? 'What I can answer with real data: the business and how it makes money, the ORIGEN and its supply, the gold reference, the technology, the traction, security, compliance, the cost, and the open risks. Name any of those.'
    : 'Lo que sí puedo contestarte con datos de verdad: el negocio y cómo gana dinero, el ORIGEN y su emisión, la referencia del oro, la tecnología, la tracción, la seguridad, el cumplimiento, el coste y los riesgos abiertos. Dime cualquiera.',{p:0})]);
}

/* Lo más cercano: puntúa por palabras compartidas. Cinco letras mínimo, que
   «que» y «como» aparecen en todo y no distinguen nada. */
function loMasCercano(s){
  const pal=[...new Set(String(s).toLowerCase().split(/[^a-z0-9áéíóúñ]+/i)
             .filter(w=>w.length>=5))];
  if(!pal.length)return null;
  let mejor=null, alto=0;
  const mira=(texto,dar)=>{
    const t=sinTildes(texto).toLowerCase();
    const n=pal.filter(w=>t.includes(sinTildes(w).toLowerCase())).length;
    if(n>alto){alto=n;mejor=dar;}
  };
  for(const q of INVERSOR)
    mira(q.re.source+' '+q.es.join(' ')+' '+q.en.join(' '),
         ()=>q[IDI].map((x,i)=>J(x,{p:i===q[IDI].length-1?0:420,foco:i?null:q.foco})));
  for(const k in SABER)
    mira(k+' '+SABER[k][IDI].join(' '), ()=>temaSaber(k));
  for(const x of SIS)
    mira(x.nom+' '+x.es+' '+x.que[IDI]+' '+x.det[IDI].join(' '), ()=>temaSistema(x));
  /* Con UNA palabra suelta en común no se llama «lo más cercano»: eso es
     ruido, y ponerle voz de asistente a un parecido casual es peor que
     decir que no lo tienes medido. Hacen falta dos. */
  if(!mejor||alto<2)return null;
  return [J(IDI==='en'?'The closest thing I have measured is this.'
                      :'Lo más cercano que tengo medido es esto.',{p:340}),
          ...mejor()];
}

/* ═══ 9b · LA PRESENTACIÓN ════════════════════════════════════════════════
   Un recorrido de unos seis minutos. La voz narra, la cámara vuela sola al
   racimo que se está nombrando, las tarjetas se materializan y los contadores
   suben. Todo con datos vivos: el bloque que dice es el bloque que hay.

   Regla que no se rompe: aquí NO se enseña nada interno. Ni fallas, ni
   pendientes, ni costes, ni seguridad. Para eso está el modo diligencia, que
   se abre a propósito y enseña justo eso. Esconder problemas a quien va a
   hacer diligencia es peor negocio que enseñarlos. */
let PRESENTANDO=false;

function contadores(lista){
  const c=$('#cifras'); c.innerHTML=''; c.classList.add('abre');
  lista.forEach(([valor,etiqueta,sufijo],i)=>{
    const d=document.createElement('div'); d.className='c';
    d.innerHTML='<div class="n">0</div><div class="e">'+etiqueta+'</div>';
    c.appendChild(d);
    setTimeout(()=>{
      d.classList.add('viva');
      const n=d.querySelector('.n'), t0=performance.now(), dur=1500;
      (function sube(t){
        const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);   // frena al final
        n.textContent=nf(Math.round(valor*e))+(sufijo||'');
        if(k<1)requestAnimationFrame(sube);
      })(t0);
    }, i*260);
  });
}
const ocultarContadores=()=>$('#cifras').classList.remove('abre');

/* El guion. Cada frase puede llevar `foco` --y la cámara vuela sola-- y
   `cifras`, que dispara los contadores. */
function guionPresentacion(){
  const es=IDI!=='en', P=[];
  const F=(x,o={})=>P.push(Object.assign({q:'JARVIS',x},o));
  /* La parada: aquí el recorrido pregunta si quieres preguntar. Van al final
     de cada capítulo, donde una persona levantaría la mano de todos modos. */
  const PARA=()=>P.push({control:true});
  const b5534=V.b5534?nf(V.b5534):'—';
  const n=NOM();

  if(es){
    /* ── 1 · quién eres y qué estás viendo ─────────────────────────────── */

/* ═══ MOVERSE POR EL RECORRIDO ════════════════════════════════════════════
   Una presentación de seis minutos que solo se puede ver de principio a fin
   no sirve en una reunión: el inversionista pregunta por los productos y hay
   que llegar ahí, no esperar. El guion se guarda entero con sus capítulos y
   se puede saltar a cualquiera --y volver--.

   El sitio actual NO se lleva en un contador aparte: se deduce de lo que
   queda en la cola. Un contador paralelo se desincroniza en cuanto algo
   interrumpe, y esto no puede fallar delante de nadie. */
let MIC_OK=false;

/* ═══ LOS PUNTOS DE CONTROL ═══════════════════════════════════════════════
   Lo que separa una grabación de una conversación: cada pocos minutos el
   recorrido se detiene y pregunta «¿hasta aquí alguna pregunta, o seguimos?».
   Si preguntas, contesta --con lo que haya que enseñar en pantalla-- y
   VUELVE SOLO al punto exacto donde se paró. Si callas unos segundos,
   sigue. Nadie tiene que buscar un botón.

   La vuelta automática es la parte que lo hace posible: sin ella, preguntar
   costaría perder el sitio, y entonces nadie pregunta. */
let volverTrasResponder=false, esperandoPregunta=false, relojControl=null;
function puntoDeControl(){
  esperandoPregunta=true;
  /* La barra tiene que decir donde estas TAMBIEN mientras pregunta: al
     pararse, `siguiente()` sale antes de pintarla y se quedaba mostrando el
     capitulo anterior. */
  pintarRecorrido();
  $('#siono').classList.add('abre');
  $('#btnSi').textContent =IDI==='en'?'I HAVE A QUESTION':'TENGO UNA PREGUNTA';
  $('#btnNo').textContent =IDI==='en'?'CARRY ON':'SIGUE';
  const q=IDI==='en'
    ? 'Anything you want to ask me so far'+VOC()+'? Or shall I carry on?'
    : '¿Hasta aquí alguna pregunta'+VOC()+'? ¿O sigo?';
  decir([J(q,{p:0})],abrirEscucha);
}
function abrirEscucha(){
    if(!esperandoPregunta)return;
    /* Con micrófono se abre solo: preguntar tiene que costar cero. */
    if(MIC_OK&&!oyendo)try{escuchar();}catch(e){}
    $('#oido').textContent=IDI==='en'
      ? (MIC_OK?'Speak, or I carry on in a moment.':'Ask with the button, or I carry on.')
      : (MIC_OK?'Habla, o sigo en un momento.':'Pregunta con el botón, o sigo.');
    /* El silencio también contesta: quince segundos y continúa. Si no,
       una demostración se queda parada esperando a alguien que ya dijo
       que no con la cara. */
    clearTimeout(relojControl);
    relojControl=setTimeout(()=>{if(esperandoPregunta)seguirRecorrido();},15000);
}
abrirEscucha.pesePendiente=true;
function seguirRecorrido(){
  clearTimeout(relojControl);
  esperandoPregunta=false; volverTrasResponder=false;
  $('#siono').classList.remove('abre'); $('#oido').textContent='';
  restaurarSiNo();
  if(oyendo&&rec)try{rec.stop();}catch(e){}
  if(hayPendiente())continuar();
}
/* Cuando se contesta una pregunta hecha en un punto de control, al terminar
   la respuesta se vuelve solo. No se pregunta «¿seguimos?» otra vez: ya
   dijo que sí al preguntar. */
function retomar(){ if(hayPendiente())continuar(); }
retomar.pesePendiente=true;
function trasResponder(){
  if(!volverTrasResponder||!hayPendiente())return;
  volverTrasResponder=false;
  const donde=RECORRIDO&&RECORRIDO.caps[capActual()];
  decir([J(IDI==='en'?'Back to where we were.':'Volvemos a donde íbamos.',{p:260})],
        retomar);
  if(donde)$('#capNom').textContent=donde.tit;
}
trasResponder.pesePendiente=true;
const restaurarSiNo=()=>{$('#btnSi').textContent=IDI==='en'?'YES':'SÍ';
                         $('#btnNo').textContent='NO';};

let RECORRIDO=null;              // {lineas, caps:[{i,tit}], fin}
function montarRecorrido(lineas,fin){
  const caps=[];
  lineas.forEach((l,i)=>{if(l.cap)caps.push({i,tit:l.cap});});
  if(!caps.length||caps[0].i>0)caps.unshift({i:0,tit:IDI==='en'?'START':'INICIO'});
  RECORRIDO={lineas,caps,fin};
  return lineas;
}
const sitioActual=()=>{
  if(!RECORRIDO)return 0;
  /* Lo que queda por decir esta en `cola` mientras habla, y en
     `colaGuardada` cuando esta parado o preguntando --en un punto de
     control la cola se vacia a proposito--. Mirando solo `cola` creia
     estar siempre en el ultimo capitulo. */
  const quedan=cola.length||(colaGuardada?colaGuardada.length:0);
  return Math.max(0,RECORRIDO.lineas.length-quedan-1);};
const capActual=()=>{
  if(!RECORRIDO)return 0;
  const i=sitioActual(); let k=0;
  RECORRIDO.caps.forEach((c,j)=>{if(c.i<=i)k=j;});
  return k;
};
/* Saltar es una decisión, no una pausa: lo guardado se descarta a propósito
   --si no, al parar después volverías al sitio viejo y no al nuevo--. */
function reproducirDesde(i){
  if(!RECORRIDO)return;
  i=Math.max(0,Math.min(RECORRIDO.lineas.length-1,i));
  colaGuardada=null; finGuardado=null; lineaActual=null;
  PRESENTANDO=true;
  $('#btnPresenta').classList.add('on');document.body.classList.add('narrando');
  $('#btnPresenta').classList.remove('sigue');
  $('#lblPresenta').textContent=IDI==='en'?'PAUSE':'PAUSAR';
  hablando=false; cola=[]; TURNO++; callarAudio(); speechSynthesis.cancel();
  setTimeout(()=>{
    alTerminar=RECORRIDO.fin;
    cola=RECORRIDO.lineas.slice(i);
    hablando=true; $('#hablar').classList.add('on');
    $('#lblHablar').textContent=t('stop');
    siguiente();
  },200);
}
/* La barra: una raya por capítulo, la de ahora encendida. Se pinta desde
   cero cada frase --son ocho rayas, no hay nada que optimizar-- para que
   nunca se quede describiendo un sitio donde ya no estás. */
function pintarRecorrido(){
  const r=$('#ruta'); if(!r)return;
  const vivo=!!RECORRIDO&&(PRESENTANDO||hayPendiente());
  r.classList.toggle('abre',vivo);
  if(!vivo)return;
  const k=capActual(), b=$('#capBarra');
  if(b.childElementCount!==RECORRIDO.caps.length){
    b.innerHTML='';
    RECORRIDO.caps.forEach((c,j)=>{const i=document.createElement('i');
      i.title=c.tit; i.addEventListener('click',()=>irACapitulo(j)); b.appendChild(i);});
  }
  [...b.children].forEach((el,j)=>{
    el.className=j===k?'aqui':j<k?'hecho':'';
    el.title=RECORRIDO.caps[j].tit;});
  $('#capNom').textContent=RECORRIDO.caps[k].tit;
}
const irACapitulo=k=>{ if(!RECORRIDO)return;
  k=Math.max(0,Math.min(RECORRIDO.caps.length-1,k));
  reproducirDesde(RECORRIDO.caps[k].i); };
function capSiguiente(){ if(!RECORRIDO)return;
  const k=capActual();
  if(k>=RECORRIDO.caps.length-1){          // del último capítulo se salta al final
    reproducirDesde(RECORRIDO.lineas.length-1); return;}
  irACapitulo(k+1); }
function capAnterior(){ if(!RECORRIDO)return;
  const k=capActual(), c=RECORRIDO.caps[k];
  /* Como en un reproductor: si ya llevas rato dentro del capítulo, «atrás» lo
     repite; si acabas de entrar, va al anterior. */
  irACapitulo(sitioActual()-c.i>1?k:k-1); }

function presentar(){
  if(PRESENTANDO){pararPresentacion();return;}
  if(continuar())return;              // seguir donde se quedó, si hay algo
  PRESENTANDO=true;
  $('#btnPresenta').classList.add('on');document.body.classList.add('narrando');
  $('#lblPresenta').textContent=IDI==='en'?'PAUSE':'PAUSAR';
  const fin=()=>{
    if(!PRESENTANDO)return;
    if(INVITADO&&!PUEDE_TX){       // sin vale se cierra con palabras, no con gasto
      decir([J(IDI==='en'
        ?'That is the ecosystem. Everything you saw is live, and every number is verifiable in the public explorer.'
        :'Ese es el ecosistema. Todo lo que viste está vivo, y cada número se puede comprobar en el explorador público.',{p:0})],
        ()=>{PRESENTANDO=false;$('#btnPresenta').classList.remove('on');document.body.classList.remove('narrando');
             $('#lblPresenta').textContent=IDI==='en'?'TOUR':'RECORRIDO';
             pintarRecorrido();});
      return;
    }
    transaccionEnVivo();
  };
  decir(montarRecorrido(guionPresentacion(),fin), fin);
  pintarRecorrido();
}
function pararPresentacion(){
  parar();                       // PRIMERO: así parar() aún ve PRESENTANDO y guarda
  PRESENTANDO=false; ocultarContadores(); soltarCamara();
  $('#btnPresenta').classList.remove('on');document.body.classList.remove('narrando');
  marcarContinuar(); pintarRecorrido();
}

/* ═══ TOCAR Y QUE PREGUNTE ════════════════════════════════════════════════
   Tocas cualquier cosa del ecosistema y JARVIS te ofrece el reporte en voz.
   Se abre la ficha para que veas los datos, y él pregunta si quieres que te
   lo cuente. «Sí» dispara el reporte hablado completo; «no» lo deja estar.
   La pregunta queda ARMADA hasta que contestas o tocas otra cosa: así el
   micrófono entiende un «sí» suelto, que fuera de contexto no significa nada. */
let ofrecido=null;                       // {tipo:'sis'|'ag', id}
function ofrecer(tipo,id,nombre){
  if(PRESENTANDO)return;         // durante el recorrido no se interrumpe (ver abrirSis)
  ofrecido={tipo,id}; $('#siono').classList.add('abre');
  const q=IDI==='en' ? 'Would you like the full report on '+nombre+'?'
                     : '¿Quieres que te dé el reporte de '+nombre+'?';
  decir([J(q,{foco:tipo==='sis'?id:null, ag:tipo==='ag'?id:null, p:0})]);
  $('#oido').textContent=IDI==='en'?'Say yes or no':'Di sí o no';
}
function aceptarOfrecido(){
  const o=ofrecido; ofrecido=null; $('#oido').textContent='';
  $('#siono').classList.remove('abre');
  if(!o)return false;
  if(o.tipo==='ag'){
    ultimoTema=o.id;
    responderCon([...citar(o.id),...detalleDe(o.id,4),
      ...((parteDe(o.id)||{}).escala||[]).map(x=>({q:(parteDe(o.id)||{}).nombre,ag:o.id,x,p:360}))]);
  }else{
    const sx=S(o.id); if(!sx)return true;
    ultimoTema=o.id;
    const e=E[o.id];
    responderCon([J((IDI==='en'?sx.nom:sx.es)+': '+e.est+'. '+e.met+'.',{foco:o.id,p:420}),
      ...(e.vivo||[]).map(([k,v])=>J(k+': '+v+'.',{foco:o.id,p:300})),
      ...sx.det[IDI].map(x=>J(x+'.',{foco:o.id,p:340}))]);
  }
  return true;
}

/* ═══ TOCAR ALGO MIENTRAS NARRA ═══════════════════════════════════════════
   Este era el reinicio de la captura del 14-ago: tocabas un sistema por
   curiosidad a mitad del recorrido, saltaba la pregunta «¿quieres el
   reporte?», esa pregunta pisaba la cola y los minutos que quedaban se
   perdían sin dejar rastro ni forma de volver.

   Ahora tocar durante el recorrido hace lo que uno espera que haga: la cámara
   vuela ahí y sale la ficha flotante, y la voz sigue su camino. El panel
   grande y el reporte hablado se quedan para cuando no está narrando --si no,
   una tapa el cerebro y el otro tapa la voz--. */
function abrirSis(s){
  if(PRESENTANDO){
    disparar(s.id,true); volarA(s.id,1.5); tarjetaSis(s.id);
    soplo(IDI==='en'?'The tour carries on. Stop it for the full report.'
                    :'El recorrido sigue. Párala para el reporte entero.');
    return;
  }
  const e=E[s.id];
  disparar(s.id,true);
  const c=panel(IDI==='en'?s.nom:s.es,s.que[IDI],e.mal?'var(--red)':s.col);
  kv(c,t('estado'),e.est,e.mal?'var(--red)':s.col);
  if(e.vivo&&e.vivo.length){h4(c,t('vivo'));for(const[k,v] of e.vivo)kv(c,k,v);}
  h4(c,t('dentro'));for(const x of s.det[IDI])li(c,x);
  ofrecer('sis',s.id,IDI==='en'?s.nom:s.es);
}
function abrirAgente(a){
  if(PRESENTANDO){
    tarjetaAg(a.id);
    soplo(IDI==='en'?'The tour carries on. Stop it for the full report.'
                    :'El recorrido sigue. Párala para el reporte entero.');
    return;
  }
  const p=parteDe(a.id);
  const c=panel(a.nom,(IDI==='en'?'Watches ':'Vigila ')+a.mira[IDI]+' · '+a.cada[IDI],a.col);
  if(!p){li(c,IDI==='en'?'This agent has not reported yet.':'Este agente no ha reportado todavía.');return;}
  kv(c,IDI==='en'?'Verdict':'Veredicto',p.veredicto.toUpperCase(),
     p.veredicto==='falla'?'var(--red)':p.veredicto==='aviso'?'var(--gold)':a.col);
  kv(c,IDI==='en'?'Last run':'Última revisión',hace(p.cuando));
  h4(c,IDI==='en'?'SUMMARY':'RESUMEN');
  li(c,p.resumen,p.veredicto==='falla'?'mala':p.veredicto==='aviso'?'ojo':'');
  if((p.hallazgos||[]).length){h4(c,IDI==='en'?'WHAT IT MEASURED':'LO QUE MIDIÓ');
    p.hallazgos.forEach(x=>li(c,x));}
  if((p.hizo||[]).length){h4(c,IDI==='en'?'WHAT IT DID':'LO QUE HIZO');p.hizo.forEach(x=>li(c,x));}
  if((p.escala||[]).length){h4(c,t('necesita'));p.escala.forEach(x=>li(c,x,'mala'));}
  ofrecer('ag',a.id,a.nom);
}

/* La puerta de idioma: solo la primera vez. Elegir es también el primer
   toque, así que desbloquea el audio y JARVIS saluda por tu nombre. */
/* El permiso del micrófono se pide EN LA PUERTA, dentro del toque de elegir
   idioma. Dos razones y las dos importan:
   · el navegador solo lo concede desde un gesto de la persona, y este es el
     único gesto garantizado antes de que empiece a hablar;
   · y si se pidiera a mitad del recorrido, la ventana del navegador saldría
     encima de la presentación --el mismo error de forma que la ventana de
     contraseña, y ya sabemos cómo sienta--.
   Se pide, no se exige: si dice que no, el recorrido va igual y las
   preguntas se hacen con los botones. */
async function pedirMicrofono(){
  if(!$('#pideMic')||!$('#pideMic').checked)return false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    /* Concedido el permiso, la pista se cierra: no hay que tener el
       micrófono abierto todo el rato, y una luz encendida sin motivo en el
       teléfono de un inversionista es exactamente lo que no queremos. */
    s.getTracks().forEach(t=>t.stop());
    return true;
  }catch(e){ return false; }
}

}
