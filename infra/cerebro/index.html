<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EL CEREBRO · Orden Global</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   EL CEREBRO · Orden Global
   Cada región es un sistema real del ecosistema, con sus datos en vivo.
   El dibujo imita la referencia: mallas angulares de líneas finas, destellos
   que radian desde el centro, y etiquetas con el pulso de cada región.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#010308; --tinta:#e6eef5; --mut:#61788c; --faint:#33445a;
  --panel:rgba(4,10,18,.88); --borde:rgba(120,170,215,.18);
  --cian:#35d6ff; --rojo:#ff4d42;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Cascadia Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tinta);font:12px/1.5 var(--mono);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#fondo,#lienzo{position:fixed;inset:0;display:block}
#lienzo{touch-action:none;cursor:grab}
#lienzo.girando{cursor:grabbing}

/* ── etiqueta de región, como en la referencia ──────────────────────────── */
.eti{position:fixed;z-index:6;transform:translateY(-50%);opacity:0;
  transition:opacity .5s;cursor:pointer;white-space:nowrap}
.eti.viva{opacity:1}
.eti b{display:block;font-size:10px;font-weight:700;letter-spacing:.13em;
  padding:2px 8px;border:1px solid;background:rgba(1,3,8,.9);line-height:1.5}
.eti s{display:block;text-decoration:none;font-size:8.5px;color:#8fa8bd;
  letter-spacing:.04em;padding:1px 8px;background:rgba(1,3,8,.82);
  border:1px solid rgba(120,170,215,.12);border-top:0}
.eti:hover b{background:rgba(255,255,255,.08)}
.eti.mal b{color:var(--rojo)!important;border-color:var(--rojo)!important;
  animation:parpadeo 1s steps(2) infinite}
@keyframes parpadeo{50%{opacity:.35}}

/* ── HUD ────────────────────────────────────────────────────────────────── */
.hud{position:fixed;z-index:10;letter-spacing:.1em}
#hudNO{top:max(12px,env(safe-area-inset-top));left:16px}
#hudNO h1{font-size:14px;font-weight:800;letter-spacing:.34em}
#hudNO h1 i{font-style:normal;color:var(--cian);animation:parpadeo 1.6s steps(2) infinite}
#hudNO .sub{font-size:8px;color:var(--mut);letter-spacing:.3em;margin-top:2px}
#hudNE{top:max(12px,env(safe-area-inset-top));right:16px;text-align:right}
#reloj{font-size:17px;font-weight:300}
#fecha{font-size:8px;color:var(--mut);letter-spacing:.2em;text-transform:uppercase}

/* píldora LIVE, como la referencia */
#vivo{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  border:1px solid rgba(255,77,66,.5);background:rgba(1,3,8,.9);
  padding:5px 14px;font-size:9.5px;letter-spacing:.2em;font-weight:700}
#vivo .p{width:6px;height:6px;border-radius:50%;background:var(--rojo);
  box-shadow:0 0 8px var(--rojo);animation:parpadeo 1.4s steps(2) infinite}
#vivo .c{color:var(--mut)}

/* ── libro de sistemas ──────────────────────────────────────────────────── */
#libro{position:fixed;z-index:10;right:14px;top:50%;transform:translateY(-50%);
  width:242px;max-height:76vh;overflow-y:auto;border:1px solid var(--borde);
  background:var(--panel);backdrop-filter:blur(10px);padding:9px 0 3px}
#libro h3{font-size:8px;letter-spacing:.3em;color:var(--mut);padding:0 12px 6px;
  border-bottom:1px solid var(--borde)}
.fila{display:flex;align-items:center;gap:8px;padding:4.5px 12px;cursor:pointer;
  border-bottom:1px solid rgba(120,170,215,.05)}
.fila:hover{background:rgba(255,255,255,.05)}
.fila .cn{width:6px;height:6px;flex:none;transform:rotate(45deg)}
.fila .nom{font-size:9px;letter-spacing:.09em;font-weight:700}
.fila .est{display:block;font-size:7.5px;letter-spacing:.12em;color:var(--mut)}
.fila .met{font-size:8px;color:var(--mut);margin-left:auto;text-align:right;
  max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.fila.mal .nom,.fila.mal .est{color:var(--rojo)!important}

/* ── consola ────────────────────────────────────────────────────────────── */
#consola{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
  bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:7px;width:min(760px,94vw)}
#subt{text-align:center;font-size:11.5px;color:var(--cian);min-height:34px;
  text-shadow:0 0 16px rgba(53,214,255,.45);line-height:1.5}
#botones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tecla{display:flex;align-items:center;gap:8px;border:1px solid var(--borde);
  background:var(--panel);backdrop-filter:blur(10px);padding:10px 18px;
  font-size:10px;letter-spacing:.2em;font-weight:700}
.tecla:active{transform:scale(.97)}
#btnVoz{border-color:rgba(53,214,255,.5);color:var(--cian);
  box-shadow:0 0 22px rgba(53,214,255,.12)}
#btnVoz.hablando{border-color:var(--rojo);color:var(--rojo)}
#onda{display:inline-flex;gap:2px;align-items:center;height:11px}
#onda i{width:2px;background:currentColor;height:3px}
.hablando #onda i{animation:onda .62s ease-in-out infinite}
.hablando #onda i:nth-child(2){animation-delay:.1s}
.hablando #onda i:nth-child(3){animation-delay:.2s}
.hablando #onda i:nth-child(4){animation-delay:.3s}
.hablando #onda i:nth-child(5){animation-delay:.4s}
@keyframes onda{50%{height:11px}}
#voces{border:1px solid var(--borde);background:rgba(4,10,18,.95);color:var(--tinta);
  font:inherit;font-size:9.5px;padding:9px 10px;max-width:190px}
#pista{font-size:7.5px;color:var(--faint);letter-spacing:.18em;text-transform:uppercase}

/* ── panel de detalle ───────────────────────────────────────────────────── */
#det{position:fixed;z-index:20;inset:0;display:none;place-items:center;
  background:rgba(1,3,8,.74);backdrop-filter:blur(7px);padding:16px}
#det.abierto{display:grid}
#det article{width:min(660px,96vw);max-height:84vh;overflow-y:auto;
  border:1px solid var(--borde);background:var(--panel);padding:22px 26px}
#det h2{font-size:12px;letter-spacing:.28em;margin-bottom:2px}
#det .cuando{font-size:8.5px;color:var(--mut);letter-spacing:.16em;margin-bottom:14px}
#det h4{font-size:8.5px;letter-spacing:.24em;color:#c9a961;margin:15px 0 5px}
#det li,#det p{font-size:11.5px;line-height:1.72;list-style:none}
#det li::before{content:"▸ ";color:var(--faint)}
#det li.malo::before{content:"✗ ";color:var(--rojo)}
#det li.malo{color:var(--rojo)}
#det .kv{display:flex;gap:10px;font-size:11px;padding:3px 0;
  border-bottom:1px solid rgba(120,170,215,.06)}
#det .kv b{font-weight:400;color:var(--mut);min-width:150px}
#det .kv span{font-variant-numeric:tabular-nums}
#cerrarDet{position:sticky;float:right;top:0;color:var(--mut);font-size:17px;padding:0 6px}

@media (max-width:900px){
  #libro{top:auto;bottom:150px;transform:none;right:10px;left:10px;width:auto;
    max-height:30vh;display:grid;grid-template-columns:1fr 1fr;padding:5px 0}
  #libro h3{grid-column:1/-1}
  .fila .met{display:none}
  .eti s{display:none}
  #subt{font-size:10px}
  #voces{max-width:130px}
}
@media (max-width:640px){#fecha{display:none}#reloj{font-size:13px}#hudNO h1{font-size:12px}}
</style>
</head>
<body>
<canvas id="fondo"></canvas>
<canvas id="lienzo"></canvas>

<div class="hud" id="hudNO">
  <h1>EL CEREBRO <i>▮</i></h1>
  <div class="sub">ORDEN GLOBAL · NÚCLEO DE CONTROL</div>
</div>
<div id="vivo"><span class="p"></span><span>EN VIVO</span><span class="c" id="cuenta">— / —</span></div>
<div class="hud" id="hudNE"><div id="reloj">--:--:--</div><div id="fecha">—</div></div>

<aside id="libro"><h3>ECOSISTEMA</h3></aside>

<div id="consola">
  <div id="subt"></div>
  <div id="botones">
    <button class="tecla" id="btnVoz"><span id="onda"><i></i><i></i><i></i><i></i><i></i></span> INFORME</button>
    <select id="voces" title="voz"></select>
    <button class="tecla" id="btnTexto">TEXTO</button>
  </div>
  <div id="pista">toca una región para verla en detalle</div>
</div>

<div id="det"><article>
  <button id="cerrarDet">✕</button>
  <h2 id="detTit">—</h2>
  <div class="cuando" id="detSub"></div>
  <div id="detCuerpo"></div>
</article></div>

<script>
'use strict';
/* ═══ 1 · EL ECOSISTEMA ENTERO ════════════════════════════════════════════
   Cada región del cerebro es un sistema de verdad. `det` es lo que se enseña
   al tocarla; `vivo` lo rellena el sondeo cuando hay datos en vivo. */
const REG=[
 {id:'n5534', nom:'NÚCLEO 5534', col:'#35d6ff', a:[ .30, .52, .62], n:58,
  que:'Cadena de pruebas · Hyperledger Besu · consenso QBFT',
  det:['4 validadores: node3, node4, node5, node6','2 nodos RPC: ordenscan-rpc y testnet-1',
       'Período de bloque: 10 segundos','Shanghai activo desde el bloque 0 · PUSH0 funciona',
       'Suelo de gas: 93 gwei en los seis nodos','Malla completa: cada validador con 5 peers',
       'RPC público: rpc-testnet y pruebas.ordenglobal-rpc.com']},
 {id:'g5550', nom:'GÉNESIS 5550', col:'#e8c15c', a:[-.34, .56, .54], n:52,
  que:'La cadena de producción · construida y juzgada, sin arrancar',
  det:['331 cuentas · 172 con código','1.375 ranuras de almacenamiento',
       'Emisión: 1.000.000.000.000 ORIGEN exacto','Juez contra la 8532: 0 diferencias en 662 códigos, 175 saldos y 1.375 ranuras',
       'md5 89a1ec6b15d584525326ca11951d87df','Respaldado en S3 con el estado y las ranuras',
       'Billetera única: 0x3d5510e5… con 249.999.982.618,07']},
 {id:'m8532', nom:'MEMORIA 8532', col:'#f0a835', a:[ .02,-.06,-.06], n:54,
  que:'La cadena vieja · congelada, esperando el corte',
  det:['polygon-edge · 6 nodos t2.large','Sin transacciones desde el 8 de agosto',
       'Raíz de estado idéntica a la del cierre de ranuras','Es la fuente del génesis de la 5550',
       'Se retira después del corte']},
 {id:'wallet',nom:'VETA WALLET', col:'#3ee89a', a:[ .48, .18, .38], n:56,
  que:'La billetera · app móvil y backend en Heroku',
  det:['435 usuarios · 434 con llave y semilla descifrables','26 con KYC aprobado',
       'Gas y límite leídos de la cadena, ya no fijos','Idempotencia por sello contra el doble pago',
       'Rotación de clave de cifrado terminada','Login social y borrado de cuenta']},
 {id:'scan',  nom:'ORDENSCAN', col:'#a986ff', a:[-.50, .12,-.44], n:50,
  que:'El explorador de bloques',
  det:['Indexa bloque a bloque y guarda el progreso','testnet.ordenscan.com sirve la 5534',
       'ordenscan.com sigue en la cadena vieja','Rutas EIP-3091: /tx, /address, /block']},
 {id:'gid',   nom:'GENESIS ID', col:'#ff8a3d', a:[-.62,-.16, .30], n:46,
  que:'Identidad · KYC, KYB, AML y SSO',
  det:['Verificación con Veriff','Puente con el backend de la billetera',
       'SSO para el ecosistema','Censo de identidades']},
 {id:'pago',  nom:'MYTOKENPAY', col:'#ff5f9e', a:[ .64,-.16, .26], n:44,
  que:'Cobros con token · API y punto de venta',
  det:['mytokenpay-api en Heroku','mytokenpay-pos.com','pos-wallet, el punto de venta']},
 {id:'tarjeta',nom:'TARJETA',   col:'#5ee7c8', a:[ .40,-.46,-.30], n:40,
  que:'Tarjeta Visa virtual · CryptoMate',
  det:['24 tarjetas activas de 25 emitidas','Se fondea con ORIGEN convertido a USDT',
       'Requiere KYC aprobado','2 fondeos en toda la historia']},
 {id:'polygon',nom:'POLYGON',   col:'#8b7dff', a:[ .58, .40,-.34], n:38,
  que:'La red de salida · USDT para la tarjeta',
  det:['Pasarela de entrada: depositar USDT y recibir ORIGEN','Tesoro en Polygon envía el USDT',
       'Varios proveedores RPC con reserva automática','Alchemy quedó limitado: hoy va por publicnode']},
 {id:'chainl',nom:'CHAINLIST',  col:'#ff4d9d', a:[-.62, .34,-.12], n:36,
  que:'El registro público de cadenas',
  det:['#8593 · Orden Global Testnet, con RPC y explorador','#8594 · reserva del chainId 5550, incubating',
       'Esquema y prettier comprobados con sus propias herramientas',
       'Los chainId 5534, 5550 y 8532 estaban libres']},
 {id:'nodos', nom:'INFRAESTRUCTURA',col:'#7fb6d8',a:[-.30,-.50,-.34], n:48,
  que:'Las máquinas · AWS',
  det:['10 instancias encendidas · 523,71 USD en julio','6 t2.large en la cadena vieja',
       '4 máquinas en la de pruebas','Balanceador con chequeo /readiness',
       'IP elásticas fijas · arranque automático comprobado con reinicio',
       'Sin desperdicio: cero IP sueltas, cero discos huérfanos']},
 {id:'tesoro',nom:'TESORO',     col:'#e6eef5', a:[ .00,-.62, .34], n:34,
  que:'Precio, comisión y emisión',
  det:['ORIGEN: 0,01 USD fijo','Comisión: 0,01 ORIGEN por transacción, sea cual sea el monto',
       'La comisión va al tesoro; el gas va al validador',
       'Con 1 ORIGEN: 84 envíos nativos o 67 de token',
       'Emisión total: un billón de ORIGEN']},
];
const E={};for(const r of REG)E[r.id]={est:'ESPERA',met:'—',fuego:.12,mal:false,vivo:[]};

/* ═══ 2 · DIBUJO ══════════════════════════════════════════════════════════ */
const L=document.getElementById('lienzo'),cx=L.getContext('2d');
const F=document.getElementById('fondo'),fx=F.getContext('2d');
let W,H,DPR,cxp,cyp,esc;
function centro(){const an=W>900?W-270:W;cxp=an*.5;cyp=W>900?H*.5:H*.40;
  esc=Math.min(an,H)*(W>900?.50:.40);}
function medir(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of[L,F]){c.width=W*DPR;c.height=H*DPR;}centro();fondo();}
addEventListener('resize',medir);
function fondo(){fx.setTransform(DPR,0,0,DPR,0,0);fx.fillStyle='#010308';fx.fillRect(0,0,W,H);
  let s=7;const r=()=>((s=s*16807%2147483647)/2147483647);
  for(let i=0;i<190;i++){const a=r();fx.fillStyle=`rgba(190,215,240,${.04+a*.15})`;
    fx.fillRect(r()*W,r()*H,a>.95?1.5:1,a>.95?1.5:1);}}

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);}

/* nodos y aristas por región: la malla angular de la referencia */
const COMPACTA=.70;                    // acerca las regiones al centro
for(const r of REG){r.a=r.a.map(v=>v*COMPACTA);}
for(const r of REG){
  r.pts=[];
  for(let i=0;i<r.n;i++)r.pts.push([r.a[0]+gauss()*.115,r.a[1]+gauss()*.10,r.a[2]+gauss()*.115]);
  r.ar=[];
  for(let i=0;i<r.pts.length;i++){
    const d=[];
    for(let j=0;j<r.pts.length;j++){if(i===j)continue;
      const A=r.pts[i],B=r.pts[j];
      d.push([(A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2,j]);}
    d.sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<3;k++)if(d[k]&&d[k][1]>i)r.ar.push([i,d[k][1]]);
  }
}
/* destellos que radian desde el centro — el rasgo más marcado del vídeo */
const rayos=[];
for(let i=0;i<46;i++){
  const t=Math.random()*6.283,f=Math.acos(2*Math.random()-1);
  rayos.push({d:[Math.sin(f)*Math.cos(t),Math.cos(f)*.75,Math.sin(f)*Math.sin(t)],
    l:.85+Math.random()*1.15, v:.05+Math.random()*.12, fase:Math.random()});
}
const EJES=[['n5534','g5550'],['n5534','scan'],['n5534','m8532'],['g5550','m8532'],
 ['g5550','tesoro'],['wallet','gid'],['wallet','tarjeta'],['tarjeta','polygon'],
 ['wallet','n5534'],['pago','wallet'],['pago','gid'],['scan','m8532'],
 ['chainl','n5534'],['chainl','g5550'],['nodos','n5534'],['nodos','m8532'],
 ['tesoro','wallet'],['polygon','wallet'],['nodos','scan']];
const R=id=>REG.find(x=>x.id===id);
const chispas=[];

let rY=.5,rX=-.10,arr=null;
L.addEventListener('pointerdown',e=>{arr=[e.clientX,e.clientY];L.classList.add('girando');
  L.setPointerCapture(e.pointerId);});
L.addEventListener('pointermove',e=>{if(!arr)return;rY+=(e.clientX-arr[0])*.005;
  rX=Math.max(-.9,Math.min(.9,rX+(e.clientY-arr[1])*.003));arr=[e.clientX,e.clientY];});
L.addEventListener('pointerup',()=>{arr=null;L.classList.remove('girando');});

function pr(p){
  const c1=Math.cos(rY),s1=Math.sin(rY),c2=Math.cos(rX),s2=Math.sin(rX);
  let x=p[0]*c1+p[2]*s1,z=-p[0]*s1+p[2]*c1,y=p[1]*c2-z*s2;z=p[1]*s2+z*c2;
  const q=3.0/(3.0+z);
  return [cxp+x*esc*q,cyp-y*esc*q,q,z];
}
const etis={};
for(const r of REG){
  const d=document.createElement('div');d.className='eti';
  d.innerHTML=`<b style="color:${r.col};border-color:${r.col}66">${r.nom}</b><s>—</s>`;
  d.onclick=()=>abrirDet(r);document.body.appendChild(d);etis[r.id]=d;
}
let t0=performance.now();
function cuadro(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;if(!arr)rY+=dt*.10;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  const seg=t/1000;

  /* núcleo brillante */
  const g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,esc*.55);
  g.addColorStop(0,'rgba(215,240,255,.30)');g.addColorStop(.35,'rgba(120,180,230,.10)');
  g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;
  cx.fillRect(cxp-esc,cyp-esc,esc*2,esc*2);

  /* destellos radiales */
  cx.lineWidth=1;
  for(const y of rayos){
    y.fase=(y.fase+dt*y.v)%1;
    const br=Math.sin(y.fase*Math.PI);
    const A=pr([y.d[0]*.15,y.d[1]*.15,y.d[2]*.15]);
    const B=pr([y.d[0]*y.l,y.d[1]*y.l,y.d[2]*y.l]);
    const lg=cx.createLinearGradient(A[0],A[1],B[0],B[1]);
    lg.addColorStop(0,`rgba(215,240,255,${.42*br})`);
    lg.addColorStop(1,'rgba(160,200,240,0)');
    cx.strokeStyle=lg;cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
    cx.globalAlpha=br*.85;cx.fillStyle='#eaf4ff';
    cx.beginPath();cx.arc(B[0],B[1],2.1*B[2],0,7);cx.fill();
    cx.globalAlpha=br*.20;cx.beginPath();cx.arc(B[0],B[1],6*B[2],0,7);cx.fill();cx.globalAlpha=1;
  }

  /* axones entre sistemas */
  cx.lineWidth=.7;cx.strokeStyle='rgba(130,175,215,.14)';
  cx.beginPath();
  for(const[a,b]of EJES){const A=pr(R(a).a),B=pr(R(b).a);cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);}
  cx.stroke();

  /* la malla de cada región: un solo trazo por color */
  for(const r of REG){
    const e=E[r.id],col=e.mal?'#ff4d42':r.col;
    const lat=.45+.55*Math.sin(seg*1.9+r.a[0]*3);
    cx.lineWidth=.85;
    cx.strokeStyle=col;cx.globalAlpha=Math.min(.95,.26+.55*(e.fuego)*lat+.12);
    cx.beginPath();
    for(const[i,j]of r.ar){const A=pr(r.pts[i]),B=pr(r.pts[j]);
      cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);}
    cx.stroke();
    cx.fillStyle=col;
    for(const p of r.pts){const P=pr(p);
      cx.globalAlpha=Math.min(1,(.5+.5*e.fuego)*Math.max(.25,P[2]-.25));
      const s=1.8*P[2];cx.fillRect(P[0]-s/2,P[1]-s/2,s,s);}
    /* halo del núcleo de la región */
    const C=pr(r.a);
    const rg=cx.createRadialGradient(C[0],C[1],0,C[0],C[1],38*C[2]*(.6+e.fuego));
    rg.addColorStop(0,col+'77');rg.addColorStop(1,col+'00');
    cx.globalAlpha=.7;cx.fillStyle=rg;
    cx.fillRect(C[0]-40*C[2],C[1]-40*C[2],80*C[2],80*C[2]);
  }
  cx.globalAlpha=1;

  /* impulsos */
  for(const r of REG){const e=E[r.id];
    if(Math.random()<dt*(e.mal?7:e.fuego*4)){
      const s=EJES.filter(x=>x[0]===r.id||x[1]===r.id);
      if(s.length){const[a,b]=s[(Math.random()*s.length)|0];
        chispas.push({de:R(a).a,a:R(b).a,t:0,v:.55+Math.random()*.6,c:e.mal?'#ff4d42':r.col});}}}
  for(let i=chispas.length-1;i>=0;i--){const s=chispas[i];s.t+=dt*s.v;
    if(s.t>=1){chispas.splice(i,1);continue;}
    const P=pr([0,1,2].map(k=>s.de[k]+(s.a[k]-s.de[k])*s.t));
    const b=Math.sin(s.t*Math.PI);
    cx.globalAlpha=.95*b;cx.fillStyle=s.c;
    cx.beginPath();cx.arc(P[0],P[1],1.9*P[2],0,7);cx.fill();
    cx.globalAlpha=.22*b;cx.beginPath();cx.arc(P[0],P[1],5.5*P[2],0,7);cx.fill();}
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;

  /* etiquetas: se colocan y despues se separan para que no se pisen */
  const puestas=[];
  for(const r of REG){
    const P=pr(r.a),d=etis[r.id];
    if(P[3]>.62){d.classList.remove('viva');continue;}
    d.classList.add('viva');d.classList.toggle('mal',E[r.id].mal);
    const an=d.offsetWidth||150, al=d.offsetHeight||30;
    const izq=P[0]<cxp;
    let x=P[0]+(izq?-an-16:16)*P[2];
    let y=Math.max(58,Math.min(H-170,P[1]));
    puestas.push({d,x:Math.max(6,Math.min(W-an-6,x)),y,an,al,izq});
  }
  /* dos pasadas de separacion: basta para que no quede ninguna encima de otra */
  for(let paso=0;paso<4;paso++){
    puestas.sort((a,b)=>a.y-b.y);
    for(let i=1;i<puestas.length;i++){
      const A=puestas[i-1],B=puestas[i];
      const seSolapanX=!(B.x+B.an<A.x-10||B.x>A.x+A.an+10);
      const falta=(A.y+A.al+10)-B.y;
      if(seSolapanX&&falta>0){B.y+=falta;}
    }
  }
  for(const q of puestas){
    q.d.style.left=q.x+'px';
    q.d.style.top=Math.max(58,Math.min(H-150,q.y))+'px';
  }
  requestAnimationFrame(cuadro);
}

/* ═══ 3 · DATOS EN VIVO ═══════════════════════════════════════════════════ */
const RAIZ='0xd21e29ff024fd135656a54ee3581bda080f716836d0e0243f0e8ec3a0b277882';
const nf=n=>Number(n).toLocaleString('es-MX');
const $=s=>document.querySelector(s);
const V={};
async function rpc(ruta,m,p=[]){
  const r=await fetch(ruta,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p}),cache:'no-store'});
  const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result;}
function set(id,est,met,mal=false,fuego,vivo){
  const e=E[id];e.est=est;e.met=met;e.mal=mal;
  if(fuego!==undefined)e.fuego=fuego; if(vivo)e.vivo=vivo;
  const d=etis[id];if(d)d.querySelector('s').textContent=met;
  libro();}
let alt0=0;
async function verNucleo(){try{
  const[c,a,gp]=await Promise.all([rpc('/rpc','eth_chainId'),rpc('/rpc','eth_blockNumber'),
    rpc('/rpc','eth_gasPrice')]);
  if(parseInt(c,16)!==5534)throw new Error('chainId');
  const b=await rpc('/rpc','eth_getBlockByNumber',['latest',false]);
  const alt=parseInt(a,16),ed=Math.max(0,Date.now()/1000-parseInt(b.timestamp,16));
  V.b5534=alt;V.gas=parseInt(gp,16)/1e9;V.edad=Math.round(ed);
  if(alt>alt0&&alt0)E.n5534.fuego=1;
  setTimeout(()=>{if(!E.n5534.mal)E.n5534.fuego=.5;},1500);alt0=alt;
  set('n5534',ed>45?'ATRASADA':'EN VIVO',`${nf(alt)} bloques · ${V.gas} gwei`,ed>45,undefined,
    [['Bloque',nf(alt)],['Precio de gas',V.gas+' gwei'],['Último bloque','hace '+Math.round(ed)+' s'],
     ['Chain ID','5534']]);
 }catch(e){set('n5534','FALLA','sin respuesta',true);}}
async function verMemoria(){try{
  const a=await rpc('/rpc-vieja','eth_blockNumber');
  const b=await rpc('/rpc-vieja','eth_getBlockByNumber',['latest',false]);
  const q=b.stateRoot.toLowerCase()===RAIZ;V.b8532=parseInt(a,16);V.quieta=q;
  set('m8532',q?'CONGELADA':'¡SE MOVIÓ!',`${nf(V.b8532)} · ${q?'raíz intacta':'RAÍZ DISTINTA'}`,!q,.12,
   [['Bloque',nf(V.b8532)],['Raíz de estado',q?'idéntica a la del cierre':'DISTINTA — revisar'],
    ['Chain ID','8532']]);
 }catch(e){set('m8532','FALLA','sin respuesta',true);}}
async function verScan(){try{
  const j=await(await fetch('/explorador/block/totalBlock',{cache:'no-store'})).json();
  const t=parseInt(j.blockTotal||j.total||0);V.idx=t;
  const atras=V.b5534&&(V.b5534-t)>40;
  set('scan',atras?'ATRASADO':'INDEXANDO',`${nf(t)} bloques`,atras,.35,
    [['Bloques indexados',nf(t)],['Distancia a la punta',V.b5534?nf(Math.max(0,V.b5534-t)):'—']]);
 }catch(e){set('scan','FALLA','sin respuesta',true);}}
async function verSalud(ruta,id,est,met,fuego){try{
  const r=await fetch(ruta,{cache:'no-store'});if(!r.ok)throw 0;
  set(id,est,met,false,fuego);return true;
 }catch(e){set(id,'FALLA','no responde',true);return false;}}
async function verChainlist(){try{
  const[a,b]=await Promise.all([8593,8594].map(n=>fetch(
    'https://api.github.com/repos/ethereum-lists/chains/pulls/'+n,{cache:'no-store'})
    .then(r=>r.ok?r.json():null)));

  V.pr93=s(a);V.pr94=s(b);
  set('chainl',(a&&a.merged)||(b&&b.merged)?'FUSIONADO':'EN REVISIÓN',
    `#8593 ${V.pr93} · #8594 ${V.pr94}`,false,.3,
    [['#8593 · testnet 5534',V.pr93],['#8594 · reserva 5550',V.pr94]]);
 }catch(e){set('chainl','SIN DATOS','GitHub no responde',false,.15);}}
function verFijos(){
  set('g5550',I.genesisListo?'LISTA':'EN OBRA',

  set('nodos','ACTIVA','10 máquinas · 6 en la vieja',false,.2);

let I={precio:'0.01',comision:'0.01 ORIGEN',genesisListo:true,hechoHoy:[],pendiente:[]};

/* ═══ 5 · LA VOZ ══════════════════════════════════════════════════════════
   Se busca la voz más natural que tenga el aparato: primero las neurales de
   Microsoft y las de Google, después Mónica y Paulina de Apple. El usuario
   puede cambiarla en el selector; la elección se recuerda.
   Cada frase va suelta y con una pausa detrás: leer un párrafo entero de
   corrido es lo que hace que suene a robot. */
const BUENAS=[/Natural/i,/Neural/i,/Online/i,/Google/i,/Mónica|Monica/i,/Paulina/i,
  /Sabina/i,/Jorge/i,/Juan/i,/Helena/i,/Laura/i];
let voces=[],voz=null;
function cargarVoces(){
  voces=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  if(!voces.length)voces=speechSynthesis.getVoices();
  voces.sort((a,b)=>puntua(b)-puntua(a));
  const sel=$('#voces');sel.innerHTML='';
  voces.forEach((v,i)=>{const o=document.createElement('option');o.value=i;
    o.textContent=v.name.replace(/Microsoft |Google /,'').slice(0,26);sel.appendChild(o);});
  const guardada=localStorage.getItem('vozCerebro');
  const idx=guardada!==null&&voces[guardada]?+guardada:0;
  sel.value=idx;voz=voces[idx]||null;
}
function puntua(v){let p=0;BUENAS.forEach((re,i)=>{if(re.test(v.name))p+=100-i*4;});
  if(/es-MX|es-US/i.test(v.lang))p+=25; if(/es-ES/i.test(v.lang))p+=12;
  if(v.localService===false)p+=30; return p;}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=cargarVoces;cargarVoces();}
$('#voces').addEventListener('change',e=>{voz=voces[e.target.value]||null;
  localStorage.setItem('vozCerebro',e.target.value);
  decir([{t:'Voz cambiada. Así sueno.',p:0}]);});

/* el guion: ordenado, con pausas, y sin siglas que se lean mal */
const dic=n=>String(Math.round(Number(n)));  // numero limpio para hablar
function guion(){
  const f=fallas(),L=[];
  const P=(t,p=380)=>L.push({t,p});
  const h=new Date().getHours();
  P(h<12?'Buenos días, José.':h<19?'Buenas tardes, José.':'Buenas noches, José.',550);
  P('Soy el cerebro de Orden Global. Este es el parte del día.',650);

  P('Primero, el estado general.',420);
  if(!f.length)P('Los doce sistemas del ecosistema están en verde. No hay ninguna falla.',600);
  else{P(`Atención. Hay ${f.length===1?'un sistema':f.length+' sistemas'} con falla.`,420);
    f.forEach(r=>P(`${r.nom.toLowerCase()}: ${E[r.id].est.toLowerCase()}.`,340));P('',400);}

  P('Ahora, las cadenas.',420);
  if(V.b5534)P(`La cadena de pruebas está en vivo, en el bloque ${dic(V.b5534)}, con el gas en ${V.gas} gigawei. El último bloque llegó hace ${V.edad} segundos.`,600);
  if(V.b8532)P(V.quieta
    ?`La cadena vieja sigue congelada, en el bloque ${dic(V.b8532)}, con la raíz de estado idéntica a la del cierre. Todo listo para migrar.`
    :`Atención: la cadena vieja se movió. La raíz de estado ya no coincide con la del cierre. Hay que rehacer el trabajo de ranuras.`,600);
  if(I.genesisListo)P('El génesis de la cinco mil quinientos cincuenta está construido y juzgado, con cero diferencias contra la cadena vieja. Está respaldado fuera del servidor.',650);

  P('Los productos.',420);
  P(`Veta Wallet, en línea, versión ${I.versionBackend||''}. Cuatrocientos treinta y cinco usuarios.`,450);
  if(V.idx)P(`El explorador va indexando: ${dic(V.idx)} bloques.`,450);
  P('Genesis ID, MyTokenPay y las tarjetas, activos.',450);

  P('El dinero.',420);
  P(`El ORIGEN está fijado en un centavo de dólar. La comisión es de cero punto cero uno ORIGEN por transacción, sea cual sea el monto, y ${I.comisionEncendida?'está encendida':'está lista pero todavía apagada'}.`,600);
  if(V.pr93)P(`En el registro público, la solicitud de la red de pruebas está ${V.pr93}, y la de la red principal, ${V.pr94}.`,550);

  if(I.hechoHoy&&I.hechoHoy.length){
    P('Esto es lo que se hizo hoy.',450);
    I.hechoHoy.forEach(x=>P(limpiar(x)+'.',300));
    P('',350);
  }
  if(I.pendiente&&I.pendiente.length){
    P('Y esto es lo que falta.',450);
    I.pendiente.forEach(x=>P(limpiar(x)+'.',300));
  }
  P(f.length?'Fin del parte. Hay fallas que revisar.':'Fin del parte. Todo bajo control.',0);
  return L.filter(x=>x.t);
}
/* que la voz no lea símbolos ni siglas raras */
function limpiar(t){
  return String(t)
    .replace(/·/g,',').replace(/—/g,',').replace(/\//g,' de ')
    .replace(/\bgwei\b/gi,'gigawei').replace(/\bRPC\b/g,'erre pe ce')
    .replace(/\bTLS\b/g,'te ele ese').replace(/\bAPI\b/g,'a pe i')
    .replace(/\bS3\b/g,'ese tres').replace(/\bAKIA\b/g,'a ka i a')
    .replace(/\bKYC\b/g,'ka i ce').replace(/\bSSO\b/g,'ese ese o')
    .replace(/\bPUSH0\b/gi,'push cero').replace(/\bmd5\s*\S+/gi,'')
    .replace(/#(\d+)/g,'número $1').replace(/\bv(\d+)\b/g,'versión $1')
    .replace(/\b[A-Z][A-Z0-9_]{3,}\b/g,x=>x.replace(/_/g,' ').toLowerCase())
    .replace(/=/g,' igual a ').replace(/\s+,/g,',').replace(/\(\s*/g,'(').replace(/\s*\)/g,')')
    .replace(/(\d)\.(\d{3})\b/g,'$1$2')
    .replace(/0x[0-9a-fA-F]{6,}…?/g,'una dirección').replace(/\s{2,}/g,' ').trim();
}
let hablando=false,cola=[];
function decir(lista){
  if(!('speechSynthesis' in window)){abrirTexto();return;}
  speechSynthesis.cancel();cola=lista.slice();hablando=true;
  $('#btnVoz').classList.add('hablando');siguiente();
}
function siguiente(){
  if(!hablando||!cola.length){parar();return;}
  const {t,p}=cola.shift();
  const u=new SpeechSynthesisUtterance(t);
  if(voz)u.voice=voz;
  u.lang=(voz&&voz.lang)||'es-MX';
  u.rate=.97; u.pitch=1.0; u.volume=1;   /* natural: ni grave ni acelerado */
  u.onstart=()=>{$('#subt').textContent=t;};
  u.onend=()=>{ if(hablando) setTimeout(siguiente,p); };
  u.onerror=()=>{ if(hablando) setTimeout(siguiente,120); };
  speechSynthesis.speak(u);
}
function parar(){hablando=false;cola=[];speechSynthesis.cancel();
  $('#btnVoz').classList.remove('hablando');$('#subt').textContent='';}
$('#btnVoz').addEventListener('click',()=>{hablando?parar():decir(guion());});

/* ═══ 6 · DETALLE ═════════════════════════════════════════════════════════ */
function abrirDet(r){
  const e=E[r.id];
  $('#detTit').textContent=r.nom;$('#detTit').style.color=r.col;
  $('#detSub').textContent=r.que;
  const c=$('#detCuerpo');c.innerHTML='';
  const est=document.createElement('div');est.className='kv';
  est.innerHTML=`<b>Estado</b><span style="color:${e.mal?'var(--rojo)':r.col}">${e.est}</span>`;
  c.appendChild(est);
  if(e.vivo&&e.vivo.length){const h=document.createElement('h4');h.textContent='EN VIVO';c.appendChild(h);
    for(const[k,v]of e.vivo){const d=document.createElement('div');d.className='kv';
      d.innerHTML=`<b>${k}</b><span>${v}</span>`;c.appendChild(d);}}
  const h=document.createElement('h4');h.textContent='QUÉ HAY DENTRO';c.appendChild(h);
  for(const x of r.det){const li=document.createElement('li');li.textContent=x;c.appendChild(li);}
  $('#det').classList.add('abierto');
}
function abrirTexto(){
  $('#detTit').textContent='PARTE DEL DÍA';$('#detTit').style.color='var(--cian)';
  $('#detSub').textContent=(I.fecha||'')+' · GENERADO POR EL CEREBRO';
  const c=$('#detCuerpo');c.innerHTML='';
  const sec=(t,items,cl)=>{if(!items.length)return;
    const h=document.createElement('h4');h.textContent=t;c.appendChild(h);
    for(const x of items){const li=document.createElement('li');if(cl)li.className=cl;
      li.textContent=x;c.appendChild(li);}};
  sec('FALLAS',fallas().map(r=>`${r.nom} — ${E[r.id].est} (${E[r.id].met})`),'malo');
  const v=[];
  if(V.b5534)v.push(`Cadena 5534: bloque ${nf(V.b5534)} · gas ${V.gas} gwei · último hace ${V.edad}s`);
  if(V.b8532)v.push(`Cadena 8532: bloque ${nf(V.b8532)} · ${V.quieta?'congelada, raíz intacta':'¡RAÍZ DISTINTA!'}`);
  if(V.idx)v.push(`Ordenscan: ${nf(V.idx)} bloques indexados`);
  if(V.pr93)v.push(`Chainlist: #8593 ${V.pr93} · #8594 ${V.pr94}`);
  v.push(`ORIGEN $${I.precio} · comisión ${I.comision} ${I.comisionEncendida?'(encendida)':'(lista, apagada)'}`);
  sec('AHORA MISMO',v);
  sec('HECHO HOY',I.hechoHoy||[]);
  sec('PENDIENTE',I.pendiente||[]);
  $('#det').classList.add('abierto');
}
$('#btnTexto').addEventListener('click',abrirTexto);
$('#cerrarDet').addEventListener('click',()=>$('#det').classList.remove('abierto'));
$('#det').addEventListener('click',e=>{if(e.target.id==='det')e.target.classList.remove('abierto')});

/* ═══ 7 · LIBRO Y RELOJ ═══════════════════════════════════════════════════ */
function libro(){
  const l=$('#libro');l.querySelectorAll('.fila').forEach(f=>f.remove());
  let mal=0,ok=0;
  for(const r of REG){const e=E[r.id];if(e.mal)mal++;else if(e.est!=='ESPERA')ok++;
    const f=document.createElement('div');f.className='fila'+(e.mal?' mal':'');
    f.onclick=()=>abrirDet(r);
    f.innerHTML=`<span class="cn" style="background:${e.mal?'transparent':r.col};border:1px solid ${r.col}"></span>
      <span><span class="nom" style="color:${r.col}">${r.nom}</span><span class="est">${e.est}</span></span>
      <span class="met">${e.met}</span>`;
    l.appendChild(f);}
  $('#cuenta').textContent=`${ok} / ${REG.length}`;
  $('#vivo').style.borderColor=mal?'rgba(255,77,66,.6)':'rgba(62,232,154,.45)';
  $('#vivo').querySelector('.p').style.background=mal?'var(--rojo)':'#3ee89a';
  $('#vivo').querySelector('.p').style.boxShadow='0 0 8px '+(mal?'var(--rojo)':'#3ee89a');
}
