<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EL CEREBRO · Orden Global</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   EL CEREBRO · Orden Global — núcleo de control
   Un cerebro de partículas donde cada región ES un sistema real, con sus
   datos en vivo, y una voz que da el parte del día. Todo lo que se ve aquí
   sale de la infraestructura de verdad: nada es decorado.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#020409; --tinta:#dfe9f0; --mut:#5d7284; --faint:#31414f;
  --panel:rgba(5,12,20,.82); --borde:rgba(110,160,200,.16);
  --cian:#3fd8ff; --oro:#e8c15c; --verde:#3ee89a; --ambar:#f0a835;
  --rosa:#ff5f9e; --violeta:#a986ff; --rojo:#ff5348; --naranja:#ff8a3d;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Cascadia Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--tinta);font:12px/1.5 var(--mono);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#fondo,#lienzo{position:fixed;inset:0;display:block}
#lienzo{touch-action:none;cursor:grab}
#lienzo.girando{cursor:grabbing}

/* ── chips de región (flotan sobre el lienzo, el JS los coloca) ─────────── */
.chip{position:fixed;z-index:5;pointer-events:none;transform:translate(-4px,-50%);
  opacity:0;transition:opacity .8s}
.chip.viva{opacity:1}
.chip .tit{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  padding:2px 7px;border:1px solid;background:rgba(2,4,9,.85)}
.chip .dat{display:block;font-size:9px;color:var(--mut);letter-spacing:.06em;
  background:rgba(2,4,9,.75);padding:1px 7px;border-left:1px solid var(--faint);
  white-space:nowrap;max-width:186px;overflow:hidden;text-overflow:ellipsis}
.chip.mal .tit{color:var(--rojo)!important;border-color:var(--rojo)!important;
  animation:alarma 1.1s steps(2) infinite}
@keyframes alarma{50%{opacity:.35}}

/* ── HUD: esquinas ──────────────────────────────────────────────────────── */
.hud{position:fixed;z-index:10;letter-spacing:.1em}
#hudNO{top:max(14px,env(safe-area-inset-top));left:18px}
#hudNO h1{font-size:15px;font-weight:800;letter-spacing:.3em;color:var(--tinta)}
#hudNO h1 i{font-style:normal;color:var(--cian)}
#hudNO .sub{font-size:8.5px;color:var(--mut);letter-spacing:.32em;margin-top:2px}
#hudNO .con{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:9px;color:var(--mut)}
#punto{width:6px;height:6px;border-radius:50%;background:var(--verde);
  box-shadow:0 0 9px var(--verde);animation:latido 2.2s ease-in-out infinite}
@keyframes latido{50%{opacity:.25}}
body.enFalla #punto{background:var(--rojo);box-shadow:0 0 9px var(--rojo)}
#hudNE{top:max(14px,env(safe-area-inset-top));right:18px;text-align:right}
#reloj{font-size:19px;color:var(--tinta);font-weight:300}
#fecha{font-size:8.5px;color:var(--mut);letter-spacing:.22em;text-transform:uppercase}

/* ── libro de estados (derecha) ─────────────────────────────────────────── */
#libro{position:fixed;z-index:10;right:18px;top:50%;transform:translateY(-50%);
  width:228px;border:1px solid var(--borde);background:var(--panel);
  backdrop-filter:blur(10px);padding:10px 0 4px}
#libro h3{font-size:8.5px;letter-spacing:.3em;color:var(--mut);padding:0 12px 7px;
  border-bottom:1px solid var(--borde)}
.fila{display:flex;align-items:center;gap:8px;padding:5.5px 12px;
  border-bottom:1px solid rgba(110,160,200,.06)}
.fila:last-child{border-bottom:0}
.fila .cn{width:7px;height:7px;flex:none;border:1px solid;transform:rotate(45deg)}
.fila .nom{font-size:9.5px;letter-spacing:.1em;font-weight:700}
.fila .met{font-size:8.5px;color:var(--mut);margin-left:auto;text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums;max-width:104px;
  overflow:hidden;text-overflow:ellipsis}
.fila .est{display:block;font-size:8px;letter-spacing:.14em}
.fila.mal .est,.fila.mal .nom{color:var(--rojo)!important}
.fila.mal .cn{animation:alarma 1.1s steps(2) infinite}

/* ── consola inferior ───────────────────────────────────────────────────── */
#consola{position:fixed;z-index:10;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:8px}
#botones{display:flex;gap:10px}
.tecla{display:flex;align-items:center;gap:9px;border:1px solid var(--borde);
  background:var(--panel);backdrop-filter:blur(10px);padding:11px 22px;
  font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--tinta)}
.tecla:active{transform:scale(.97)}
#btnInforme{border-color:rgba(63,216,255,.5);color:var(--cian);
  box-shadow:0 0 24px rgba(63,216,255,.12)}
#btnInforme.hablando{border-color:var(--rojo);color:var(--rojo)}
#onda{display:inline-flex;gap:2.5px;align-items:flex-end;height:12px}
#onda i{width:2.5px;background:currentColor;height:3px}
.hablando #onda i{animation:onda .7s ease-in-out infinite}
.hablando #onda i:nth-child(2){animation-delay:.12s}
.hablando #onda i:nth-child(3){animation-delay:.24s}
.hablando #onda i:nth-child(4){animation-delay:.36s}
@keyframes onda{50%{height:12px}}
#pista{font-size:8.5px;color:var(--faint);letter-spacing:.2em;text-transform:uppercase}
#subt{max-width:min(680px,88vw);text-align:center;font-size:11px;color:var(--cian);
  min-height:17px;text-shadow:0 0 14px rgba(63,216,255,.4);letter-spacing:.04em}

/* ── el parte escrito ───────────────────────────────────────────────────── */
#parte{position:fixed;z-index:20;inset:0;display:none;place-items:center;
  background:rgba(2,4,9,.72);backdrop-filter:blur(6px)}
#parte.abierto{display:grid}
#parte article{width:min(620px,92vw);max-height:82vh;overflow-y:auto;
  border:1px solid var(--borde);background:var(--panel);padding:26px 28px}
#parte h2{font-size:11px;letter-spacing:.3em;color:var(--cian);margin-bottom:4px}
#parte .cuando{font-size:9px;color:var(--mut);letter-spacing:.18em;margin-bottom:16px}
#parte h4{font-size:9px;letter-spacing:.24em;color:var(--oro);margin:16px 0 6px}
#parte li,#parte p{font-size:11.5px;line-height:1.75;color:var(--tinta);list-style:none}
#parte li::before{content:"▸ ";color:var(--faint)}
#parte li.malo::before{content:"✗ ";color:var(--rojo)}
#parte li.malo{color:var(--rojo)}
#cerrarParte{position:sticky;float:right;top:0;color:var(--mut);font-size:16px;padding:2px 8px}

@media (max-width:640px){
  #fecha{display:none}
  #reloj{font-size:14px}
  #hudNO h1{font-size:13px}
}
@media (max-width:900px){
  #libro{top:auto;bottom:118px;transform:none;right:12px;left:12px;width:auto;
    display:grid;grid-template-columns:1fr 1fr;padding:6px 0}
  #libro h3{grid-column:1/-1}
  .fila .met{display:none}
  #subt{font-size:10px}
}
</style>
</head>
<body>
<canvas id="fondo"></canvas>
<canvas id="lienzo"></canvas>

<div class="hud" id="hudNO">
  <h1>EL CEREBRO <i>▮</i></h1>
  <div class="sub">ORDEN GLOBAL · NÚCLEO DE CONTROL</div>
  <div class="con"><span id="punto"></span><span id="conTexto">SINCRONIZANDO…</span></div>
</div>
<div class="hud" id="hudNE">
  <div id="reloj">--:--:--</div>
  <div id="fecha">—</div>
</div>

<aside id="libro"><h3>SISTEMAS</h3></aside>

<div id="consola">
  <div id="subt"></div>
  <div id="botones">
    <button class="tecla" id="btnInforme"><span id="onda"><i></i><i></i><i></i><i></i></span> INFORME DEL DÍA</button>
    <button class="tecla" id="btnParte">TEXTO</button>
  </div>
  <div id="pista">la voz necesita un toque · los navegadores no dejan hablar solos</div>
</div>

<div id="parte"><article>
  <button id="cerrarParte">✕</button>
  <h2>PARTE DEL DÍA</h2>
  <div class="cuando" id="parteCuando"></div>
  <div id="parteCuerpo"></div>
</article></div>

<script>
'use strict';
/* ═══ 1 · LAS REGIONES: cada una es un sistema real ═══════════════════════
   ancla: posición anatómica en el cerebro (x derecha, y arriba, z frente). */
const REGIONES=[
 {id:'nucleo',  nom:'NÚCLEO 5534',  color:'#3fd8ff', ancla:[ .42, .38, .80], n:190},
 {id:'genesis', nom:'GÉNESIS 5550', color:'#e8c15c', ancla:[-.44, .42, .74], n:170},
 {id:'wallet',  nom:'VETA WALLET',  color:'#3ee89a', ancla:[ .52, .72,-.05], n:160},
 {id:'scan',    nom:'ORDENSCAN',    color:'#a986ff', ancla:[-.50, .30,-.72], n:150},
 {id:'chainlist',nom:'CHAINLIST',   color:'#ff5f9e', ancla:[ .84,-.02, .12], n:130},
 {id:'gid',     nom:'GENESIS ID',   color:'#ff8a3d', ancla:[-.84,-.02, .12], n:130},
 {id:'memoria', nom:'MEMORIA 8532', color:'#f0a835', ancla:[ .02,-.12,-.10], n:150},
 {id:'tesoro',  nom:'TESORO',       color:'#dfe9f0', ancla:[ .00,-.58,-.62], n:110},
];
const E={}; // estado por región: {estado, met, extra, disparo}
for(const r of REGIONES) E[r.id]={estado:'ESPERA', met:'—', disparo:.25, mal:false};

/* ═══ 2 · EL CEREBRO DE PARTÍCULAS ════════════════════════════════════════ */
const lienzo=document.getElementById('lienzo'), cx=lienzo.getContext('2d');
const fondo=document.getElementById('fondo'), fx=fondo.getContext('2d');
let W,H,DPR;
function medir(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of [lienzo,fondo]){c.width=W*DPR;c.height=H*DPR;}
  pintarFondo();}
addEventListener('resize',medir);

function centroCerebro(){const ancho=W>900?W-260:W;
  return [ancho*.5, W>640?H*.5:H*.42, Math.min(ancho,H)*(W>640?.36:.33)];}
function pintarFondo(){ // estrellas + nebulosa, se pintan una vez
  fx.setTransform(DPR,0,0,DPR,0,0); fx.fillStyle='#020409'; fx.fillRect(0,0,W,H);
  let s=9;const rnd=()=>((s=s*16807%2147483647)/2147483647);
  for(let i=0;i<170;i++){const a=rnd();fx.fillStyle=`rgba(180,210,235,${.05+a*.16})`;
    fx.fillRect(rnd()*W,rnd()*H,a>.94?1.6:1,a>.94?1.6:1);}
  const [cxp,cyp,esc]=centroCerebro();
  const g=fx.createRadialGradient(cxp,cyp,0,cxp,cyp,esc*1.9);
  g.addColorStop(0,'rgba(40,90,140,.16)');g.addColorStop(.55,'rgba(25,55,95,.07)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  fx.fillStyle=g;fx.fillRect(0,0,W,H);
}
/* un destello pre-dibujado por color: es lo que hace brillar las regiones */
const destellos={};
function destello(color){
  if(destellos[color])return destellos[color];
  const c=document.createElement('canvas');c.width=c.height=32;
  const g=c.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
  r.addColorStop(0,color);r.addColorStop(.25,color+'aa');
  r.addColorStop(.6,color+'22');r.addColorStop(1,color+'00');
  g.fillStyle=r;g.fillRect(0,0,32,32);
  return destellos[color]=c;
}

/* la forma: dos hemisferios con surco central, algo más anchos que altos */
function dentro(p){const [x,y,z]=p;
  const g=1-Math.min(1,Math.abs(x)*9)*Math.max(0,y)*.35; // surco sagital
  return (x*x)/(1.15*1.15)+(y*y)/((.92*g)*(.92*g))+(z*z)/(1.05*1.05)<=1;}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

const puntos=[]; // {p:[x,y,z], r:region|null, fase}
for(const r of REGIONES){
  let hechos=0,intentos=0;
  while(hechos<r.n&&intentos++<4000){
    const p=[r.ancla[0]+gauss()*.24,r.ancla[1]+gauss()*.20,r.ancla[2]+gauss()*.24];
    if(dentro(p)){puntos.push({p,r,fase:Math.random()*7});hechos++;}
  }
}
for(let i=0;i<420;i++){ // polvo neuronal neutro, da volumen al cerebro
  const p=[(Math.random()*2-1)*1.15,(Math.random()*2-1)*.92,(Math.random()*2-1)*1.05];
  if(dentro(p))puntos.push({p,r:null,fase:Math.random()*7});
}
/* sinapsis: dentro de cada región, cada punto se ata a su vecino más cercano */
const sinapsis=[];
for(const r of REGIONES){
  const mios=puntos.filter(q=>q.r===r);
  for(let i=0;i<mios.length;i+=2){
    let mejor=null,d0=1e9;
    for(let j=0;j<mios.length;j++){if(i===j)continue;
      const a=mios[i].p,b=mios[j].p;
      const d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
      if(d<d0){d0=d;mejor=mios[j];}}
    if(mejor&&d0<.09)sinapsis.push({a:mios[i],b:mejor,r});
  }
}
/* axones entre regiones: por ellos viajan los impulsos */
const AXONES=[['nucleo','genesis'],['nucleo','wallet'],['nucleo','scan'],
 ['nucleo','memoria'],['genesis','memoria'],['genesis','tesoro'],['wallet','gid'],
 ['wallet','tesoro'],['scan','memoria'],['chainlist','nucleo'],['chainlist','genesis'],
 ['gid','nucleo'],['memoria','tesoro']];
const eje=id=>REGIONES.find(r=>r.id===id);
const impulsos=[]; // {de,a,t,vel,color}

let rotY=.6, rotX=-.12, arrastre=null, girado=0;
lienzo.addEventListener('pointerdown',e=>{arrastre=[e.clientX,e.clientY];girado=0;
  lienzo.classList.add('girando');lienzo.setPointerCapture(e.pointerId);});
lienzo.addEventListener('pointermove',e=>{if(!arrastre)return;
  rotY+=(e.clientX-arrastre[0])*.005; rotX+=(e.clientY-arrastre[1])*.003;
  rotX=Math.max(-.9,Math.min(.9,rotX)); girado=1; arrastre=[e.clientX,e.clientY];});
lienzo.addEventListener('pointerup',()=>{arrastre=null;lienzo.classList.remove('girando');});

function proyectar(p,ry,rx,cxp,cyp,esc){
  const c1=Math.cos(ry),s1=Math.sin(ry),c2=Math.cos(rx),s2=Math.sin(rx);
  let x=p[0]*c1+p[2]*s1, z=-p[0]*s1+p[2]*c1, y=p[1]*c2-z*s2; z=p[1]*s2+z*c2;
  const per=3.1/(3.1+z);
  return [cxp+x*esc*per, cyp-y*esc*per, per, z];
}

const chips={};
for(const r of REGIONES){
  const d=document.createElement('div');d.className='chip';
  d.innerHTML=`<span class="tit" style="color:${r.color};border-color:${r.color}55">${r.nom}</span><span class="dat">…</span>`;
  document.body.appendChild(d);chips[r.id]=d;
}

let t0=performance.now();
function cuadro(t){
  const dt=Math.min(.05,(t-t0)/1000);t0=t;
  if(!arrastre)rotY+=dt*.11;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  const [cxp,cyp,esc]=centroCerebro();
  const seg=t/1000;

  cx.globalCompositeOperation='lighter';
  /* sinapsis de región */
  cx.lineWidth=.6;
  for(const s of sinapsis){
    const e=E[s.r.id];
    const A=proyectar(s.a.p,rotY,rotX,cxp,cyp,esc),B=proyectar(s.b.p,rotY,rotX,cxp,cyp,esc);
    const prof=(A[2]+B[2])/2;
    cx.strokeStyle=(e.mal?'#ff5348':s.r.color)+'';
    cx.globalAlpha=.07+prof*.13*(0.4+e.disparo);
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }
  /* axones */
  cx.lineWidth=.8;
  for(const [a,b] of AXONES){
    const A=proyectar(eje(a).ancla,rotY,rotX,cxp,cyp,esc),B=proyectar(eje(b).ancla,rotY,rotX,cxp,cyp,esc);
    cx.strokeStyle='#7fb6d8';cx.globalAlpha=.05;
    cx.beginPath();cx.moveTo(A[0],A[1]);cx.lineTo(B[0],B[1]);cx.stroke();
  }
  /* partículas: cada una es un destello del color de su región */
  for(const q of puntos){
    const P=proyectar(q.p,rotY,rotX,cxp,cyp,esc);
    const e=q.r?E[q.r.id]:null;
    const lat=.55+.45*Math.sin(seg*2.1+q.fase);
    if(q.r){
      const base=e.mal?'#ff5348':q.r.color;
      const alfa=(.30+.55*lat*(.35+e.disparo))*Math.max(.18,P[2]-.3);
      const d=destello(base), tam=(4.5+3.5*lat)*P[2];
      cx.globalAlpha=Math.min(.95,alfa);
      cx.drawImage(d,P[0]-tam/2,P[1]-tam/2,tam,tam);
    }else{
      cx.globalAlpha=.12*Math.max(.15,P[2]-.35);
      cx.fillStyle='#5f7f98';
      cx.fillRect(P[0],P[1],P[2],P[2]);
    }
  }
  /* impulsos que viajan por los axones */
  for(const r of REGIONES){const e=E[r.id];
    if(Math.random()<dt*(e.mal?6:e.disparo*3.2)){
      const salidas=AXONES.filter(x=>x[0]===r.id||x[1]===r.id);
      if(salidas.length){const [a,b]=salidas[Math.floor(Math.random()*salidas.length)];
        impulsos.push({de:eje(a).ancla,a:eje(b).ancla,t:0,vel:.5+Math.random()*.7,
          color:e.mal?'#ff5348':r.color});}}}
  for(let i=impulsos.length-1;i>=0;i--){const im=impulsos[i];im.t+=dt*im.vel;
    if(im.t>=1){impulsos.splice(i,1);continue;}
    const p=[0,1,2].map(k=>im.de[k]+(im.a[k]-im.de[k])*im.t);
    const P=proyectar(p,rotY,rotX,cxp,cyp,esc);
    cx.globalAlpha=.9*Math.sin(im.t*Math.PI);cx.fillStyle=im.color;
    cx.beginPath();cx.arc(P[0],P[1],1.8*P[2],0,7);cx.fill();
    cx.globalAlpha=.25*Math.sin(im.t*Math.PI);
    cx.beginPath();cx.arc(P[0],P[1],4.5*P[2],0,7);cx.fill();
  }
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;

  /* chips: siguen a su región, con conector */
  cx.strokeStyle='rgba(150,190,220,.35)';cx.lineWidth=1;
  for(const r of REGIONES){
    const P=proyectar(r.ancla,rotY,rotX,cxp,cyp,esc);
    const izq=P[0]<cxp, dx=izq?-92:92;
    let x=P[0]+dx*P[2], y=P[1]-26*P[2];
    const d=chips[r.id];
    const anchoChip=160;
    let lx=izq? x-anchoChip : x;
    lx=Math.max(8,Math.min(W-anchoChip-8,lx));
    y=Math.max(64,Math.min(H-150,y));
    d.style.left=lx+'px'; d.style.top=y+'px';
    x=izq? lx+anchoChip : lx;
    d.classList.toggle('mal',E[r.id].mal);
    if(P[3]<.55){d.classList.add('viva');
      cx.globalAlpha=.4;cx.beginPath();cx.moveTo(P[0],P[1]);cx.lineTo(x,y);cx.stroke();cx.globalAlpha=1;
    } else d.classList.remove('viva');   // la región quedó detrás del cerebro
  }
  requestAnimationFrame(cuadro);
}

/* ═══ 3 · LOS DATOS DE VERDAD ═════════════════════════════════════════════
   Todo entra por el propio dominio (proxies de Caddy): /rpc es la 5534,
   /rpc-vieja la 8532, /explorador el ordenscan, /salud-* los backends. */
const RAIZ_CIERRE='0xd21e29ff024fd135656a54ee3581bda080f716836d0e0243f0e8ec3a0b277882';
const nf=n=>Number(n).toLocaleString('es-MX');
const $=s=>document.querySelector(s);

async function rpc(ruta,metodo,params=[]){
  const r=await fetch(ruta,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:metodo,params}),cache:'no-store'});
  const j=await r.json(); if(j.error)throw new Error(j.error.message); return j.result;
}
function fija(id,estado,met,mal=false,disparo){
  E[id].estado=estado;E[id].met=met;E[id].mal=mal;
  if(disparo!==undefined)E[id].disparo=disparo;
  const chip=chips[id]; if(chip)chip.querySelector('.dat').textContent=met;
  pintarLibro();
}
const V={}; // valores vivos para el informe

let alturaPrev=0;
async function mirarNucleo(){
  try{
    const [cad,alt,gas]=await Promise.all([rpc('/rpc','eth_chainId'),
      rpc('/rpc','eth_blockNumber'),rpc('/rpc','eth_gasPrice')]);
    if(parseInt(cad,16)!==5534)throw new Error('chainId '+parseInt(cad,16));
    const b=await rpc('/rpc','eth_getBlockByNumber',['latest',false]);
    const altura=parseInt(alt,16), edad=Math.max(0,Date.now()/1000-parseInt(b.timestamp,16));
    V.altura5534=altura;V.gas=parseInt(gas,16)/1e9;V.edad=Math.round(edad);
    const atras=edad>45;
    if(altura>alturaPrev&&alturaPrev)E.nucleo.disparo=1;   // ¡bloque nuevo!
    setTimeout(()=>{if(!E.nucleo.mal)E.nucleo.disparo=.55;},1600);
    alturaPrev=altura;
    fija('nucleo',atras?'ATRASADA':'EN VIVO',
      `bloque ${nf(altura)} · ${V.gas} gwei`,atras,atras?undefined:.55);
  }catch(e){fija('nucleo','FALLA','sin respuesta',true);}
}
async function mirarMemoria(){
  try{
    const alt=await rpc('/rpc-vieja','eth_blockNumber');
    const b=await rpc('/rpc-vieja','eth_getBlockByNumber',['latest',false]);
    const quieta=b.stateRoot.toLowerCase()===RAIZ_CIERRE;
    V.altura8532=parseInt(alt,16);V.quieta=quieta;
    fija('memoria',quieta?'CONGELADA':'¡SE MOVIÓ!',
      `bloque ${nf(V.altura8532)} · ${quieta?'raíz intacta':'RAÍZ DISTINTA'}`,!quieta,.2);
  }catch(e){fija('memoria','FALLA','sin respuesta',true);}
}
async function mirarScan(){
  try{
    const j=await(await fetch('/explorador/block/totalBlock',{cache:'no-store'})).json();
    const total=parseInt(j.blockTotal||j.total||0);
    V.indexados=total;
    const atras=V.altura5534&&(V.altura5534-total)>40;
    fija('scan',atras?'ATRASADO':'INDEXANDO',`${nf(total)} bloques`,atras,.4);
  }catch(e){fija('scan','FALLA','sin respuesta',true);}
}
async function mirarWallet(){
  try{const r=await fetch('/salud-wallet',{cache:'no-store'});
    if(!r.ok)throw 0; V.wallet=true;
    fija('wallet','EN LÍNEA',`v${INF.versionBackend||'—'} · precio $${INF.precio}`,false,.45);
  }catch(e){V.wallet=false;fija('wallet','FALLA','no responde',true);}
}
async function mirarGid(){
  try{const r=await fetch('/salud-genesis',{cache:'no-store'});
    if(!r.ok)throw 0;fija('gid','EN LÍNEA','KYC · SSO · puente',false,.35);
  }catch(e){fija('gid','FALLA','no responde',true);}
}
async function mirarChainlist(){
  try{
    const [a,b]=await Promise.all([8593,8594].map(n=>
      fetch('https://api.github.com/repos/ethereum-lists/chains/pulls/'+n,
        {cache:'no-store'}).then(r=>r.ok?r.json():null)));
    const est=p=>!p?'?':p.merged?'FUSIONADO':p.state==='open'?'abierto':'cerrado';
    V.pr93=est(a);V.pr94=est(b);
    const fusion=(a&&a.merged)||(b&&b.merged);
    fija('chainlist',fusion?'FUSIONADO':'EN REVISIÓN',
      `#8593 ${V.pr93} · #8594 ${V.pr94}`,false,.35);
  }catch(e){fija('chainlist','SIN DATOS','GitHub no responde',false,.2);}
}
function mirarFijos(){
  fija('genesis',INF.genesisListo?'LISTA':'EN OBRA',
    INF.genesisListo?'juez: 0 diferencias · Shanghai':'construyendo',false,.5);
  fija('tesoro','FIJADO',`ORIGEN $${INF.precio} · comisión ${INF.comision}`,false,.3);
}

/* ═══ 4 · EL INFORME (informe.json lo escribe el equipo cada día) ═════════ */
let INF={precio:'0.01',comision:'0.01 ORIGEN',genesisListo:true,hechoHoy:[],pendiente:[]};
async function cargarInforme(){
  try{INF=await(await fetch('/informe.json',{cache:'no-store'})).json();}catch(e){}
  mirarFijos();
  $('#parteCuando').textContent=(INF.fecha||'')+' · GENERADO POR EL CEREBRO';
}

function fallasActivas(){
  return REGIONES.filter(r=>E[r.id].mal)
    .map(r=>({nom:r.nom,est:E[r.id].estado,met:E[r.id].met}));
}
function construirParte(){
  const fallas=fallasActivas();
  const s=[];
  s.push(`Parte del día. ${INF.fecha||''}.`);
  if(fallas.length===0)s.push('Todos los sistemas en verde.');
  else s.push(`Atención: ${fallas.length} sistema${fallas.length>1?'s':''} con falla: `+
    fallas.map(f=>f.nom).join(', ')+'.');
  if(V.altura5534)s.push(`Cadena de pruebas: en vivo, bloque ${V.altura5534}, gas ${V.gas} güey.`);
  if(V.altura8532)s.push(`Cadena vieja: ${V.quieta?'congelada, con la raíz de estado intacta. Lista para migrar.':'¡tuvo movimiento! Hay que revisar el cierre.'}`);
  if(INF.genesisListo)s.push('Génesis de la cinco cinco cinco cero: construido, juzgado, cero diferencias. Respaldado en S3.');
  if(V.indexados)s.push(`Explorador: ${V.indexados} bloques indexados.`);
  if(V.wallet!==undefined)s.push(`Veta Wallet: ${V.wallet?'en línea, versión '+(INF.versionBackend||''):'sin responder'}. Precio del ORIGEN: un centavo de dólar, fijo. Comisión: cero punto cero uno ORIGEN, ${INF.comisionEncendida?'encendida':'lista y apagada'}.`);
  if(V.pr93)s.push(`Chainlist: solicitud de la testnet ${V.pr93}; la de la red principal ${V.pr94}.`);
  if(INF.hechoHoy&&INF.hechoHoy.length){s.push('Lo hecho hoy: '+INF.hechoHoy.map(x=>x.replace(/·/g,',')).join('. ')+'.');}
  if(INF.pendiente&&INF.pendiente.length){s.push('Lo que falta: '+INF.pendiente.join('. ')+'.');}
  s.push(fallas.length===0?'Fin del parte. Todo bajo control.':'Fin del parte. Revisar las fallas.');
  return s;
}
function pintarParte(){
  const c=$('#parteCuerpo');c.innerHTML='';
  const fallas=fallasActivas();
  const sec=(t,items,clase)=>{if(!items.length)return;
    const h=document.createElement('h4');h.textContent=t;c.appendChild(h);
    for(const x of items){const li=document.createElement('li');
      if(clase)li.className=clase;li.textContent=typeof x==='string'?x:`${x.nom} — ${x.est} (${x.met})`;
      c.appendChild(li);}};
  sec('FALLAS',fallas,'malo');
  const vivo=[];
  if(V.altura5534)vivo.push(`Cadena 5534: bloque ${nf(V.altura5534)} · gas ${V.gas} gwei · último bloque hace ${V.edad}s`);
  if(V.altura8532)vivo.push(`Cadena 8532: bloque ${nf(V.altura8532)} · ${V.quieta?'congelada, raíz intacta':'¡RAÍZ DISTINTA!'}`);
  if(V.indexados)vivo.push(`Ordenscan: ${nf(V.indexados)} bloques indexados`);
  if(V.pr93)vivo.push(`Chainlist: #8593 ${V.pr93} · #8594 ${V.pr94}`);
  vivo.push(`ORIGEN $${INF.precio} fijo · comisión ${INF.comision} ${INF.comisionEncendida?'(encendida)':'(lista, apagada)'}`);
  sec('AHORA MISMO',vivo);
  sec('HECHO HOY',INF.hechoHoy||[]);
  sec('PENDIENTE',INF.pendiente||[]);
}

/* ═══ 5 · LA VOZ ══════════════════════════════════════════════════════════
   Web Speech del propio dispositivo: nada sale a ningún servicio. En iOS
   hace falta el toque del usuario, por eso el botón. */
let vozLista=null, hablando=false;
function elegirVoz(){
  const voces=speechSynthesis.getVoices();
  const orden=['Mónica','Paulina','Google español','es-MX','es-ES','es-US','es-'];
  for(const q of orden){const v=voces.find(v=>(v.name+' '+v.lang).includes(q));if(v)return v;}
  return voces[0]||null;
}
if('speechSynthesis' in window)
  speechSynthesis.onvoiceschanged=()=>{vozLista=elegirVoz();};
function hablar(frases){
  if(!('speechSynthesis' in window)){abrirParte();return;}
  speechSynthesis.cancel();
  vozLista=vozLista||elegirVoz();
  hablando=true;$('#btnInforme').classList.add('hablando');
  frases.forEach((f,i)=>{
    const u=new SpeechSynthesisUtterance(f);
    if(vozLista)u.voice=vozLista;
    u.lang=(vozLista&&vozLista.lang)||'es-MX';u.rate=1.02;u.pitch=.85;
    u.onstart=()=>{$('#subt').textContent=f;};
    if(i===frases.length-1)u.onend=()=>pararVoz();
    speechSynthesis.speak(u);
  });
}
function pararVoz(){hablando=false;speechSynthesis.cancel();
  $('#btnInforme').classList.remove('hablando');$('#subt').textContent='';}
$('#btnInforme').addEventListener('click',()=>{
  if(hablando){pararVoz();return;}
  hablar(construirParte());
});
function abrirParte(){pintarParte();$('#parte').classList.add('abierto');}
$('#btnParte').addEventListener('click',abrirParte);
$('#cerrarParte').addEventListener('click',()=>$('#parte').classList.remove('abierto'));
$('#parte').addEventListener('click',e=>{if(e.target.id==='parte')e.target.classList.remove('abierto')});

/* ═══ 6 · LIBRO DE ESTADOS + RELOJ ════════════════════════════════════════ */
function pintarLibro(){
  const libro=$('#libro');
  libro.querySelectorAll('.fila').forEach(f=>f.remove());
  let malas=0;
  for(const r of REGIONES){
    const e=E[r.id];if(e.mal)malas++;
    const f=document.createElement('div');f.className='fila'+(e.mal?' mal':'');
    f.innerHTML=`<span class="cn" style="border-color:${r.color};background:${e.mal?'transparent':r.color}"></span>
      <span><span class="nom" style="color:${r.color}">${r.nom}</span>
      <span class="est">${e.estado}</span></span><span class="met">${e.met}</span>`;
    libro.appendChild(f);
  }
  document.body.classList.toggle('enFalla',malas>0);
  $('#conTexto').textContent=malas?`${malas} SISTEMA${malas>1?'S':''} EN FALLA`:'TODOS LOS SISTEMAS EN VERDE';
}
setInterval(()=>{const d=new Date();
  $('#reloj').textContent=d.toLocaleTimeString('es-MX',{hour12:false});
  $('#fecha').textContent=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
},500);

/* ═══ 7 · ARRANQUE Y RONDAS ═══════════════════════════════════════════════ */
medir();requestAnimationFrame(cuadro);pintarLibro();
(async()=>{
  await cargarInforme();
  mirarNucleo();mirarMemoria();mirarScan();mirarWallet();mirarGid();mirarChainlist();
})();
setInterval(mirarNucleo,10000);
setInterval(mirarMemoria,30000);
setInterval(mirarScan,20000);
setInterval(()=>{mirarWallet();mirarGid();},60000);
setInterval(mirarChainlist,300000);
</script>
