<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ultron</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/ultron.png">
<style>
:root{--bg:#000;--card:#111214;--line:#222;--txt:#eee;--dim:#8b8b8b;--me:#2a2a2e;--you:transparent;--acc:#d4a017}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#000;position:sticky;top:0;z-index:5}
header b{font-weight:650;letter-spacing:.02em;flex:1;text-align:center}
header button{background:none;border:0;color:var(--txt);width:40px;height:40px;font-size:20px}
#lista{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);background:#0b0b0d;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s;z-index:8;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#lista.abierta{transform:none}
#lista h2{padding:16px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
#lista a{display:block;padding:12px 16px;color:var(--txt);text-decoration:none;border-bottom:1px solid #181818}
#lista a small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#fondo{display:none;position:fixed;inset:0;background:#0008;z-index:7}
#fondo.on{display:block}
#hilos{overflow:auto;flex:1}
#chat{flex:1;overflow:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%}
.msg.user{align-self:flex-end;background:var(--me);border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.bot{align-self:flex-start}
.msg .meta{font-size:11px;color:var(--dim);margin:6px 0}
.msg pre{white-space:pre-wrap;word-break:break-word;font:inherit}
#estado{font-size:13px;color:var(--dim);padding:0 16px 8px}
#caja{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#000}
#caja textarea{flex:1;resize:none;min-height:44px;max-height:140px;background:#161616;border:1px solid #2a2a2a;border-radius:22px;color:var(--txt);padding:11px 16px;font:inherit}
#caja button{width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:#000;font-weight:700}
#login{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;padding:28px;z-index:20}
#login h1{font-size:28px;margin-bottom:8px}
#login p{color:var(--dim);margin-bottom:24px}
#login input{width:100%;background:#161616;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;margin-bottom:10px;font:inherit}
#login button{width:100%;padding:14px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:700}
#login .err{color:#f66;margin-top:10px;min-height:1.2em}
.trabajo{border:1px solid #333;border-radius:12px;padding:10px;margin-top:8px;font-size:13px;color:#ccc}
a.os{color:var(--acc);font-size:12px;padding:8px 16px}
</style>
</head>
<body>
<div id="login">
  <h1>Ultron</h1>
  <p>Versión lite · el OS sigue en /os</p>
  <input id="correo" type="email" placeholder="Correo" autocomplete="username">
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button id="entrar">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>
<header>
  <button id="menu" aria-label="Chats">☰</button>
  <b id="titulo">Ultron</b>
  <button id="nuevo" aria-label="Nuevo">＋</button>
</header>
<div id="fondo"></div>
<aside id="lista">
  <h2>Conversaciones</h2>
  <div id="hilos"></div>
  <a class="os" href="/os">Abrir ULTRON OS</a>
</aside>
<main id="chat"></main>
<div id="estado"></div>
<form id="caja">
  <textarea id="texto" rows="1" placeholder="Preguntale a Ultron"></textarea>
  <button type="submit" aria-label="Enviar">↑</button>
</form>
<script src="/js/lite.js"></script>
</body>
</html>
