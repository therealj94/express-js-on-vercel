<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Ultron</title>
<link rel="icon" href="/img/ultron.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#050505;--s:#111;--l:#1c1c1e;--t:#f2f2f2;--d:#8e8e93;--a:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;min-height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  border-bottom:1px solid #161616;background:#050505ee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:4}
header b{flex:1;text-align:center;font-weight:600;font-size:17px;letter-spacing:-.02em}
header button{width:40px;height:40px;border:0;background:transparent;color:var(--t);font-size:20px}
#drawer{position:fixed;inset:0 auto 0 0;width:min(88vw,340px);background:#0a0a0a;z-index:8;
  transform:translateX(-105%);transition:.22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#scrim{display:none;position:fixed;inset:0;background:#0009;z-index:7}
#scrim.on{display:block}
#drawer h2{padding:18px 16px 8px;font-size:22px}
#hilos{flex:1;overflow:auto}
#hilos a{display:block;padding:12px 16px;color:var(--t);text-decoration:none;border-bottom:1px solid #141414}
#hilos a .t{font-weight:600;font-size:15px}
#hilos a small{display:block;color:var(--d);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hilos a .w{color:var(--a);font-size:11px;margin-top:4px}
#drawer .foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #181818}
#drawer .foot a{color:var(--a);text-decoration:none;font-size:13px}
#chat{flex:1;overflow:auto;padding:18px 16px 8px}
.empty{padding:18vh 20px 0;text-align:center}
.empty h1{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px}
.empty p{color:var(--d);margin-bottom:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pills button{border:1px solid #2a2a2a;background:#121212;color:var(--t);border-radius:20px;padding:8px 14px;font-size:13px}
.msg{margin:0 0 16px}
.msg.me{display:flex;justify-content:flex-end}
.msg.me .b{max-width:82%;background:#2c2c2e;border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.ai .b{max-width:100%}
.msg .b{white-space:pre-wrap;word-break:break-word}
.msg .tools{font-size:11px;color:var(--d);margin:6px 0 0}
#bar{padding:0 16px 6px;font-size:12px;color:var(--d);min-height:16px}
#box{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #161616;background:#050505}
#box textarea{flex:1;border:0;background:#1c1c1e;color:var(--t);border-radius:22px;padding:12px 16px;
  font:inherit;resize:none;min-height:44px;max-height:140px}
#adj,#go{width:44px;height:44px;border-radius:22px;border:0;font-size:18px}
#adj{background:#1c1c1e;color:var(--t)}
#go{background:#fff;color:#000;font-weight:700}
#login{position:fixed;inset:0;background:#050505;z-index:30;display:flex;flex-direction:column;justify-content:center;padding:32px}
#login h1{font-size:34px;letter-spacing:-.04em;margin-bottom:6px}
#login p{color:var(--d);margin-bottom:28px}
#login input{width:100%;background:#1c1c1e;border:0;border-radius:14px;padding:16px;color:#fff;margin-bottom:10px;font:inherit}
#login button{width:100%;padding:16px;border:0;border-radius:14px;background:#fff;color:#000;font-weight:700;font-size:16px}
#login .err{color:#ff6b6b;margin-top:12px;min-height:1.2em}
</style>
</head>
<body>
<div id="login">
  <h1>Ultron</h1>
  <p>Junta Directiva · lite</p>
  <input id="correo" type="email" placeholder="Correo" autocomplete="username">
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button type="button" id="entrar">Continuar</button>
  <div class="err" id="loginErr"></div>
</div>
<header>
  <button type="button" id="menu" aria-label="Historial">☰</button>
  <b id="titulo">Ultron</b>
  <button type="button" id="nuevo" aria-label="Nuevo">✎</button>
</header>
<div id="scrim"></div>
<aside id="drawer">
  <h2>Chats</h2>
  <div id="hilos"></div>
  <div class="foot"><a href="/os">ULTRON OS</a></div>
</aside>
<main id="chat"></main>
<div id="bar"></div>
<form id="box">
  <button type="button" id="adj" aria-label="Adjuntar">＋</button>
  <input id="file" type="file" hidden accept=".pdf,.doc,.docx,.txt,.csv,.png,.jpg,.jpeg,.webp">
  <textarea id="texto" rows="1" placeholder="Preguntale a Ultron"></textarea>
  <button type="submit" id="go">↑</button>
</form>
<script src="/js/lite.js"></script>
</body>
</html>
