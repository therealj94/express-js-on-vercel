<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Ultron</title>
<link rel="icon" href="/img/ultron.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#050505;--s:#111;--l:#1c1c1e;--t:#f2f2f2;--d:#8e8e93;--a:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;min-height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));
  border-bottom:1px solid #161616;background:#050505ee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:4}
header b{flex:1;text-align:center;font-weight:600;font-size:17px;letter-spacing:-.02em}
header button{width:40px;height:40px;border:0;background:transparent;color:var(--t);font-size:20px}
header button.txt{width:auto;padding:0 8px;font-size:13px;font-weight:600}
header button.gold{background:#c9a227;color:#000;border-radius:10px;height:32px;width:auto;padding:0 10px}
.led{width:22px!important;font-size:14px;color:#8e8e93}
.led.andando{color:#c9a227}.led.ok{color:#30d158}.led.mal{color:#ff453a}
#hablar.on{background:#ff453a;color:#fff}
#desahogo{display:none;margin:0 12px 8px;border:0;border-radius:14px;padding:12px;background:#1c1c1e;color:#f2f2f2;font-weight:600}
#desahogo.on{display:block}
#drawer{position:fixed;inset:0 auto 0 0;width:min(88vw,340px);background:#0a0a0a;z-index:8;
  transform:translateX(-105%);transition:.22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#scrim{display:none;position:fixed;inset:0;background:#0009;z-index:7}
#scrim.on{display:block}
#drawer h2{padding:18px 16px 8px;font-size:22px}
#hilos{flex:1;overflow:auto}
#hilos a{display:block;padding:12px 16px;color:var(--t);text-decoration:none;border-bottom:1px solid #141414}
#hilos a .t{font-weight:600;font-size:15px}
#hilos a small{display:block;color:var(--d);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hilos a .w{color:var(--a);font-size:11px;margin-top:4px}
#drawer .foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid #181818}
#drawer .foot a{color:var(--a);text-decoration:none;font-size:13px}
#chat{flex:1;overflow:auto;padding:18px 16px 8px}
.empty{padding:18vh 20px 0;text-align:center}
.empty h1{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-bottom:8px}
.empty p{color:var(--d);margin-bottom:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pills button{border:1px solid #2a2a2a;background:#121212;color:var(--t);border-radius:20px;padding:8px 14px;font-size:13px}
.msg{margin:0 0 16px}
.msg.me{display:flex;justify-content:flex-end}
.msg.me .b{max-width:82%;background:#2c2c2e;border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.ai .b{max-width:100%}
.msg .b{white-space:pre-wrap;word-break:break-word}
.msg .tools{font-size:11px;color:var(--d);margin:6px 0 0}
#bar{padding:0 16px 4px;font-size:12px;color:var(--d)}
#proceso{display:none;margin:0 12px 8px;background:#0c0c0e;border:1px solid #222;border-radius:12px;overflow:hidden}
#proceso.on{display:block}
#proceso .cap{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #1a1a1a}
#proceso .cap b{flex:1;font-size:12px;color:#c9a227}
#cerrarTurno{border:0;background:#fff;color:#000;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
#log{max-height:180px;overflow:auto;padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#cfcfcf;white-space:pre-wrap;word-break:break-word}
#log .paso{color:#8e8e93;margin:6px 0 2px}
#log .code{background:#161616;border-radius:8px;padding:8px;margin:4px 0;color:#d8d8d8}
#box{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #161616;background:#050505}
#box textarea{flex:1;border:0;background:#1c1c1e;color:var(--t);border-radius:22px;padding:12px 16px;
  font:inherit;resize:none;min-height:44px;max-height:140px}
#adj,#go{width:44px;height:44px;border-radius:22px;border:0;font-size:18px}
#adj{background:#1c1c1e;color:var(--t)}
#go{background:#fff;color:#000;font-weight:700}
#login{position:fixed;inset:0;background:#050505;z-index:30;display:flex;flex-direction:column;justify-content:center;padding:32px}
#login h1{font-size:34px;letter-spacing:-.04em;margin-bottom:6px}
#login p{color:var(--d);margin-bottom:28px}
#login input{width:100%;background:#1c1c1e;border:0;border-radius:14px;padding:16px;color:#fff;margin-bottom:10px;font:inherit}
#login button{width:100%;padding:16px;border:0;border-radius:14px;background:#fff;color:#000;font-weight:700;font-size:16px}
#login .err{color:#ff6b6b;margin-top:12px;min-height:1.2em}

#ajustes{display:none;position:fixed;inset:0;background:#000a;z-index:25;align-items:flex-end;justify-content:center}
#ajustes.on{display:flex}
#ajustes .sheet{width:100%;max-width:640px;background:#111;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#ajustes h2{margin-bottom:14px;font-size:20px}
#ajustes label{display:block;font-size:12px;color:var(--d);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
#ajustes .seg{display:flex;gap:6px;flex-wrap:wrap}
#ajustes .seg button{flex:1;min-width:90px;background:#1c1c1e;color:var(--t);border:1px solid #2a2a2a;border-radius:12px;padding:10px 8px;font-size:13px}
#ajustes .seg button.on{background:#fff;color:#000;border-color:#fff}
#ajustes input{width:100%;background:#1c1c1e;border:0;border-radius:12px;padding:12px;color:#fff;font:inherit}
#ajustes .row{display:flex;gap:8px;margin-top:16px}
#ajustes .row button,#ajustes .danger,#ajustes #cerrarAjustes,#ajustes #guardarAjustes{border:0;border-radius:12px;padding:12px;font:inherit;color:#fff;background:#2a2a2e}
#ajustes .danger{background:#3a1515;width:100%;margin-top:10px}
#ajustes a{display:block;margin:14px 0;color:var(--a);text-decoration:none}
#ajustes .hint{color:var(--d);font-size:12px;margin-top:8px}

#popupAuth{display:none;position:fixed;inset:0;background:#000c;z-index:40;align-items:center;justify-content:center;padding:20px}
#popupAuth.on{display:flex}
#popupAuth .card{background:#161616;border-radius:16px;padding:20px;width:100%;max-width:400px}
#popupAuth h3{margin-bottom:10px}
#popupAuth .row{display:flex;gap:8px;margin-top:16px}
#popupAuth button{flex:1;border:0;border-radius:12px;padding:12px;background:#2a2a2e;color:#fff}
#popupAuth button.ok{background:#fff;color:#000;font-weight:700}
#authLista .item{border:1px solid #2a2a2a;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
#authLista .item button{margin-top:8px;margin-right:6px;border:0;border-radius:8px;padding:8px 10px;background:#2a2a2e;color:#fff}
#cerrarFijo{display:none;margin:0 12px 8px;border:0;border-radius:14px;padding:14px;background:#c9a227;color:#000;font-weight:800;font-size:15px}
#cerrarFijo.on{display:block}
#cerrarTurno{background:#c9a227!important;color:#000!important;font-weight:800!important}
</style>
</head>
<body>
<div id="login">
  <h1>Ultron</h1>
  <p>Junta Directiva · lite</p>
  <input id="correo" type="email" placeholder="Correo" autocomplete="username">
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button type="button" id="entrar">Continuar</button>
  <div class="err" id="loginErr"></div>
</div>
<header>
  <button type="button" id="menu" aria-label="Historial">☰</button>
  <b id="titulo">Ultron</b><button type="button" id="led" class="led" title="Caché">●</button>
  <button type="button" id="nuevo" aria-label="Nuevo">✎</button>
  <button type="button" id="cerrarHead" class="txt gold">Terminá</button>
  <button type="button" id="gear" aria-label="Ajustes" class="txt">Ajustes</button>
</header>
<div id="scrim"></div>
<aside id="drawer">
  <h2>Chats</h2>
  <div id="hilos"></div>
  <div class="foot"><a href="/os">ULTRON OS</a></div>
</aside>
<main id="chat"></main>
<div id="proceso">
  <div class="cap"><b id="procTit">En ello</b><button type="button" id="cerrarTurno">Terminá ya</button></div>
  <div id="log"></div>
</div>
<div id="bar"></div>
<button type="button" id="cerrarFijo">TERMINÁ YA · entregá lo que hay</button>
<button type="button" id="desahogo">Guardá este capítulo</button>
<form id="box">
  <button type="button" id="adj" aria-label="Adjuntar">＋</button>
  <button type="button" id="hablar" aria-label="Hablar">🎙</button>
  <input id="file" type="file" hidden accept=".pdf,.doc,.docx,.txt,.csv,.png,.jpg,.jpeg,.webp">
  <textarea id="texto" rows="1" placeholder="Preguntale a Ultron"></textarea>
  <button type="submit" id="go">↑</button>
</form>
<div id="popupAuth">
  <div class="card">
    <h3>Hace falta tu OK</h3>
    <p id="authResumen"></p>
    <p class="hint" id="authMeta"></p>
    <div class="row">
      <button type="button" id="authNo">Denegar</button>
      <button type="button" id="authSi" class="ok">Aprobar</button>
    </div>
  </div>
</div>

<div id="ajustes">
  <div class="sheet">
    <h2>Ajustes</h2>
    <label>Interfaz</label>
    <div class="seg" id="segInterfaz">
      <button type="button" data-v="lite">Lite</button>
      <button type="button" data-v="pro">Pro · OS</button>
    </div>
    <label>Cerebro</label>
    <div class="seg" id="segCerebro">
      <button type="button" data-v="nodo">Nodo 27B</button>
      <button type="button" data-v="relevo">Relevo</button>
      <button type="button" data-v="claude">Claude</button>
    </div>
    <p class="hint" id="hintCerebro"></p>
    <label>Idioma</label>
    <div class="seg" id="segIdioma">
      <button type="button" data-v="es">Español</button>
      <button type="button" data-v="en">English</button>
    </div>
    <label>Voz</label>
    <div class="seg" id="segVoz">
      <button type="button" data-v="on">On</button>
      <button type="button" data-v="off">Off</button>
    </div>
    <label>Lugar (clima)</label>
    <input id="lugar" placeholder="Tegucigalpa">
    <div class="row">
      <button type="button" id="guardarAjustes">Guardar</button>
      <button type="button" id="cerrarOtras">Cerrar otras sesiones</button>
    </div>
    <label>Autorizaciones</label>
<div id="authLista"></div>
<button type="button" id="salir" class="danger">Salir</button>
    <a href="/os">Abrir ULTRON OS</a>
    <button type="button" id="cerrarAjustes">Listo</button>
    <p class="hint" id="ajErr"></p>
  </div>
</div>

<script src="/js/lite.js?v=hab1"></script>
</body>
</html>
