# DOS RANURAS: NO SE PUEDE CON ESTE MODELO, Y ESTA ES LA PRUEBA.
#
# 7-sep, en el registro de ollama, mientras carga el 27B:
#
#   level=WARN source=sched.go:509
#   msg="model architecture does not currently support parallel requests"
#   architecture=qwen35
#
# No es memoria, ni el colchon, ni la ventana: OLLAMA NO SOPORTA PETICIONES EN
# PARALELO PARA LA ARQUITECTURA qwen35, que es la de qwen3.8:27b. Fuerza una
# ranura pase lo que pase, y por eso el registro dice siempre
# «llama_context: n_seq_max = 1» aunque OLLAMA_NUM_PARALLEL diga 2.
#
# Se llego aqui despues de descartar dos cosas que SI parecian la causa, y las
# dos quedan escritas abajo porque el trabajo que costo no se tira: el colchon
# de 5,4 GB era de verdad un estorbo, y la ventana de 32 768 tambien. Los dos
# se corrigieron y siguen corregidos; simplemente no eran LA causa.
#
# LO QUE ESTO SIGNIFICA
# ULTRON y AU-RA van a seguir turnandose en la misma ranura mientras compartan
# este modelo en esta tarjeta. Separarlos de verdad pide una de dos cosas, y
# las dos son decision de la junta:
#   · una segunda tarjeta (otra g5.xlarge, 1,006 USD/hora ~ 734 USD/mes), cada
#     una con su ollama y su ranura;
#   · o un modelo de otra arquitectura que si admita paralelo — y eso cambia
#     como contestan los dos, que es mas serio que el gasto.
#
# Mientras tanto, lo que SI se puede hacer —y ya se hizo— es que el turno de
# cada uno sea corto y que la caché se pierda lo menos posible: prompt de voz
# mas chico, calentarla al abrir el microfono, y cortar de verdad al
# interrumpir para que la ranura quede libre en el acto.
#
# NUM_PARALLEL se deja en 2 a proposito: hoy ollama lo ignora para esta
# arquitectura, y el dia que cambie el modelo o la version de ollama, la
# intencion ya esta puesta y el vigilante ya esta al lado.
#
# ─────────────────────────────────────────────────────────────────────────────
# LO QUE SIGUE ABAJO ES LO QUE SI SE CORRIGIO POR EL CAMINO
# ─────────────────────────────────────────────────────────────────────────────
#
# POR QUE SE QUIEREN DOS
# ULTRON y AU-RA comparten el mismo modelo en la misma tarjeta. Con una sola
# ranura no se solapan: se turnan. Y como la cache de prefijo es DE LA RANURA,
# cada vez que uno de los dos entra le borra al otro el prompt ya evaluado.
# Medido contra produccion el 6-sep, la misma pregunta:
#
#   con la cache caliente ....  1,0 s hasta la primera palabra
#   con la cache fria .......... 6,5 s
#
# Seis veces, y la diferencia entera es evaluar el prompt otra vez.
#
# LO QUE CUESTA UNA RANURA DE VERDAD (qwen3.8:27b, ventana 32 768)
#
#   llama_kv_cache:         1088,00 MiB  (32 768 celdas, 16 capas, q8_0)
#   llama_memory_recurrent:  748,12 MiB  (64 capas, 1 secuencia)
#   ─────────────────────────────────────
#   por ranura              1 836 MiB
#
# OJO: la primera vez se leyo mal esta cuenta —se tomo la linea de 128 MiB, que
# es la del modelo de VECTORES, no la del 27B— y salio la mitad. El numero es
# 1 836 MiB por ranura, no 876.
#
# EL COLCHON, QUE ERA EL PRIMER ESTORBO
# Al pedir la segunda ranura, ollama se nego y lo dijo con todas las letras:
#
#   "llama-server model predicted to exceed available memory, evicting"
#   predicted=18.2 GiB  available=16.0 GiB  gpu_free=21.8 GiB  overhead=5.4 GiB
#
# En la tarjeta habia 21,8 GB libres de verdad, pero ollama solo se dejaba usar
# 16,0 porque tarjeta.conf le reservaba 5,4 GB de colchon — un numero de cuando
# habia TRES ranuras, sin nada escrito que lo explique. Aqui se baja a 3 GB,
# que sigue siendo amplio para una tarjeta headless donde no corre nada mas
# (y despues a 2,5 GB, ver mas abajo).
# Comprobado despues del cambio: «offloaded 66/66 layers to GPU», los dos
# modelos residentes, 20 078 MiB usados de 23 028. Igual que antes: el colchon
# mas bajo no empeoro nada.
#
# EL SEGUNDO ESTORBO: LA VENTANA, Y SE BAJO
# Con el colchon en 3 GB el presupuesto era 19,5 GB, y dos ranuras a ventana
# 32 768 son 16,2 (modelo) + 2 x 1,84 = 19,9 GB. Por 400 MB no entraba, y
# ollama —que trata NUM_PARALLEL como un TECHO, no como una orden— se quedaba
# en una. Se comprueba en el registro: «llama_context: n_seq_max = 1».
#
# Nadie usa 32 768. Se miro lo que de verdad se pide, siete dias de registro:
#
#   menos de 1k .....  1 739 llamadas      12k - 16k .......     76
#   1k - 4k .........      7               mas de 16 384 ...     32
#   4k - 8k .........  1 066               el mayor de todos: 21 868 fichas
#   8k - 12k ........     52
#
# Asi que la ventana baja a 24 576: cubre hasta el pico de 21 868 con 2 700
# fichas de aire —esas 32 llamadas grandes son los turnos largos de ULTRON con
# varias herramientas encadenadas, los que mas valen, y con 16 384 se habrian
# recortado— y a la vez deja entrar la segunda ranura:
#
#   KV a 24 576 ...........   816 MiB   (1088 x 24576/32768)
#   recurrente ............   748 MiB
#   por ranura ............ 1 564 MiB
#   dos ranuras ........... 3 128 MiB
#   modelo + dos ranuras .. 19,26 GB   contra 20,0 GB de presupuesto
#
# El colchon baja a 2,5 GB para dejar esos 740 MB de margen al predictor. La
# medida real de antes decia que sobraba: con 3 GB de colchon quedaban 2 513
# MiB libres de verdad en la tarjeta.
#
# LA VENTANA SE BAJA EN CINCO SITIOS O EN NINGUNO. El modelo se carga con la
# ventana del PRIMERO que pide, asi que si uno pide 24 576 y otro 32 768, cada
# pedido del segundo recarga 16 GB de disco:
#   1. /etc/ultron-motor.env            ULTRON_MOTOR_CTX=24576
#   2. aura.service.d/ventana-24k.conf  AURA_VENTANA=24576
#   3. /usr/local/bin/ogb-tibio.sh      el pulso de cada tres minutos
#   4. /usr/local/bin/ollama-vigia.sh   el reclavado despues de reiniciar
#   5. /usr/local/bin/ogb-precalentar.sh  el de arranque
# Los tres ultimos son los mas faciles de olvidar y los que mas duelen: un
# pulso con otra ventana recarga el modelo entero cada tres minutos.
#
# Lo que NO se toca: ULTRON_NODO_CTX en Heroku sigue en 12 288. Ese numero es
# el presupuesto del PROMPT de ULTRON (8 188 fichas) y subirlo solo haria los
# prompts mas grandes, o sea mas lentos. La ventana de 24 576 es para que
# quepan las VUELTAS de herramientas, no para escribir prompts mas largos.
#
# EL RIESGO, CUANDO LLEGUE A TOMARLAS
# una-ranura.conf existia por el 5-sep: con TRES ranuras, una conexion cortada
# a media generacion dejo a ollama sin contestar 300 segundos, con ULTRON y
# AU-RA caidos detras. Y ULTRON corta conexiones a proposito —la guarda del
# bucle, y desde el 6-sep tambien al interrumpir—. Por eso este archivo NO va
# solo: antes se puso ollama-vigia.timer, que cada minuto le pide /api/tags y
# con tres lecturas malas seguidas reinicia y vuelve a clavar los dos modelos.
# Aquel cuelgue queda acotado a unos tres minutos y, sobre todo, pasa a ser un
# tiempo CONOCIDO en vez de una espera sin fondo.
#
# PARA VOLVER ATRAS: se borra este archivo (vuelve el colchon de 5,4 GB de
# tarjeta.conf y NUM_PARALLEL=3, asi que hay que reponer una-ranura.conf con
# OLLAMA_NUM_PARALLEL=1 — hay copia en /root/una-ranura.conf.respaldo),
# daemon-reload y restart.
#
# Y SIEMPRE, DESPUES DE TOCAR ESTO, MIRAR EL REGISTRO: si ollama decide que no
# le alcanza, empuja capas a la CPU EN SILENCIO y el modelo pasa de rapido a
# inservible. La linea que lo dice es «load_tensors: offloaded N/N layers to
# GPU»: tienen que ser todas (66/66 en el 27B).
[Service]
Environment=OLLAMA_NUM_PARALLEL=2
Environment=OLLAMA_GPU_OVERHEAD=2684354560
