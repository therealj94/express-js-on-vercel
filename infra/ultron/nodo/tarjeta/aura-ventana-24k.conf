# LA VENTANA DE AU-RA, Y POR QUE ESTA AQUI Y NO EN OTRO SITIO.
#
# Este archivo es de aura.service, no de ollama. Se guarda junto a las conf de
# la tarjeta a proposito: la ventana de AU-RA y las ranuras de ollama son UNA
# SOLA decision, y separarlas fue lo que hizo falta explicar dos veces.
#
# El modelo se carga con la ventana del PRIMERO que pide, y ULTRON y AU-RA
# comparten modelo. Si uno pide 24 576 y el otro 32 768, cada pedido del
# segundo recarga 16 GB de disco — el desastre del 5-sep. O se bajan las dos, o
# ninguna. Se bajan las dos.
#
# POR QUE 24 576 Y NO 16 384
# Se miro lo que de verdad se pide, siete dias de registro de ollama:
#
#   menos de 1k .....  1 739 llamadas
#   1k - 4k .........      7
#   4k - 8k .........  1 066
#   8k - 12k ........     52
#   12k - 16k .......     76
#   mas de 16 384 ...     32     <- el mayor, 21 868 fichas
#
# Con 16 384 se recortarian esas 32, y son justo los turnos largos de ULTRON
# con varias herramientas encadenadas: los que mas valen. 24 576 las cubre
# todas con 2 700 fichas de aire, y aun asi deja entrar la segunda ranura.
#
# Reemplaza a ventana-32k.conf. Para volver atras: AURA_VENTANA=32768 aqui y en
# /etc/ultron-motor.env, los tres scripts de la tarjeta, y quitar la segunda
# ranura de zz-dos-ranuras.conf. Las cinco cosas van juntas.
[Service]
Environment=AURA_VENTANA=24576
