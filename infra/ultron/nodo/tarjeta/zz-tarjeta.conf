# EL MODELO Y LA VENTANA SALEN DE /etc/ogb-tarjeta.env, Y DE NINGUN OTRO SITIO.
#
# Se instala como drop-in en LOS DOS servicios que piensan con el modelo:
#   /etc/systemd/system/aura.service.d/zz-tarjeta.conf
#   /etc/systemd/system/ultron-motor.service.d/zz-tarjeta.conf
#
# Se llama zz- a proposito: systemd aplica los drop-ins por orden alfabetico y
# el ultimo manda. Asi este gana a cerebro-qwen38.conf y a ventana-24k.conf sin
# tener que borrarlos, que es lo que deja volver atras borrando UN archivo.
#
# El guion de EnvironmentFile=- quiere decir «si no esta, no pasa nada»: cada
# servicio tiene su propio valor por defecto en el codigo, y arrancar con el
# viejo es mejor que no arrancar.
[Service]
EnvironmentFile=-/etc/ogb-tarjeta.env
