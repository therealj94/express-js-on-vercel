name: Veta Wallet — actualizar por aire

# Publica un EAS Update: manda el código JavaScript nuevo a los teléfonos que
# ya tienen la app instalada, sin pasar por la tienda. Es lo que se llama
# "actualizar por aire" (OTA).
#
#   Actions → "Veta Wallet — actualizar por aire" → Run workflow → elegir canal
#
# QUÉ SÍ Y QUÉ NO VIAJA POR AIRE
#
#   Sí:  pantallas, textos, traducciones, colores, arreglos de lógica,
#        cambios en las llamadas al servidor. Todo lo que sea JavaScript.
#
#   No:  agregar o quitar un módulo nativo, cambiar permisos, cambiar el
#        icono, subir la versión. Eso necesita una compilación nueva
#        (workflow "Veta Wallet — compilar Android") y, si va a producción,
#        pasar otra vez por la tienda.
#
# LA REGLA QUE LO GOBIERNA
#
#   `runtimeVersion` es "appVersion": el número de versión ES la frontera.
#   Un update publicado desde la 1.33.0 sólo llega a los teléfonos que tengan
#   instalada la 1.33.0. En cuanto se sube a 1.34.0 hace falta compilar de
#   nuevo, y desde ese momento los updates van a la 1.34.0.
#
#   Antes esto decía "sdkVersion", que ponía a todas las versiones del mismo
#   SDK en el mismo saco. Con esa regla, un update de la 1.33.0 —que trae
#   módulos nativos que la 1.32.0 no tiene compilados— habría llegado a los
#   teléfonos con la 1.32.0 instalada y les habría tumbado la pantalla de
#   acceso. No es una precaución teórica: `expo-auth-session` arrastra
#   `expo-application`, que en la 1.32.0 no existe.
#
# CANALES
#
#   preview      los teléfonos con el APK de prueba (perfil `preview`)
#   development  los teléfonos con la app de desarrollo
#   production   los teléfonos que la instalaron desde Google Play
#
#   `production` cambia lo que ve la gente de verdad, sin revisión de la
#   tienda de por medio. Se hace a propósito y sabiendo lo que se manda.
#
# Requisito (ya configurado): el secreto EXPO_TOKEN del repositorio.

on:
  push:
    branches:
      - claude/veta-wallet-phantom-design-7syah8
      - preview
    paths:
      - 'veta-wallet-app/**'
      - '.github/workflows/veta-preview.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'A qué teléfonos va'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production
      message:
        description: 'Mensaje del update (aparece en el Dashboard EAS)'
        required: false
        default: ''

concurrency:
  group: veta-update-${{ github.event.inputs.channel || 'preview' }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veta-wallet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: veta-wallet-app/package-lock.json

      - name: EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install
        run: npm ci

      # Revisión previa: caza colisiones de nombres, dependencias mal
      # ubicadas y desfases de SDK antes de gastar minutos publicando algo
      # que no va a abrir en el teléfono.
      - name: Verificar
        run: npm run verificar

      - name: Publicar EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CANAL: ${{ github.event.inputs.channel || 'preview' }}
        run: |
          set -e
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN. Créalo en Settings → Secrets → Actions."
            exit 1
          fi
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            # Con el commit se ve qué llevó cada update sin pensarlo.
            MSG=$(git log -1 --pretty=format:'%s' | cut -c1-72)
          fi
          # Se publica por rama, no por canal: `--branch` crea la rama si no
          # existe, `--channel` falla si el canal todavía no está mapeado. Los
          # tres perfiles de `eas.json` usan canales con el mismo nombre que su
          # rama, así que apuntan al mismo sitio.
          eas update --branch "$CANAL" --message "$MSG" --non-interactive

      - name: Resumen
        if: success()
        env:
          CANAL: ${{ github.event.inputs.channel || 'preview' }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          echo "### ✅ Update publicado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Canal: **$CANAL** · llega sólo a los teléfonos con la **$VER** instalada." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Se descarga al reabrir la app." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: https://expo.dev/accounts/vetawallet/projects/veta-wallet/updates" >> $GITHUB_STEP_SUMMARY
