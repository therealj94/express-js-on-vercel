name: Veta Wallet — compilar Android

# Compila Android en los servidores de Expo. No hace falta tener nada
# instalado en tu computadora: se lanza desde la pestaña Actions.
#
#   Actions → "Veta Wallet — compilar Android" → Run workflow → elegir perfil
#
# Qué perfil elegir:
#
#   development  Para PROBAR. Reemplaza a Expo Go: se instala una vez y
#                recibe los cambios en vivo igual que Expo Go, pero atado
#                al SDK de este proyecto. Deja de importar qué versión de
#                Expo Go tengas — que es justo el problema que da
#                "Failed to download remote update" cuando el SDK del
#                proyecto y el de Expo Go no coinciden.
#                Además incluye los módulos nativos que Expo Go no trae
#                (los avisos con la app cerrada).
#
#   preview      APK para repartir a gente que solo va a usar la app.
#                Sin recarga en vivo; recibe updates del channel "preview".
#
#   production   AAB (App Bundle) para subir a Google Play Console. Este es
#                el que pide la tienda — Play ya no acepta APK para apps
#                nuevas. Compilarlo no necesita la cuenta de Play Console
#                todavía: eso hace falta recién al momento de subirlo.
#
# Requisito (ya configurado): el secreto EXPO_TOKEN del repositorio.

# También se puede pedir una compilación SIN entrar a la pestaña Actions:
# escribiendo el perfil en `veta-wallet-app/.solicitud-de-build` y empujando el
# cambio. Existe porque el operador automático puede empujar código pero no
# tiene permiso para apretar el botón de Actions, y esperar a que alguien lo
# apriete a mano convertía cada compilación en una cita.
#
# Sólo se dispara cuando cambia ESE archivo, así que los demás empujes no
# gastan una build.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de build'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production
  push:
    paths:
      - 'veta-wallet-app/.solicitud-de-build'

concurrency:
  group: veta-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veta-wallet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # De dónde sale el perfil: del menú si se lanzó a mano, y si no del
      # archivo de solicitud. Se valida contra la lista en vez de pasarlo tal
      # cual, porque va derecho a una línea de comandos.
      - name: Qué perfil
        id: perfil
        run: |
          P="${{ inputs.profile }}"
          if [ -z "$P" ] && [ -f .solicitud-de-build ]; then
            P=$(grep -vE '^\s*(#|$)' .solicitud-de-build | head -1 | tr -d '[:space:]')
          fi
          case "$P" in
            development|preview|production) ;;
            *) echo "::error::Perfil no reconocido: '$P'. Tiene que ser development, preview o production."; exit 1 ;;
          esac
          echo "perfil=$P" >> $GITHUB_OUTPUT
          echo "Compilando el perfil: $P"

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: veta-wallet-app/package-lock.json

      - name: EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install
        run: npm ci

      # Mismo chequeo previo que usa el workflow de updates: caza desfases
      # de SDK y dependencias mal puestas antes de gastar una build entera.
      - name: Verificar
        run: npm run verificar

      # Los tres identificadores de OAuth se pegan una vez en
      # Settings → Secrets and variables → Actions → Variables, y de ahí entran
      # a eas.json. Si no están, avisa y sigue: la app esconde los botones.
      - name: Identificadores de Google
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: node scripts/inyectar-google.js

      - name: Compilar
        id: compilar
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN. Créalo en Settings → Secrets → Actions."
            exit 1
          fi
          eas build \
            --platform android \
            --profile "${{ steps.perfil.outputs.perfil }}" \
            --non-interactive \
            --wait \
            --json | tee build.json
          URL=$(node -e "
            const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));
            const x=Array.isArray(b)?b[0]:b;
            process.stdout.write((x&&x.artifacts&&(x.artifacts.buildUrl||x.artifacts.applicationArchiveUrl))||'');
          ")
          echo "url=$URL" >> $GITHUB_OUTPUT

      # La huella SHA-1 del certificado con que EAS firma la app. Google Cloud
      # la pide para el identificador de Android, y no existe hasta que hay una
      # primera compilación: por eso compilar es el paso 1 de configurar Google,
      # no un desvío antes de configurarlo.
      #
      # Se saca del archivo compilado con `keytool`, que lee la firma de verdad.
      # Es a propósito no preguntarle a la API de Expo: lo que importa no es qué
      # llave dice Expo que tiene guardada, sino con cuál quedó firmado esto.
      #
      # Nunca tumba la corrida: si algo falla, la huella también está en el
      # panel de credenciales de Expo.
      - name: Huella SHA-1
        if: success() && steps.compilar.outputs.url != ''
        continue-on-error: true
        run: |
          set -e
          curl -sL --max-time 300 -o app.bin "${{ steps.compilar.outputs.url }}"
          echo "### Huella del certificado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -printcert -jarfile app.bin 2>/dev/null \
            | grep -iE 'SHA1:|SHA-1:|SHA256:|SHA-256:|Owner:' \
            | sed 's/^[[:space:]]*//' >> $GITHUB_STEP_SUMMARY || \
            echo "no se pudo leer la firma de este archivo" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "La **SHA1** es la que pide Google Cloud al crear el identificador de Android, junto con el paquete \`com.ordenglobal.vetawallet\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.perfil.outputs.perfil }}" != "production" ]; then
            echo "> Ojo: ésta es la huella del perfil **${{ steps.perfil.outputs.perfil }}**. La app publicada se firma con la de \`production\`, y si se registra la equivocada, Google funciona mientras probás y deja de funcionar en la tienda. Registrá **las dos** en Google Cloud — se pueden agregar varias huellas al mismo identificador." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dónde descargarlo
        if: always()
        run: |
          echo "### Build de Android" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Perfil: **${{ steps.perfil.outputs.perfil }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.compilar.outputs.url }}" ]; then
            echo "Descarga directa: ${{ steps.compilar.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Panel de Expo: https://expo.dev/accounts/vetawallet/projects/veta-wallet/builds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.perfil.outputs.perfil }}" = "production" ]; then
            echo "Es un **.aab**, no se instala directo en un teléfono: se sube en Play Console → Producción (o Prueba interna) → Crear versión nueva." >> $GITHUB_STEP_SUMMARY
          else
            echo "Es un **APK**: ábrelo desde el teléfono y se instala." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.perfil.outputs.perfil }}" = "production" ]; then
            echo "Es un **.aab**, no se instala directo en un teléfono: se sube en Play Console → Producción (o Prueba interna) → Crear versión nueva." >> $GITHUB_STEP_SUMMARY
          else
            echo "Ábrelo desde el teléfono y se instala. Si es el perfil \`development\`, después abre la app y apunta al servidor con \`npx expo start\` o carga el channel \`development\`." >> $GITHUB_STEP_SUMMARY
          fi
