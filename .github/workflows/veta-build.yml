name: Veta Wallet — compilar Android

# Compila Android en los servidores de Expo. No hace falta tener nada
# instalado en tu computadora: se lanza desde la pestaña Actions.
#
#   Actions → "Veta Wallet — compilar Android" → Run workflow → elegir perfil
#
# Qué perfil elegir:
#
#   development  Para PROBAR. Reemplaza a Expo Go: se instala una vez y
#                recibe los cambios en vivo igual que Expo Go, pero atado
#                al SDK de este proyecto. Deja de importar qué versión de
#                Expo Go tengas — que es justo el problema que da
#                "Failed to download remote update" cuando el SDK del
#                proyecto y el de Expo Go no coinciden.
#                Además incluye los módulos nativos que Expo Go no trae
#                (los avisos con la app cerrada).
#
#   preview      APK para repartir a gente que solo va a usar la app.
#                Sin recarga en vivo; recibe updates del channel "preview".
#
#   production   AAB (App Bundle) para subir a Google Play Console. Este es
#                el que pide la tienda — Play ya no acepta APK para apps
#                nuevas. Compilarlo no necesita la cuenta de Play Console
#                todavía: eso hace falta recién al momento de subirlo.
#
# Requisito (ya configurado): el secreto EXPO_TOKEN del repositorio.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de build'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veta-wallet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: veta-wallet-app/package-lock.json

      - name: EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install
        run: npm ci

      # Mismo chequeo previo que usa el workflow de updates: caza desfases
      # de SDK y dependencias mal puestas antes de gastar una build entera.
      - name: Verificar
        run: npm run verificar

      - name: Compilar
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN. Créalo en Settings → Secrets → Actions."
            exit 1
          fi
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait

      - name: Dónde descargarlo
        if: always()
        run: |
          echo "### Build de Android lista" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Perfil: **${{ inputs.profile }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descárgala desde el panel de Expo — el enlace aparece en la fila de la build:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/vetawallet/projects/veta-wallet/builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.profile }}" = "production" ]; then
            echo "Es un **.aab**, no se instala directo en un teléfono: se sube en Play Console → Producción (o Prueba interna) → Crear versión nueva." >> $GITHUB_STEP_SUMMARY
          else
            echo "Ábrelo desde el teléfono y se instala. Si es el perfil \`development\`, después abre la app y apunta al servidor con \`npx expo start\` o carga el channel \`development\`." >> $GITHUB_STEP_SUMMARY
          fi
