name: Hotspot Libre (Android)

on:
  push:
    paths:
      - 'hotspot-libre/**'
      - '.github/workflows/hotspot-libre-android.yml'
  pull_request:
    paths:
      - 'hotspot-libre/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotspot-libre
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del proxy
        run: gradle testDebugUnitTest --no-daemon

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-libre-debug-apk
          path: hotspot-libre/app/build/outputs/apk/debug/app-debug.apk
