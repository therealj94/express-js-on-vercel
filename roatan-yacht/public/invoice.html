<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice — Roatán Private Yacht Getaways</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
<style>
  @media print {
    .topbar, .ticks, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .plate { border-color: #ccc; box-shadow: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brandmark" href="/"><b>Roatán Yacht Getaways</b><span>by Love Cloud</span></a>
    <nav><button class="btn btn-ghost btn-sm no-print" onclick="window.print()">Print / save PDF</button></nav>
  </div>
</header>
<div class="ticks"></div>

<main class="block">
  <div class="wrap" id="out" style="max-width:720px"><p class="small">Loading invoice…</p></div>
</main>

<script type="module">
const money = (n, c = 'USD') =>
  new Intl.NumberFormat('en-US', { style: 'currency', currency: c, minimumFractionDigits: 2 }).format(n)
const number = new URLSearchParams(location.search).get('n')
const out = document.getElementById('out')

async function load() {
  if (!number) { out.innerHTML = '<div class="notice">No invoice number in the link.</div>'; return }
  const res = await fetch(`/api/invoices/${encodeURIComponent(number)}`)
  const data = await res.json().catch(() => ({ ok: false, error: 'Something went wrong.' }))
  if (!data.ok) { out.innerHTML = `<div class="notice">${data.error}</div>`; return }

  const inv = data.invoice
  const paid = inv.status === 'paid'
  out.innerHTML = `
    <div class="stack" style="gap:22px">
      <div class="stack" style="gap:8px">
        <p class="label">Invoice ${inv.number}</p>
        <h1>${paid ? 'Paid. Thank you.' : `${money(inv.total, inv.currency)} due`}</h1>
        <p class="small">From ${data.brand}${inv.dueDate ? ` · due ${inv.dueDate}` : ''}</p>
      </div>

      <div class="plate">
        <div class="plate-head">
          <h3>Billed to ${inv.customer.name || inv.customer.email}</h3>
          <span class="chip ${paid ? 'ok' : 'signal'}">${paid ? 'Paid' : inv.status}</span>
        </div>
        <div class="plate-body">
          <div class="tablewrap">
            <table>
              <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead>
              <tbody>
                ${inv.lines.map((l) => `
                  <tr>
                    <td><strong>${l.label}</strong>${l.detail ? `<br><span class="small faint">${l.detail}</span>` : ''}</td>
                    <td class="num">${l.qty}</td>
                    <td class="num">${money(l.unitPrice, inv.currency)}</td>
                    <td class="num">${money(l.amount, inv.currency)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="totals">
            <div class="mline grand"><span>Total due</span><span class="amt">${money(inv.total, inv.currency)}</span></div>
          </div>
          ${inv.notes ? `<p class="small">${inv.notes}</p>` : ''}
          ${!paid && inv.paymentUrl
            ? `<a class="btn btn-primary btn-block no-print" href="${inv.paymentUrl}">Pay ${money(inv.total, inv.currency)} now</a>`
            : !paid
              ? '<div class="notice no-print">Card payment is not switched on yet. Reply to the email with how you would like to pay and we will send instructions.</div>'
              : ''}
        </div>
      </div>
      ${inv.bookingRef ? `<p class="small faint">Related booking: ${inv.bookingRef}</p>` : ''}
    </div>`
}
load()
</script>
</body>
</html>
