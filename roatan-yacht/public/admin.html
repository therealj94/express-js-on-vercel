<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Roatán Private Yacht Getaways</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brandmark" href="/admin.html"><b>Bridge</b><span>Roatán Yacht Getaways admin</span></a>
    <nav>
      <a href="/" class="desktop-only">View the site</a>
      <button class="btn btn-ghost btn-sm hidden" id="signOut" type="button">Sign out</button>
    </nav>
  </div>
</header>
<div class="horizon"></div>

<main class="block">
  <div class="wrap">

    <div id="login" class="stack" style="gap:18px; max-width:400px">
      <div class="stack" style="gap:6px">
        <p class="eyebrow">Staff only</p>
        <h1>Sign in</h1>
      </div>
      <form class="panel" id="loginForm">
        <div class="panel-body">
          <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          <div id="loginError"></div>
        </div>
      </form>
    </div>

    <div id="app" class="hidden stack" style="gap:22px">
      <div class="steps-nav" id="tabs"></div>
      <div id="systemNote"></div>
      <div id="view"></div>
    </div>

  </div>
</main>

<script src="/admin.js" type="module"></script>
</body>
</html>
