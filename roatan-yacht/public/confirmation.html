<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your booking — Roatán Private Yacht Getaways</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brandmark" href="/"><b>Roatán Yacht Getaways</b><span>by Love Cloud</span></a>
    <nav><a href="/lookup.html">Find another booking</a></nav>
  </div>
</header>
<div class="horizon"></div>

<main class="block">
  <div class="wrap" id="out" style="max-width:760px">
    <p class="small">Loading your booking…</p>
  </div>
</main>

<script type="module">
const money = (n, c = 'USD') =>
  new Intl.NumberFormat('en-US', { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(n)
const params = new URLSearchParams(location.search)
const ref = params.get('ref')
const justPaid = params.get('paid') === '1'
const out = document.getElementById('out')

function render(booking, settings) {
  const paidLabel = {
    paid: 'Paid in full',
    deposit_paid: 'Deposit received',
    unpaid: 'Awaiting payment',
  }[booking.paymentStatus]

  out.innerHTML = `
    <div class="stack" style="gap:26px">
      <div class="stack" style="gap:10px">
        <p class="eyebrow">Booking ${booking.ref} · ${paidLabel}</p>
        <h1>You are on the water${booking.customer.name ? `, ${booking.customer.name.split(' ')[0]}` : ''}.</h1>
        <p class="small">${justPaid ? 'Payment went through. ' : ''}We sent the details to ${booking.customer.email}. Show this page — or just the booking number — at the marina.</p>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>${booking.vesselName}</h3>
          <span class="tag ${booking.paymentStatus === 'paid' ? 'ok' : 'brass'}">${paidLabel}</span>
        </div>
        <div class="panel-body">
          <div class="grid cols-3">
            <div class="stat"><span class="k">Departure</span><span class="v" style="font-size:1.1rem">${booking.date}</span></div>
            <div class="stat"><span class="k">Guests</span><span class="v" style="font-size:1.1rem">${booking.guests}</span></div>
            <div class="stat"><span class="k">Boarding pass</span><span class="v" style="font-size:1.1rem">${booking.boardingPass}</span></div>
          </div>
          <div class="manifest">
            ${booking.lines.map((l) => `
              <div class="mline">
                <span class="lbl"><span>${l.label}</span>${l.detail ? `<span class="det">${l.detail}</span>` : ''}</span>
                <span class="amt">${money(l.amount, booking.currency)}</span>
              </div>`).join('')}
          </div>
          <div class="totals">
            <div class="mline grand"><span>Total</span><span class="amt">${money(booking.total, booking.currency)}</span></div>
            <div class="mline"><span>Paid so far</span><span class="amt">${money(booking.amountPaid || 0, booking.currency)}</span></div>
            ${booking.total - (booking.amountPaid || 0) > 0.01
              ? `<div class="mline"><span>Balance due 48 h before departure</span><span class="amt">${money(booking.total - (booking.amountPaid || 0), booking.currency)}</span></div>`
              : ''}
          </div>
        </div>
      </div>

      <div class="notice">
        <strong>Where to meet us</strong>
        <span class="small">${settings.departurePoint}</span>
        <span class="small">Questions before the day? WhatsApp ${settings.whatsapp} or email ${settings.contactEmail}.</span>
      </div>

      <div class="notice good">
        <strong>What to bring</strong>
        <span class="small">Swimsuit, a towel you like, reef-safe sunscreen, and a card or cash for the crew if they earn it. Everything else is aboard.</span>
      </div>

      <p class="small faint">${settings.cancellationPolicy}</p>
    </div>`
}

async function load() {
  if (!ref) {
    out.innerHTML = '<div class="notice bad">No booking number in the link. <a href="/lookup.html">Look yours up here.</a></div>'
    return
  }
  try {
    const res = await fetch(`/api/bookings/${encodeURIComponent(ref)}`)
    const data = await res.json()
    if (!data.ok) throw new Error(data.error)
    render(data.booking, data.settings)
  } catch (err) {
    out.innerHTML = `<div class="notice bad">${err.message} <a href="/lookup.html">Try looking it up.</a></div>`
  }
}
load()
</script>
</body>
</html>
