<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ORIGEN — La misma regla</title>
<style>
@font-face{font-family:Fraunces;src:url(fraunces-latin-400-normal.woff2) format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:Fraunces;src:url(fraunces-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal}
@font-face{font-family:Fraunces;src:url(fraunces-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:Inter;src:url(inter-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url(inter-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url(inter-latin-600-normal.woff2) format('woff2');font-weight:600}
html,body{margin:0;background:#000}
#gl{display:none}
</style>
<script src="topojson-client.min.js"></script>
<script src="mundo.js"></script>
<script src="datos.js"></script>
<script src="shader.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="out"></canvas>
<script>
// ============================================================
// ORIGEN · «La misma regla» · 9:16 · 1080x1920 · 30 fps
// Los tiempos salen de la voz (datos.js): cada escena cae en su palabra.
// ============================================================
const W=1080, H=1920, DUR=window.TIEMPOS.duracion;
const GLS=.75, gw=Math.round(W*GLS), gh=Math.round(H*GLS);
const out=document.getElementById('out'); out.width=W; out.height=H;
const ctx=out.getContext('2d');
const glc=document.getElementById('gl'); glc.width=gw; glc.height=gh;
const gl=glc.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:true});

// ---------- tiempos de la voz ----------
const TP=window.TIEMPOS.palabras, FR=window.TIEMPOS.frases;
const P=(w,k=0)=>TP[w][k];
const F=n=>FR[n-1];

// ---------- utilidades ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const ss=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u);};
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const win=(t,a,b,fi=.4,fo=.4)=>ss(a,a+fi,t)*(1-ss(b-fo,b,t));
let semilla=7; const rnd=()=>{semilla=(semilla*16807)%2147483647;return (semilla-1)/2147483646;};
const CREMA='#F4EBDD', ORO1='#FFE3A3', ORO2='#E0A43A', ORO3='#9A6414', ROJO='#FF3B30';
function oroGrad(y,px){const g=ctx.createLinearGradient(0,y-px*.85,0,y+px*.2);g.addColorStop(0,ORO1);g.addColorStop(.55,ORO2);g.addColorStop(1,ORO3);return g;}

// ---------- WebGL ----------
const VS=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
function sh(tp,src){const s=gl.createShader(tp);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,window.FS));
gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={}; for(const n of ['uRes','uT','uTopY','uR','uPlanet','uDawn','uFlash','uSeed','uSpeed','uScale','uMat','uMode','uDiscY','uDiscR']) U[n]=gl.getUniformLocation(prog,n);
gl.viewport(0,0,gw,gh);
function glRender(t,s){
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes,gw,gh); gl.uniform1f(U.uScale,GLS); gl.uniform1f(U.uT,t);
  gl.uniform1f(U.uTopY,s.topY||1150); gl.uniform1f(U.uR,1400); gl.uniform1f(U.uPlanet,s.planet??1);
  gl.uniform1f(U.uDawn,s.dawn??.9); gl.uniform1f(U.uFlash,s.flash||0); gl.uniform1f(U.uSeed,s.seed||0);
  gl.uniform1f(U.uSpeed,s.speed??.1); gl.uniform1i(U.uMat,s.mat||0); gl.uniform1i(U.uMode,s.mode||0);
  gl.uniform1f(U.uDiscY,s.discY||820); gl.uniform1f(U.uDiscR,s.discR||280);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ---------- mapa real (Natural Earth vía world-atlas) ----------
const MAPA={x0:70,y0:560,k:11.2,lon0:-118,lat0:33};
const proy=(lat,lon)=>[MAPA.x0+(lon-MAPA.lon0)*MAPA.k, MAPA.y0+(MAPA.lat0-lat)*MAPA.k];
const enRegion=(lon,lat)=>lon>-120&&lon<-30&&lat>-60&&lat<32.6;
const topo=window.MUNDO;
const feats=topojson.feature(topo,topo.objects.countries).features;
const PAISES=[]; const idsLatam=new Set();
for(const f of feats){
  const polys=f.geometry?(f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.type==='MultiPolygon'?f.geometry.coordinates:[]):[];
  const anillos=[];
  for(const pol of polys){ const r=pol[0]; let sx=0,sy=0; for(const [lo,la] of r){sx+=lo;sy+=la;} sx/=r.length; sy/=r.length;
    let mn=1e9,mx=-1e9; for(const [lo] of r){mn=Math.min(mn,lo);mx=Math.max(mx,lo);}
    if(enRegion(sx,sy)&&mx-mn<60&&f.id!=='840') anillos.push(r); }
  if(!anillos.length) continue;
  idsLatam.add(f.id);
  const path=new Path2D(); let cx=0,cy=0,n=0,big=0,bigC=[0,0];
  for(const r of anillos){ let ax=0,ay=0; r.forEach(([lo,la],i)=>{const [x,y]=proy(la,lo); if(i===0) path.moveTo(x,y); else path.lineTo(x,y); ax+=x; ay+=y;}); path.closePath();
    if(r.length>big){big=r.length; bigC=[ax/r.length, ay/r.length];} }
  PAISES.push({id:f.id, path, c:bigC});
}
const mesh=topojson.mesh(topo,topo.objects.countries,(a,b)=>a!==b&&idsLatam.has(a.id)&&idsLatam.has(b.id));
const FRONTERAS=new Path2D();
for(const line of mesh.coordinates){ line.forEach(([lo,la],i)=>{const [x,y]=proy(la,lo); if(i===0) FRONTERAS.moveTo(x,y); else FRONTERAS.lineTo(x,y);}); }
const MAPC=[540,1058];

// puntos de población: dentro de tierra, más densos cerca de las ciudades
const CAPITALES=[['México','$',19.43,-99.13],['Guatemala','Q',14.63,-90.51],['Honduras','L',14.07,-87.19],['El Salvador','$',13.69,-89.19],
['Nicaragua','C$',12.11,-86.24],['Costa Rica','₡',9.93,-84.08],['Panamá','B/.',8.98,-79.52],['Cuba','$',23.11,-82.37],
['Rep. Dominicana','RD$',18.49,-69.93],['Haití','G',18.54,-72.34],['Colombia','$',4.71,-74.07],['Venezuela','Bs',10.49,-66.88],
['Ecuador','$',-0.18,-78.47],['Perú','S/',-12.05,-77.04],['Bolivia','Bs',-16.5,-68.15],['Brasil','R$',-15.79,-47.88],
['Paraguay','₲',-25.26,-57.58],['Uruguay','$U',-34.9,-56.16],['Argentina','$',-34.6,-58.38],['Chile','$',-33.45,-70.67]];
const DESP={'Guatemala':[-26,-4],'Honduras':[8,-20],'El Salvador':[-20,26],'Nicaragua':[26,0],'Costa Rica':[-22,24],'Panamá':[20,26],
  'Haití':[-22,-14],'Rep. Dominicana':[26,-14],'Uruguay':[28,10],'Argentina':[-20,10],'Paraguay':[20,-8],'Venezuela':[0,-16],'Colombia':[22,4],'Ecuador':[-24,4]};
const CAPS=CAPITALES.map(([n,s,la,lo],i)=>({n,s,p:proy(la,lo),i,d:DESP[n]||[0,-16]}));
const CIUDADES_EXTRA=[[20.67,-103.35],[25.69,-100.31],[-23.55,-46.63],[-22.9,-43.2],[6.25,-75.56],[3.45,-76.53],[-31.42,-64.18],[-12.97,-38.5],[-3.72,-38.54],[-8.05,-34.9],[-19.92,-43.94],[-30.03,-51.23],[10.39,-75.48],[32.5,-117.0],[-2.19,-79.89],[-17.78,-63.18],[-3.1,-60.02],[-1.45,-48.5],[21.16,-86.85]];
(()=>{ const g=document.createElement('canvas').getContext('2d'); CAPS.forEach(cp=>{ cp.pais=PAISES.find(p=>g.isPointInPath(p.path,cp.p[0],cp.p[1]))||null; }); })();
const PUNTOS=[];
(()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#fff'; for(const p of PAISES) g.fill(p.path);
  const d=g.getImageData(0,0,W,H).data; const tierra=(x,y)=>{x|=0;y|=0;return x>=0&&y>=0&&x<W&&y<H&&d[(y*W+x)*4]>128;};
  const focos=[...CAPS.map(c=>c.p),...CIUDADES_EXTRA.map(([a,b])=>proy(a,b))];
  let n=0,guard=0;
  while(n<5200&&guard<400000){ guard++;
    let x,y;
    if(rnd()<.45){ const f=focos[Math.floor(rnd()*focos.length)]; const r=Math.pow(rnd(),1.6)*38, a=rnd()*6.283; x=f[0]+Math.cos(a)*r; y=f[1]+Math.sin(a)*r; }
    else { x=60+rnd()*960; y=520+rnd()*1060; }
    if(!tierra(x,y)) continue;
    let pais=null; for(const p of PAISES){ if(g.isPointInPath(p.path,x,y)){pais=p;break;} }
    PUNTOS.push({x,y,t:.6+Math.pow(rnd(),.8)*3.6,ph:rnd()*6.28,s:.7+rnd()*1.1,pais}); n++; }
})();

// ---------- cámara del mapa ----------
function camara(t){
  const base={s:1,cx:540,cy:1010};
  const ruta={s:1.75,cx:proy(4,-88)[0],cy:proy(4,-88)[1]+40};
  const gl2={s:1.45,cx:proy(3.5,-91)[0],cy:proy(3.5,-91)[1]+40};
  const lejos={s:.8,cx:540,cy:1010};
  const KF=[[0,base],[F(3).ini-.6,base],[F(3).ini+.6,ruta],[F(3).fin+.5,ruta],[F(3).fin+1.9,base],
    [F(9).ini-1.2,base],[F(9).ini+.2,gl2],[F(9).fin,gl2],[F(9).fin+1.4,base],[P('mundial'),base],[P('mundial')+2.2,lejos]];
  let c={...KF[KF.length-1][1]};
  for(let i=0;i<KF.length-1;i++){ const [ta,A]=KF[i],[tb,B]=KF[i+1];
    if(t>=ta&&t<tb){ const k=eInOut((t-ta)/(tb-ta)); c={s:lerp(A.s,B.s,k),cx:lerp(A.cx,B.cx,k),cy:lerp(A.cy,B.cy,k)}; break; } }
  c.s*=1+.012*Math.sin(t*.4);
  return c;
}
const aPantalla=(c,[x,y])=>[(x-c.cx)*c.s+540,(y-c.cy)*c.s+960];

// ---------- mapa: escena completa ----------
function dibujarMapa(t,a){
  if(a<=.003) return;
  const c=camara(t);
  const tFrontera=P('fronteras'), tCura=P('fragmentos');
  const grieta=ss(tFrontera-.1,tFrontera+.5,t)*(1-ss(tCura-.4,tCura+.8,t));
  const cura=ss(tCura-.4,tCura+.8,t);
  const explota=grieta*.045;
  const congela=win(t,F(4).ini-.3,F(5).ini+.4,.5,.5);
  const escaneo=clamp((t-(P('regla')-.1))/1.6);
  ctx.save(); ctx.globalAlpha=a;
  ctx.translate(540,960); ctx.scale(c.s,c.s); ctx.translate(-c.cx,-c.cy);
  // países
  for(const p of PAISES){
    const dx=(p.c[0]-MAPC[0])*explota, dy=(p.c[1]-MAPC[1])*explota;
    ctx.save(); ctx.translate(dx,dy);
    ctx.fillStyle=`rgba(${Math.round(lerp(22,40,cura))},${Math.round(lerp(22,30,cura))},${Math.round(lerp(34,18,cura))},${.85})`;
    ctx.fill(p.path);
    ctx.lineWidth=1/c.s; ctx.strokeStyle=`rgba(255,220,160,${.10+.1*cura})`; ctx.stroke(p.path);
    ctx.restore();
  }
  // puntos de población
  for(const d of PUNTOS){
    const ap=clamp((t-d.t)/.5); if(ap<=0) continue;
    const off=d.pais?[(d.pais.c[0]-MAPC[0])*explota,(d.pais.c[1]-MAPC[1])*explota]:[0,0];
    const tw=.55+.45*Math.sin(t*2.2+d.ph);
    let r=255,g=205,b=130;
    if(congela>0){ const gris=congela*(1-ss(0,.08,escaneo-(d.y-450)/1150)); r=lerp(r,150,gris); g=lerp(g,150,gris); b=lerp(b,160,gris); }
    ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},${(ap*tw*.8).toFixed(3)})`;
    const s=d.s*1.25/Math.sqrt(c.s); ctx.fillRect(d.x+off[0]-s/2,d.y+off[1]-s/2,s,s);
  }
  // fronteras: grieta roja → costura de oro
  if(grieta>.01||cura>.01){
    ctx.save(); ctx.lineJoin='round';
    const col=cura>0?`rgba(${Math.round(lerp(255,255,cura))},${Math.round(lerp(59,200,cura))},${Math.round(lerp(48,110,cura))},`:'rgba(255,59,48,';
    const pulso=.65+.35*Math.sin(t*9);
    const vis=Math.max(grieta*(congela>0?1-.6*congela:pulso),cura*(1-ss(F(11).ini,F(11).ini+1,t)*.4));
    ctx.shadowColor=col+'1)'; ctx.shadowBlur=14;
    ctx.strokeStyle=col+(vis*.95).toFixed(3)+')'; ctx.lineWidth=(2.2+cura)/c.s; ctx.stroke(FRONTERAS);
    ctx.restore();
  }
  // capitales con su moneda
  const tCap0=F(2).ini+.1;
  const tUno=P('dinero',2);
  CAPS.forEach((cp,i)=>{
    const t0=tCap0+i*.075; const ap=eOut((t-t0)/.35); if(ap<=0) return;
    const pais=cp.pais;
    const off=pais?[(pais.c[0]-MAPC[0])*explota,(pais.c[1]-MAPC[1])*explota]:[0,0];
    const x=cp.p[0]+off[0], y=cp.p[1]+off[1];
    const esc=ss(P('regla')-.1+(y-450)/1150*1.6,P('regla')+(y-450)/1150*1.6+.2,t);
    const oro=Math.max(cura,esc*congela);
    ctx.save();
    ctx.shadowColor=oro>.5?'rgba(255,200,110,1)':'rgba(255,255,255,.9)'; ctx.shadowBlur=18;
    ctx.fillStyle=oro>.5?ORO1:'#fff';
    ctx.beginPath(); ctx.arc(x,y,4.2*ap/Math.sqrt(c.s)*1.2,0,7); ctx.fill();
    // símbolo de moneda → marca de gramín
    const uni=ss(tUno-.6,tUno+.3,t);
    const aS=ap*win(t,t0,F(11).ini+.6,.3,.5);
    if(aS>0){
      ctx.shadowBlur=8; ctx.textAlign='center';
      const fs=26/Math.sqrt(c.s);
      if(uni<1){ ctx.globalAlpha=aS*(1-uni); ctx.font=`600 ${fs}px Inter`; ctx.fillStyle=grieta>.3&&cura<.5?'#FFD0C8':CREMA; ctx.fillText(cp.s,x+cp.d[0]/Math.sqrt(c.s),y+(cp.d[1]+8)/Math.sqrt(c.s)); }
      if(uni>0){ ctx.globalAlpha=aS*uni; ctx.strokeStyle=ORO1; ctx.lineWidth=2/Math.sqrt(c.s); ctx.beginPath(); ctx.arc(x,y-20/Math.sqrt(c.s),8/Math.sqrt(c.s),0,7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y-28/Math.sqrt(c.s)); ctx.lineTo(x,y-32/Math.sqrt(c.s)); ctx.stroke(); }
    }
    ctx.restore();
  });
  // escaneo de la regla de oro
  if(escaneo>0&&escaneo<1){
    const y=lerp(430,1600,escaneo);
    ctx.save(); const g=ctx.createLinearGradient(0,y-60,0,y+4); g.addColorStop(0,'rgba(255,200,110,0)'); g.addColorStop(1,'rgba(255,220,160,.55)');
    ctx.fillStyle=g; ctx.fillRect(-400,y-60,1900,64);
    ctx.shadowColor='rgba(255,200,110,1)'; ctx.shadowBlur=24; ctx.strokeStyle=ORO1; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-400,y); ctx.lineTo(1500,y); ctx.stroke();
    for(let i=0;i<=60;i++){ const x=-60+i*20; ctx.lineWidth=i%5===0?2.5:1.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-(i%5===0?22:10)); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
  return c;
}

// ---------- escena 3: el envío que se encoge ----------
const RUTA=[[19.43,-99.13],[14.63,-90.51],[14.07,-87.19],[12.11,-86.24],[9.93,-84.08],[8.98,-79.52],[4.71,-74.07],[-0.18,-78.47],[-12.05,-77.04]].map(([a,b])=>proy(a,b));
function envioLento(t){
  const t0=F(3).ini+.2, t1=P('camino')+.1;
  if(t<t0-.3||t>F(4).ini+.6) return;
  const c=camara(t);
  const n=RUTA.length-1; const u=clamp((t-t0)/(t1-t0));
  // avance con tirones: se detiene en cada frontera
  const seg=u*n; const k=Math.min(Math.floor(seg),n-1); const f=seg-k;
  const avance=f<.45?0:eInOut((f-.45)/.55);
  const [ax,ay]=RUTA[k], [bx,by]=RUTA[k+1];
  const x=lerp(ax,bx,avance), y=lerp(ay,by,avance);
  const perdida=Math.pow(.9,k+(f>.2?1:0));
  const fade=1-ss(F(4).ini,F(4).ini+.6,t);
  ctx.save(); ctx.globalAlpha=fade;
  ctx.translate(540,960); ctx.scale(c.s,c.s); ctx.translate(-c.cx,-c.cy);
  // estela
  ctx.strokeStyle='rgba(255,210,140,.35)'; ctx.setLineDash([4,6]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(RUTA[0][0],RUTA[0][1]); for(let i=1;i<=k;i++) ctx.lineTo(RUTA[i][0],RUTA[i][1]); ctx.lineTo(x,y); ctx.stroke(); ctx.setLineDash([]);
  // choque en frontera: anillo rojo y una gota que se cae
  if(f<.45&&k>0||(k===0&&f>.2&&f<.45)){
    const ch=clamp(f/.45);
    ctx.strokeStyle=`rgba(255,59,48,${(1-ch)*.9})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,10+ch*22,0,7); ctx.stroke();
    ctx.fillStyle=`rgba(255,200,110,${(1-ch)*.8})`; ctx.beginPath(); ctx.arc(x+ch*10,y+ch*30,3*(1-ch),0,7); ctx.fill();
  }
  const r=17*perdida;
  ctx.shadowColor='rgba(255,196,90,1)'; ctx.shadowBlur=25;
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r); g.addColorStop(0,'#FFF6DA'); g.addColorStop(.5,ORO2); g.addColorStop(1,ORO3);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.restore();
  // contador de días
  const dias=t<P('dias')-.9?1:t<P('dias')-.2?2:3;
  const aD=win(t,t0,F(4).ini+.2,.4,.5);
  if(aD>0){ ctx.save(); ctx.globalAlpha=aD; ctx.textAlign='center';
    ctx.font='500 26px Inter'; ctx.letterSpacing='8px'; ctx.fillStyle='rgba(244,235,221,.7)'; ctx.fillText('TIEMPO DE ENVÍO',544,300);
    ctx.letterSpacing='0px'; ctx.font='600 118px Fraunces'; ctx.fillStyle=oroGrad(420,118); ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=30;
    ctx.fillText(`Día ${dias}`,540,420); ctx.restore(); }
}

// ---------- escena 9: el pago en segundos ----------
const GDL=proy(20.67,-103.35), LIM=proy(-12.05,-77.04);
function pagoRapido(t){
  const aE=win(t,F(9).ini-.4,F(10).ini,.5,.6); if(aE<=0) return;
  const c=camara(t);
  const tG=P('guadalajara'), tL=P('lima'), tS=P('segundos')-.15, tC=P('celular');
  ctx.save(); ctx.globalAlpha=aE; ctx.translate(540,960); ctx.scale(c.s,c.s); ctx.translate(-c.cx,-c.cy);
  const ctrl=[(GDL[0]+LIM[0])/2-260,(GDL[1]+LIM[1])/2-60];
  const punto=u=>{const a=(1-u)*(1-u),b=2*(1-u)*u,d=u*u;return [a*GDL[0]+b*ctrl[0]+d*LIM[0],a*GDL[1]+b*ctrl[1]+d*LIM[1]];};
  // ciudades
  const ciudad=(p,t0,nom,izq)=>{ const a=eOut((t-t0)/.4); if(a<=0) return;
    const pul=(t-t0)%1.4/1.4;
    ctx.strokeStyle=`rgba(255,220,160,${(1-pul)*.8*a})`; ctx.lineWidth=2/c.s; ctx.beginPath(); ctx.arc(p[0],p[1],6+pul*26,0,7); ctx.stroke();
    ctx.shadowColor='rgba(255,200,110,1)'; ctx.shadowBlur=20; ctx.fillStyle=ORO1; ctx.beginPath(); ctx.arc(p[0],p[1],6,0,7); ctx.fill();
    ctx.shadowBlur=10; ctx.font=`600 ${30/c.s}px Inter`; ctx.textAlign=izq?'right':'left'; ctx.fillStyle=CREMA; ctx.globalAlpha=aE*a;

  s.topY=lerp(2080,1150,eOut((t-t0)/1.6));
  const c0=F(5).ini+.55, paso=(tOro-c0)/MATS.length;
  if(t>=c0&&t<tOro){ const k=Math.floor((t-c0)/paso); s.mat=MATS[k]; s.seed=k*1.7+.3; s.speed=.45; s.flash=Math.exp(-(t-(c0+k*paso))*14)*.6; }
  if(t>=tOro){ s.mat=0; s.speed=.12; s.flash=Math.exp(-(t-tOro)*4)*1.0; }
  if(t>F(6).ini-.5) s.topY=lerp(1150,2100,eInOut((t-(F(6).ini-.5))/.9));
  glRender(t,s); ctx.save(); ctx.globalAlpha=ss(t0-.1,t0+.4,t); ctx.drawImage(glc,0,0,W,H); ctx.restore();
  titulo(t,'el oro.',tOro,F(6).ini-.2,1000,150,'oro');
  return true;
}
function fondoFinal(t){
  const t0=F(12).ini-.35; if(t<t0) return;
  glRender(t,{mode:0,mat:0,speed:.05,seed:9.1,planet:1,dawn:1,topY:lerp(1950,1600,eOut((t-t0)/1.6)),flash:Math.exp(-(t-t0)*4)*1.0});
  ctx.drawImage(glc,0,0,W,H);
}

// ---------- cuadro ----------
function renderFrame(t){
  ctx.globalAlpha=1; ctx.filter='none'; ctx.fillStyle='#030409'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(540,1000,100,540,1000,1100); g.addColorStop(0,'rgba(40,30,20,.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // mapa: escenas 1–4 y 9–11
  const aMapa=Math.max(1-ss(F(5).ini-.3,F(5).ini+.2,t), ss(F(9).ini-1.2,F(9).ini-.4,t)*(1-ss(F(12).ini-.9,F(12).ini-.3,t)));
  if(aMapa>0) dibujarMapa(t,aMapa);
  envioLento(t); pagoRapido(t); red(t);
  contador(t);
  planeta(t);
  disco(t);
  grafica(t); celular(t);
  fondoFinal(t); marca(t);
  // golpes de luz en momentos clave
  destello(t,P('fronteras'),.18,6); destello(t,P('mundial'),.5,3); destello(t,P('segundos')+.7,.25,6);
  subtitulos(t);
  const negro=Math.max(1-ss(0,.8,t), ss(DUR-.9,DUR,t));
  acabado(t,negro);
  return out.toDataURL('image/jpeg',.94);
}
window.renderFrame=renderFrame;
window.DURACION=DUR;
window.listo=document.fonts.ready.then(async()=>{
  await Promise.all(['400 40px Fraunces','600 40px Fraunces','italic 400 40px Fraunces','400 40px Inter','500 40px Inter','600 40px Inter'].map(f=>document.fonts.load(f)));
  return true;
});
</script>
