<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden Global Explorer · Chain 5550</title>
<meta name="description" content="Explorador oficial de la blockchain Orden Global (chain 5550) · Layer 1 · Hyperledger Besu · consenso QBFT · EVM Shanghai. Bloques, transacciones, direcciones y tokens en tiempo real.">
<meta property="og:title" content="Orden Global Explorer">
<meta property="og:description" content="Explorador oficial de la blockchain Orden Global · Chain 5550 · Layer 1 · Besu QBFT · Shanghai">
<meta property="og:type" content="website">
<meta name="theme-color" content="#04191A">
<!-- Favicon en linea: sin peticiones externas, que la politica de contenido del
     hosting bloquea, y sin un archivo mas que mantener. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304191A'/%3E%3Cpath d='M16 6l8.5 5v10L16 26l-8.5-5V11z' fill='none' stroke='%23C9A961' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23C9A961'/%3E%3C/svg%3E">
<style>
  /* ── Un solo archivo, sin dependencias ni paso de compilacion. Se despliega
       copiandolo a cualquier hosting estatico. Decision deliberada: el equipo
       puede mantenerlo sin instalar nada. ───────────────────────────────── */
  :root{
    --oro:#C9A961; --oro2:#E4CE93; --oro-t:rgba(201,169,97,.13);
    --fondo:#031415; --panel:#072526; --panel2:#0A3132;
    --linea:#123E3F; --linea2:#1B5354;
    --txt:#EDF5F4; --txt2:#9FBDBA; --txt3:#6B908D;
    --ok:#3FB984; --mal:#E86A6A; --info:#5AA9E0;
    --r:14px; --r2:11px;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--fondo);color:var(--txt);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    /* El resplandor dorado del fondo se queda fijo detras del contenido. */
    background-image:radial-gradient(900px 480px at 50% -8%, rgba(201,169,97,.10), transparent 70%);
    background-repeat:no-repeat;background-attachment:fixed;
  }
  a{color:var(--oro);text-decoration:none}
  a:hover{color:var(--oro2)}
  .env{max-width:1180px;margin:0 auto;padding:0 20px}
  h2{font-size:16.5px;font-weight:700;letter-spacing:-.15px}
  .seccion{margin:34px 0}
  .cabecera-seccion{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .cabecera-seccion .mas{font-size:13px;color:var(--txt2)}
  .cabecera-seccion .mas:hover{color:var(--oro)}

  /* ── Cabecera ─────────────────────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--linea);
    background:rgba(4,22,23,.86);backdrop-filter:blur(12px)}
  .barra{display:flex;align-items:center;gap:10px;padding:13px 0}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;
    letter-spacing:-.3px;white-space:nowrap;color:var(--txt);margin-right:8px}
  .logo:hover{color:var(--txt)}
  .logo svg{flex:none}
  .logo span{color:var(--oro)}
  nav{display:flex;gap:4px;font-size:14px;margin-left:auto;flex-wrap:wrap}
  nav a{color:var(--txt2);padding:7px 12px;border-radius:9px;white-space:nowrap}
  nav a:hover{color:var(--txt);background:var(--panel2)}
  nav a.on{color:var(--oro);background:var(--oro-t)}
  /* En pantallas estrechas la navegacion se partia en tres lineas y empujaba
     el logo a un costado. Pasa a una fila propia que se desliza en horizontal. */
  @media(max-width:720px){
    .barra{flex-wrap:wrap;gap:0;padding:11px 0 0}
    .logo{margin:0 0 9px}
    /* El sangrado hasta el borde se hace con margen negativo y ancho AUTO.
       Con `width:calc(100% + 40px)` el 100% se resolvia contra una caja que ya
       tenia su propio ancho, y la barra terminaba midiendo mas que la pantalla:
       la pagina entera se podia arrastrar de lado. */
    /* La barra se desliza DENTRO del margen de la pagina.
       Antes sangraba hasta el borde con margen negativo y `width:calc(100% +
       40px)`, y ese calculo la dejaba midiendo 430px en una pantalla de 390:
       la pagina entera se arrastraba de lado. El sangrado era un adorno; que
       no se pueda mover la pagina en horizontal, no.
       `flex-basis:0` con `flex-grow:1` la hace ocupar la linea que le queda sin
       mirar el ancho de su contenido, y `min-width:0` le da permiso para
       encogerse por debajo de el — que es lo que deja que el desplazamiento
       ocurra por dentro. */
    nav{margin:0;padding:0 0 9px;flex:1 1 0;min-width:0;
      flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    .hero{padding:34px 0 4px}
    .buscar button{padding:0 18px}
  }

  /* ── Portada ──────────────────────────────────────────────────────────── */
  .hero{padding:52px 0 8px;text-align:center}
  .hero .et{display:inline-flex;align-items:center;gap:7px;font-size:12px;
    letter-spacing:.7px;text-transform:uppercase;color:var(--oro);
    background:var(--oro-t);border:1px solid rgba(201,169,97,.28);
    padding:5px 13px;border-radius:999px;margin-bottom:18px}
  .punto{width:6px;height:6px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(63,185,132,.6);animation:latido 2.2s infinite}
  @keyframes latido{70%{box-shadow:0 0 0 7px rgba(63,185,132,0)}100%{box-shadow:0 0 0 0 rgba(63,185,132,0)}}
  .hero h1{font-size:clamp(28px,5.2vw,44px);line-height:1.12;font-weight:800;
    letter-spacing:-1.1px;margin-bottom:13px}
  .hero h1 b{background:linear-gradient(96deg,var(--oro) 15%,var(--oro2) 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--txt2);font-size:16px;max-width:560px;margin:0 auto 26px}

  /* ── Buscador ─────────────────────────────────────────────────────────── */
  .buscar{display:flex;gap:9px;max-width:660px;margin:0 auto}
  .buscar .campo{flex:1;position:relative;min-width:0}
  .buscar .campo svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
  .buscar input{width:100%;background:var(--panel);border:1px solid var(--linea2);
    border-radius:12px;padding:14px 15px 14px 43px;color:var(--txt);font-size:14.5px;
    outline:none;transition:border-color .15s,box-shadow .15s}
  .buscar input::placeholder{color:var(--txt3)}
  .buscar input:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
  .buscar button{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#04191A;
    border:0;border-radius:12px;padding:0 26px;font-weight:700;font-size:14.5px;
    cursor:pointer;white-space:nowrap}
  .buscar button:hover{filter:brightness(1.07)}
  .pista{color:var(--txt3);font-size:12.5px;margin:11px auto 0;text-align:center}
  .pista code{background:var(--panel);border:1px solid var(--linea);border-radius:6px;
    padding:1.5px 7px;font-size:11.5px;cursor:pointer;color:var(--txt2)}
  .pista code:hover{border-color:var(--oro);color:var(--oro)}

  /* ── Tarjetas de cifras ───────────────────────────────────────────────── */
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}
  .tarj{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
    padding:17px 19px;box-shadow:var(--sombra);position:relative;overflow:hidden}
  a.tarj:hover{border-color:var(--linea2);background:var(--panel2)}
  .tarj .et{color:var(--txt3);font-size:11px;text-transform:uppercase;
    letter-spacing:.85px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .tarj .va{font-size:22px;font-weight:750;letter-spacing:-.5px;word-break:break-all;line-height:1.25}
  .tarj .va.oro{color:var(--oro)}
  .tarj .sub{color:var(--txt3);font-size:12px;margin-top:4px}

  /* ── Paneles y filas ──────────────────────────────────────────────────── */
  .panel{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--sombra)}
  .fila{display:flex;justify-content:space-between;gap:14px;padding:13px 17px;
    border-top:1px solid var(--linea);align-items:center}
  .fila:first-child{border-top:0}
  .fila:hover{background:var(--panel2)}
  .izq{min-width:0;flex:1}
  .der{text-align:right;color:var(--txt2);font-size:12.6px;white-space:nowrap;flex:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.7px}
  .cortar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .sub{color:var(--txt3);font-size:12.2px;margin-top:3px}
  .icono{width:30px;height:30px;border-radius:9px;background:var(--oro-t);
    display:grid;place-items:center;flex:none;color:var(--oro);font-size:11px;font-weight:700}
  .conicono{display:flex;gap:11px;align-items:center;min-width:0}

  table{width:100%;border-collapse:collapse}
  td{padding:12px 17px;border-top:1px solid var(--linea);vertical-align:top;font-size:13.8px}
  tr:first-child td{border-top:0}
  .sello{color:var(--txt3);opacity:.6;font-size:11.5px;margin-left:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  td.k{color:var(--txt3);width:200px;white-space:nowrap}
  /* Una linea de ayuda bajo la etiqueta, para los datos que no se explican
     solos. «Tolerancia a caidas» no le dice nada a quien no sabe que es QBFT;
     «cuantos validadores pueden faltar» si. */
  /* «ARTIFICIAL INTELLIGENCE» desbordaba su tarjeta: los nombres largos se
     parten en vez de empujar. */
  .tarj .va{overflow-wrap:anywhere}
  td.k .ayuda{display:block;color:var(--txt3);opacity:.72;font-size:11.5px;
    line-height:1.35;white-space:normal;font-weight:400;margin-top:1px}
  td.v{word-break:break-all}
  @media(max-width:640px){
    td.k{width:auto;display:block;border-top:1px solid var(--linea);padding-bottom:2px;font-size:12px}
    td.v{display:block;border-top:0;padding-top:2px}
  }

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  /* `min-width:0` en las columnas: por defecto una celda de rejilla no se
     encoge por debajo de su contenido mas ancho, asi que un hash largo o una
     tabla con etiquetas fijas estiraban la columna MAS que la pantalla y
     sacaban la pagina de cuadro en el telefono. */
  .cols > *{min-width:0}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}

  /* ── Filtros ──────────────────────────────────────────────────────────── */
  .filtros{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
    padding:15px 17px;margin-bottom:16px;box-shadow:var(--sombra)}
  /* Los filtros se agrupan por lo que preguntan — que, cuando, cuanto, quien —
     en vez de ser seis cajas sueltas en fila. */
  .grupos-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
  .grupo-f{min-width:0}
  .tit-f{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--oro);
    margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--linea)}
  .par-f{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--oro-t);
    border:1px solid rgba(201,169,97,.32);border-radius:999px;padding:5px 12px;
    font-size:12.5px;color:var(--txt2)}
  .chip b{color:var(--oro);font-weight:600}
  .chip .x{color:var(--txt3);font-size:11px}
  .chip:hover{border-color:var(--mal);text-decoration:none}
  .chip:hover .x{color:var(--mal)}
  .campo-f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--txt3);margin-bottom:5px}
  .campo-f input,.campo-f select{width:100%;background:var(--fondo);border:1px solid var(--linea2);
    border-radius:9px;padding:9px 11px;color:var(--txt);font-size:13.5px;outline:none;
    font-family:inherit}
  .campo-f input:focus,.campo-f select:focus{border-color:var(--oro)}
  .campo-f input::-webkit-calendar-picker-indicator{filter:invert(.7)}
  .acciones-f{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap;align-items:center}
  .btn{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#04191A;border:0;
    border-radius:9px;padding:9px 18px;font-weight:700;font-size:13.5px;cursor:pointer;
    font-family:inherit}
  .btn:hover{filter:brightness(1.07)}
  .btn.sec{background:none;border:1px solid var(--linea2);color:var(--txt2)}
  .btn.sec:hover{border-color:var(--oro);color:var(--oro);filter:none}
  .resumen-f{color:var(--txt3);font-size:12.5px;margin-left:auto}

  /* ── Paginacion ───────────────────────────────────────────────────────── */
  .pag{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .pag .info{color:var(--txt3);font-size:12.8px;padding:0 6px}

  /* ── Varios ───────────────────────────────────────────────────────────── */
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--linea2);
    border-radius:999px;padding:2px 10px;font-size:11.3px;color:var(--txt2);white-space:nowrap}
  .pill.oro{background:var(--oro-t);border-color:rgba(201,169,97,.3);color:var(--oro)}
  .pill.ok{background:rgba(63,185,132,.12);border-color:rgba(63,185,132,.3);color:var(--ok)}
  .pill.ent{background:rgba(63,185,132,.12);border-color:rgba(63,185,132,.3);color:var(--ok)}
  .pill.sal{background:rgba(232,106,106,.1);border-color:rgba(232,106,106,.28);color:var(--mal)}
  .copiar{background:none;border:0;color:var(--txt3);cursor:pointer;padding:2px 4px;
    vertical-align:middle;line-height:0}
  .copiar:hover{color:var(--oro)}
  .aviso.peligro{border-color:rgba(240,119,107,.45);background:rgba(240,119,107,.09);color:#f4b4ac;text-align:left}
.aviso.bueno{border-color:rgba(62,217,160,.4);background:rgba(62,217,160,.08);color:#9fe8cd;text-align:left}
.aviso{padding:36px 20px;text-align:center;color:var(--txt3);font-size:14px}
  .error{padding:18px;border:1px solid rgba(232,106,106,.4);border-radius:var(--r2);
    color:var(--mal);background:rgba(232,106,106,.07);margin:16px 0;font-size:14px}
  .cargando{color:var(--txt3);padding:32px;text-align:center;font-size:13.5px}
  /* Esqueleto de carga: da idea de la forma que va a tener el contenido. */
  .hueso{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--panel2) 25%,var(--linea) 50%,var(--panel2) 75%);
    background-size:200% 100%;animation:brillo 1.3s infinite}
  @keyframes brillo{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── Grafico ──────────────────────────────────────────────────────────── */
  .graf{padding:18px 19px 12px}
  .graf .barras{display:flex;align-items:flex-end;gap:3px;height:112px}
  .graf .b{flex:1;background:linear-gradient(180deg,var(--oro),rgba(201,169,97,.28));
    border-radius:3px 3px 0 0;min-height:3px;position:relative;cursor:default;transition:filter .12s}
  .graf .b:hover{filter:brightness(1.35)}
  .graf .ejes{display:flex;justify-content:space-between;color:var(--txt3);
    font-size:11px;margin-top:9px;border-top:1px solid var(--linea);padding-top:9px}

  footer{border-top:1px solid var(--linea);margin-top:52px;padding:26px 0 38px;
    color:var(--txt3);font-size:12.6px}
  .pie{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .pie a{color:var(--txt2)}
  .pie a:hover{color:var(--oro)}

  /* ── Etiquetas humanas ────────────────────────────────────────────────── */
  /* Una direccion conocida lleva su nombre al lado: «AUKA · contrato»,
     «Tesoro», «Validador node3». La pastilla es chica y va DESPUES del hash,
     nunca en su lugar: el hash sigue siendo el dato; el nombre es la ayuda. */
  .etq{display:inline-block;vertical-align:middle;margin-left:6px;padding:1px 8px;border-radius:999px;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;line-height:1.6;
    background:var(--oro-t);border:1px solid rgba(201,169,97,.3);color:var(--oro)}
  .etq.val{background:rgba(90,169,224,.12);border-color:rgba(90,169,224,.3);color:var(--info)}
  .etq.tes{background:rgba(63,185,132,.12);border-color:rgba(63,185,132,.3);color:var(--ok)}
  .etq.con{background:var(--panel2);border-color:var(--linea2);color:var(--txt2)}
  a.dir{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.7px}

  /* ── Verificacion de contrato ────────────────────────────────────────── */
  .verif{display:flex;gap:12px;align-items:flex-start;padding:14px 17px;border-radius:var(--r2);
    border:1px solid var(--linea);background:var(--panel);margin:14px 0;font-size:13.5px;line-height:1.5}
  .verif .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800}
  .verif.ok{border-color:rgba(63,185,132,.4)} .verif.ok .ic{background:rgba(63,185,132,.15);color:var(--ok)}
  .verif.mal{border-color:rgba(232,106,106,.45)} .verif.mal .ic{background:rgba(232,106,106,.15);color:var(--mal)}
  .verif.gris .ic{background:var(--panel2);color:var(--txt3)}
  .verif b{display:block;margin-bottom:2px}
  .verif .mono{color:var(--txt3);font-size:11.5px;word-break:break-all}

  /* ── La cabecera de una ficha (tx, bloque, direccion) ─────────────────── */
  /* Al estilo de un explorador limpio: el titulo, el identificador entero en
     mono con su boton de copiar, y las pastillas de estado en la misma fila.
     Sin adornos: el dato manda. */
  .ficha-cab{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .ficha-cab h2{font-size:19px}
  .ficha-id{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--txt2);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
  .ficha-pills{display:flex;gap:6px;flex-wrap:wrap}
  /* La fila «de → para» de una transaccion, en una sola linea que envuelve. */
  .flujo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flujo .flecha{color:var(--txt3)}
  /* Las tarjetas de una direccion: saldo nativo grande y los tokens chicos. */
  .tarj .va.chico{font-size:17px}
  /* Las filas de transacciones de un bloque, leidas del nodo: de, para, valor. */
  .txb .fila{align-items:flex-start}
  .txb .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  /* Precio de ORIGEN en la portada: referencia, rotulada, con su hora. */
  .tarj .ref{font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.4}
  .tarj .ref b{color:var(--txt2);font-weight:600}
  @media(max-width:640px){
    .ficha-cab h2{font-size:17px}
    .etq{margin-left:0;margin-top:3px}
  }

  /* Aviso flotante al copiar. */
  #brindis{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);
    background:var(--panel2);border:1px solid var(--oro);color:var(--oro);
    padding:10px 20px;border-radius:11px;font-size:13.5px;z-index:60;
    transition:transform .22s ease;box-shadow:var(--sombra)}
  #brindis.ver{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div class="env barra">
  <a class="logo" href="/" data-ruta>
    <svg width="25" height="25" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 5l9.5 5.6v11.2L16 27.4 6.5 21.8V10.6z" fill="none" stroke="#C9A961" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="3.1" fill="#C9A961"/>
    </svg>
    ORDEN <span>GLOBAL</span>
  </a>
  <nav>
    <a href="/" data-ruta>Inicio</a>
    <a href="/blocks" data-ruta>Bloques</a>
    <a href="/txs" data-ruta>Transacciones</a>
    <a href="/tokens" data-ruta>Tokens</a>
    <a href="/red" data-ruta>Red</a>
  </nav>
</div></header>

<main id="app"><div class="env"><div class="cargando">Cargando…</div></div></main>

<footer><div class="env pie">

async function sha256Hex(hex) {
  const limpio = String(hex || "").replace(/^0x/, "");
  const bytes = new Uint8Array(limpio.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(limpio.slice(i * 2, i * 2 + 2), 16);
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, "0")).join("");
}

/** { estado, registro, hashCadena } — estado: verificado | distinto | sinRegistro | sinCodigo | noSePudo */
async function verificarContrato(addr) {
  const a = String(addr || "").toLowerCase();
  const registro = VERIFICADOS[a] || null;
  try {
    const codigo = await rpc("eth_getCode", [a, "latest"]);
    if (!codigo || codigo === "0x") return { estado: "sinCodigo", registro, hashCadena: null };
    const hashCadena = await sha256Hex(codigo);
    if (!registro) return { estado: "sinRegistro", registro, hashCadena };
    return { estado: hashCadena === registro.bytecodeSha256 ? "verificado" : "distinto", registro, hashCadena };
  } catch (e) {
    return { estado: "noSePudo", registro, hashCadena: null };
  }
}

function fecha(ts) {
  const n = Number(ts || 0);
  return n ? new Date(n * 1000).toLocaleString("es") : "—";
}
// El valor llega como "0." o "1.5" segun el token; se normaliza para mostrar.
function valor(v) {
  const s = String(v ?? "0").replace(/\.$/, "");
  const n = Number(s);
  return Number.isFinite(n) ? n.toLocaleString("es", { maximumFractionDigits: 8 }) : s;
}
// Divide un totalSupply en crudo (entero, sin decimales) por 10^decimales.
// No se usa Number: 555 millones con 18 decimales tiene 27 digitos y no cabe
// en un double sin perder precision. Se hace con BigInt sobre el texto.
function supplyLegible(crudo, decimales) {
  try {
    const entero = BigInt(crudo) / (10n ** BigInt(decimales || 18));
    return Number(entero).toLocaleString("es");
  } catch (e) { return String(crudo); }
}

// Que moneda representa el `value` de una transaccion. Cuando el indexador
// reconoce una transferencia de token, guarda en `value` la cantidad DEL TOKEN
// (no de ORIGEN) y en `to` al destinatario real. Etiquetarlo siempre como
// ORIGEN seria falso: una fila de 328,44 ONDK se leeria como 328,44 ORIGEN.
function monedaDe(t) {
  const s = String(t?.symbol || "").toUpperCase();
  return (!s || s === "CONTRACT") ? MONEDA : s;
}
const esToken = (t) => !NO_TOKEN.has(String(t?.symbol || "").toUpperCase());
const destinoCorto = (x) => x.to ? esc(corto(x.to, 8, 6)) : "creación de contrato";

async function api(ruta) {
  const r = await fetch(API + ruta, { headers: { Accept: "application/json" } });
  if (!r.ok) {
    let msg = `El servidor respondió ${r.status}`;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

// ── Copiar al portapapeles ───────────────────────────────────────────────────
function brindis(txt) {
  const b = $("#brindis");
  b.textContent = txt;
  b.classList.add("ver");
  clearTimeout(brindis._t);
  brindis._t = setTimeout(() => b.classList.remove("ver"), 1600);
}
const iconoCopiar = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
const btnCopiar = (v) => `<button class="copiar" data-copiar="${esc(v)}" title="Copiar" aria-label="Copiar">${iconoCopiar}</button>`;

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copiar]");
  if (!b) return;
  e.preventDefault();
  const v = b.getAttribute("data-copiar");
  try {
    await navigator.clipboard.writeText(v);
    brindis("Copiado");
  } catch (err) {
    // navigator.clipboard no existe fuera de HTTPS ni en algunos navegadores
    // antiguos; se recurre al metodo de seleccion de toda la vida.
    const ta = document.createElement("textarea");
    ta.value = v; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); brindis("Copiado"); }
    catch (e2) { brindis("No se pudo copiar"); }
    document.body.removeChild(ta);
  }
});

// ── Enrutado (EIP-3091) ──────────────────────────────────────────────────────
// Las rutas /block/<n>, /tx/<hash> y /address/<addr> son el estandar que exigen
// Chainlist y las billeteras para reconocer un explorador. Se resuelven en el
// cliente; el hosting debe reescribir cualquier ruta a este index.html.
function ir(url, reemplazar) {
  history[reemplazar ? "replaceState" : "pushState"]({}, "", url);
  window.scrollTo(0, 0);
  pintar();
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-ruta]");
  if (!a) return;
  e.preventDefault();
  ir(a.getAttribute("href"));
});
window.addEventListener("popstate", pintar);

function buscar(e) {
  if (e) e.preventDefault();
  const q = ($("#q")?.value || "").trim();
  if (!q) return;
  if (/^0x[a-fA-F0-9]{64}$/.test(q)) return ir(`/tx/${q}`);
  if (/^0x[a-fA-F0-9]{40}$/.test(q)) {
    // Si la direccion es el contrato de un token conocido, su ficha de token
    // es mas util que la de direccion.
    const s = tokenPorContrato(q);
    return ir(s ? `/token/${q}` : `/address/${q}`);
  }
  if (/^\d+$/.test(q)) return ir(`/block/${q}`);
  // Un GID: se reconoce la forma y se explica que no hay indice que lo
  // resuelva (vistaGid). Fingir «no hay resultados» seria mentir.
  if (esGid(q)) return ir(`/gid/${encodeURIComponent(q.replace(/\s/g, "").toUpperCase())}`);
  // Cualquier otra cosa se trata como busqueda libre sobre las transacciones.
  return ir(`/txs?q=${encodeURIComponent(q)}`);
}
/* El chip puede ENSEÑAR una version corta y llevar el valor entero en
   `data-valor`: una direccion completa mide 307px y no cabe en un telefono de
   320. Sin `data-valor` se usa el texto, que es como estaba. */
function ejemplo(el) {
  const i = $("#q");
  if (i) { i.value = el.dataset.valor || el.textContent; buscar(); }
}

const iconoLupa = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg>`;

const err = (m) => `<div class="error"><b>No se pudo cargar.</b><br>${esc(m)}</div>`;

        </div>
        <div>

          <div class="cabecera-seccion" style="margin-top:26px"><h2>La red, en corto</h2>

     haya nada no se enseña nada: una pista que lleva a un «no existe» es peor
     que ninguna pista. */
  const _ej = {};
  function ejemplosVivos(mas) {

    const el = $("#ejs");
    if (!el) return;
    const trozos = [];
    if (_ej.bloque) trozos.push(`<code onclick="ejemplo(this)">${esc(String(_ej.bloque))}</code>`);

  }

  precioOrigen().then(p => {
    const el = $("#corig");
    if (!el) return;
    if (!p) {
      el.innerHTML = `<div class="et">ORIGEN · referencia</div><div class="va">—</div><div class="ref">sin feed del oro ahora mismo</div>`;

    const hora = new Date(p.en).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });

  api("/block/allBlocks?lastBlock=11").then(b => {

  }).catch(() => tarjeta("ctiem", "Tiempo de bloque", "—"));

  Promise.all([api("/transaction/resumen"), catalogo()]).then(([r, tokens]) => {
    const tks = (r.simbolos || []).filter(s => !NO_TOKEN.has(s.simbolo.toUpperCase()));
    tarjeta("ctx", "Transacciones", num(r.total),

    const cuantosSeMovieron = tks.length;

        <div class="cabecera-seccion"><h2>Actividad de la cadena</h2></div>

    /* Los tokens DE LA RED son los que están desplegados, no los que se han
       movido. La sección enseñaba uno solo —el único con transacciones— bajo un
       título que promete la red entera, y daba a entender que la cadena tiene un
       token cuando tiene catorce. Se listan los del catálogo y el movimiento va

    const movidos = Object.fromEntries(tks.map(s => [s.simbolo.toUpperCase(), s.n]));
    const lista = (tokens || []).length
      ? tokens.slice(0, 8).map(t => ({ simbolo: t.symbol, nombre: t.nombre || t.symbol,

                               : "sin movimientos todavía"}</div>

    }).join("");
  }).catch(() => {
    tarjeta("ctx", "Transacciones", "—");
    tarjeta("ctk", "Tokens", "—");
    $("#tks").innerHTML = `<div class="aviso">No se pudo cargar el resumen.</div>`;

  rpc("qbft_getValidatorsByBlockNumber", ["latest"])

  api("/transaction/allTransactions?lastTransaction=8").then(d => {

  }).catch(e => { $("#tx").innerHTML = err(e.message); });

// Fila de transaccion reutilizada por la portada, el listado y los filtros.
function filaTx(x) {
  const mon = monedaDe(x);
  return `<div class="fila"><div class="conicono izq">
      <div class="icono">${esc(esToken(x) ? mon.slice(0, 3) : "Tx")}</div>
      <div style="min-width:0">
        <a href="/tx/${esc(x.hash)}" data-ruta class="mono cortar">${esc(corto(x.hash, 16, 8))}</a>
        <div class="sub flujo">${dirHtml(x.from)} <span class="flecha">→</span> ${dirHtml(x.to)}</div>
      </div></div>
    <div class="der">${valor(x.value)} <span class="pill">${esc(mon)}</span>
      <div class="sub">${hace(x.timestamp)}</div></div></div>`;
}

async function vistaBloques(app, params) {
  const pagina = Math.max(1, Number(params.get("p") || 1));
  const POR = 25;
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="cabecera-seccion"><h2>Bloques</h2></div>
    <div class="panel" id="l">${esqueleto(8)}</div><div id="pag"></div></div>`;
  try {
    // El backend devuelve los N ultimos desde la punta de la cadena, asi que la
    // pagina se consigue pidiendo hasta el final del tramo y quedandose con su
    // ultimo trozo. El tope del servidor son 50 por peticion.
    const hasta = pagina * POR;
    const d = await api(`/block/allBlocks?lastBlock=${Math.min(50, hasta)}`);
    const todos = d.blockInfo || [];
    const b = todos.slice((pagina - 1) * POR, pagina * POR);
    $("#l").innerHTML = b.length ? b.map(x => `
      <div class="fila"><div class="conicono izq">
        <div class="icono">Bk</div>
        <div style="min-width:0">
          <a href="/block/${esc(x.number)}" data-ruta><b>#${num(x.number)}</b></a>
          <div class="sub mono cortar">${esc(corto(x.hash, 20, 10))}</div>
        </div></div>
        <div class="der">${num(x.transactions)} tx<div class="sub">${hace(x.timestamp)}</div></div></div>`).join("")
      : `<div class="aviso">Sin bloques.</div>`;
    $("#pag").innerHTML = paginacion(pagina, todos.length >= Math.min(50, hasta) && pagina < 2, "/blocks");
  } catch (e) { $("#l").innerHTML = err(e.message); }
}

function paginacion(pagina, hayMas, base, extra = "") {
  const url = (p) => `${base}?${extra}${extra ? "&" : ""}p=${p}`;
  return `<div class="pag">
    ${pagina > 1 ? `<a class="btn sec" href="${url(pagina - 1)}" data-ruta>← Anterior</a>`
                 : `<span class="btn sec" style="opacity:.4">← Anterior</span>`}
    <span class="info">Página ${num(pagina)}</span>
    ${hayMas ? `<a class="btn sec" href="${url(pagina + 1)}" data-ruta>Siguiente →</a>`
             : `<span class="btn sec" style="opacity:.4">Siguiente →</span>`}
  </div>`;
}

// ── Listado de transacciones, con filtros de servidor ────────────────────────
const FILTROS = ["simbolo", "desdeFecha", "hastaFecha", "minValor", "maxValor", "q"];

async function vistaTxs(app, params) {
  const pagina = Math.max(1, Number(params.get("p") || 1));
  const POR = 25;

  // Los filtros viven en la URL: asi un enlace filtrado se puede compartir y
  // el boton de atras del navegador funciona.
  const f = {};
  FILTROS.forEach(k => { const v = params.get(k); if (v) f[k] = v; });
  const aFecha = (u) => u ? new Date(Number(u) * 1000).toISOString().slice(0, 10) : "";

  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="cabecera-seccion"><h2>Transacciones</h2><span class="mas" id="cuenta"></span></div>
    <form class="filtros" onsubmit="aplicarFiltros(event)">
      <div class="grupos-f">
        <div class="grupo-f">
          <div class="tit-f">Qué</div>
          <div class="campo-f"><label for="f-sim">Moneda o token</label>
            <select id="f-sim"><option value="">Todas las monedas</option></select></div>
        </div>
        <div class="grupo-f">
          <div class="tit-f">Cuándo</div>
          <div class="par-f">
            <div class="campo-f"><label for="f-des">Desde</label>
              <input id="f-des" type="date" value="${aFecha(f.desdeFecha)}"></div>
            <div class="campo-f"><label for="f-has">Hasta</label>
              <input id="f-has" type="date" value="${aFecha(f.hastaFecha)}"></div>
          </div>
        </div>
        <div class="grupo-f">
          <div class="tit-f">Cuánto</div>
          <div class="par-f">
            <div class="campo-f"><label for="f-min">Mínimo</label>
              <input id="f-min" type="number" step="any" min="0" placeholder="0" value="${esc(f.minValor || "")}"></div>
            <div class="campo-f"><label for="f-max">Máximo</label>
              <input id="f-max" type="number" step="any" min="0" placeholder="sin límite" value="${esc(f.maxValor || "")}"></div>
          </div>
        </div>
        <div class="grupo-f">
          <div class="tit-f">Quién</div>
          <div class="campo-f"><label for="f-q">Hash o dirección</label>
            <input id="f-q" type="text" placeholder="0x…" value="${esc(f.q || "")}"></div>
        </div>
      </div>
      <div class="acciones-f">
        <button class="btn" type="submit">Aplicar filtros</button>
        ${Object.keys(f).length ? `<a class="btn sec" href="/txs" data-ruta>Limpiar todo</a>` : ""}
        <span class="resumen-f" id="resf"></span>
      </div>
    </form>
    <div id="chips"></div>
    <div class="panel" id="l">${esqueleto(8)}</div><div id="pag"></div></div>`;

  // Etiquetas de lo que esta filtrando ahora mismo, cada una con su aspa para
  // quitarla sin tener que vaciar el formulario entero.
  const quitar = (k) => {
    const p = new URLSearchParams();
    Object.entries(f).forEach(([kk, vv]) => { if (kk !== k) p.set(kk, vv); });
    return `/txs${p.toString() ? "?" + p : ""}`;
  };
  const nombreF = { simbolo: "Moneda", desdeFecha: "Desde", hastaFecha: "Hasta",
                    minValor: "Mínimo", maxValor: "Máximo", q: "Contiene" };
  const valorF = (k, v) => (k === "desdeFecha" || k === "hastaFecha")
    ? new Date(Number(v) * 1000).toLocaleDateString("es")
    : (k === "q" ? corto(v, 10, 6) : v);
  const activos = Object.entries(f);
  if (activos.length) {
    $("#chips").innerHTML = `<div class="chips">` + activos.map(([k, v]) =>
      `<a class="chip" href="${quitar(k)}" data-ruta title="Quitar este filtro">
        <b>${nombreF[k] || k}:</b> ${esc(valorF(k, v))} <span class="x">✕</span></a>`).join("") + `</div>`;
  }

  // El desplegable de monedas se llena con lo que hay de verdad en la cadena.
  api("/transaction/resumen").then(r => {
    const sel = $("#f-sim");
    if (!sel) return;
    (r.simbolos || []).forEach(s => {
      const et = s.simbolo === "" ? "(sin etiqueta)" : s.simbolo;
      const o = document.createElement("option");
      o.value = s.simbolo; o.textContent = `${et} · ${num(s.n)}`;
      if (s.simbolo === (f.simbolo || "")) o.selected = true;
      sel.appendChild(o);
    });
  }).catch(() => {});

  const qs = new URLSearchParams();
  Object.entries(f).forEach(([k, v]) => qs.set(k, v));
  qs.set("lastTransaction", String(POR));
  qs.set("desde", String((pagina - 1) * POR));

  try {
    const d = await api(`/transaction/allTransactions?${qs}`);
    const t = d.transactions || [];
    $("#cuenta").textContent = d.filtrado
      ? `${num(d.total)} coinciden con el filtro`
      : `${num(d.total)} en total`;
    $("#resf").textContent = d.filtrado ? `Filtro activo · ${num(d.total)} resultados` : "";
    $("#l").innerHTML = t.length ? t.map(filaTx).join("")
      : `<div class="aviso">Ninguna transacción coincide con esos filtros.<br>
         <a href="/txs" data-ruta>Quitar los filtros</a></div>`;
    const extra = Object.entries(f).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
    $("#pag").innerHTML = paginacion(pagina, pagina * POR < d.total, "/txs", extra);
  } catch (e) { $("#l").innerHTML = err(e.message); }
}

function aplicarFiltros(e) {
  e.preventDefault();
  const p = new URLSearchParams();
  const sim = $("#f-sim").value; if (sim) p.set("simbolo", sim);
  const des = $("#f-des").value; if (des) p.set("desdeFecha", String(Math.floor(new Date(des + "T00:00:00Z") / 1000)));
  // El "hasta" incluye el dia entero: si no, elegir el mismo dia en ambos
  // campos no devolveria nada.
  const has = $("#f-has").value; if (has) p.set("hastaFecha", String(Math.floor(new Date(has + "T23:59:59Z") / 1000)));
  const mi = $("#f-min").value; if (mi !== "") p.set("minValor", mi);
  const ma = $("#f-max").value; if (ma !== "") p.set("maxValor", ma);
  const q = $("#f-q").value.trim(); if (q) p.set("q", q);
  ir(`/txs${p.toString() ? "?" + p : ""}`);
}

async function vistaBloque(app, id) {
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="ficha-cab"><h2>Bloque #${esc(num(id))}</h2><div class="ficha-id" id="bid"></div></div>
    <div class="panel" id="d">${esqueleto(6)}</div><div id="txb"></div></div>`;
  try {
    const r = await api(`/block/block/${encodeURIComponent(id)}`);
    const b = r.blockInfo || r.block || r;
    if (!b || b.number === undefined) throw new Error("No se encontró ese bloque.");

    const hashes = Array.isArray(b.transactions) ? b.transactions : [];
    const cuantas = b.transactionCount ?? hashes.length;
    const n = Number(b.number);

    $("#bid").innerHTML = `${esc(b.hash)} ${btnCopiar(b.hash)}`;

    // Sobre el validador: en la 5550 el proponente SI viaja en `miner` —QBFT lo
    // pone ahi— y por eso se muestra, con su nombre si es uno de los siete
    // conocidos. La direccion cero solo aparece en el bloque cero, que no lo
    // propuso nadie: es el genesis. Decir «Validador: 0x000…000» ahi no es un
    // dato, es ruido que ademas hace pensar que al bloque le falta algo.
    const cero = /^0x0{40}$/i.test(String(b.miner || ""));
    const filaValidador = cero
      ? `<tr><td class="k">Origen</td><td class="v">Bloque génesis <span class="pill">no lo propuso ningún validador</span></td></tr>`
      : `<tr><td class="k">Validador</td><td class="v">${dirHtml(b.miner, { corta: false, copiar: true })}</td></tr>`;
    const usado = Number(b.gasUsed), limite = Number(b.gasLimit);
    const pctGas = usado >= 0 && limite > 0 ? ` <span class="pill">${((usado / limite) * 100).toFixed(2)} %</span>` : "";

    $("#d").innerHTML = `<table>
      <tr><td class="k">Número</td><td class="v">${num(b.number)}
        <span class="pill"><a href="/block/${n - 1}" data-ruta>← anterior</a></span>
        <span class="pill"><a href="/block/${n + 1}" data-ruta>siguiente →</a></span></td></tr>
      <tr><td class="k">Fecha</td><td class="v">${fecha(b.timestamp)} <span class="pill">${hace(b.timestamp)}</span></td></tr>
      <tr><td class="k">Transacciones</td><td class="v">${num(cuantas)}</td></tr>
      ${filaValidador}
      <tr><td class="k">Gas usado / límite</td><td class="v">${num(b.gasUsed)} / ${num(b.gasLimit)}${pctGas}</td></tr>
      <tr><td class="k">Tamaño</td><td class="v">${num(b.size)} bytes</td></tr>
      <tr><td class="k">Hash</td><td class="v mono">${esc(b.hash)} ${btnCopiar(b.hash)}</td></tr>
      ${b.parentHash ? `<tr><td class="k">Bloque padre</td><td class="v mono"><a href="/block/${n - 1}" data-ruta>${esc(b.parentHash)}</a></td></tr>` : ""}
      ${b.stateRoot ? `<tr><td class="k">Raíz de estado</td><td class="v mono">${esc(b.stateRoot)}</td></tr>` : ""}
    </table>`;

    if (hashes.length) {
      // Los detalles de cada transaccion —de, para, valor— se leen del nodo:
      // el indice solo guarda los hashes en el bloque. Hasta 25 en paralelo;
      // si el nodo no contesta alguna, esa fila queda con el hash a secas.
      const TOPE = 25;
      const lote = hashes.slice(0, TOPE);
      $("#txb").innerHTML = `<div class="seccion">
        <div class="cabecera-seccion"><h2>Transacciones del bloque (${num(hashes.length)})</h2>
          ${hashes.length > TOPE ? `<span class="mas">se detallan las primeras ${TOPE}</span>` : ""}</div>
        <div class="panel txb" id="txbl">` + lote.map(h => `
          <div class="fila" id="tx-${esc(h.slice(2, 18))}"><div class="conicono izq"><div class="icono">Tx</div>
            <div style="min-width:0"><a href="/tx/${esc(h)}" data-ruta class="mono cortar">${esc(corto(h, 18, 10))}</a>
            <div class="sub">…</div></div></div><div class="der"></div></div>`).join("")
        + hashes.slice(TOPE).map(h => `<div class="fila"><div class="conicono izq"><div class="icono">Tx</div>
            <a href="/tx/${esc(h)}" data-ruta class="mono cortar">${esc(h)}</a></div></div>`).join("")
        + `</div></div>`;
      await Promise.all(lote.map(async (h) => {
        const el = $(`#tx-${h.slice(2, 18)}`);
        if (!el) return;
        try {
          const t = await rpc("eth_getTransactionByHash", [h]);
          if (!t) throw new Error("no está");
          const m = metodoDe(t.input);
          const valorEth = Number(BigInt(t.value || "0x0") / 1000000000000n) / 1e6; // wei → ORIGEN, 6 decimales
          el.querySelector(".sub").innerHTML = `${dirHtml(t.from)} <span class="flecha">→</span> ${dirHtml(t.to)}${m && m.nombre ? ` <span class="pill mono">${esc(m.nombre.split("(")[0])}</span>` : ""}`;
          el.querySelector(".der").innerHTML = `${valorEth.toLocaleString("es", { maximumFractionDigits: 6 })} <span class="pill">${MONEDA}</span>`;
        } catch (e) {
          el.querySelector(".sub").textContent = "el nodo no devolvió el detalle";
        }
      }));
    }
  } catch (e) { $("#d").innerHTML = err(e.message); }
}

// ── Búsqueda por GID: se reconoce, y se dice con verdad que no se resuelve ──
//
// QUE HAY Y QUE FALTA. En la cadena 5550 NO existe un registro de GID: ningun
// contrato guarda «este GID es esta direccion», y un GID no se deriva de una
// llave. Lo que existe es Genesis ID, fuera de la cadena, y su API contesta
// en UN sentido: dada una direccion, si hay una identidad verificada detras
// y cual es su GID (`GET /api/v1/direccion/:direccion`, alcance
// gid.verificar — es lo que este explorador ya enseña en la ficha de una
// direccion). El sentido contrario —dado un GID, sus direcciones— no esta
// expuesto a las apps: `GET /api/v1/identidades/por-gid/:gid` existe pero
// exige el alcance gid.perfil, que devuelve el perfil entero y que Ordenscan
// NO tiene ni debe tener (un explorador es publico; con esa clave se leerian
// nombres).
//
// Para que esta busqueda funcione haria falta UNA de estas dos cosas, y la
// decision es de Genesis/la Junta, no del explorador:
//   a) en Genesis ID, una ruta de solo-direcciones `GET /api/v1/gid/:gid/direcciones`
//      bajo el alcance gid.verificar (devuelve las direcciones vinculadas y
//      nada mas), y que ogscan-backend la consulte con su clave y la sirva
//      como `GET /address/por-gid/:gid`; o
//   b) un registro EN CADENA (contrato de vinculos GID → direccion, firmado
//      por Genesis), que cualquiera pueda leer sin clave.
// Hasta entonces esta vista dice eso, en vez de un «sin resultados» que
// haria creer que el GID no existe.
async function vistaGid(app, gid) {
  const g = String(gid || "").toUpperCase();
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="ficha-cab"><h2>Genesis ID</h2><div class="ficha-id">${esc(g)} ${btnCopiar(g)}
      <span class="pill">${g.startsWith("GNB") ? "negocio" : "persona"} · forma válida</span></div></div>
    <div class="panel"><table>
      <tr><td class="k">Qué es</td><td class="v">Un identificador de <b>Genesis ID</b>, el registro de identidad del ecosistema. Vive fuera de la cadena: ningún contrato de la 5550 guarda a qué direcciones corresponde.</td></tr>
      <tr><td class="k">Buscar por GID</td><td class="v">Todavía no se puede resolver un GID a sus direcciones desde el explorador. Genesis ID solo expone a las apps el sentido contrario —de una dirección a su GID—, que es lo que este explorador enseña en la ficha de cada dirección con identidad verificada.</td></tr>
      <tr><td class="k">Qué haría falta</td><td class="v">Que Genesis ID publique una consulta de solo-direcciones por GID (sin datos personales) y este explorador la sirva, o un registro de vínculos GID → dirección en la propia cadena. Está anotado en el código de esta vista.</td></tr>
      <tr><td class="k">Mientras tanto</td><td class="v">Si tenés una dirección, buscala: si detrás hay una identidad verificada, la ficha lo dice y muestra su GID.</td></tr>
    </table></div></div>`;
}

async function vistaTx(app, hash) {
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="ficha-cab"><h2>Transacción</h2><div class="ficha-id" id="tid">${esc(hash)}</div><div class="ficha-pills" id="tpills"></div></div>
    <div class="panel" id="d">${esqueleto(7)}</div><div id="tdet"></div></div>`;
  try {
    const r = await api(`/transaction/transaction/${encodeURIComponent(hash)}`);
    const t = r.transaction || r.transactionInfo || r;
    if (!t || !t.hash) throw new Error("No se encontró esa transacción.");

    await catalogo();
    const mon = monedaDe(t);
    const tk = esToken(t);
    const contrato = t.addressContract || (tk ? contratoDe(mon) : null);
    const rc = t.recibo;

    $("#tid").innerHTML = `${esc(t.hash)} ${btnCopiar(t.hash)}`;
    $("#tpills").innerHTML = (rc
      ? (rc.exito ? `<span class="pill ok">✓ Éxito</span>` : `<span class="pill sal">✕ Fallida</span>`)
      : `<span class="pill">estado no disponible</span>`)
      + (rc && rc.confirmaciones ? ` <span class="pill">${num(rc.confirmaciones)} confirmaciones</span>` : "")
      + ` <span class="pill">${hace(t.timestamp)}</span>`;

    // Hay dos formas de transferencia de token en los datos. Cuando el
    // indexador la reconocio, `to` ya es el destinatario y `value` la cantidad
    // del token. Cuando no, queda el `input` en crudo y el backend lo
    // decodifica: ahi `to` es el contrato y el destinatario va aparte.
    const tr = t.transferencia;
    const m = metodoDe(t.input);
    const tipo = tk ? `Transferencia de token <span class="pill oro">${esc(mon)}</span>`
      : (String(t.symbol).toUpperCase() === "CONTRACT" || (m && m.nombre))
        ? `Llamada a contrato${m && m.nombre ? ` <span class="pill mono">${esc(m.nombre)}</span>` : ""}`
        : `Transferencia de ${MONEDA}`;

    // El resumen humano: quien, a quien, cuanto. Es la primera fila porque es
    // lo que la gente vino a ver; el resto de la tabla es para quien sabe.
    const resumen = `<div class="flujo">${dirHtml(t.from, { corta: false, copiar: true })} <span class="flecha">→</span>
      ${t.to ? dirHtml(t.to, { corta: false, copiar: true }) : `<span class="pill">creación de contrato</span>`}</div>`;

    const filasToken = tr ? `
      <tr><td class="k">Destinatario real</td><td class="v">${dirHtml(tr.destino, { corta: false, copiar: true })}</td></tr>
      <tr><td class="k">Cantidad transferida</td><td class="v"><b>${valor(tr.cantidad)}</b> ${esc(t.symbol || "")}</td></tr>` : "";

    // Los datos crudos de la llamada: util para quien sabe leerlos, oculto
    // tras un desplegable para quien no.
    const hayDatos = t.input && t.input !== "0x" && t.input !== "Transfer";

    $("#d").innerHTML = `<table>
      <tr><td class="k">Tipo</td><td class="v">${tipo}</td></tr>
      <tr><td class="k">De → Para</td><td class="v">${resumen}</td></tr>
      <tr><td class="k">Valor</td><td class="v"><b style="font-size:15px">${valor(t.value)}</b> ${esc(mon)}</td></tr>
      ${filasToken}
      <tr><td class="k">Bloque</td><td class="v"><a href="/block/${esc(t.blockNumber)}" data-ruta>#${num(t.blockNumber)}</a>${
        rc && rc.posicionEnBloque !== null ? ` <span class="pill">posición ${esc(rc.posicionEnBloque)}</span>` : ""}</td></tr>
      <tr><td class="k">Fecha</td><td class="v">${fecha(t.timestamp)} <span class="pill">${hace(t.timestamp)}</span></td></tr>
      ${contrato ? `<tr><td class="k">Contrato del token</td><td class="v">${dirHtml(contrato, { corta: false, copiar: true })} <span class="pill"><a href="/token/${esc(contrato)}" data-ruta>ficha del token →</a></span></td></tr>` : ""}
      ${rc && rc.contratoCreado ? `<tr><td class="k">Contrato creado</td><td class="v">${dirHtml(rc.contratoCreado, { corta: false, copiar: true })}</td></tr>` : ""}
      ${rc && rc.comision !== null ? `<tr><td class="k">Comisión pagada</td><td class="v">${valor(rc.comision)} ${MONEDA}</td></tr>` : ""}
      <tr><td class="k">Gas usado / límite</td><td class="v">${rc && rc.gasUsado ? num(rc.gasUsado) : "—"}${
        t.gas ? ` / ${num(t.gas)}` : ""}${
        rc && rc.gasUsado && t.gas ? ` <span class="pill">${((Number(rc.gasUsado) / Number(t.gas)) * 100).toFixed(1)}%</span>` : ""}</td></tr>
      <tr><td class="k">Precio del gas</td><td class="v">${num(t.gasPrice)} <span class="pill">${valor(Number(t.gasPrice) / 1e9)} Gwei</span></td></tr>
      <tr><td class="k">Nonce</td><td class="v">${esc(t.nonce)}</td></tr>
      ${rc ? `<tr><td class="k">Eventos emitidos</td><td class="v">${num(rc.eventos)}</td></tr>` : ""}
      ${hayDatos ? `<tr><td class="k">Datos de entrada</td><td class="v">
        ${m ? `<span class="pill mono">${esc(m.nombre || ("método " + m.selector))}</span> ` : ""}
        <details style="margin-top:7px"><summary style="cursor:pointer;color:var(--oro)">Ver datos en crudo</summary>
        <div class="mono" style="margin-top:8px;word-break:break-all;color:var(--txt2);
             background:var(--fondo);border:1px solid var(--linea);border-radius:9px;padding:11px;
             max-height:180px;overflow:auto">${esc(t.input)}</div></details></td></tr>` : ""}
    </table>`;
  } catch (e) { $("#d").innerHTML = err(e.message); }
}

async function vistaToken(app, contrato) {
  await catalogo();
  const sim = tokenPorContrato(contrato) || NOMBRES_TOKEN[String(contrato).toLowerCase()];
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="ficha-cab"><h2>Token ${sim ? esc(sim) : ""}</h2>
      <div class="ficha-id">${esc(contrato)} ${btnCopiar(contrato)}${pillEtq(etiquetaDe(contrato))}</div></div>
    <div id="verif"></div>
    <div id="res"></div>
    <div class="cabecera-seccion" style="margin-top:26px"><h2>Movimientos del token</h2></div>
    <div class="panel" id="l">${esqueleto(6)}</div></div>`;
  // La verificacion va por su lado: lee el bytecode del nodo y compara con el
  // registro. Si el nodo no contesta, lo dice y la ficha sigue.
  verificarContrato(contrato).then(v => { const el = $("#verif"); if (el) el.innerHTML = cajaVerificacion(v); });
  try {
    const r = await api(`/address/token/${encodeURIComponent(contrato)}`);
    const d = r.result || r;
    const td = d.tokenData || {};
    $("#res").innerHTML = `<div class="tarjetas">
      <div class="tarj"><div class="et">Símbolo</div><div class="va oro">${esc(td.symbol)}</div></div>
      <div class="tarj"><div class="et">Nombre</div><div class="va">${esc(td.name)}</div></div>
      <div class="tarj"><div class="et">Suministro total</div><div class="va">${supplyLegible(td.totalSupply, td.decimal)}</div>
        <div class="sub">${esc(td.symbol)}</div></div>
      <div class="tarj"><div class="et">Decimales</div><div class="va">${esc(td.decimal)}</div></div>
    </div>`;
    const t = d.transactions || [];
    $("#l").innerHTML = t.length ? t.slice(0, 50).map(filaTx).join("")
      : `<div class="aviso">Este token no tiene transacciones registradas en el índice.</div>`;
  } catch (e) {
    $("#res").innerHTML = "";
    $("#l").innerHTML = err(e.message);
  }
}

// ── Identidad y sanciones de una dirección ───────────────────────────────────
//
// Tres estados, y distinguirlos importa:
//
//   sancionada === true   → aviso rojo, y se dice ANTES que ninguna otra cosa
//   sancionada === false  → se comprobó y está limpia
//   sancionada === null   → NO se pudo comprobar
//
// El tercero no se enseña como si fuera el segundo. Un explorador que diga
// "sin coincidencias" cuando en realidad no consultó nada le da a alguien la
// confianza para mandar fondos que no debería tener. Si no se comprobó, se
// calla — es preferible no decir nada que decir algo tranquilizador y falso.
function avisoIdentidad(g) {
  if (!g || !g.consultado) return "";
  const partes = [];

  if (g.sancionada === true) {
    partes.push(`<div class="aviso peligro">
      <b>Dirección en listas de sanciones.</b>
      ${g.ficha ? `Figura en ${esc(g.ficha.lista)}${g.ficha.programa ? ` (programa ${esc(g.ficha.programa)})` : ""}.` : ""}
      No envíe fondos a esta dirección.</div>`);
  }

  if (g.verificada === true && g.gid) {
    partes.push(`<div class="aviso bueno">
      <b>Identidad verificada.</b> Detrás de esta dirección hay una identidad
      comprobada por Genesis ID: <span class="mono">${esc(g.gid)}</span>.</div>`);
  }

  return partes.join("");
}

async function vistaDireccion(app, addr) {
  await catalogo();
  const sim = tokenPorContrato(addr) || NOMBRES_TOKEN[String(addr).toLowerCase()];
  const etq = etiquetaDe(addr);
  const banner = sim
    ? `<div class="pista" style="text-align:left;margin:-6px 0 16px">Esta dirección es el contrato del token <b>${esc(sim)}</b>. <a href="/token/${addr}" data-ruta>Ver la ficha del token →</a></div>`
    : "";
  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="ficha-cab"><h2>${etq ? esc(etq.nombre) : "Dirección"}</h2>
      <div class="ficha-id">${esc(addr)} ${btnCopiar(addr)}</div>
      <div class="ficha-pills" id="dpills"></div></div>
    ${banner}<div id="verif"></div><div id="res"></div>
    <div class="cabecera-seccion" style="margin-top:26px"><h2>Transacciones<span id="ntx"></span></h2>
      <a class="mas" href="/txs?q=${encodeURIComponent(addr)}" data-ruta>Buscar con filtros →</a></div>
    <div class="panel" id="l">${esqueleto(6)}</div></div>`;
  try {
    const d = await api(`/address/${encodeURIComponent(addr)}`);
    const tk = d.tokensBalance || {};
    // Cuenta o contrato: lo dice el nodo (getCode) via el backend. Un
    // contrato lleva ademas su verificacion contra el registro.
    $("#dpills").innerHTML = (d.esContrato ? `<span class="pill oro">contrato</span>` : `<span class="pill">cuenta</span>`)
      + (etq ? pillEtq(etq) : "")
      + (d.identidad && d.identidad.verificada === true ? ` <span class="pill ok">identidad verificada</span>` : "");
    if (d.esContrato) {
      verificarContrato(addr).then(v => { const el = $("#verif"); if (el) el.innerHTML = cajaVerificacion(v); });
    }
    const filasTk = Object.entries(tk).map(([k, v]) => {
      const c = v.contractAddress;
      return `<a class="tarj" href="${c ? `/token/${c}` : "#"}" data-ruta>
        <div class="et">${esc(k)}</div><div class="va chico">${valor(v.balance)}</div></a>`;
    }).join("");
    $("#res").innerHTML = avisoIdentidad(d.identidad) + `<div class="tarjetas">
      <div class="tarj"><div class="et">Saldo ${MONEDA}</div>
        <div class="va oro">${d.balance === null ? "—" : valor(d.balance)}</div>
        ${d.balance === null ? `<div class="sub">el nodo no respondió</div>` : ""}</div>${filasTk}</div>`;

    const t = d.transactions || [];
    const TOPE = 50;
    $("#ntx").textContent = t.length ? ` (${num(t.length)})` : "";
    $("#l").innerHTML = (t.length ? t.slice(0, TOPE).map(x => {
      const sale = String(x.from || "").toLowerCase() === String(addr).toLowerCase();
      const mon = monedaDe(x);
      return `<div class="fila"><div class="conicono izq">
        <div class="icono">${sale ? "↑" : "↓"}</div>
        <div style="min-width:0">
          <a href="/tx/${esc(x.hash)}" data-ruta class="mono cortar">${esc(corto(x.hash, 16, 8))}</a>
          <div class="sub flujo">${sale
            ? `<span class="pill sal">envió</span> a ${dirHtml(x.to)}`
            : `<span class="pill ent">recibió</span> de ${dirHtml(x.from)}`}</div>
        </div></div>
        <div class="der">${valor(x.value)} <span class="pill">${esc(mon)}</span>
          <div class="sub">${hace(x.timestamp)}</div></div></div>`;
    }).join("") : `<div class="aviso">Esta dirección no tiene transacciones registradas.</div>`)
      + (t.length > TOPE ? `<div class="aviso">Mostrando las ${TOPE} más recientes de ${num(t.length)}.</div>` : "");
  } catch (e) { $("#l").innerHTML = err(e.message); }
}

// ── La red: qué es esta cadena, con los datos leídos del nodo ────────────────
//
// Lo que se enseña aquí es la ficha de identidad de la red, y tiene que ser
// CIERTA: quien la lee decide con ella si conecta su billetera o su servicio.
// Por eso casi todo se le pregunta al nodo en vivo —validadores, cliente,
// techo de gas, ritmo— en vez de escribirlo en el HTML. Lo escrito a mano se
// limita a lo que no cambia: el nombre, la moneda y las direcciones públicas.
async function vistaRed(app) {
  const dato = (k, id, ayuda) => `<tr><td class="k">${k}${
    ayuda ? `<div class="ayuda">${ayuda}</div>` : ""}</td><td class="v" id="${id}">…</td></tr>`;

  app.innerHTML = `<div class="env">
    <section class="hero" style="padding:34px 0 6px">
      <div class="et"><span class="punto"></span> Layer 1 propia · Chain ${CHAIN_ID}</div>
      <h1>La cadena de <b>Orden Global</b></h1>
      <p>Una blockchain propia, no una red de pruebas ni una capa encima de otra:
         bloques cada diez segundos, validada por su propio grupo de nodos, y
         compatible con las herramientas de Ethereum.</p>
    </section>

    <section class="seccion"><div class="tarjetas">
      <div class="tarj"><div class="et">Validadores</div><div class="va oro" id="r-val">…</div>
        <div class="sub" id="r-val-sub">consenso QBFT</div></div>
      <div class="tarj"><div class="et">Ritmo</div><div class="va" id="r-ritmo">…</div>
        <div class="sub">entre bloque y bloque</div></div>
      <div class="tarj"><div class="et">Último bloque</div><div class="va" id="r-alt">…</div>
        <div class="sub" id="r-alt-sub">&nbsp;</div></div>
      <div class="tarj"><div class="et">Techo de gas</div><div class="va" id="r-gas">…</div>
        <div class="sub">por bloque</div></div>
    </div></section>

    <section class="seccion"><div class="cols">
      <div>
        <div class="cabecera-seccion"><h2>Para conectarse</h2></div>
        <div class="panel"><table>
          <tr><td class="k">Nombre de la red</td><td class="v">Orden Global</td></tr>
          <tr><td class="k">ID de cadena</td><td class="v">${CHAIN_ID}
            <span class="pill">0x${CHAIN_ID.toString(16)}</span> ${btnCopiar(String(CHAIN_ID))}</td></tr>
          <tr><td class="k">Moneda</td><td class="v">${MONEDA} <span class="pill">18 decimales</span></td></tr>
          <tr><td class="k">RPC</td><td class="v mono">${RPC} ${btnCopiar(RPC)}</td></tr>
          <tr><td class="k">RPC alterno</td><td class="v mono">${RPC2} ${btnCopiar(RPC2)}</td></tr>
          <tr><td class="k">Explorador</td><td class="v mono">${esc(location.origin)} ${btnCopiar(location.origin)}</td></tr>
        </table></div>
        <div class="acciones-f" style="margin-top:16px">
          <button class="btn" onclick="agregarBilletera()">Añadir a MetaMask</button>
          <span class="resumen-f" id="mmsg" style="margin-left:0"></span>
        </div>
      </div>
      <div>
        <div class="cabecera-seccion"><h2>Cómo funciona</h2></div>
        <div class="panel"><table>
          ${dato("Tipo", "r-tipo")}
          ${dato("Cliente", "r-cliente")}
          ${dato("Consenso", "r-cons", "quién puede proponer un bloque")}
          ${dato("Tolerancia a caídas", "r-tol", "cuántos validadores pueden faltar")}
          ${dato("Máquina virtual", "r-evm", "qué contratos entiende")}
          ${dato("Coste del gas", "r-precio")}
          ${dato("Bloque génesis", "r-gen", "la huella de esta cadena")}
        </table></div>
      </div>
    </div></section>

    <section class="seccion">
      <div class="cabecera-seccion"><h2>Los tokens de la red</h2>
        <a class="mas" href="/tokens" data-ruta>Ver todos →</a></div>
      <div class="tarjetas" id="r-tokens"></div>
    </section>

    <p class="pista" style="text-align:left;margin-top:6px">
      Este explorador implementa <b>EIP-3091</b> — las rutas <code>/block/&lt;n&gt;</code>,
      <code>/tx/&lt;hash&gt;</code> y <code>/address/&lt;0x…&gt;</code> — que es el estándar
      que exigen Chainlist y las billeteras para reconocer un explorador de bloques.
      La red está publicada en <b>Chainlist</b> con este mismo ID.</p>
  </div>`;

  const poner = (id, txt, pill) => {
    const el = $("#" + id);
    if (el) el.innerHTML = txt + (pill ? ` <span class="pill">${pill}</span>` : "");
  };
  // Cada dato por su lado: si el nodo no contesta a uno, los demás se ven igual.
  const flojo = (id) => () => poner(id, "—");

  poner("r-tipo", "Layer 1 propia", "no es un rollup ni una sidechain");
  poner("r-evm", "EVM · Shanghai", "compatible con Solidity y las herramientas de Ethereum");

  rpc("web3_clientVersion")
    .then(v => poner("r-cliente", esc(String(v).split("/").slice(0, 2).join(" · "))))
    .catch(flojo("r-cliente"));

  rpc("qbft_getValidatorsByBlockNumber", ["latest"]).then(v => {
    const n = (v || []).length;
    poner("r-val", num(n));
    // La tolerancia de QBFT es (n−1)/3 hacia abajo. No se escribe «2» a mano:
    // el día que entre o salga un validador, este número tiene que moverse solo.
    const aguanta = Math.floor((n - 1) / 3);
    const el = $("#r-val-sub");
    if (el) el.textContent = `consenso QBFT · quórum de ${n - aguanta}`;
    poner("r-cons", "QBFT", "tolerante a fallos bizantinos");
    poner("r-tol", aguanta === 1 ? "1 validador" : `${num(aguanta)} validadores`,
      `de ${num(n)}`);
  }).catch(() => { flojo("r-val")(); flojo("r-cons")(); flojo("r-tol")(); });

  // El ritmo y el techo de gas salen de bloques REALES, no de la configuración.
  Promise.all([rpc("eth_blockNumber"), rpc("eth_getBlockByNumber", ["latest", false])])
    .then(async ([alt, b]) => {
      const n = aNum(alt);
      poner("r-alt", num(n));
      poner("r-gas", num(aNum(b.gasLimit)));
      const sub = $("#r-alt-sub");
      if (sub) sub.textContent = hace(aNum(b.timestamp));
      const antes = await rpc("eth_getBlockByNumber", ["0x" + Math.max(0, n - 10).toString(16), false]);
      const dt = (aNum(b.timestamp) - aNum(antes.timestamp)) / Math.max(1, n - Math.max(0, n - 10));
      poner("r-ritmo", dt > 0 ? dt.toFixed(1) + " s" : "—");
    })
    .catch(() => { flojo("r-alt")(); flojo("r-gas")(); flojo("r-ritmo")(); });

  rpc("eth_getBlockByNumber", ["0x0", false])
    .then(g => poner("r-gen", `<span class="mono">${esc(corto(g.hash, 12, 8))}</span> ${btnCopiar(g.hash)}`))
    .catch(flojo("r-gen"));

  rpc("eth_gasPrice")
    .then(p => {
      const gwei = aNum(p) / 1e9;
      poner("r-precio", gwei ? `${gwei.toLocaleString("es", { maximumFractionDigits: 2 })} gwei` : "sin coste",
        "mínimo que aceptan los validadores");
    })
    .catch(flojo("r-precio"));

  catalogo().then(tokens => {
    const el = $("#r-tokens");
    if (!el) return;
    el.innerHTML = (tokens || []).length
      ? tokens.map(t => `<a class="tarj" href="/token/${esc(t.contrato)}" data-ruta>
          <div class="et">${esc(t.symbol)}</div>
          <div class="va">${esc(t.nombre || t.symbol)}</div>
          <div class="sub mono">${esc(corto(t.contrato, 10, 6))}</div></a>`).join("")
      : `<div class="aviso">No se pudo leer el catálogo de tokens.</div>`;
  });
}

async function agregarBilletera() {
  const m = $("#mmsg");
  if (!window.ethereum) {
    m.textContent = "No se detectó ninguna billetera en este navegador.";
    return;
  }
  try {
    await window.ethereum.request({
      method: "wallet_addEthereumChain",
      params: [{
        chainId: "0x" + CHAIN_ID.toString(16),
        chainName: "Orden Global",
        nativeCurrency: { name: MONEDA, symbol: MONEDA, decimals: 18 },
        rpcUrls: [RPC],
        blockExplorerUrls: [location.origin],
      }],
    });
    m.textContent = "Red añadida.";
  } catch (e) {
    m.textContent = "No se pudo añadir: " + (e?.message || "cancelado");
  }
}

// ── Despachador ──────────────────────────────────────────────────────────────
function pintar() {
  const app = $("#app");
  const p = location.pathname.replace(/\/+$/, "") || "/";
  const params = new URLSearchParams(location.search);
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === p));

  let m;
  if (p === "/") return vistaInicio(app);
  if (p === "/blocks") return vistaBloques(app, params);
  if (p === "/txs") return vistaTxs(app, params);
  if (p === "/tokens") return vistaTokens(app);
  if (p === "/red") return vistaRed(app);
  if ((m = p.match(/^\/block\/(.+)$/))) return vistaBloque(app, decodeURIComponent(m[1]));
  if ((m = p.match(/^\/tx\/(.+)$/))) return vistaTx(app, decodeURIComponent(m[1]));
  if ((m = p.match(/^\/token\/(.+)$/))) return vistaToken(app, decodeURIComponent(m[1]));
  if ((m = p.match(/^\/address\/(.+)$/))) return vistaDireccion(app, decodeURIComponent(m[1]));
  if ((m = p.match(/^\/gid\/(.+)$/))) return vistaGid(app, decodeURIComponent(m[1]));

  app.innerHTML = `<div class="env">${cajaBuscar(true)}
    <div class="aviso">Esa página no existe. <a href="/" data-ruta>Volver al inicio</a></div></div>`;
}
catalogo();   // se pide ya, para que las vistas no esperen por el
pintar();
</script>
