# Blueprint de Render para desplegar el motor Genesis ID (Orden Global).
# En Render: New + → Blueprint → conecta este repo y elige la rama.
services:
  - type: web
    name: genesis-id
    runtime: node
    rootDir: genesis-id
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Portal oficial de Genesis ID (genesisid.online).
      - key: GENESIS_PORTAL_API
        value: https://www.genesisid.online
      # API key del portal. sync:false = Render la pide en el dashboard y NO
      # queda escrita en el repositorio (es un secreto: nunca versionarla).
      #
      # PEGA LA CLAVE COMPLETA. Si se copia una versión abreviada del tipo
      # gid_live_xxxx… el carácter «…» no cabe en una cabecera HTTP y todas
      # las llamadas al portal fallan. Compruébalo en /api/portal/status:
      # debe responder {"configured": true} sin "problemaConLaClave".
      - key: GENESIS_API_KEY
        sync: false
      # Opcional: segundos de espera al portal antes de rendirse (30 s por
      # defecto). Súbelo solo si el portal tarda en despertar.
      # - key: GENESIS_PORTAL_TIMEOUT_MS
      #   value: "30000"
      # Rutas de la API del portal. Solo hacen falta si el portal las publica
      # en otro sitio (síntoma: 404 con una página HTML). Descúbrelas con
      # GET /api/portal/discover, que dice exactamente qué poner aquí.
      # - key: GENESIS_PATH_USER_STATUS
      #   value: /api/apps/user-status
      # - key: GENESIS_PATH_REGISTER
      #   value: /api/apps/register-app
      # - key: GENESIS_PATH_TOKEN_VALIDATE
      #   value: /api/apps/token-validate
      # Persistencia entre reinicios (opcional): añade un Disk en Render montado
      # en /var/data y descomenta la siguiente línea para conservar los datos.
      # - key: GENESIS_DATA_FILE
      #   value: /var/data/genesis.json
