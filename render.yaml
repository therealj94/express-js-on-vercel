# Blueprint de Render para desplegar el motor Genesis ID (Orden Global).
# En Render: New + → Blueprint → conecta este repo y elige la rama.
services:
  - type: web
    name: genesis-id
    runtime: node
    rootDir: genesis-id
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

      # ─── Almacenamiento ────────────────────────────────────────────────────
      # OBLIGATORIO para datos reales. En Render el disco es efímero: sin esto,
      # cada despliegue borra todas las identidades verificadas.
      # sync:false = Render la pide en el panel y NO queda escrita en el repo.
      - key: GENESIS_MONGO_URL
        sync: false
      - key: GENESIS_MONGO_DB
        value: genesisid

      # ─── Primer administrador ──────────────────────────────────────────────
      # Si no se define la contraseña, el motor genera una al azar y la imprime
      # UNA sola vez en el registro de arranque.
      - key: GENESIS_ADMIN_EMAIL
        value: admin@ordenglobal.link
      - key: GENESIS_ADMIN_PASSWORD
        sync: false

      # ─── Inicio de sesión único entre las apps del ecosistema ──────────────
      # Secreto con el que se firman los tokens GID. Genere uno largo al azar.
      - key: GENESIS_SSO_SECRETO
        sync: false
      - key: GENESIS_SSO_MINUTOS
        value: "15"

      # ─── Listas de sanciones ───────────────────────────────────────────────
      # Carpeta con SDN.CSV y ALT.CSV de la OFAC, o listas propias en JSON.
      # SIN ESTO NO SE TAMIZA A NADIE, y ninguna identidad puede aprobarse sin
      # una anulación escrita. Requiere montar un Disk en Render.
      # - key: GENESIS_LISTAS_DIR
      #   value: /var/data/listas

      # ─── Biometría ─────────────────────────────────────────────────────────
      # Proveedor de cotejo de rostro y prueba de vida. Sin él, el cotejo lo
      # resuelve a mano un operador en cada verificación.
      # - key: GENESIS_BIOMETRIA_URL
      #   sync: false
      # - key: GENESIS_BIOMETRIA_KEY
      #   sync: false

      # ─── Umbrales (opcionales) ─────────────────────────────────────────────
      # - key: GENESIS_EDAD_MINIMA
      #   value: "18"
      # - key: GENESIS_UMBRAL_USD          # reporte por operación única
      #   value: "10000"
      # - key: GENESIS_VENTANA_DIAS        # ventana de acumulación
      #   value: "30"
      # - key: GENESIS_SESION_HORAS        # duración de la sesión del panel
      #   value: "8"

  # ─── Tesorería de Orden Global ─────────────────────────────────────────────
  # La Autoridad de Emisión de ORIGEN y las tesorerías de security y utility
  # tokens. Sirve su propio front (tesoreria/*.html) y el API bajo /api.
  - type: web
    name: tesoreria
    runtime: node
    rootDir: tesoreria/servidor
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # OBLIGATORIO para operar de verdad: sin Mongo, el libro sellado se pierde
      # en cada despliegue. Puede ser el mismo clúster de Genesis ID con otra base.
      - key: TESORERIA_MONGO_URL
        sync: false
      - key: TESORERIA_MONGO_DB
        value: tesoreria
      # Primer presidente del Consejo. Sin contraseña, se genera una y se imprime
      # UNA sola vez en el registro de arranque.
      - key: TESORERIA_ADMIN_EMAIL
        value: tesoreria@ordenglobal.org
      - key: TESORERIA_ADMIN_NOMBRE
        value: Presidente del Consejo
      - key: TESORERIA_ADMIN_PASSWORD
        sync: false
      # Entrada con la sesión única de Genesis ID: clave de API de la app
      # «tesoreria» emitida desde el panel de Genesis (alcance gid.verificar).
      - key: TESORERIA_GENESIS_URL
        value: https://genesis-id.onrender.com
      - key: TESORERIA_GENESIS_API_KEY
        sync: false
      # RPC de la cadena 5550 para conciliar el supply real contra el autorizado.
      - key: RPC_ORDEN_URL
        value: https://rpc.ordenglobal-rpc.com/
      # Orígenes adicionales que pueden llamar al API (la copia estática en Vercel).
      # - key: TESORERIA_CORS
      #   value: https://express-js-on-vercel.vercel.app
