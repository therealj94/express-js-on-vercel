# Blueprint de Render para desplegar el motor Genesis ID (Orden Global).
# En Render: New + → Blueprint → conecta este repo y elige la rama.
services:
  - type: web
    name: genesis-id
    runtime: node
    rootDir: genesis-id
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Portal oficial de Genesis ID (genesisid.online).
      - key: GENESIS_PORTAL_API
        value: https://www.genesisid.online
      # API key del portal. sync:false = Render la pide en el dashboard y NO
      # queda escrita en el repositorio (es un secreto: nunca versionarla).
      - key: GENESIS_API_KEY
        sync: false
      # Persistencia entre reinicios (opcional): añade un Disk en Render montado
      # en /var/data y descomenta la siguiente línea para conservar los datos.
      # - key: GENESIS_DATA_FILE
      #   value: /var/data/genesis.json
