# Blueprint de Render para desplegar el motor Genesis ID (Orden Global).
# En Render: New + → Blueprint → conecta este repo y elige la rama.
services:
  - type: web
    name: genesis-id
    runtime: node
    rootDir: genesis-id
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"

      # ─── Almacenamiento ────────────────────────────────────────────────────
      # OBLIGATORIO para datos reales. En Render el disco es efímero: sin esto,
      # cada despliegue borra todas las identidades verificadas.
      # sync:false = Render la pide en el panel y NO queda escrita en el repo.
      - key: GENESIS_MONGO_URL
        sync: false
      - key: GENESIS_MONGO_DB
        value: genesisid

      # ─── Primer administrador ──────────────────────────────────────────────
      # Si no se define la contraseña, el motor genera una al azar y la imprime
      # UNA sola vez en el registro de arranque.
      - key: GENESIS_ADMIN_EMAIL
        value: admin@ordenglobal.link
      - key: GENESIS_ADMIN_PASSWORD
        sync: false

      # ─── Inicio de sesión único entre las apps del ecosistema ──────────────
      # Secreto con el que se firman los tokens GID. Genere uno largo al azar.
      - key: GENESIS_SSO_SECRETO
        sync: false
      - key: GENESIS_SSO_MINUTOS
        value: "15"

      # ─── Listas de sanciones ───────────────────────────────────────────────
      # Carpeta con SDN.CSV y ALT.CSV de la OFAC, o listas propias en JSON.
      # SIN ESTO NO SE TAMIZA A NADIE, y ninguna identidad puede aprobarse sin
      # una anulación escrita. Requiere montar un Disk en Render.
      # - key: GENESIS_LISTAS_DIR
      #   value: /var/data/listas

      # ─── Biometría ─────────────────────────────────────────────────────────
      # Proveedor de cotejo de rostro y prueba de vida. Sin él, el cotejo lo
      # resuelve a mano un operador en cada verificación.
      # - key: GENESIS_BIOMETRIA_URL
      #   sync: false
      # - key: GENESIS_BIOMETRIA_KEY
      #   sync: false

      # ─── Umbrales (opcionales) ─────────────────────────────────────────────
      # - key: GENESIS_EDAD_MINIMA
      #   value: "18"
      # - key: GENESIS_UMBRAL_USD          # reporte por operación única
      #   value: "10000"
      # - key: GENESIS_VENTANA_DIAS        # ventana de acumulación
      #   value: "30"
      # - key: GENESIS_SESION_HORAS        # duración de la sesión del panel
      #   value: "8"

  # ─── OrdenExchange: la casa de cambio P2P ────────────────────────────────
  - type: web
    name: ordenexchange
    runtime: node
    rootDir: ordenexchange
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # ─── Almacenamiento ────────────────────────────────────────────────────
      # OBLIGATORIO: sin Mongo, cada despliegue borra los saldos en custodia.
      - key: ORDENEX_MONGO_URL
        sync: false
      - key: ORDENEX_MONGO_DB
        value: ordenexchange

      # ─── Sesiones y primer administrador del panel (/admin) ────────────────
      - key: ORDENEX_JWT_SECRETO
        generateValue: true
      - key: ORDENEX_ADMIN_EMAIL
        value: admin@ordenglobal.link
      - key: ORDENEX_ADMIN_PASSWORD
        sync: false

      # ─── Genesis ID: la clave de la app «ordenexchange» ────────────────────
      # La imprime el motor Genesis ID al redesplegar con la app nueva, o se
      # emite desde su panel → Operadores y apps. Sin ella nadie se verifica.
      - key: GENESIS_URL
        value: https://genesis-id.onrender.com
      - key: GENESIS_API_KEY
        sync: false

      # ─── Cadena 5550 ───────────────────────────────────────────────────────
      # La tesorería: a dónde deposita la gente y desde dónde se firman los
      # retiros. Sin ella no se comprueban depósitos.
      - key: ORDENEX_RPC_URL
        value: https://ordenglobal-rpc.com
      - key: ORDENEX_TESORERIA
        sync: false

      # ─── Precio de referencia (se puede cambiar luego desde el panel) ──────
      - key: ORDENEX_ORO_USD_ONZA
        sync: false
      - key: ORDENEX_PLATA_USD_ONZA
        sync: false

      # ─── Modo demostración: NUNCA en producción ────────────────────────────
      - key: ORDENEX_DEMO
        value: "0"
