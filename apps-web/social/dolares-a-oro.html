<!doctype html>
<meta charset="utf-8">
<title>Orden Global · de dólares a oro · 1080x1080</title>
<!--
  PIEZA 2 · DE DÓLARES A ORO · 1080×1080 (feed)

  LA IDEA · La referencia que dio José reparte la pieza en dos manos: una da
  billetes de un país, la otra recibe los de otro. La nuestra reparte la pieza
  en dos MATERIAS: a la izquierda el papel, a la derecha el metal. Mismo recurso
  —un antes y un después que se leen de un vistazo— y ninguna coincidencia de
  color, tipografía ni tono.

  EL TELÉFONO ES REAL · La pantalla de dentro es una captura de la web de Veta
  Wallet, no una maqueta dibujada. Una interfaz inventada en un anuncio es una
  promesa que después no está en la app cuando la persona la abre.

  SIN CIFRAS DE CONVERSIÓN · No se pone «500 USD = 0,29 AUKA» ni nada parecido.
  El precio del oro se mueve todos los días y una cifra impresa en una imagen
  queda vieja el mismo día que se publica — y una cifra vieja en un anuncio de
  dinero no es un detalle, es una queja.
-->
<style>
@font-face{font-family:'Cinzel';src:url('piezas/Cinzel-Bold.ttf') format('truetype');font-weight:700}
@font-face{font-family:'Plex';src:url('piezas/IBMPlexSans.woff2') format('woff2');font-weight:100 700}
@font-face{font-family:'PlexMono';src:url('piezas/IBMPlexMono-500.woff2') format('woff2');font-weight:500}

:root{
  --pozo:#021B1C; --oro:#C9A94E; --oroLt:#E8CE86; --oroPl:#F7EFD0;
  --crema:#F3ECD9; --bruma:#AEC7C3; --humo:#6E8C88;
  --papel:#7C8C7F;         /* el verde apagado del billete, no un verde vivo */
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1080px;overflow:hidden;background:var(--pozo);
  font-family:'Plex',system-ui,sans-serif;color:var(--crema);position:relative}

/* ── el fondo, partido en dos materias ────────────────────────────────── */
.fondo{position:absolute;inset:0;
  background:
    radial-gradient(80% 90% at 6% 50%, rgba(124,140,127,.30), transparent 62%),
    radial-gradient(85% 95% at 96% 46%, rgba(201,169,78,.34), transparent 62%),
    linear-gradient(160deg,#04292A 0%,#021B1C 52%,#010E0F 100%)}
.grano{position:absolute;inset:0;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:4px 4px}
/* La costura entre las dos mitades: donde el papel se vuelve metal. */
.costura{position:absolute;left:50%;top:0;width:2px;height:100%;
  background:linear-gradient(to bottom,transparent,rgba(232,206,134,.35) 30%,rgba(232,206,134,.35) 70%,transparent);
  filter:blur(1px)}

.lienzo{position:relative;height:100%;padding:64px 68px 56px;display:flex;flex-direction:column}

.rotulo{display:flex;align-items:center;gap:16px;
  font:500 20px/1 'PlexMono',monospace;letter-spacing:.28em;color:var(--oro);text-transform:uppercase}
.rotulo::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,169,78,.55),transparent)}

h1{font-family:'Cinzel',Georgia,serif;font-weight:700;line-height:1.0;margin-top:30px}
h1 .a{display:block;font-size:88px;color:var(--bruma)}
h1 .b{display:block;font-size:88px;color:var(--oroPl)}
.bajada{margin-top:20px;font-size:27px;line-height:1.4;color:var(--bruma);max-width:30ch}
.bajada b{color:var(--oroLt);font-weight:600}

/* ── la escena ─────────────────────────────────────────────────────────── */
.escena{position:relative;height:470px;margin-top:10px}

/* El papel: un fajo insinuado, sin dibujar un billete falso de ningún país.
   Un billete inventado en un anuncio de dinero se lee como juguete. */
.fajo{position:absolute;left:8px;top:50%;width:290px;height:190px;
  transform:translateY(-50%) rotate(-10deg)}
.fajo .b{position:absolute;left:0;width:274px;height:124px;border-radius:9px;
  background:linear-gradient(150deg,#9DAD9E,#7C8C7F 58%,#5F6E5C);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 16px 34px -16px rgba(0,0,0,.85)}
.fajo .b::after{content:'';position:absolute;inset:11px;border:1px solid rgba(255,255,255,.20);border-radius:5px}
.fajo .b:nth-child(1){top:0;left:16px;opacity:.55}
.fajo .b:nth-child(2){top:26px;left:8px;opacity:.78}
.fajo .b:nth-child(3){top:54px;left:0}
.fajo .s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Cinzel',serif;font-size:56px;color:rgba(255,255,255,.80);z-index:2}
.fajo .b small{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font:500 16px/1 'PlexMono',monospace;letter-spacing:.24em;color:rgba(255,255,255,.55)}

/* El metal: un lingote, con su brillo y su canto. */
.lingote{position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(8deg);
  width:262px;height:156px;border-radius:14px/18px;
  background:linear-gradient(160deg,#FBF0C8 0%,#E8CE86 26%,#C9A94E 58%,#96751F 100%);
  box-shadow:0 34px 70px -26px rgba(232,206,134,.6),0 0 0 1px rgba(255,255,255,.35) inset;
  display:grid;place-items:center}
.lingote::before{content:'';position:absolute;left:0;right:0;top:0;height:34%;
  border-radius:14px 14px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent)}
.lingote span{position:relative;font-family:'Cinzel',serif;font-size:40px;color:#5A4410;letter-spacing:.06em}
.lingote small{position:absolute;bottom:22px;font:500 17px/1 'PlexMono',monospace;
  letter-spacing:.2em;color:rgba(90,68,16,.75)}

/* La flecha que cruza: el verbo de la pieza. */
.flecha{position:absolute;top:50%;height:2px;z-index:3;
  background:linear-gradient(90deg,rgba(174,199,195,.20),rgba(232,206,134,.85))}
.flecha.izq{left:300px;width:112px}
.flecha.der{right:300px;width:112px}
.flecha.der::after{content:'';position:absolute;right:-2px;top:-9px;
  border-left:19px solid var(--oroLt);border-top:10px solid transparent;border-bottom:10px solid transparent}

/* El teléfono, con la captura de verdad dentro. */
.tel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:214px;height:434px;border-radius:33px;padding:7px;
  background:linear-gradient(150deg,#2A3B3A,#0B1918);
  box-shadow:0 60px 110px -34px rgba(0,0,0,.9),0 0 0 1.5px rgba(232,206,134,.35);z-index:4}
.tel img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:29px;display:block}
.tel .isla{position:absolute;left:50%;top:20px;transform:translateX(-50%);
  width:74px;height:20px;border-radius:999px;background:#060F0F;z-index:5}

/* ── el pie ────────────────────────────────────────────────────────────── */
.nota{margin-top:18px;display:flex;align-items:center;gap:12px;font-size:23px;color:var(--humo)}
.nota b{color:var(--bruma);font-weight:600}
.pie{margin-top:26px;display:flex;align-items:center;justify-content:space-between}
.marcas{display:flex;align-items:center;gap:24px}
.marcas img.og{height:56px;width:auto}
.marcas img.veta{height:66px;width:auto}
.marcas .barra{width:1px;height:44px;background:rgba(201,169,78,.5)}
.cta{display:flex;align-items:center;gap:16px;height:84px;padding:0 40px;border-radius:999px;
  background:linear-gradient(135deg,var(--oroPl),var(--oro));color:#04211F;
  font-size:32px;font-weight:600;box-shadow:0 20px 44px -20px rgba(232,206,134,.8)}
.cta svg{width:28px;height:28px;stroke:#04211F;stroke-width:2.4;fill:none;stroke-linecap:round}
</style>

<div class="fondo"></div><div class="grano"></div><div class="costura"></div>

<div class="lienzo">
  <div class="rotulo">Orden Global · Veta Wallet</div>

  <h1><span class="a">De dólares</span><span class="b">a oro.</span></h1>
  <p class="bajada">Cambiá tu saldo por <b>ORIGEN</b> en segundos, desde el teléfono. Sin ventanilla y sin horario.</p>

  <div class="escena">
    <div class="fajo">
      <div class="b"></div>
      <div class="b"></div>
      <div class="b"><span class="s">$</span><small>USD</small></div>
    </div>

    <div class="flecha izq"></div>
    <div class="flecha der"></div>

    <div class="tel">
      <div class="isla"></div>
      <img src="piezas/billetera.png" alt="Veta Wallet">
    </div>

    <div class="lingote"><span>AU</span><small>999.9</small></div>
  </div>

  <div class="nota">Oro real, certificado y guardado. <b>Respaldo 1:1.</b></div>

  <div class="pie">
    <div class="marcas">
      <img class="og" src="piezas/og-mono.png" alt="Orden Global">
      <span class="barra"></span>
      <img class="veta" src="piezas/veta-mark.png" alt="Veta Wallet">
    </div>
    <div class="cta">
      <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
      Descargá la app
    </div>
  </div>
</div>
