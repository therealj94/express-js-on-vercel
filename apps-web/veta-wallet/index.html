<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orden Global · Un ecosistema entero, en una sola cuenta</title>
<meta name="description" content="Orden Global: tu dinero respaldado en oro (Veta Wallet), tu gente (PULSE CHAT), tu negocio (MyTokenPay) y tu identidad (Genesis ID), sobre nuestra propia cadena y con AU-RA, la inteligencia del ecosistema.">
<meta name="theme-color" content="#021B1C">
<link rel="icon" href="assets/veta-logo.png">
<link rel="apple-touch-icon" href="assets/veta-logo.png">
<meta property="og:title" content="Orden Global">
<meta property="og:description" content="Un ecosistema entero, en una sola cuenta.">
<meta property="og:image" content="https://app.vetawallet.com/assets/veta.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Veta Wallet · web

   Una veta es la franja de mineral por la que el oro llega a la superficie:
   el nombre de la marca y la columna vertebral de este diseño. Una sola línea
   dorada atraviesa la pantalla, se abre donde hay que decidir y se ensancha
   donde está el valor.

   La letra grande es Cinzel: la MISMA que firma la app en el teléfono, un
   trazo lapidario que casa con el dorado de la marca. Viaja dentro de la
   página, así que no depende de ningún CDN. El texto de trabajo va en
   Archivo, seca y neutra, para que la lapidaria sea la única voz alta.

   Dentro de la billetera no hay lapidaria: los títulos de pantalla son secos
   y en negrita, del tamaño que tienen en el teléfono. Ese fue el motivo real
   de que la web se viera de otra casa — no el color, que ya era el mismo.
   ═══════════════════════════════════════════════════════════════════════════ */

/* La tipografia de display de la app. Cinzel Bold: el mismo archivo que
   viaja dentro del telefono, convertido a woff2 y servido desde aqui — no
   depende de ningun CDN, asi que la marca nunca cae a la letra del sistema.
   Solo hay negrita: la fuente no sintetiza pesos, por eso todo lo que la use
   va en 700. */
@font-face{
  font-family:'Cinzel';src:url('assets/fonts/Cinzel-Bold.woff2') format('woff2');
  font-weight:700;font-style:normal;font-display:swap;
}

/* Los valores son los de orden-global-app/src/theme.js, uno a uno. La web se
   veia de otra casa por dos motivos, y ninguno era el color: la letra grande
   era una didona en vez de la lapidaria de la marca, y el fondo era un verde
   plano en vez de la fotografia sobre la que se dibuja la app. */
:root{
  --pozo:#021B1C; --veta:#063430;
  --panel:rgba(6,40,42,.82); --panel2:rgba(12,54,56,.86); --panel3:rgba(22,78,80,.74);
  --linea:rgba(201,169,97,.34); --linea2:rgba(201,169,97,.26);
  --campo:rgba(8,44,46,.88); --campoBr:#2E7477;
  --oro:#C9A961; --oroLt:#EAD79C; --oroHi:#F8EFCF; --oroDp:#96793F;
  --crema:#F3ECD9; --bruma:#AEC7C3; --humo:#6E938F;
  --jade:#3ED9A0; --coral:#F0776B; --tinta:#3A2C08;
  --serif:'Cinzel','Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:18px; --r2:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* La app se dibuja sobre una fotografia de marca con un velo encima, y la
   legibilidad la resuelven las tarjetas de vidrio, no oscureciendo la foto
   entera. El velo son los mismos tres pasos que usa AppBackground. */
body{
  background:var(--pozo); color:var(--crema); font-family:var(--sans); font-weight:400;
  min-height:100svh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(180deg, rgba(4,30,30,.26), rgba(2,20,21,.50) 46%, rgba(1,12,13,.66)),
    url('assets/fondo.jpg');
  background-size:cover, cover;
  background-position:center, center;
  background-repeat:no-repeat, no-repeat;
  background-attachment:fixed, fixed;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:6px}
.oculto{display:none!important}
.mono{font-family:var(--mono);font-variant-ligatures:none}

/* La veta es de la PORTADA: es su idea —una franja de mineral que sube a la
   superficie— y ahi se queda. Dentro de la billetera la app no tiene ninguna
   linea cruzando la pantalla, y dejarla era la mitad de por que la web se
   veia de otra casa. */
#app:not(.oculto) ~ .veta-svg,
body:has(#app:not(.oculto)) .veta-svg{display:none}

/* ── la veta ─────────────────────────────────────────────────────────────── */
.veta-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.veta-svg path{fill:none;stroke:url(#vetaGrad);stroke-width:1.7;stroke-linecap:round;
  stroke-dasharray:var(--largo);stroke-dashoffset:var(--largo);
  animation:vetaCrece 2.6s cubic-bezier(.32,.9,.35,1) forwards}
.veta-svg path.b{animation-delay:.55s;opacity:.7}
.veta-svg path.c{animation-delay:.95s;opacity:.45}
@keyframes vetaCrece{to{stroke-dashoffset:0}}
.pepita{fill:var(--oroHi);opacity:0;animation:pepitaSale .9s 2.1s ease forwards}
@keyframes pepitaSale{from{opacity:0}to{opacity:1}}

/* ── cabecera fina, presente en la portada y el acceso ───────────────────── */
.techo{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:18px clamp(18px,4vw,42px)}
.techo .marca{font-size:clamp(19px,2.6vw,23px)}
.idiomas{display:flex;border:1px solid var(--linea2);border-radius:100px;overflow:hidden;
  background:rgba(2,22,23,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.idiomas button{padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--humo);transition:.2s}
.idiomas button[aria-pressed=true]{background:rgba(201,169,97,.16);color:var(--oroHi)}

/* ── marca ───────────────────────────────────────────────────────────────── */
.marca{display:flex;align-items:baseline;gap:.34ch;
  font-family:var(--serif);font-weight:700;letter-spacing:.04em;line-height:1;color:var(--crema)}
.marca em{font-style:normal;font-weight:700;
  background:linear-gradient(100deg,var(--oroLt),var(--oroHi) 42%,var(--oro) 72%,var(--oroLt));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:brillo 6s linear infinite}
@keyframes brillo{to{background-position:220% 0}}

/* ── portada: editorial, cargada a la izquierda ──────────────────────────────
   Nada centrado. El texto vive en la mitad izquierda como una página de
   revista; la mitad derecha es de la veta y del lingote flotante. El vacío de
   la derecha no es un descuido: es la roca sin excavar. */
#bienvenida{position:relative;z-index:2;min-height:min(100svh,860px);display:grid;align-items:center;
  grid-template-columns:minmax(0,6fr) minmax(0,4fr);gap:clamp(20px,3.5vw,48px);
  max-width:1420px;margin:0 auto;
  padding:clamp(86px,14vh,120px) clamp(20px,5vw,64px) clamp(40px,7vh,64px)}
.bv{max-width:640px}
.bv .renglon{display:block;overflow:hidden;padding-bottom:.06em}
.bv .palabra{display:inline-block;transform:translateY(112%);animation:palabraSube .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes palabraSube{to{transform:none}}
.sello{font-size:11px;font-weight:700;letter-spacing:.34em;color:var(--oroDp);text-transform:uppercase;
  display:flex;align-items:center;gap:14px}
.sello::after{content:"";height:1px;width:74px;background:linear-gradient(90deg,var(--oroDp),transparent)}
.bv h1{margin-top:22px;font-family:var(--serif);font-weight:700;letter-spacing:0;
  font-size:clamp(40px,7vw,82px);line-height:1.04;color:var(--crema)}
.bv h1 i{font-style:normal;font-weight:700;color:var(--oroLt)}
.bv p{margin-top:22px;color:var(--bruma);font-size:clamp(14.5px,1.6vw,16.5px);line-height:1.66;max-width:46ch;
  opacity:0;animation:aparece .8s 1s ease forwards}
.bv-btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;
  opacity:0;animation:aparece .8s 1.2s ease forwards}
@keyframes aparece{to{opacity:1}}
/* La fila de hechos: alineada a la izquierda, separada por hilos, cada dato
   con su cifra en didona. Es la línea de "por qué creerle" y entra la última. */
.hechos{margin-top:clamp(34px,6vh,58px);display:flex;gap:clamp(18px,3vw,38px);flex-wrap:wrap;
.bv-marcas{margin-top:22px;font-size:11px;font-weight:700;letter-spacing:.14em;
  color:var(--humo);text-transform:uppercase}
  opacity:0;animation:aparece .9s 1.5s ease forwards}
.hecho{padding-left:16px;border-left:1px solid var(--linea2)}
.hecho b{display:block;font-family:var(--serif);font-weight:700;font-size:clamp(20px,2.6vw,27px);color:var(--oroLt)}
.hecho small{display:block;margin-top:4px;font-size:11.5px;color:var(--humo);letter-spacing:.04em;max-width:17ch;line-height:1.5}

/* El lingote: una tarjeta de vidrio con la equivalencia del gramo y un QR real
   hacia la casa. Flota apenas, como colgada de la veta. */
.lingote{justify-self:end;align-self:center;width:min(100%,320px);padding:26px;
  animation:flota 7s 2.4s ease-in-out infinite,aparece 1s 1.6s ease both}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-
12px) rotate(.4deg)}}
.lingote .l-lbl{font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--humo)}
.lingote .l-uno{margin-top:10px;font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;color:var(--oroHi)}
.lingote .l-eq{margin-top:8px;font-size:13px;color:var(--bruma);line-height:1.6}
.lingote .l-qr{margin-top:18px;display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid var(--linea2)}
.lingote .l-qr>div{width:74px;flex:0 0 auto;border-radius:10px;overflow:hidden}
.lingote .l-qr small{font-size:11.5px;color:var(--humo);line-height:1.55}

/* ── botones ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:15px 30px;border-radius:100px;font-weight:700;font-size:15px;letter-spacing:.01em;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,background .22s,border-color .22s;
  white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:scale(.975)}
.btn-oro{color:#2A2007;background:linear-gradient(120deg,var(--oroLt),var(--oro) 52%,var(--oroLt));
  background-size:210% 100%;box-shadow:0 14px 40px -16px rgba(201,169,97,.7)}
.btn-oro:hover{transform:translateY(-2px);box-shadow:0 20px 52px -16px rgba(201,169,97,.85)}
/* El destello que cruza al pasar el cursor: reflejo sobre metal, no un hover. */
.btn-oro::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  background-size:250% 100%;background-position:160% 0;transition:background-position .7s ease}
.btn-oro:hover::after{background-position:-60% 0}
.btn-linea{border:1px solid var(--linea);color:var(--crema);background:rgba(255,255,255,.03)}
.btn-linea:hover{border-color:var(--oro);background:rgba(201,169,97,.09);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-full{width:100%}
.btn-sm{padding:11px 20px;font-size:13.5px}

.vidrio{background:var(--panel);border:1px solid var(--linea2);border-radius:var(--r2);
  backdrop-filter:bl
ur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}

/* ── acceso: el formulario a un lado, la promesa al otro ─────────────────── */
#acceso{position:relative;z-index:2;min-height:100svh;display:grid;align-items:center;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,70px);
  padding:clamp(86px,13vh,110px) clamp(20px,5vw,64px) 48px}
.acc-lado{max-width:430px;justify-self:end}
.acc-lado .sello{margin-bottom:18px}
.acc-lado h2{font-family:var(--serif);font-weight:700;font-size:clamp(30px,4.2vw,50px);line-height:1.08}
.acc-lado h2 i{font-style:normal;font-weight:700;color:var(--oroLt)}
.acc-lado p{margin-top:16px;color:var(--bruma);font-size:15px;line-height:1.65;max-width:38ch}
.acc-lado .gid-mini{margin-top:26px;display:flex;gap:12px;align-items:flex-start;padding:16px;
  border:1px solid var(--linea2);border-radius:var(--r);background:rgba(2,22,23,.4)}
.acc-lado .gid-mini svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--oroLt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acc-lado .gid-mini small{font-size:12.5px;color:var(--humo);line-height:1.6}
.acc{width:min(94vw,428px);padding:cl
amp(26px,5vw,38px);justify-self:start;
  animation:sube .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.seg{display:flex;gap:4px;padding:4px;background:rgba(2,20,20,.6);border:1px solid var(--linea2);
  border-radius:100px;margin-bottom:24px}
.seg button{flex:1;padding:11px;border-radius:100px;font-size:14px;font-weight:600;color:var(--bruma);transition:.2s}
.seg button[aria-selected=true]{background:linear-gradient(120deg,var(--oroLt),var(--oro));color:#2A2007;font-weight:700}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12px;color:var(--bruma);margin-bottom:7px;font-weight:500}
.campo input{width:100%;padding:14px 15px;background:var(--campo);border:1px solid var(--campoBr);
  border-radius:var(--r);font-size:15.5px;color:var(--crema);transition:border-color .2s,box-shadow .2s}
.campo input::placeholder{color:var(--humo)}
.campo input:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
.campo-pw{position:relative}
.campo-pw input{padding-right:52px}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px;color:var(--humo);border-radius:10px}
.ojo:hover{color:var(--oroLt)}
.fuerza{height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
.fuerza i{display:block;height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.fuerza-lbl{font-size:11px;margin-top:6px;color:var(--humo)}
.aviso{margin-top:4px;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);font-size:13.5px;line-height:1.5}
.aviso-mal{background:rgba(240,119,107,.1);border:1px solid rgba(240,119,107,.35);color:#FFC3BC}
.aviso-ok{background:rgba(62,217,160,.1);border:1px solid rgba(62,217,160,.32);color:#B6F2DC}
.acc-legal{margin-top:18px;font-size:11.5px;color:var(--humo);text-align:center;line-height:1.6}
.acc-legal a{color:var(--bruma)}
.acc-volver{display:block;margin:20px auto 0;font-size:13px;color:var(--humo)}
.acc-volver:hover{color:var(--oroLt)}

/* ── armazón de la aplicación ────────────────────────────────────────────── */
#app{position:relative;z-index:2;min-height:100svh}
.riel{position:fixed;left:0;top:0;bottom:0;width:232px;padding:26px 18px;z-index:5;
  border-right:1px solid var(--linea2);background:rgba(2,22,23,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;flex-direction:column;gap:6px}
.riel-marca{display:flex;align-items:center;gap:9px;padding:6px 8px 22px;font-size:16.5px;
  letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.riel-marca img{height:26px;width:auto;border-radius:0;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  font-size:14.5px;font-weight:600;color:var(--bruma);transition:.18s;width:100%;text-align:left;position:relative}
.nav svg{width:19px;height:19px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.045);color:var(--crema)}
.nav[aria-current=page]{background:rgba(201,169,97,.13);color:var(--oroHi)}
.nav[aria-current=page] svg{color:var(--oro)}
/* La sección activa lleva su propia astilla de veta al costado. */
.nav[aria-current=page]::before{content:"";position:absolute;left:-18px;top:22%;bottom:22%;width:2px;
  background:linear-gradient(180deg,transparent,var(--oro),transparent)}
.riel-pie{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--linea2);font-size:11.5px;color:var(--humo);line-height:1.7}
.riel-pie a{color:var(--bruma);text-decoration:none}
.riel-pie a:hover{color:var(--oroLt)}
.riel-pie .idiomas{margin-top:10px;width:max-content}

.lienzo{margin-left:232px;padding:clamp(20px,3vw,38px) clamp(16px,3vw,38px) 60px;max-width:920px}
/* Cada vista entra en cascada: los bloques se levantan uno tras otro. Como el
   contenido se re-crea al navegar, la animación corre sola en cada cambio. */
.lienzo>*{animation:bloqueSube .55s cubic-bezier(.2,.8,.3,1) both}
.lienzo>*:nth-child(2){animation-delay:.07s}
.lienzo>*:nth-child(3){animation-delay:.14s}
.lienzo>*:nth-child(4){animation-delay:.21s}
.lienzo>*:nth-child(5){animation-delay:.28s}
@keyframes bloqueSube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
/* Header de orden-global-app/src/ui.js: hTitle 19/800, hSub 11.5. En una
   pantalla grande sube un poco, pero sigue siendo un titulo de pantalla y no
   un titular. */
.cab h2{font-family:var(--sans);font-weight:800;font-size:clamp(19px,2.2vw,24px);
  letter-spacing:-.01em;color:var(--crema)}
.cab .sub{font-size:12px;color:var(--bruma);margin-top:5px}

/* ── el saldo ────────────────────────────────────────────────────────────── */
.saldo{padding:clamp(24px,4vw,34px);position:relative;overflow:hidden}

.saldo-lbl{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--oro);font-weight:600;opacity:.9}
.saldo-cifra{margin-top:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.saldo-cifra b{font-family:var(--sans);font-weight:800;font-size:clamp(40px,7.6vw,58px);
  line-height:1;letter-spacing:-1px;color:var(--oroHi);
  font-variant-numeric:lining-nums tabular-nums;
  text-shadow:0 2px 10px rgba(0,0,0,.45)}
.saldo-cifra span{font-size:14px;font-weight:700;color:var(--oroDp);letter-spacing:.14em}
.saldo-fiat{margin-top:10px;font-size:15px;color:var(--bruma)}
.saldo-fiat .pastilla{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:100
px;
  font-size:12px;font-weight:700;font-family:var(--mono)}
.sube-p{background:rgba(62,217,160,.14);color:var(--jade)}
.baja-p{background:rgba(240,119,107,.14);color:var(--coral)}
.acciones{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.acc-btn{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;
  border-radius:var(--r);border:1px solid var(--linea2);background:rgba(255,255,255,.035);
  font-size:12.5px;font-weight:600;color:var(--crema);transition:.2s}
.acc-btn:hover{border-color:var(--linea);background:rgba(201,169,97,.09);transform:translateY(-2px)}
.acc-btn svg{width:21px;height:21px;stroke:var(--oro);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.bloque{margin-top:22px;padding:clamp(20px,3vw,26px)}
.bloque h3{font-size:16.5px;font-weight:700;margin-bottom:4px;color:var(--crema)}
/* .pie nombra dos cosas: el pie de pagina del sitio y la letra pequeña de
   dentro de un bloque. La primera trae relleno y un borde superior que la
   segunda heredaba, asi que cada aclaracion dentro de una tarjeta salia
   indentada y con una raya encima que nadie habia pedido. */
.bloque .pie{font-size:13px;color:var(--humo);line-height:1.6;
  padding:0;border-top:0;display:block;background:none}
.hilera{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hilera:last-child{border-bottom:0}
.hilera .ic{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:rgba(201,169,97,.11);border:1px solid var(--linea2)}
.hilera .ic svg{width:17px;height:17px;stroke:var(--oro);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hilera .txt{flex:1;min-width:0}
.hilera .txt b{display:block;font-size:14.5px;font-weight:600}
.hilera .txt small{display:block;font-size:12.5px;color:var(--humo);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hilera .val{text-align:right;font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.val.entra{color:var(--jade)} .val.sale{color:var(--crema)}
.vacio{padding:34px 20px;text-align:center;color:var(--humo);font-size:14px;line-height:1.7}
.vacio b{display:block;color:var(--bruma);font-size:15px;margin-bottom:6px;font-weight:600}

.gid{display:flex;align-items:flex-start;gap:16px}
.gid-ic{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(201,169,97,.22),rgba(62,217,160,.12));border:1px solid var(--linea)}
.gid-ic svg{width:22px;height:22px;stroke:var(--oroLt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.estado{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:100px;
  font-size:12px;font-weight:700;letter-spacing:.02em}
.estado::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.e-ok{background:rgba(62,217,160,.13);color:var(--jade)}
.e-rev{background:rgba(201,169,97,.14);color:var(--oroLt)}
.e-no{background:rgba(174,199,195,.1);color:var(--bruma)}
.e-mal{background:rgba(240,119,107,.12);color:var(--coral)}

.qr-caja{margin:0 auto;width:min(78vw,260px);padding:16px;background:var(--crema);border-radius:20px;
  box-shadow:0 24px 60px -26px rgba(0,0,0,.9)}
.qr-caja svg{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:8px}
.dir{margin-top:20px;padding:15px;background:rgba(2,20,20,.55);border:1px solid var(--linea2);
  border-radius:var(--r);font-family:var(--mono);font-size:13px;word-break:break-all;line-height:1.7;
  text-align:center;color:var(--bruma)}
.tabs{display:none}

#tostada{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:60;
  opacity:0;visibility:hidden;
  padding:13px 22px;border-radius:100px;background:rgba(6,44,46,.96);border:1px solid var(--linea);
  font-size:14px;font-weight:600;box-shadow:0 18px 50px -18px rgba(0,0,0,.9);
  transition:transform .38s cubic-bezier(.2,.9,.3,1),opacity .3s,visibility .3s;
  max-width:90vw;text-align:center}
#tostada.ver{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ── AU-RA Y EL CEREBRO ───────────────────────────────────────────────────
   El Nucleo deja de ser un tablero con fichas: es una pantalla inmersiva en
   negro donde el cerebro (canvas) ocupa todo y las esferas flotan encima como
   ganglios. El resto de la aplicacion NO cambia de piel — la orden fue clara:
   el ecosistema de la billetera se queda como esta. El negro es del Nucleo y
   de la bienvenida, que son el territorio de AU-RA. */
body.en-cerebro{background:#010708}
body.en-cerebro .lienzo{max-width:none;padding:0}

.cerebro{position:relative;height:calc(100svh - 0px);min-height:520px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%, #06201f 0%, #010708 62%)}
@media(max-width:900px){.cerebro{height:calc(100svh - 76px)}}
.cerebro canvas{position:absolute;inset:0;width:100%;height:100%}

.cerebro-cab{position:absolute;top:0;left:0;right:0;z-index:4;
  padding:clamp(18px,3vw,30px) clamp(18px,4vw,40px);pointer-events:none}
.cerebro-cab h2{font-family:var(--sans);font-weight:800;font-size:clamp(19px,2.2vw,24px);color:var(--crema)}
.cerebro-cab .sub{font-size:12px;color:var(--bruma);margin-top:5px}

/* Las esferas: los mismos botones de antes, ahora sobre el cuadro entero. */
.cerebro .nu-mundo{z-index:3}
.nu-foco .nu-esfera{transform:scale(1.22);box-shadow:0 0 0 2px var(--halo),0 0 70px -4px var(--halo),
  inset 0 -10px 22px -12px rgba(0,0,0,.6)}
.nu-lente img{width:calc(64% * var(--zoom,1));height:auto;display:block}
.cerebro-pie{position:absolute;left:clamp(18px,4vw,40px);bottom:clamp(18px,3vw,30px);z-index:4;
  display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:560px){.cerebro-pie{right:96px}}

/* ── el orbe flotante ── AU-RA vive en TODO el ecosistema ─────────────────── */
#aura-orbe{position:fixed;right:18px;bottom:88px;z-index:70;width:64px;height:64px;
  border-radius:50%;cursor:pointer;padding:0;
  filter:drop-shadow(0 6px 24px rgba(126,216,196,.35))}
@media(min-width:901px){#aura-orbe{right:26px;bottom:26px;width:72px;height:72px}}
#aura-orbe canvas{width:100%;height:100%;display:block}
#aura-orbe .aura-nombre{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
  font-size:9px;font-weight:800;letter-spacing:.22em;color:var(--oroLt);opacity:.85;white-space:nowrap}
#aura-orbe[data-oculto]{display:none}

/* ── el panel de conversacion ─────────────────────────────────────────────── */
#aura-panel{position:fixed;z-index:75;right:16px;bottom:160px;width:min(400px,calc(100vw - 32px));
  max-height:min(600px,calc(100svh - 200px));display:flex;flex-direction:column;
  border-radius:var(--r2);border:1px solid rgba(126,216,196,.25);overflow:hidden;
  background:linear-gradient(180deg,rgba(4,20,21,.97),rgba(1,10,11,.98));
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95);
  transform:translateY(14px);opacity:0;visibility:hidden;transition:.28s cubic-bezier(.2,.9,.3,1)}
#aura-panel.ver{transform:none;opacity:1;visibility:visible}
@media(max-width:900px){#aura-panel{right:8px;left:8px;width:auto;bottom:150px}}
.aura-cab{display:flex;align-items:center;gap:11px;padding:14px 16px;
  border-bottom:1px solid rgba(126,216,196,.16)}
.aura-cab b{font-size:14px;letter-spacing:.14em;color:var(--crema)}
.aura-beta{font-size:9px;font-weight:800;letter-spacing:.14em;padding:3px 8px;border-radius:100px;
  background:rgba(158,134,240,.16);color:#C9BCF5;border:1px solid rgba(158,134,240,.35)}
.aura-cab small{display:block;font-size:10.5px;color:var(--humo);margin-top:2px}
.aura-x{margin-left:auto;width:30px;height:30px;border-radius:10px;color:var(--humo);font-size:16px}
.aura-x:hover{color:var(--crema)}
.aura-hilo{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.aura-b{max-width:88%;padding:10px 13px;border-radius:15px 15px 15px 5px;
  background:rgba(126,216,196,.09);border:1px solid rgba(126,216,196,.14);
  font-size:13.5px;line-height:1.6;color:var(--crema);white-space:pre-wrap;word-break:break-word}
.aura-b.mio{align-self:flex-end;border-radius:15px 15px 5px 15px;
  background:rgba(201,169,97,.13);border-color:rgba(201,169,97,.2)}
.aura-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px}
.aura-chip{padding:7px 12px;border-radius:100px;font-size:11.5px;font-weight:600;
  color:var(--bruma);border:1px solid rgba(126,216,196,.22);background:rgba(126,216,196,.05)}
.aura-chip:hover{color:var(--crema);border-color:rgba(126,216,196,.5)}
.aura-pie{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid rgba(126,216,196,.16)}
.aura-pie input{flex:1;min-width:0;padding:11px 14px;border-radius:100px;
  border:1px solid rgba(126,216,196,.2);background:rgba(2,14,15,.8);font-size:13.5px;color:var(--crema)}
.aura-pie input:focus{outline:none;border-color:rgba(126,216,196,.5)}
.aura-mic,.aura-manda{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.aura-mic svg,.aura-manda svg{width:18px;height:18px;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.aura-mic{border:1px solid rgba(126,216,196,.3)}
.aura-mic svg{stroke:#7ED8C4}
.aura-mic.oyendo{background:rgba(126,216,196,.18);animation:auraOye 1.1s ease-in-out infinite}
@keyframes auraOye{0%,100%{box-shadow:0 0 0 0 rgba(126,216,196,.35)}50%{box-shadow:0 0 0 9px rgba(126,216,196,0)}}
.aura-manda{background:linear-gradient(140deg,#7ED8C4,#4FA391)}
.aura-manda svg{stroke:#04211D}

/* ── la bienvenida en negro ───────────────────────────────────────────────── */
#aura-bienvenida{position:fixed;inset:0;z-index:90;background:#010708;
  display:grid;place-items:center;overflow:hidden}
#aura-bienvenida canvas.red{position:absolute;inset:0;width:100%;height:100%;opacity:.8}
.aurab-caja{position:relative;z-index:2;text-align:center;padding:24px;
  display:flex;flex-direction:column;align-items:center;gap:0}
.aurab-caja .orbe-grande{width:clamp(130px,30vw,180px);height:clamp(130px,30vw,180px);cursor:pointer;
  filter:drop-shadow(0 0 60px rgba(126,216,196,.35))}
.aurab-caja .orbe-grande canvas{width:100%;height:100%}
.aurab-nombre{margin-top:26px;font-family:var(--serif);font-weight:700;letter-spacing:.3em;
  font-size:clamp(26px,6vw,38px);color:var(--crema)}
.aurab-linaje{margin-top:10px;font-size:10.5px;font-weight:700;letter-spacing:.26em;color:var(--humo);
  text-transform:uppercase}
.aurab-linaje b{color:#C9BCF5}
.aurab-sub{margin-top:26px;min-height:54px;max-width:52ch;font-size:clamp(14px,3.6vw,16.5px);
  line-height:1.75;color:var(--bruma)}
.aurab-toca{margin-top:8px;font-size:12px;color:var(--oroLt);animation:tocaLate 1.6s ease-in-out infinite}
@keyframes tocaLate{0%,100%{opacity:.5}50%{opacity:1}}
.aurab-saltar{position:absolute;top:18px;right:22px;z-index:3;font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--humo);padding:8px}
.aurab-saltar:hover{color:var(--crema)}
#aura-bienvenida.irse{transition:opacity .9s ease;opacity:0;pointer-events:none}

/* ── el recorrido ─────────────────────────────────────────────────────────── */
#aura-tour{position:fixed;inset:0;z-index:80;pointer-events:none}
#aura-tour .velo{position:absolute;inset:0;transition:background .5s}
#aura-tour .letras{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(620px,calc(100vw - 28px));pointer-events:auto;
  border-radius:var(--r2);border:1px solid rgba(126,216,196,.25);
  background:linear-gradient(180deg,rgba(3,17,18,.96),rgba(1,9,10,.97));
  padding:18px 20px;box-shadow:0 30px 80px -30px rgba(0,0,0,.95)}
#aura-tour .letras .paso{font-size:10px;font-weight:800;letter-spacing:.22em;color:#7ED8C4}
#aura-tour .letras h3{margin-top:6px;font-size:17px;font-weight:800;color:var(--crema)}
#aura-tour .letras p{margin-top:8px;font-size:13.5px;line-height:1.7;color:var(--bruma);min-height:44px}
#aura-tour .letras .fila{display:flex;gap:10px;margin-top:14px;align-items:center}
#aura-tour .letras .fila .btn{padding:10px 18px;font-size:13px}
#aura-tour .letras .salirse{margin-left:auto;font-size:11.5px;color:var(--humo)}
#aura-tour .letras .salirse:hover{color:var(--crema)}

/* ── EL NUCLEO ────────────────────────────────────────────────────────────
   La constelacion del ecosistema. Las esferas van colocadas en tanto por
   ciento sobre un cuadro cuadrado, con las MISMAS coordenadas que el
   telefono, y las lineas se dibujan en un SVG que ocupa ese mismo cuadro en
   el mismo sistema: asi el dibujo y los botones no se separan a ningun
   tamaño de pantalla. */
.nu-campo{position:relative;width:min(560px,100%);aspect-ratio:1;margin:6px auto 4px}
.nu-hilos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nu-hilos line{stroke:var(--linea2);stroke-width:.28;vector-effect:non-scaling-stroke}

.nu-mundo{position:absolute;transform:translate(-50%,-50%);display:flex;
  flex-direction:column;align-items:center;gap:8px;padding:0;cursor:pointer}
.nu-esfera{width:calc(var(--t) * clamp(74px,17vw,104px));aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,var(--g1),var(--g2) 52%,var(--g3));
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 40px -8px var(--halo),
    inset 0 -10px 22px -12px rgba(0,0,0,.6);
  animation:nuFlota 5s ease-in-out infinite;animation-delay:var(--d);transition:transform .2s}
.nu-mundo:hover .nu-esfera{transform:scale(1.06)}
@keyframes nuFlota{0%,100%{translate:0 0}50%{translate:0 -7px}}
.nu-lente{width:52%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:var(--lente);box-shadow:inset 0 2px 9px rgba(0,0,0,.7)}
.nu-lente svg{width:56%;height:56%;fill:none;stroke:var(--halo);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
/* El nombre puede ser mas ancho que su esfera —«Ordenexchange» lo es— y las
   esferas del borde lo empujaban fuera de la pantalla. Se le pone tope y se
   deja partir en dos lineas: un nombre en dos renglones se lee; uno cortado a
   la mitad por el borde, no. */
.nu-nombre{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--crema);
  max-width:min(32vw,124px);text-align:center;line-height:1.25;
  text-shadow:0 1px 6px rgba(0,0,0,.8)}
.nu-chip{position:absolute;top:-6px;padding:2px 8px;border-radius:100px;font-size:9px;
  font-weight:800;letter-spacing:.12em;background:rgba(2,20,20,.9);color:var(--oroLt);
  border:1px solid var(--linea2)}
.nu-pronto .nu-esfera{opacity:.5;animation-duration:8s}
.nu-pronto .nu-nombre{color:var(--humo)}
.nu-candado{position:absolute;right:-2px;top:calc(var(--t) * clamp(50px,11.5vw,70px));
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:rgba(2,20,20,.92);border:1px solid var(--linea)}
.nu-candado svg{width:12px;height:12px;fill:none;stroke:var(--oro);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nu-cerrado .nu-esfera{opacity:.72}

.nu-puerta{display:flex;gap:14px;align-items:flex-start}
.nu-puerta-ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:rgba(201,169,97,.16);border:1px solid var(--linea)}
.nu-puerta-ic svg{width:22px;height:22px;fill:none;stroke:var(--oro);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

@media(max-width:560px){
  .nu-nombre{font-size:10.5px}
}

/* ── PULSE CHAT ────────────────────────────────────────────────────────────
   Dos columnas cuando la pantalla da para las dos: la lista a la izquierda y
   el hilo a la derecha, como cualquier mensajeria de escritorio. En el movil
   son dos pantallas —la caja lleva data-abierto y la lista se aparta—, porque
   una columna de 200px al lado de un hilo no sirve para nada.

   La altura se calcula, no se deja crecer: un hilo que empuja el pie de la
   pagina obliga a bajar con la rueda para escribir, que es lo contrario de un
   chat. */
.chat{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);
  gap:14px;height:calc(100svh - 190px);min-height:420px}
.chat-lista{display:flex;flex-direction:column;overflow-y:auto;
  border:1px solid var(--linea2);border-radius:var(--r2);background:#052A2B;padding:10px}
.chat-hilo{display:flex;flex-direction:column;min-width:0;
  border:1px solid var(--linea2);border-radius:var(--r2);background:#052A2B;overflow:hidden}

.cha-cab{display:flex;gap:8px;padding:4px 4px 10px;position:sticky;top:-10px;z-index:2;
  background:#052A2B}
.cha-cab input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;
  border:1px solid var(--linea2);background:var(--campo);font-size:13.5px;color:var(--crema)}
.cha-cab input:focus{outline:none;border-color:var(--campoBr)}
.cha-mas{flex:none;width:40px;border-radius:12px;border:1px solid var(--linea);
  background:rgba(201,169,97,.08);display:grid;place-items:center}
.cha-mas svg{width:18px;height:18px;stroke:var(--oroLt);fill:none;stroke-width:2;stroke-linecap:round}
.cha-mas:hover{background:rgba(201,169,97,.18)}

.cha-fila{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px;border-radius:13px;transition:background .18s}
.cha-fila:hover{background:rgba(255,255,255,.04)}
.cha-fila[data-aqui]{background:rgba(201,169,97,.13)}
.cha-av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  overflow:hidden;font-family:var(--sans);font-weight:700;font-size:16px;color:var(--oroHi);
  background:linear-gradient(140deg,#1E8C74,#0A463F)}
.cha-av img{width:100%;height:100%;object-fit:cover}
.cha-txt{min-width:0;flex:1}
.cha-txt b{display:block;font-size:14px;font-weight:600;color:var(--crema);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cha-txt b em{font-style:normal;font-weight:400;color:var(--humo);font-size:12px}
.cha-txt small{display:block;font-size:12.5px;color:var(--humo);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cha-bola{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:100px;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--oro);color:#1B1403}

.cha-hcab{display:flex;align-items:center;gap:11px;padding:12px 14px;
  border-bottom:1px solid var(--linea2)}
.cha-quien{min-width:0}
.cha-quien b{display:block;font-size:14.5px;color:var(--crema)}
.cha-quien small{display:block;font-size:12px;color:var(--humo);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cha-volver{display:none;flex:none;width:32px;height:32px;border-radius:10px}
.cha-volver svg{width:20px;height:20px;stroke:var(--bruma);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.cha-msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth}
.cha-cargando{margin:auto;color:var(--humo)}
.cha-b{max-width:min(76%,520px);align-self:flex-start;display:flex;flex-direction:column;gap:3px}
.cha-b.cha-mio{align-self:flex-end;align-items:flex-end}
.cha-globo{padding:10px 13px;border-radius:16px 16px 16px 5px;
  background:rgba(8,52,50,.9);border:1px solid var(--linea2);
  font-size:14px;line-height:1.6;color:var(--crema);word-break:break-word}
.cha-mio .cha-globo{border-radius:16px 16px 5px 16px;
  background:linear-gradient(140deg,rgba(201,169,97,.22),rgba(150,121,63,.18));
  border-color:var(--linea)}
.cha-globo p{margin:0;white-space:pre-wrap}
.cha-de{display:block;font-size:11.5px;font-weight:700;color:var(--oroLt);margin-bottom:4px}
.cha-b time{font-size:10.5px;color:var(--humo);padding:0 4px;font-variant-numeric:tabular-nums}
.cha-img{display:block;max-width:100%;border-radius:12px;margin-bottom:6px}
.cha-arch{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--oroLt);
  text-decoration:none}
.cha-arch svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}

/* El comprobante de un pago no es un mensaje con formato: es una tarjeta, y
   se distingue del resto porque lo que dice se puede comprobar. */
.cha-pago{padding:13px 15px;border-radius:16px;border:1px solid var(--linea);
  background:linear-gradient(150deg,rgba(201,169,97,.16),rgba(6,40,42,.9))}
.cha-pk{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--oro);font-weight:700}
.cha-pago b{display:block;margin-top:5px;font-family:var(--mono);font-size:19px;color:var(--crema)}
.cha-pago p{margin-top:6px;font-size:13px;color:var(--bruma)}
.cha-pago a{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--oroLt)}

.cha-pie{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--linea2)}
.cha-pie input{flex:1;min-width:0;padding:12px 14px;border-radius:100px;

/* ── la bienvenida del ecosistema ─────────────────────────────────────────
   Seis tarjetas a pantalla completa, las mismas que el telefono. En el
   movil ocupa todo; en escritorio se recoge en una tarjeta centrada, porque
   estirar una historia de seis pasos a 1600px la vuelve un cartel. La
   esfera de arriba es el mismo lenguaje que el Nucleo: un circulo con halo
   y la lente oscura en el centro, dibujado en CSS y sin una imagen mas. */
.bienve{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,rgba(10,66,60,.96),rgba(2,20,21,.98) 70%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:24px;overflow-y:auto}
.bien-caja{width:min(560px,100%);text-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:0;
  padding:clamp(26px,5vw,44px) clamp(20px,4vw,38px) clamp(22px,4vw,34px);
  border-radius:var(--r2);border:1px solid var(--linea2);
  background:linear-gradient(180deg,rgba(8,48,48,.72),rgba(4,28,30,.86));
  box-shadow:0 40px 90px -40px rgba(0,0,0,.95)}
.bien-saltar{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--humo);padding:6px 8px}
.bien-saltar:hover{color:var(--oroLt)}
.bien-esfera{width:clamp(104px,26vw,132px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;margin-bottom:clamp(18px,4vw,26px);
  background:radial-gradient(circle at 32% 26%,var(--bE1),var(--bE2) 52%,var(--bE3));
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 46px -6px var(--bHalo),
    inset 0 -12px 26px -12px rgba(0,0,0,.6);
  animation:bienLate 4.2s ease-in-out infinite}
@keyframes bienLate{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bien-lente{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:var(--bLente);box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}
.bien-lente svg{width:56%;height:56%;fill:none;stroke:var(--bHalo);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.bien-k{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--oro)}
.bien-caja h2{font-family:var(--serif);font-weight:700;line-height:1.08;
  font-size:clamp(28px,6.4vw,40px);margin:10px 0 14px}
.bien-caja p{color:var(--bruma);font-size:clamp(14px,3.4vw,16px);line-height:1.72;
  max-width:44ch;margin:0 auto}
/* La frase de recuperacion usa la misma caja que la bienvenida: es una sola
   pantalla que tapa todo, que es lo que hay que hacer con doce palabras que no
   se vuelven a enseñar. */
.sem-rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;
  margin:clamp(20px,4vw,26px) 0 4px}
.sem-rejilla span{display:flex;align-items:baseline;gap:6px;padding:9px 10px;border-radius:11px;
  border:1px solid var(--linea2);background:rgba(2,20,20,.5);
  font-family:var(--mono);font-size:13px;color:var(--crema)}
.sem-rejilla em{font-style:normal;font-size:10px;color:var(--humo);min-width:1.2em}
.sem-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.sem-pie{margin-top:14px;font-size:11.5px;line-height:1.6;color:var(--humo);max-width:44ch}
@media(max-width:420px){.sem-rejilla{grid-template-columns:repeat(2,1fr)}}

.bien-puntos{display:flex;gap:7px;justify-content:center;margin:clamp(22px,5vw,30px) 0 18px}
.bien-punto{width:7px;height:7px;border-radius:50%;background:rgba(201,169,97,.26);transition:.3s}
.bien-punto[data-aqui]{width:22px;border-radius:100px;background:var(--oro)}
.bienve .btn{width:100%}
@media(max-width:560px){
  .bienve{padding:0;place-items:stretch}
  .bien-caja{width:100%;min-height:100svh;justify-content:center;border:0;border-radius:0;
    background:none;box-shadow:none;padding:64px 22px 40px}
}
@media(prefers-reduced-motion:reduce){.bien-esfera{animation:none}}

.girando{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.25);
  border-top-color:currentColor;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.esqueleto{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));
  background-size:200% 100%;animation:brilloEsq 1.3s linear infinite;border-radius:8px;color:transparent}
@keyframes brilloEsq{to{background-position:-200% 0}}

/* ══ EL RECORRIDO ═════════════════════════════════════════════════════════════
   Debajo de la portada. No es relleno: es lo que una persona necesita saber
   antes de confiarle oro a una pagina — que es ORIGEN, como se usa, quien lo
   guarda, y que hay detras. Cada bloque entra al aparecer en pantalla y cada
   uno se compone distinto: nada de tres tarjetas iguales en fila. */

.baja{scroll-margin-top:80px}
/* Lo que todavia no se ha visto espera abajo y a un lado; al entrar en pantalla
   sube a su sitio. El desplazamiento lateral alterna, asi que el ojo va en
   zigzag en vez de bajar en linea recta. */
.rev{opacity:0;transform:translateY(38px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.rev.izq{transform:translate(-26px,26px)}
.rev.der{transform:translate(26px,26px)}
.rev.ve{opacity:1;transform:none}

.tramo{position:relative;z-index:2;padding:clamp(64px,11vh,120px) clamp(20px,5vw,64px);max-width:1420px;margin:0 auto}
.tramo-cab{max-width:44ch}
.tramo-cab .sello{margin-bottom:20px}
.tramo-cab h2{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.6vw,54px);line-height:1.08}
.tramo-cab h2 i{font-style:normal;font-weight:700;color:var(--oroLt)}
.tramo-cab p{margin-top:18px;color:var(--bruma);font-size:15.5px;line-height:1.68}

/* ── qué es ORIGEN: una escalera, no una rejilla ────────────────────────────
   Tres peldaños que bajan hacia la derecha. El desnivel dice lo que dice el
   texto: del metal enterrado al dinero que se mueve. */
.escalera{margin-top:clamp(34px,6vh,64px);display:grid;gap:14px}
.peldano{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;
  padding:26px clamp(20px,3vw,32px);border:1px solid var(--linea2);border-radius:var(--r2);
  background:rgba(6,40,42,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:border-color .3s,transform .3s,background .3s}
.peldano:hover{border-color:var(--linea);transform:translateY(-3px);background:rgba(6,40,42,.72)}
.peldano:nth-child(2){margin-left:clamp(0px,6vw,90px)}
.peldano:nth-child(3){margin-left:clamp(0px,12vw,180px)}
.peldano .num{font-family:var(--serif);font-weight:700;font-size:clamp(28px,3.4vw,42px);
  line-height:1;color:var(--oroDp);min-width:1.4ch}
.peldano h3{font-family:var(--serif);font-weight:700;font-size:clamp(19px,2.2vw,25px);line-height:1.2}
.peldano p{margin-top:9px;color:var(--bruma);font-size:14.5px;line-height:1.66;max-width:52ch}

/* ── la bóveda: cifra enorme a un lado, lista de garantías al otro ────────── */
.par{margin-top:clamp(34px,6vh,64px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);
  gap:clamp(26px,5vw,72px);align-items:center}
.par .cifrona{font-family:var(--serif);font-weight:700;font-size:clamp(64px,13vw,160px);line-height:.86;
  letter-spacing:-.02em;
  background:linear-gradient(150deg,var(--oroHi),var(--oro) 55%,var(--oroDp));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.par .cifrona small{display:block;margin-top:16px;font-family:var(--sans);font-size:12px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;color:var(--humo);-webkit-text-fill-color:var(--humo)}
.garantias{display:grid;gap:0}
.garantia{display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-top:1px solid var(--linea2)}
.garantia:last-child{border-bottom:1px solid var(--linea2)}
.garantia svg{width:20px;height:20px;flex:0 0 auto;margin-top:2px;stroke:var(--oro);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.garantia b{display:block;font-size:15px;font-weight:600}
.garantia small{display:block;margin-top:5px;font-size:13.5px;color:var(--humo);line-height:1.6}

/* ── el ecosistema: fichas anchas con su propio acento ─────────────────────── */
.eco{margin-top:clamp(34px,6vh,64px);display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.eco-f{padding:26px;border:1px solid var(--linea2);border-radius:var(--r2);position:relative;overflow:hidden;
  background:rgba(6,40,42,.5);transition:transform .3s,border-color .3s}
.eco-f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acento,var(--oro));opacity:.55}
.eco-f:hover{transform:translateY(-4px);border-color:var(--linea)}
.eco-f h3{font-family:var(--serif);font-weight:700;font-size:22px}
.eco-f p{margin-top:10px;color:var(--bruma);font-size:14px;line-height:1.62}
.eco-f a{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:700;color:var(--oroLt)}
.eco-f a::after{content:"→";transition:transform .25s}
.eco-f a:hover::after{transform:translateX(4px)}

/* ── el cierre: una sola frase grande y el botón ───────────────────────────── */
.cierre{padding:clamp(70px,13vh,140px) clamp(20px,5vw,64px) clamp(80px,14vh,150px);
  max-width:1420px;margin:0 auto;position:relative;z-index:2}
.cierre h2{font-family:var(--serif);font-weight:700;font-size:clamp(34px,6.4vw,88px);line-height:1.02;max-width:16ch}
.cierre h2 i{font-style:normal;font-weight:700;
  background:linear-gradient(100deg,var(--oroLt),var(--oroHi) 45%,var(--oro) 72%,var(--oroLt));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:brillo 7s linear infinite}
.cierre .btns{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.pie{border-top:1px solid var(--linea2);padding:26px clamp(20px,5vw,64px);position:relative;z-index:2;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  max-width:1420px;margin:0 auto;font-size:12.5px;color:var(--humo)}
.pie a{color:var(--bruma);text-decoration:none}
.pie a:hover{color:var(--oroLt)}
.pie nav{display:flex;gap:16px;flex-wrap:wrap}

@media (max-width:900px){
  .par{grid-template-columns:1fr;gap:26px}
  .peldano:nth-child(2),.peldano:nth-child(3){margin-left:0}
  .peldano{grid-template-columns:1fr;gap:10px}
}

@media (max-width:900px){
  /* En un teléfono el desplazamiento lateral del revelado no aporta — la
     pantalla es demasiado estrecha para que el zigzag se lea — y en cambio
     empuja los bloques fuera del borde: eso es lo que creaba los cuatro píxeles
     de desplazamiento horizontal. Aquí solo suben. */
  .rev.izq,.rev.der{transform:translateY(26px)}
}
@media (prefers-reduced-motion:reduce){
  .rev{opacity:1;transform:none;transition:none}
}

/* ── móvil ───────────────────────────────────────────────────────────────── */

  #bienvenida{grid-template-columns:1fr;align-content
:center;gap:34px;padding-top:96px}

/* ── la billetera: monedas, ficha, tarjeta, cambio, ajustes ───────────────── */

.bloque-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}

/* el ojo del patrimonio */
.saldo-ojo{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:none;border:0;cursor:pointer;padding:0;color:inherit}
.ojo-ic{width:19px;height:19px;fill:none;stroke:var(--bruma);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;flex:none;transition:stroke .2s}
.saldo-ojo:hover .ojo-ic{stroke:var(--oro)}
.sube{color:var(--jade)} .baja{color:var(--coral)}

/* el disco de cada moneda */
.disco{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:17px;font-weight:700;overflow:hidden;
  background:var(--panel);border:1px solid var(--linea)}
.disco img{width:100%;height:100%;object-fit:cover}
.disco-g{width:58px;height:58px;font-size:23px}

/* la lista de monedas */
.monedas{display:flex;flex-direction:column;gap:8px}
.moneda{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:13px;
  color:inherit;font:inherit;transition:border-color .18s,transform .18s,background .18s}
.moneda:hover{border-color:var(--linea);background:var(--panel2);transform:translateX(2px)}
.moneda:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.m-txt{flex:1;min-width:0}
.m-txt b{display:block;font-size:14.5px;font-weight:600;color:var(--crema);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-txt small,.m-val small{display:block;font-size:12px;color:var(--humo);margin-top:3px}
.m-val{text-align:right;white-space:nowrap}
.m-val b{font-size:14.5px;font-weight:600;color:var(--crema);font-family:var(--mono)}
.m-val small{font-family:var(--mono)}
.sin-precio{margin-top:14px;text-align:center;line-height:1.65}

/* volver, y la ficha de una moneda */
.volver{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
  color:var(--bruma);font:inherit;font-size:13.5px;padding:6px 0;margin-bottom:6px;transition:color .18s}
.volver:hover{color:var(--oro)}
.volver svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ficha-cab{display:flex;align-items:center;gap:15px;margin-bottom:22px}
.ficha-cab h2{font-family:var(--sans);font-weight:800;font-size:20px;margin:0;color:var(--crema)}
.ficha-cifra{display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:18px 0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.ficha-cifra .et{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--humo);margin-bottom:7px}
.ficha-cifra b{font-size:20px;font-weight:700;color:var(--crema);font-family:var(--mono)}
.ficha-cifra em{font-style:normal;font-size:13px;color:var(--humo)}
.ficha-precio{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:16px;font-size:13.5px;color:var(--bruma)}
.ficha-precio b{color:var(--crema);font-family:var(--mono)}
.ficha-desc{margin-top:18px;font-size:14px;line-height:1.75;color:var(--bruma)}
.ficha-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ── enviar cualquier token ───────────────────────────────────────────────
   Las monedas se eligen en fichas y no en un desplegable: hay quince, cada
   una con su disco de color, y verlas es reconocerlas. En el movil la fila
   se desliza; en escritorio se ajusta sola en rejilla. */
.env-fichas{display:grid;gap:9px;margin-top:14px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.env-ficha{display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  padding:10px 12px;border-radius:13px;border:1px solid var(--linea2);
  background:rgba(2,20,20,.45);transition:border-color .2s,background .2s}
.env-ficha:hover{border-color:var(--linea)}
.env-ficha[data-elegida]{border-color:var(--oro);background:rgba(201,169,97,.12)}
.env-ficha span{min-width:0;display:block}
.env-ficha b{display:block;font-size:13.5px;font-weight:600;color:var(--crema)}
.env-ficha small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--humo);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env-contactos{margin-top:9px;width:100%;padding:10px 12px;border-radius:12px;
  border:1px solid var(--linea2);background:var(--campo);font-size:13.5px;color:var(--bruma)}
.env-monto{display:flex;align-items:center;gap:8px}
.env-monto input{flex:1;min-width:0}
.env-max{flex:none;padding:11px 14px;border-radius:12px;border:1px solid var(--linea);
  font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--oroLt);
  background:rgba(201,169,97,.08)}
.env-max:hover{background:rgba(201,169,97,.18)}
.env-usd{margin-top:7px;min-height:18px;font-family:var(--mono);font-size:12.5px;color:var(--humo)}
/* Ancho fijo: un <select> dentro de un flex se estira con su contenido y
   deja el campo de la cantidad reducido a un boton redondo. */
.cob-sim{flex:0 0 104px;width:104px;padding:11px 10px;border-radius:12px;
  border:1px solid var(--linea);background:rgba(201,169,97,.08);
  font-size:13px;font-weight:700;color:var(--oroLt)}
#cob-qr{max-width:270px;margin-inline:auto}
.cob-cifra{margin-top:16px;font-family:var(--sans);font-weight:800;font-size:28px;
  letter-spacing:-.5px;color:var(--oroHi);font-variant-numeric:tabular-nums}
.cob-cifra em{font-style:normal;font-size:.45em;color:var(--humo);letter-spacing:.08em}

/* fichas de datos, en dos columnas */
.datos{margin:20px 0 0;display:flex;flex-direction:column;gap:1px;
  background:var(--linea);border:1px solid var(--linea);border-radius:13px;overflow:hidden}
.datos>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  background:var(--panel);padding:12px 14px}
.datos dt{font-size:12.5px;color:var(--humo);flex:none}
.datos dd{margin:0;font-size:13.5px;color:var(--crema);text-align:right;
  word-break:break-word;min-width:0}

/* la tarjeta */
.tar-plastico{position:relative;aspect-ratio:1.586;max-width:370px;border-radius:19px;padding:20px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,#0d3b3a,#04191a 55%,#1a1408);
  border:1px solid var(--linea);box-shadow:0 18px 40px rgba(0,0,0,.42);overflow:hidden}
.tar-plastico::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(201,169,97,.16) 50%,transparent 62%)}
.tar-fria{filter:saturate(.35) brightness(.85)}
.tar-fantasma{opacity:.45;border-style:dashed;align-items:center;justify-content:center}
.tar-marca{font-weight:700;letter-spacing:.16em;font-size:13px;color:var(--crema)}
.tar-marca em,.tar-fantasma em{font-style:normal;color:var(--oro)}
.tar-num{font-size:16px;letter-spacing:.09em;color:var(--oroLt)}
.tar-pie{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tar-pie b{font-family:var(--mono);color:var(--crema);font-size:15px}
.tar-botones{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.tar-vacia{text-align:center}
.tar-vacia .tar-plastico{margin:0 auto 22px}
.btn-ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;margin-right:6px;vertical-align:-2px}
.revelar{margin-top:16px}
.secreto{margin-top:16px;padding:16px;border:1px solid var(--linea);border-radius:14px;
  background:rgba(201,169,97,.06)}
.sec-fila{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:7px 0;font-size:13.5px;color:var(--humo)}
.sec-fila b{color:var(--oroHi);font-size:16px;letter-spacing:.05em}
.campo-fila{display:flex;gap:12px}
.campo-cod{width:104px;flex:none}
.checa{display:flex;align-items:flex-start;gap:10px;margin:4px 0 18px;
  font-size:13.5px;color:var(--bruma);text-align:left;cursor:pointer;line-height:1.55}
.checa input{margin-top:3px;accent-color:var(--oro);width:16px;height:16px;flex:none}

/* cambiar */
.caja-cambio{background:var(--panel);border:1px solid var(--linea);border-radius:17px;padding:15px}
.cc-cab{display:flex;justify-content:space-between;font-size:12px;color:var(--humo);margin-bottom:10px}
.cc-fila{display:flex;align-items:center;gap:12px}
.cc-fila input{flex:1;min-width:0;background:none;border:0;color:var(--crema);
  font-size:27px;font-weight:700;font-family:var(--mono);padding:0}
.cc-fila input:focus{outline:none}
.cc-fila input[readonly]{color:var(--bruma)}
.cc-tok{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--linea);
  border-radius:13px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--crema);flex:none}
.cc-tok .disco{width:26px;height:26px;font-size:12px}
.cc-sel{cursor:pointer;font:inherit;font-weight:600;max-width:170px}
.cc-flecha{display:flex;justify-content:center;margin:-9px 0;position:relative;z-index:1}
.cc-flecha svg{width:34px;height:34px;padding:7px;border-radius:50%;background:var(--panel2);
  border:1px solid var(--linea);fill:none;stroke:var(--oro);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* Un boton apagado tiene que verse apagado: con el mismo brillo que uno vivo,
   la gente lo toca, no pasa nada, y cree que la pagina esta rota. */
.btn:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.35)}
.btn:disabled:hover{transform:none}

/* avisos dentro de una vista */
.nota{padding:13px 15px;border-radius:13px;font-size:13px;line-height:1.65;
  background:var(--panel2);border:1px solid var(--linea);color:var(--bruma)}
.nota-obra{border-color:var(--linea);background:rgba(201,169,97,.07);color:var(--oroLt)}
.nota-cuidado{border-color:rgba(224,106,106,.34);background:rgba(224,106,106,.07);color:#F0B9B9}

/* en obra */
.obra{text-align:center;padding:38px 22px}
.obra-ic{width:64px;height:64px;margin:0 auto 20px;border-radius:20px;display:flex;
  align-items:center;justify-content:center;background:rgba(201,169,97,.11);border:1px solid var(--linea)}
.obra-ic svg{width:30px;height:30px;fill:none;stroke:var(--oro);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ajustes */
.ajustes{display:flex;flex-direction:column;gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:15px;overflow:hidden}
.ajuste{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:0;padding:14px 15px;color:inherit;font:inherit;transition:background .18s}
.ajuste:hover{background:var(--panel2)}
.ajuste:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.aj-ic{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;
  justify-content:center;background:rgba(201,169,97,.1);border:1px solid var(--linea)}
.aj-ic svg{width:18px;height:18px;fill:none;stroke:var(--oro);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.aj-txt{flex:1;min-width:0}
.aj-txt b{display:block;font-size:14px;font-weight:600;color:var(--crema)}
.aj-txt small{display:block;font-size:12px;color:var(--humo);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aj-flecha{width:17px;height:17px;flex:none;fill:none;stroke:var(--humo);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.centrado{text-align:center}
.dir-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

@media (max-width:520px){
  .ficha-cifra{grid-template-columns:1fr}
  .campo-fila{flex-direction:column;gap:0}

  .cc-fila input{font-size:23px}
  .cc-sel{max-width:132px}
}

/* ── la tarjeta, calcada del telefono ─────────────────────────────────────── */

/* La escena es la que gira. Cada cara esta girada media vuelta respecto de la
   otra y con la trasera oculta, asi que solo se ve una a la vez — que es como
   funciona una tarjeta de verdad. */
.tar-escena{position:relative;max-width:378px;aspect-ratio:1.586;
  transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.8,.2,1)}
.tar-escena.volteada{transform:rotateY(180deg)}
.tar-cara{position:absolute;inset:0;border-radius:20px;overflow:hidden;cursor:pointer;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  border:1px solid var(--linea);padding:16px 19px 17px;text-align:left;
  background:linear-gradient(135deg,#221D15,#12100C 55%,#050505);
  box-shadow:0 20px 44px rgba(0,0,0,.45);
  display:flex;flex-direction:column;justify-content:space-between}
.tar-reverso{transform:rotateY(180deg)}
.tar-cara:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.tar-circuito{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* El monograma es el protagonista, no una marca de agua: grande, centrado y
   arriba. Los datos se apoyan debajo para no pisarlo. */
.tar-mono{position:absolute;left:50%;top:17%;transform:translateX(-50%);
  width:60%;max-height:44%;object-fit:contain;opacity:.95;pointer-events:none}
.tar-fria{filter:saturate(.3) brightness(.8)}
.tar-fila-alta{display:flex;justify-content:space-between;align-items:center;position:relative}
.tar-premium{font-size:10.5px;letter-spacing:.45em;color:rgba(234,215,156,.85);font-weight:600}
.tar-visa{font-size:21px;font-weight:800;font-style:italic;color:var(--oroHi);letter-spacing:.02em}
.tar-datos{display:flex;align-items:flex-end;gap:13px;position:relative}
.tar-chip{position:relative;width:42px;height:32px;border-radius:6px;flex:none;margin-bottom:2px;
  background:linear-gradient(135deg,#F8EFCF,#DFC078 45%,#96793F);
  box-shadow:0 0 0 6px rgba(223,192,120,.10),0 0 0 13px rgba(223,192,120,.05)}
.tar-chip-l,.tar-chip-c{position:absolute;background:rgba(90,70,25,.55)}
.tar-chip-l{left:0;right:0;top:11px;height:1px}
.tar-chip-c{top:0;bottom:0;left:15px;width:1px}
.tar-campos{flex:1;min-width:0}
/* Una sombra oscura desplazada imita el grabado sobre el negro. */
.tar-num{display:block;font-family:var(--mono);font-size:clamp(15px,4.6vw,20.5px);
  letter-spacing:.11em;color:var(--oroHi);font-weight:700;white-space:nowrap;
  text-shadow:0 1.5px 2.5px rgba(0,0,0,.7)}
.tar-valid{display:flex;align-items:center;gap:7px;margin-top:7px}
.tar-validK{font-size:6.5px;line-height:8px;letter-spacing:.12em;
  color:rgba(234,215,156,.7);font-weight:700}
.tar-validV{font-size:14px;color:var(--oroLt);font-weight:700;letter-spacing:.11em;
  font-family:var(--mono);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tar-titular{display:block;font-size:14px;color:var(--oroLt);font-weight:700;margin-top:6px;
  letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.6)}
/* el reverso */
.tar-banda{position:absolute;top:20px;left:0;right:0;height:44px;background:#080705}
.tar-firma-fila{position:absolute;top:82px;left:19px;right:19px;display:flex;align-items:center;gap:10px}
.tar-firma{flex:1;height:34px;background:#EFEAE0;border-radius:3px}
.tar-cvv{background:#fff;border-radius:4px;padding:4px 11px;text-align:center;min-width:66px}
.tar-cvvK{display:block;color:#5A5A5A;font-size:7.5px;letter-spacing:.16em;font-weight:800}
.tar-cvv b{color:#0B0B0B;font-weight:800;letter-spacing:.14em;font-size:20px;font-family:var(--mono)}
.tar-reverso-pie{position:absolute;bottom:14px;left:19px;right:19px;display:flex;
  justify-content:space-between;align-items:flex-end;gap:10px;
  font-size:8.5px;line-height:1.45;color:rgba(234,215,156,.55)}
.tar-pista{display:flex;align-items:center;gap:7px;margin-top:12px;
  font-size:12.5px;color:var(--humo)}
.tar-pista svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tar-estado{display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-top:16px}
.tar-estado b{font-family:var(--mono);color:var(--crema);font-size:15px}

@media (prefers-reduced-motion:reduce){ .tar-escena{transition:none} }


/* ── atajos, contactos, visor y secretos ──────────────────────────────────── */

.atajos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.atajo{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;
  background:var(--panel2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--linea);border-radius:20px;padding:15px;
  color:inherit;font:inherit;transition:border-color .18s,transform .18s,background .18s}
.atajo:hover{border-color:var(--oro);background:var(--panel2);transform:translateY(-1px)}
.atajo:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.atajo b{display:block;font-size:14.5px;font-weight:700;color:var(--crema)}
.atajo small{display:block;font-size:12px;color:var(--bruma);margin-top:2px;line-height:1.35}
.atajo-ic{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;
  justify-content:center;background:rgba(201,169,97,.16);border:1px solid var(--linea)}
.atajo-ic svg{width:19px;height:19px;fill:none;stroke:var(--oro);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

.con-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* el visor de la camara */
.visor{position:relative;max-width:340px;margin:0 auto;aspect-ratio:1;border-radius:20px;
  overflow:hidden;background:#04191A;border:1px solid var(--linea)}
.visor video{width:100%;height:100%;object-fit:cover;display:block}
.visor-marco{position:absolute;inset:16%;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 2px var(--oro),0 0 0 100vmax rgba(2,27,28,.55)}

/* la frase de recuperacion */
.frase{list-style:none;counter-reset:p;margin:0 0 16px;padding:0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.frase li{counter-increment:p;display:flex;align-items:baseline;gap:7px;
  background:var(--panel);border:1px solid var(--linea);border-radius:11px;padding:9px 10px}
.frase li::before{content:counter(p);font-size:10.5px;color:var(--humo);
  min-width:14px;text-align:right;flex:none}
.frase li span{font-size:13.5px;color:var(--oroHi);font-weight:600;word-break:break-all}
.llave-txt{word-break:break-all;font-size:12.5px;color:var(--oroHi);line-height:1.7;margin-bottom:14px}

@media (max-width:520px){
  .atajos{grid-template-columns:1fr}
  .frase{grid-template-columns:repeat(2,1fr)}
}

/* ── verificar la identidad ───────────────────────────────────────────────── */

/* Los tres pasos, siempre a la vista. Saber cuantos faltan antes de empezar es
   la diferencia entre un tramite y un pozo sin fondo. */
.pasos{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}
.paso-p{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;
  font-size:11.5px;line-height:1.4;color:var(--humo)}
.paso-p i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.07)}
.paso-p.ya i{background:rgba(201,169,97,.45)}
.paso-p.va i{background:linear-gradient(120deg,var(--oroLt),var(--oro))}
.paso-p.va{color:var(--oroLt)}

/* Un select y un textarea con la misma piel que los input: tres pieles
   distintas en un formulario parecen tres formularios pegados con cinta. */
.campo select,.campo textarea{width:100%;padding:14px 15px;background:var(--campo);
  border:1px solid var(--campoBr);border-radius:var(--r);font-size:15.5px;color:var(--crema);
  transition:border-color .2s,box-shadow .2s}
.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--oro);
  box-shadow:0 0 0 3px rgba(201,169,97,.14)}
/* La MRZ se copia caracter a caracter: monoespaciada y holgada, o se confunde
   un 0 con una O justo donde eso invalida el documento entero. */
.campo textarea{display:block;min-height:110px;resize:vertical;font-family:var(--mono);
  font-size:14px;letter-spacing:.08em;line-height:1.9}
/* Un enlace con pinta de boton no lleva subrayado; el reset general solo toca
   los <a> del pie y del riel. */
a.btn{text-decoration:none}
.campo .ayuda{display:block;font-size:11.5px;color:var(--humo);margin-top:7px;line-height:1.55}
.campo-tres{display:flex;gap:10px}
.campo-tres .campo{flex:1;min-width:0;margin-bottom:0}

/* Elegir entre dos o tres respuestas, sin desplegable: se ven todas de una vez
   y se toca la que es. */
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opcion{flex:1 1 120px;cursor:pointer;position:relative}
.opcion input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;cursor:pointer}
.opcion span{display:block;text-align:center;padding:12px 13px;border-radius:var(--r);
  border:1px solid var(--campoBr);background:var(--campo);font-size:13.5px;color:var(--bruma);
  transition:border-color .18s,color .18s,background .18s}
.opcion input:checked+span{border-color:var(--oro);color:var(--crema);background:rgba(201,169,97,.1)}
.opcion input:focus-visible+span{outline:2px solid var(--oro);outline-offset:2px}

/* La captura de una foto. El hueco tiene la forma del documento —o de una
   cara— para que se sepa como encuadrar ANTES de disparar, y no despues de
   mirar una foto cortada. */
.capt{margin-top:18px}
.capt-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.capt-h b{font-size:13.5px;font-weight:600;color:var(--crema)}
.capt-caja{display:block;position:relative;cursor:pointer;border-radius:17px;overflow:hidden;
  border:1px dashed var(--campoBr);background:var(--campo);
  transition:border-color .18s,background .18s}
.capt-caja:hover{border-color:var(--oro);background:var(--panel2)}
.capt-caja:focus-within{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
.capt-caja input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.capt-dentro{display:flex;justify-content:center;padding:20px 16px;pointer-events:none}
.capt-marco{width:min(100%,290px);aspect-ratio:1.586;border:1px solid rgba(201,169,97,.32);
  border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:14px;text-align:center}
.capt-marco.cara{width:min(100%,178px);aspect-ratio:.8;border-radius:50%/42%}
.capt-marco svg{width:26px;height:26px;fill:none;stroke:var(--oro);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.capt-marco b{font-size:14px;font-weight:600;color:var(--crema)}
.capt-marco small{font-size:11.5px;color:var(--humo)}
.capt-previa{display:block;width:100%;max-height:320px;object-fit:contain;
  background:#04191A;border:1px solid var(--linea);border-radius:17px}
.capt-pie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}

/* La barra del envio. Avanza por etapas cumplidas, no con un temporizador. */
.ver-barra{height:5px;border-radius:3px;background:rgba(255,255,255,.07);
  overflow:hidden;margin-bottom:14px}
.ver-barra i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(120deg,var(--oroLt),var(--oro));transition:width .45s ease}
.ver-etapa{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--bruma)}

.ver-botones{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.ver-botones .btn{flex:1 1 170px}
/* Un titulo de seccion fuera de un bloque: el de dentro es `.bloque h3`. */
.cab-mini{font-size:15px;font-weight:700;color:var(--crema)}

@media (max-width:520px){
  .pasos{gap:7px}
  .paso-p span{font-size:10.5px}
}

<!-- La cabecera fina: marca a la izquierda, idioma a la derecha. Está desde el
     primer pixel porque el idioma se elige ANTES de leer, no después. -->
