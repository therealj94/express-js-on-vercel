<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Veta Wallet · web

   Una veta es la franja de mineral por la que el oro llega a la superficie:
   el nombre de la marca y la columna vertebral de este diseño. Una sola línea
   dorada atraviesa la pantalla, se abre donde hay que decidir y se ensancha
   donde está el valor.

   La letra grande es una didona (Bodoni Moda): la tipografía de las casas de
   joyería y de los billetes grabados, con ese contraste fino/grueso que ya es
   oro tallado. El texto de trabajo va en Archivo, seca y neutra, para que la
   didona sea la única voz alta. Los números del saldo también van en didona:
   un saldo en oro merece cifras de grabado, no de hoja de cálculo.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  --pozo:#021B1C; --veta:#063430;
  --panel:rgba(6,40,42,.82); --panel2:rgba(12,54,56,.86);
  --linea:rgba(201,169,97,.28); --linea2:rgba(201,169,97,.15);
  --campo:rgba(8,44,46,.9); --campoBr:#2E7477;
  --oro:#C9A961; --oroLt:#EAD79C; --oroHi:#F8EFCF; --oroDp:#96793F;
  --crema:#F3ECD9; --bruma:#AEC7C3; --humo:#6E938F;
  --jade:#3ED9A0; --coral:#F0776B;
  --serif:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:16px; --r2:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--pozo); color:var(--crema); font-family:var(--sans); font-weight:400;
  min-height:100svh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 80% at 78% -10%, rgba(14,90,82,.55), transparent 60%),
    radial-gradient(90% 60% at 8% 105%, rgba(201,169,97,.10), transparent 62%),
    radial-gradient(140% 100% at 50% 40%, rgba(6,52,48,.6), transparent 70%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:6px}
.oculto{display:none!important}
.mono{font-family:var(--mono);font-variant-ligatures:none}

/* ── la veta ─────────────────────────────────────────────────────────────── */
.veta-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.veta-svg path{fill:none;stroke:url(#vetaGrad);stroke-width:1.7;stroke-linecap:round;
  stroke-dasharray:var(--largo);stroke-dashoffset:var(--largo);
  animation:vetaCrece 2.6s cubic-bezier(.32,.9,.35,1) forwards}
.veta-svg path.b{animation-delay:.55s;opacity:.7}
.veta-svg path.c{animation-delay:.95s;opacity:.45}
@keyframes vetaCrece{to{stroke-dashoffset:0}}
.pepita{fill:var(--oroHi);opacity:0;animation:pepitaSale .9s 2.1s ease forwards}
@keyframes pepitaSale{from{opacity:0}to{opacity:1}}

/* ── cabecera fina, presente en la portada y el acceso ───────────────────── */
.techo{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;
  justify-content:space-between;padding:18px clamp(18px,4vw,42px)}
.techo .marca{font-size:clamp(19px,2.6vw,23px)}
.idiomas{display:flex;border:1px solid var(--linea2);border-radius:100px;overflow:hidden;
  background:rgba(2,22,23,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.idiomas button{padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--humo);transition:.2s}
.idiomas button[aria-pressed=true]{background:rgba(201,169,97,.16);color:var(--oroHi)}

/* ── marca ───────────────────────────────────────────────────────────────── */
.marca{display:flex;align-items:baseline;gap:.34ch;
  font-family:var(--serif);font-weight:500;letter-spacing:.005em;line-height:1;color:var(--crema)}
.marca em{font-style:italic;font-weight:400;
  background:linear-gradient(100deg,var(--oroLt),var(--oroHi) 42%,var(--oro) 72%,var(--oroLt));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:brillo 6s linear infinite}
@keyframes brillo{to{background-position:220% 0}}

/* ── portada: editorial, cargada a la izquierda ──────────────────────────────
   Nada centrado. El texto vive en la mitad izquierda como una página de
   revista; la mitad derecha es de la veta y del lingote flotante. El vacío de
   la derecha no es un descuido: es la roca sin excavar. */
#bienvenida{position:relative;z-index:2;min-height:min(100svh,860px);display:grid;align-items:center;
  grid-template-columns:minmax(0,6fr) minmax(0,4fr);gap:clamp(20px,3.5vw,48px);
  max-width:1420px;margin:0 auto;
  padding:clamp(86px,14vh,120px) clamp(20px,5vw,64px) clamp(40px,7vh,64px)}
.bv{max-width:640px}
.bv .renglon{display:block;overflow:hidden;padding-bottom:.06em}
.bv .palabra{display:inline-block;transform:translateY(112%);animation:palabraSube .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes palabraSube{to{transform:none}}
.sello{font-size:11px;font-weight:700;letter-spacing:.34em;color:var(--oroDp);text-transform:uppercase;
  display:flex;align-items:center;gap:14px}
.sello::after{content:"";height:1px;width:74px;background:linear-gradient(90deg,var(--oroDp),transparent)}
.bv h1{margin-top:22px;font-family:var(--serif);font-weight:500;letter-spacing:0;
  font-size:clamp(40px,7vw,82px);line-height:1.04;color:var(--crema)}
.bv h1 i{font-style:italic;font-weight:400;color:var(--oroLt)}
.bv p{margin-top:22px;color:var(--bruma);font-size:clamp(14.5px,1.6vw,16.5px);line-height:1.66;max-width:46ch;
  opacity:0;animation:aparece .8s 1s ease forwards}
.bv-btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;
  opacity:0;animation:aparece .8s 1.2s ease forwards}
@keyframes aparece{to{opacity:1}}
/* La fila de hechos: alineada a la izquierda, separada por hilos, cada dato
   con su cifra en didona. Es la línea de "por qué creerle" y entra la última. */
.hechos{margin-top:clamp(34px,6vh,58px);display:flex;gap:clamp(18px,3vw,38px);flex-wrap:wrap;
  opacity:0;animation:aparece .9s 1.5s ease forwards}
.hecho{padding-left:16px;border-left:1px solid var(--linea2)}
.hecho b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(20px,2.6vw,27px);color:var(--oroLt)}
.hecho small{display:block;margin-top:4px;font-size:11.5px;color:var(--humo);letter-spacing:.04em;max-width:17ch;line-height:1.5}

/* El lingote: una tarjeta de vidrio con la equivalencia del gramo y un QR real
   hacia la casa. Flota apenas, como colgada de la veta. */
.lingote{justify-self:end;align-self:center;width:min(100%,320px);padding:26px;
  animation:flota 7s 2.4s ease-in-out infinite,aparece 1s 1.6s ease both}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-
12px) rotate(.4deg)}}
.lingote .l-lbl{font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--humo)}
.lingote .l-uno{margin-top:10px;font-family:var(--serif);font-weight:500;font-size:44px;line-height:1;color:var(--oroHi)}
.lingote .l-eq{margin-top:8px;font-size:13px;color:var(--bruma);line-height:1.6}
.lingote .l-qr{margin-top:18px;display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid var(--linea2)}
.lingote .l-qr>div{width:74px;flex:0 0 auto;border-radius:10px;overflow:hidden}
.lingote .l-qr small{font-size:11.5px;color:var(--humo);line-height:1.55}

/* ── botones ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:15px 30px;border-radius:100px;font-weight:700;font-size:15px;letter-spacing:.01em;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s,background .22s,border-color .22s;
  white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:scale(.975)}
.btn-oro{color:#2A2007;background:linear-gradient(120deg,var(--oroLt),var(--oro) 52%,var(--oroLt));
  background-size:210% 100%;box-shadow:0 14px 40px -16px rgba(201,169,97,.7)}
.btn-oro:hover{transform:translateY(-2px);box-shadow:0 20px 52px -16px rgba(201,169,97,.85)}
/* El destello que cruza al pasar el cursor: reflejo sobre metal, no un hover. */
.btn-oro::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  background-size:250% 100%;background-position:160% 0;transition:background-position .7s ease}
.btn-oro:hover::after{background-position:-60% 0}
.btn-linea{border:1px solid var(--linea);color:var(--crema);background:rgba(255,255,255,.03)}
.btn-linea:hover{border-color:var(--oro);background:rgba(201,169,97,.09);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-full{width:100%}
.btn-sm{padding:11px 20px;font-size:13.5px}

.vidrio{background:var(--panel);border:1px solid var(--linea2);border-radius:var(--r2);
  backdrop-filter:bl
ur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}

/* ── acceso: el formulario a un lado, la promesa al otro ─────────────────── */
#acceso{position:relative;z-index:2;min-height:100svh;display:grid;align-items:center;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,70px);
  padding:clamp(86px,13vh,110px) clamp(20px,5vw,64px) 48px}
.acc-lado{max-width:430px;justify-self:end}
.acc-lado .sello{margin-bottom:18px}
.acc-lado h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.2vw,50px);line-height:1.08}
.acc-lado h2 i{font-style:italic;font-weight:400;color:var(--oroLt)}
.acc-lado p{margin-top:16px;color:var(--bruma);font-size:15px;line-height:1.65;max-width:38ch}
.acc-lado .gid-mini{margin-top:26px;display:flex;gap:12px;align-items:flex-start;padding:16px;
  border:1px solid var(--linea2);border-radius:var(--r);background:rgba(2,22,23,.4)}
.acc-lado .gid-mini svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--oroLt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acc-lado .gid-mini small{font-size:12.5px;color:var(--humo);line-height:1.6}
.acc{width:min(94vw,428px);padding:cl
amp(26px,5vw,38px);justify-self:start;
  animation:sube .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes sube{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.seg{display:flex;gap:4px;padding:4px;background:rgba(2,20,20,.6);border:1px solid var(--linea2);
  border-radius:100px;margin-bottom:24px}
.seg button{flex:1;padding:11px;border-radius:100px;font-size:14px;font-weight:600;color:var(--bruma);transition:.2s}
.seg button[aria-selected=true]{background:linear-gradient(120deg,var(--oroLt),var(--oro));color:#2A2007;font-weight:700}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12px;color:var(--bruma);margin-bottom:7px;font-weight:500}
.campo input{width:100%;padding:14px 15px;background:var(--campo);border:1px solid var(--campoBr);
  border-radius:var(--r);font-size:15.5px;color:var(--crema);transition:border-color .2s,box-shadow .2s}
.campo input::placeholder{color:var(--humo)}
.campo input:focus{outline:none;border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
.campo-pw{position:relative}
.campo-pw input{padding-right:52px}
.ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:10px;color:var(--humo);border-radius:10px}
.ojo:hover{color:var(--oroLt)}
.fuerza{height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
.fuerza i{display:block;height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.fuerza-lbl{font-size:11px;margin-top:6px;color:var(--humo)}
.aviso{margin-top:4px;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);font-size:13.5px;line-height:1.5}
.aviso-mal{background:rgba(240,119,107,.1);border:1px solid rgba(240,119,107,.35);color:#FFC3BC}
.aviso-ok{background:rgba(62,217,160,.1);border:1px solid rgba(62,217,160,.32);color:#B6F2DC}
.acc-legal{margin-top:18px;font-size:11.5px;color:var(--humo);text-align:center;line-height:1.6}
.acc-legal a{color:var(--bruma)}
.acc-volver{display:block;margin:20px auto 0;font-size:13px;color:var(--humo)}
.acc-volver:hover{color:var(--oroLt)}

/* ── armazón de la aplicación ────────────────────────────────────────────── */
#app{position:relative;z-index:2;min-height:100svh}
.riel{position:fixed;left:0;top:0;bottom:0;width:232px;padding:26px 18px;z-index:5;
  border-right:1px solid var(--linea2);background:rgba(2,22,23,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;flex-direction:column;gap:6px}
.riel-marca{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;font-size:21px}
.riel-marca img{width:26px;height:26px;border-radius:7px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  font-size:14.5px;font-weight:600;color:var(--bruma);transition:.18s;width:100%;text-align:left;position:relative}
.nav svg{width:19px;height:19px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.045);color:var(--crema)}
.nav[aria-current=page]{background:rgba(201,169,97,.13);color:var(--oroHi)}
.nav[aria-current=page] svg{color:var(--oro)}
/* La sección activa lleva su propia astilla de veta al costado. */
.nav[aria-current=page]::before{content:"";position:absolute;left:-18px;top:22%;bottom:22%;width:2px;
  background:linear-gradient(180deg,transparent,var(--oro),transparent)}
.riel-pie{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--linea2);font-size:11.5px;color:var(--humo);line-height:1.7}
.riel-pie a{color:var(--bruma);text-decoration:none}
.riel-pie a:hover{color:var(--oroLt)}
.riel-pie .idiomas{margin-top:10px;width:max-content}

.lienzo{margin-left:232px;padding:clamp(20px,3vw,38px) clamp(16px,3vw,38px) 60px;max-width:920px}
/* Cada vista entra en cascada: los bloques se levantan uno tras otro. Como el
   contenido se re-crea al navegar, la animación corre sola en cada cambio. */
.lienzo>*{animation:bloqueSube .55s cubic-bezier(.2,.8,.3,1) both}
.lienzo>*:nth-child(2){animation-delay:.07s}
.lienzo>*:nth-child(3){animation-delay:.14s}
.lienzo>*:nth-child(4){animation-delay:.21s}
.lienzo>*:nth-child(5){animation-delay:.28s}
@keyframes bloqueSube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.cab h2{font-family:var(--serif);font-weight:500;font-size:clamp(27px,3.8vw,38px)}
.cab .sub{font-size:13px;color:var(--humo);margin-top:6px}

/* ── el saldo ────────────────────────────────────────────────────────────── */
.saldo{padding:clamp(24px,4vw,34px);position:relative;overflow:hidden}
.saldo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,var(--oro) 22%,var(--oroHi) 50%,var(--oro) 78%,transparent)}
.saldo-lbl{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--humo);font-weight:600}
.saldo-cifra{margin-top:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.saldo-cifra b{font-family:var(--serif);font-weight:500;font-size:clamp(44px,8.4vw,72px);
  line-height:1;font-variant-numeric:lining-nums;
  background:linear-gradient(105deg,var(--oroHi),var(--oroLt) 40%,var(--oro) 75%,var(--oroHi));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:brillo 8s linear infinite}
.saldo-cifra span{font-size:14px;font-weight:700;color:var(--oroDp);letter-spacing:.14em}
.saldo-fiat{margin-top:10px;font-size:15px;color:var(--bruma)}
.saldo-fiat .pastilla{display:inline-block;margin-left:8px;padding:3px 9px;border-radius:100
px;
  font-size:12px;font-weight:700;font-family:var(--mono)}
.sube-p{background:rgba(62,217,160,.14);color:var(--jade)}
.baja-p{background:rgba(240,119,107,.14);color:var(--coral)}
.acciones{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.acc-btn{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;
  border-radius:var(--r);border:1px solid var(--linea2);background:rgba(255,255,255,.035);
  font-size:12.5px;font-weight:600;color:var(--crema);transition:.2s}
.acc-btn:hover{border-color:var(--linea);background:rgba(201,169,97,.09);transform:translateY(-2px)}
.acc-btn svg{width:21px;height:21px;stroke:var(--oro);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.bloque{margin-top:22px;padding:clamp(20px,3vw,26px)}
.bloque h3{font-size:15px;font-weight:700;margin-bottom:4px}
/* .pie nombra dos cosas: el pie de pagina del sitio y la letra pequeña de
   dentro de un bloque. La primera trae relleno y un borde superior que la
   segunda heredaba, asi que cada aclaracion dentro de una tarjeta salia
   indentada y con una raya encima que nadie habia pedido. */
.bloque .pie{font-size:13px;color:var(--humo);line-height:1.6;
  padding:0;border-top:0;display:block;background:none}
.hilera{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.hilera:last-child{border-bottom:0}
.hilera .ic{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:rgba(201,169,97,.11);border:1px solid var(--linea2)}
.hilera .ic svg{width:17px;height:17px;stroke:var(--oro);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hilera .txt{flex:1;min-width:0}
.hilera .txt b{display:block;font-size:14.5px;font-weight:600}
.hilera .txt small{display:block;font-size:12.5px;color:var(--humo);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hilera .val{text-align:right;font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.val.entra{color:var(--jade)} .val.sale{color:var(--crema)}
.vacio{padding:34px 20px;text-align:center;color:var(--humo);font-size:14px;line-height:1.7}
.vacio b{display:block;color:var(--bruma);font-size:15px;margin-bottom:6px;font-weight:600}

.gid{display:flex;align-items:flex-start;gap:16px}
.gid-ic{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(201,169,97,.22),rgba(62,217,160,.12));border:1px solid var(--linea)}
.gid-ic svg{width:22px;height:22px;stroke:var(--oroLt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.estado{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:100px;
  font-size:12px;font-weight:700;letter-spacing:.02em}
.estado::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
