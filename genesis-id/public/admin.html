<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis ID · Admin en vivo</title>
<style>
:root{
  --bg:#021B1C; --panel:#0A3436; --panel2:#123F41; --line:#1C5E61;
  --gold:#C9A961; --cyan:#4FD8E0; --txt:#F1EAD6; --mut:#9BB6B2; --faint:#66857f;
  --ok:#3ED9A0; --warn:#F5B62E; --bad:#F0776B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 600px at 50% -10%,#0a2f31,#021012);color:var(--txt);
 font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:26px}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:14px;max-width:1080px;margin:0 auto 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(201,169,97,.18),transparent)}
.mark svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.7}
.brand b{font-size:17px;display:block}.brand span{font-size:10.5px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ok);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(62,217,160,.6);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(62,217,160,.5)}70%{box-shadow:0 0 0 8px rgba(62,217,160,0)}100%{box-shadow:0 0 0 0 rgba(62,217,160,0)}}
.wrap{max-width:1080px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:15px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-size:26px;font-weight:750;margin-top:5px}
.kpi.g .v{color:var(--gold)}.kpi.c .v{color:var(--cyan)}.kpi.w .v{color:var(--warn)}.kpi.o .v{color:var(--ok)}
h2{font-size:15px;margin:22px 0 12px;font-weight:700}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:650;padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 15px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;padding:3px 10px;border-radius:999px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:rgba(62,217,160,.14)}.warn{color:var(--warn);background:rgba(245,182,46,.14)}
.info{color:var(--cyan);background:rgba(79,216,224,.14)}.bad{color:var(--bad);background:rgba(240,119,107,.14)}
.uid{color:var(--gold)}.buid{color:var(--cyan)}
.foot{max-width:1080px;margin:22px auto 0;color:var(--faint);font-size:11.5px;text-align:center}
.empty{padding:22px 15px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V6l8-4z"/><path d="M8.5 12l2.5 2.5L15.5 9.5"/></svg></div>
    <div><b>Genesis ID · Admin en vivo</b><span>Orden Global · motor real</span></div>
  </div>
  <div class="live"><i></i><span id="liveTxt">Conectado</span></div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <h2>Identidades personales (KYC)</h2>
  <div class="card"><table><thead><tr><th>Correo</th><th>Nombre</th><th>UID Genesis</th><th>Veta Wallet</th><th>Paso</th><th>Actualizado</th></tr></thead><tbody id="idns"></tbody></table></div>

  <h2>Negocios (KYB)</h2>
  <div class="card"><table><thead><tr><th>Negocio</th><th>Titular</th><th>UID negocio</th><th>País</th><th>Estado</th></tr></thead><tbody id="biz"></tbody></table></div>
</div>
<div class="foot">Se actualiza cada 4 s desde <span class="num">/api/admin</span> · datos reales del motor</div>

<script>
const STEP = {
  'email':['info','Correo'],'doc-front':['info','Documento'],'doc-back':['info','Documento'],
  'face':['info','Rostro'],'processing':['info','Procesando'],'review24':['warn','Revisión 24 h'],'verified':['ok','Verificada'],
};
const BSTAT = {'verified':['ok','Verificado'],'pending':['warn','En revisión'],'rejected':['bad','Rechazado']};
function ago(iso){ if(!iso) return '—'; const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return 'hace '+Math.floor(s)+'s'; if(s<3600) return 'hace '+Math.floor(s/60)+'m';
  if(s<86400) return 'hace '+Math.floor(s/3600)+'h'; return 'hace '+Math.floor(s/86400)+'d'; }
function pill(cls,txt){return '<span class="pill '+cls+'"><i></i>'+txt+'</span>';}

async function load(){
  try{
    const [s,i,b] = await Promise.all([
      fetch('/api/admin/stats').then(r=>r.json()),
      fetch('/api/admin/identities').then(r=>r.json()),
      fetch('/api/admin/business').then(r=>r.json()),
    ]);
    document.getElementById('liveTxt').textContent='Conectado';
    document.getElementById('kpis').innerHTML =
      kpi('g','Identidades',s.identities.total)+kpi('o','Verificadas',s.identities.verified)+
      kpi('c','En proceso',s.identities.inProgress)+kpi('w','Revisión 24h',s.identities.inReview)+
      kpi('g','Negocios',s.businesses.total)+kpi('o','KYB verificados',s.businesses.verified);
    document.getElementById('idns').innerHTML = i.identities.length ? i.identities.map(x=>{
      const st=STEP[x.step]||['info',x.step];
      const w=x.walletAddress ? x.walletAddress.slice(0,6)+'…'+x.walletAddress.slice(-4) : '—';
      return '<tr><td>'+x.email+'</td><td>'+(x.fullName||'—')+'</td><td class="num uid">'+(x.genesisUid||'—')+
        '</td><td class="num buid" title="'+(x.walletAddress||'')+'">'+w+
        '</td><td>'+pill(st[0],st[1])+'</td><td class="num">'+ago(x.updatedAt)+'</td></tr>';}).join('') :
      '<tr><td colspan="6" class="empty">Aún no hay identidades.</td></tr>';
    document.getElementById('biz').innerHTML = b.businesses.length ? b.businesses.map(x=>{
      const st=BSTAT[x.status]||['info',x.status];
      return '<tr><td>'+x.tradeName+'</td><td>'+x.ownerEmail+'</td><td class="num buid">'+(x.genesisUid||'—')+
        '</td><td>'+x.country+'</td><td>'+pill(st[0],st[1])+'</td></tr>';}).join('') :
      '<tr><td colspan="5" class="empty">Aún no hay negocios.</td></tr>';
  }catch(e){ document.getElementById('liveTxt').textContent='Reconectando…'; }
}
function kpi(c,l,v){return '<div class="kpi '+c+'"><div class="l">'+l+'</div><div class="v num">'+v+'</div></div>';}
load(); setInterval(load,4000);
</script>
</body>
</html>
