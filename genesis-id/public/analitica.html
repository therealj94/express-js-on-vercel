<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis ID · Analítica del ecosistema</title>
<style>
/* Mismo sistema de color que el panel de cumplimiento: quien salta de uno a
   otro tiene que sentir que sigue en la misma casa. */
:root{
  --bg:#021012; --panel:#0A3436; --panel2:#0d2b2d; --line:#1C5E61; --line2:#164a4d;
  --gold:#C9A961; --cyan:#4FD8E0; --txt:#F1EAD6; --mut:#9BB6B2; --faint:#66857f;
  --ok:#3ED9A0; --warn:#F5B62E; --bad:#F0776B; --crit:#ff5a7a; --viol:#9C8CF0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1100px 640px at 50% -12%,#0a2f31,#021012);color:var(--txt);
 font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;background:var(--line);color:var(--txt)}
button:hover{filter:brightness(1.18)}
button:disabled{opacity:.45;cursor:not-allowed}
button.p{background:var(--gold);color:#1a1200;font-weight:700}
button.ok{background:var(--ok);color:#022;font-weight:700}
button.bad{background:var(--bad);color:#2a0a06;font-weight:700}
button.g{background:transparent;border:1px solid var(--line)}
button.mini{padding:5px 10px;font-size:12px}
/* El «seleccionado» de nav está limitado a nav, y los botones de filtro que
   viven dentro del lienzo se quedaban sin marca: se veían todos iguales y no
   había forma de saber qué filtro estaba puesto. */
button.g.sel{border-color:var(--gold);background:rgba(201,169,97,.16);color:var(--gold)}
input,select,textarea{font:inherit;background:#061e20;color:var(--txt);border:1px solid var(--line);
 border-radius:9px;padding:9px 11px;width:100%}
a{color:var(--cyan)}
.oculto{display:none!important}

#entrada{display:grid;place-items:center;min-height:100vh;padding:20px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;width:100%;max-width:400px}
.caja h1{font-size:20px;margin-bottom:4px}
.caja p.sub{color:var(--faint);font-size:12px;margin-bottom:22px}
.caja label{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.err{background:rgba(240,119,107,.14);border:1px solid rgba(240,119,107,.4);color:var(--bad);
 padding:9px 12px;border-radius:9px;font-size:12.5px;margin-top:12px}

header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:11px}
.sello{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;
 background:linear-gradient(135deg,rgba(201,169,97,.2),transparent)}
.sello svg{width:21px;height:21px;stroke:var(--gold);fill:none;stroke-width:1.7}
.marca b{font-size:16px;display:block}
.marca span{font-size:10px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.mandos{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mandos select{width:auto;padding:6px 10px;font-size:12.5px}
.rol{background:rgba(201,169,97,.16);color:var(--gold);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
nav{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line2);overflow-x:auto}
nav button{background:none;border-radius:0;border-bottom:2px solid transparent;color:var(--mut);padding:11px 14px;white-space:nowrap}
nav button.sel{color:var(--txt);border-bottom-color:var(--gold)}
nav button .pip{display:inline-block;min-width:17px;padding:0 4px;margin-left:6px;border-radius:9px;
 background:var(--crit);color:#2a0008;font-size:10px;font-weight:800;line-height:16px;text-align:center}
main{padding:22px;max-width:1500px;margin:0 auto}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
/* Un degradado apenas perceptible arriba de cada tarjeta. Da profundidad sin
   pedir atención: en un panel que se mira todos los días, el adorno que se
   nota es el que cansa. */
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,169,97,.5),transparent);opacity:.7}
.kpi.c::before{background:linear-gradient(90deg,transparent,rgba(79,216,224,.55),transparent)}
.kpi.o::before{background:linear-gradient(90deg,transparent,rgba(62,217,160,.55),transparent)}
.kpi.b::before{background:linear-gradient(90deg,transparent,rgba(240,119,107,.6),transparent)}
.kpi.v::before{background:linear-gradient(90deg,transparent,rgba(156,140,240,.55),transparent)}
.kpi{transition:transform .16s ease,border-color .16s ease}
.kpi:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.13)}
.kpi{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:14px;position:relative;overflow:hidden}
.kpi .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.kpi .v{font-size:26px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;margin-top:3px;color:var(--faint);position:relative;z-index:1;padding-right:96px}
.kpi .d.sube{color:var(--ok)} .kpi .d.baja{color:var(--bad)}
.kpi.g .v{color:var(--gold)}.kpi.c .v{color:var(--cyan)}.kpi.w .v{color:var(--warn)}
.kpi.o .v{color:var(--ok)}.kpi.b .v{color:var(--bad)}.kpi.v .v{color:var(--viol)}
/* La chispa va detrás del texto y muy tenue: es un adorno que da contexto, no
   un dato que se lea. Si tapa la cifra deja de ser un adorno y es un estorbo. */
.kpi .chispa{position:absolute;right:0;bottom:0;opacity:.28;pointer-events:none;z-index:0}

h2{font-size:15px;margin:24px 0 11px;font-weight:700;display:flex;align-items:center;gap:9px}
h2 .pista{font-size:11.5px;color:var(--faint);font-weight:400}
h3{font-size:12px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tarjeta{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:13px;overflow:hidden}
.tarjeta.p{padding:16px}
.rejilla{display:grid;gap:14px}
.rejilla.dos{grid-template-columns:1fr 1fr}
.rejilla.tres{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.rejilla.dos,.rejilla.tres{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
 padding:10px 12px;border-bottom:1px solid var(--line2);font-weight:700}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13px;vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.pulsable{cursor:pointer}
.vacio{padding:34px 18px;text-align:center;color:var(--faint);font-size:13px}
th.orden{cursor:pointer;user-select:none}
th.orden:hover{color:var(--txt)}
.vacio b{display:block;color:var(--mut);margin-bottom:5px;font-size:14px}

.eti{display:inline-block;padding:2.5px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.eti.ok{background:rgba(62,217,160,.16);color:var(--ok)}
.eti.warn{background:rgba(245,182,46,.16);color:var(--warn)}
.eti.bad{background:rgba(240,119,107,.16);color:var(--bad)}
.eti.crit{background:rgba(255,90,122,.18);color:var(--crit)}
.eti.mut{background:rgba(155,182,178,.13);color:var(--mut)}
.eti.cyan{background:rgba(79,216,224,.14);color:var(--cyan)}
.eti.gold{background:rgba(201,169,97,.16);color:var(--gold)}

.barra{height:7px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--gold))}

pre.pila{background:#061e20;border:1px solid var(--line2);border-radius:10px;padding:13px;
 font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);overflow-x:auto;white-space:pre;max-height:330px}

.velo{position:fixed;inset:0;background:rgba(2,10,12,.78);display:grid;place-items:center;padding:20px;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;
 width:100%;max-width:820px;max-height:88vh;overflow-y:auto}
.modal h3{margin-top:0;color:var(--txt);text-transform:none;letter-spacing:0;font-size:16px}
.filaBtn{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}

.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:9px}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.cargando{color:var(--faint);font-size:12.5px;padding:16px}
.pie{color:var(--faint);font-size:11.5px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line2)}
</style>
</head>
<body>

<!-- ── Entrada ─────────────────────────────────────────────────────────── -->
<div id="entrada">
  <form class="caja" onsubmit="entrar(event)">
    <h1>Analítica del ecosistema</h1>
    <p class="sub">Genesis ID · Orden Global</p>
    <label>Correo del operador</label>
    <input id="eMail" type="email" autocomplete="username" required>
    <label>Contraseña</label>
    <input id="eClave" type="password" autocomplete="current-password" required>
    <div id="eError" class="err oculto"></div>
    <button class="p" style="width:100%;margin-top:18px" type="submit">Entrar</button>
    <p style="margin-top:14px;font-size:11.5px;color:var(--faint)">
      Se usa la misma cuenta que el panel de cumplimiento.
    </p>
  </form>
</div>

<!-- ── Aplicación ──────────────────────────────────────────────────────── -->
<div id="app" class="oculto">
  <header>
    <div class="marca">
      <div class="sello"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 4-7 5 5"/><path d="M3 21h18"/></svg></div>
      <div><b>Analítica del ecosistema</b><span>Genesis ID</span></div>
    </div>
    <div class="mandos">
      <select id="filtroApp" onchange="pintar()"><option value="todas">Todas las apps</option></select>
      <select id="filtroDias" onchange="pintar()">
        <option value="7">7 días</option>
        <option value="30" selected>30 días</option>
        <option value="90">90 días</option>
      </select>
      <button class="g mini" onclick="pintar(true)">Actualizar</button>
      <span class="rol" id="quien"></span>
      <button class="g mini" onclick="location.href='/cerebro'" title="Todo el ecosistema como un mapa navegable">El cerebro ↗</button>
      <button class="g mini" onclick="location.href='/admin'" title="Identidades, negocios y casos">Cumplimiento ↗</button>
      <button class="g mini" onclick="salir()">Salir</button>
    </div>
  </header>

  <nav id="nav"></nav>
  <main id="lienzo"><div class="cargando">Cargando…</div></main>
</div>

<script>
'use strict';

/* ─────────────────────────────────────────────────────────────────────────
   Estado y transporte
   ───────────────────────────────────────────────────────────────────────── */

let sesion = localStorage.getItem('gid.sesion') || '';
let yo = null;
let pestana = 'resumen';
/** Plataforma elegida en «Conexiones»: '' = todas, 'android', 'web'. */
let conexPlataforma = '';
/** Identificador del temporizador que refresca esa pestaña sola. */
let conexReloj = null;
let datos = {};      // caché de lo último traído
let cargando = false;

const PESTANAS = [
  ['resumen',   'Resumen'],
  ['apps',      'Apps'],
  ['usuarios',  'Usuarios'],
  ['paises',    'Países'],
  ['embudo',    'Verificación'],
  ['usuarios2', 'Directorio'],
  ['conexiones','Conexiones'],
  ['errores',   'Errores'],
  ['seguridad', 'Seguridad'],
  ['salud',     'Salud'],
];

async function api(ruta, opciones = {}) {
  const r = await fetch('/api' + ruta, {
    ...opciones,
    headers: {
      'Content-Type': 'application/json',
      ...(sesion ? { Authorization: 'Bearer ' + sesion } : {}),
      ...(opciones.headers || {}),
    },
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (r.status === 401) { salir(); throw new Error('La sesión venció'); }
  if (!r.ok) throw new Error(cuerpo.error || ('Error ' + r.status));
  return cuerpo;
}

async function entrar(ev) {
  ev.preventDefault();
  const err = document.getElementById('eError');
  err.classList.add('oculto');
  try {
    const r = await api('/sesion/entrar', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('eMail').value,
        contrasena: document.getElementById('eClave').value,
      }),
    });
    sesion = r.token;
    localStorage.setItem('gid.sesion', sesion);
    yo = r.operador;
    arrancar();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('oculto');
  }
}

function salir() {
  api('/sesion/salir', { method: 'POST' }).catch(() => {});
  sesion = ''; yo = null;
  localStorage.removeItem('gid.sesion');
  document.getElementById('app').classList.add('oculto');
  document.getElementById('entrada').classList.remove('oculto');
}

/* ─────────────────────────────────────────────────────────────────────────
   Utilidades de presentación
   ───────────────────────────────────────────────────────────────────────── */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const n = (v) => (v === null || v === undefined) ? '—' : Number(v).toLocaleString('es');

/** Números grandes en corto: 12.400 → 12,4 k. En un KPI, los ceros estorban. */
function corto(v) {
  if (v === null || v === undefined) return '—';
  const x = Number(v);
  if (Math.abs(x) >= 1e6) return (x / 1e6).toFixed(1).replace('.', ',') + ' M';
  if (Math.abs(x) >= 1e4) return (x / 1e3).toFixed(1).replace('.', ',') + ' k';
  return x.toLocaleString('es');
}

function cuando(iso) {
  if (!iso) return '—';
  const t = new Date(iso), seg = (Date.now() - t) / 1000;
  if (seg < 60) return 'hace instantes';
  if (seg < 3600) return 'hace ' + Math.floor(seg / 60) + ' min';
  if (seg < 86400) return 'hace ' + Math.floor(seg / 3600) + ' h';
  if (seg < 604800) return 'hace ' + Math.floor(seg / 86400) + ' d';
  return t.toLocaleDateString('es', { day: '2-digit', month: 'short', year: '2-digit' });
}

const fechaCorta = (d) => {
  const [, m, dd] = String(d).split('-');
  return dd + '/' + m;
};

/** Variación entre dos cifras, con su flecha y su color. */
function delta(hoy, ayer, alRevés = false) {
  if (!ayer && !hoy) return '<div class="d">sin datos ayer</div>';
  if (!ayer) return '<div class="d sube">↑ nuevo</div>';
  const p = Math.round(((hoy - ayer) / ayer) * 100);
  if (p === 0) return '<div class="d">igual que ayer</div>';
  const bueno = alRevés ? p < 0 : p > 0;
  return `<div class="d ${bueno ? 'sube' : 'baja'}">${p > 0 ? '↑' : '↓'} ${Math.abs(p)} % vs ayer</div>`;
}

function kpi(etiqueta, valor, clase = '', extra = '', chispa = null) {
  return `<div class="kpi ${clase}">
    <div class="l">${etiqueta}</div>
    <div class="v">${valor}</div>
    ${extra}
    ${chispa ? `<div class="chispa">${chispa}</div>` : ''}
  </div>`;
}

function vacio(titulo, texto) {
  return `<div class="vacio"><b>${esc(titulo)}</b>${esc(texto)}</div>`;
}

/* ─────────────────────────────────────────────────────────────────────────
   Gráficas
   Se dibujan a mano en SVG. No hay librería de gráficas: son cuatro formas,
   pesan cero y no meten una dependencia de terceros en el panel que además
   sirve identidades.
   ───────────────────────────────────────────────────────────────────────── */

/** Línea con área, rejilla y ejes. `series` = [{nombre,color,valores}]. */
function grafLinea(etiquetas, series, alto = 190) {
  const W = 1000, H = alto, ml = 44, mr = 12, mt = 14, mb = 26;
  const ancho = W - ml - mr, altoU = H - mt - mb;
  const todos = series.flatMap((s) => s.valores.filter((v) => v !== null));
  const max = Math.max(1, ...todos);
  const paso = etiquetas.length > 1 ? ancho / (etiquetas.length - 1) : 0;
  const x = (i) => ml + i * paso;
  const y = (v) => mt + altoU - (v / max) * altoU;

  // Cuatro líneas de rejilla bastan para leer una magnitud sin ensuciar.
  let rejilla = '';
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = y(v);
    rejilla += `<line x1="${ml}" y1="${yy}" x2="${W - mr}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>
      <text x="${ml - 7}" y="${yy + 3.5}" fill="#66857f" font-size="10" text-anchor="end">${corto(Math.round(v))}</text>`;
  }

  let ejes = '';
  const cada = Math.max(1, Math.ceil(etiquetas.length / 8));
  etiquetas.forEach((e, i) => {
    if (i % cada && i !== etiquetas.length - 1) return;
    ejes += `<text x="${x(i)}" y="${H - 8}" fill="#66857f" font-size="10" text-anchor="middle">${fechaCorta(e)}</text>`;
  });

  // El último día está a medias —son las tres de la tarde, no las doce de la
  // noche— y dibujarlo igual que los demás hace que toda gráfica parezca un
  // desplome al final. Se traza aparte, punteado, y se dice en la leyenda.
  const ultimo = etiquetas.length - 1;
  let trazos = '';
  series.forEach((s) => {
    const firmes = s.valores.slice(0, ultimo);
    const pts = firmes.map((v, i) => `${x(i)},${y(v ?? 0)}`).join(' ');
    trazos += `<polygon points="${ml},${y(0)} ${pts} ${x(ultimo - 1)},${y(0)}"
        fill="${s.color}" opacity=".10"/>
      <polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="${x(ultimo - 1)}" y1="${y(firmes[firmes.length - 1] ?? 0)}"
        x2="${x(ultimo)}" y2="${y(s.valores[ultimo] ?? 0)}"
        stroke="${s.color}" stroke-width="2" stroke-dasharray="3 3" opacity=".65"/>
      <circle cx="${x(ultimo)}" cy="${y(s.valores[ultimo] ?? 0)}" r="3.2"
        fill="none" stroke="${s.color}" stroke-width="1.8"/>`;
  });

  const leyenda = series.map((s) =>
    `<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join('') +
    '<span style="color:var(--faint)">— · — el último punto es el día en curso, todavía incompleto</span>';

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${rejilla}${trazos}${ejes}
    </svg><div class="leyenda">${leyenda}</div>`;
}

/** Línea diminuta para meter dentro de una celda o un KPI. */
function chispa(valores, color = '#4FD8E0', ancho = 92, alto = 30) {
  if (!valores || valores.length < 2) return '';
  const max = Math.max(1, ...valores);
  const paso = ancho / (valores.length - 1);
  const pts = valores.map((v, i) => `${i * paso},${alto - (v / max) * (alto - 4) - 2}`).join(' ');
  return `<svg viewBox="0 0 ${ancho} ${alto}" width="${ancho}" height="${alto}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/**
 * Barras verticales por día o por categoría corta.
 *
 * `ancho` es el del viewBox, no el de la pantalla: el SVG se estira al hueco
 * que le toque, así que un viewBox de 1000 metido en media columna encoge la
 * tipografía a la mitad y las fechas dejan de leerse. Para una gráfica chica
 * se pasa un viewBox chico y el texto queda a su tamaño.
 */
function grafBarras(etiquetas, valores, color = '#C9A961', alto = 150, W = 1000) {
  const H = alto, ml = 40, mr = 10, mt = 10, mb = 24;
  const ancho = W - ml - mr, altoU = H - mt - mb;
  const max = Math.max(1, ...valores);
  const paso = ancho / valores.length;
  const w = Math.max(2, paso * 0.62);
  let barras = '', ejes = '';
  valores.forEach((v, i) => {
    const h = (v / max) * altoU;
    const x = ml + i * paso + (paso - w) / 2;
    barras += `<rect x="${x}" y="${mt + altoU - h}" width="${w}" height="${h}" rx="2" fill="${color}" opacity=".82"/>`;
    const cada = Math.max(1, Math.ceil(valores.length / 12));
    if (!(i % cada)) ejes += `<text x="${x + w / 2}" y="${H - 7}" fill="#66857f" font-size="9.5" text-anchor="middle">${esc(etiquetas[i])}</text>`;
  });
  for (let i = 0; i <= 2; i++) {
    const v = (max / 2) * i, yy = mt + altoU - (v / max) * altoU;
    barras = `<line x1="${ml}" y1="${yy}" x2="${W - mr}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>
      <text x="${ml - 6}" y="${yy + 3.5}" fill="#66857f" font-size="9.5" text-anchor="end">${corto(Math.round(v))}</text>` + barras;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${barras}${ejes}</svg>`;
}

/** Embudo: cada paso, su ancho proporcional y cuánta gente se cayó ahí. */
function grafEmbudo(pasos) {
  if (!pasos.length || !pasos[0].n) return vacio('Todavía no hay verificaciones', 'El embudo aparece con la primera identidad.');
  const max = pasos[0].n;
  return pasos.map((p, i) => {
    const pct = (p.n / max) * 100;
    const color = i === pasos.length - 1 ? 'var(--ok)' : 'linear-gradient(90deg,var(--cyan),var(--gold))';
    return `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span>${esc(p.paso)}</span>
        <span class="num"><b>${n(p.n)}</b>
          <span style="color:var(--faint)">· ${p.porcentaje} %</span>
          ${p.caida > 0 ? `<span style="color:var(--bad)"> −${n(p.caida)}</span>` : ''}</span>
      </div>
      <div style="height:22px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:7px"></div>
      </div>
    </div>`;
  }).join('');
}

/** Fila de tabla con barra proporcional. */
function filaBarra(nombre, valor, max, extra = '') {
  const pct = max ? (valor / max) * 100 : 0;
  return `<tr>
    <td>${nombre}</td>
    <td class="num" style="width:80px">${n(valor)}</td>
    <td style="width:38%"><div class="barra"><i style="width:${pct}%"></i></div></td>
    <td style="width:110px;color:var(--faint);font-size:12px">${extra}</td>
  </tr>`;
}

/* ─────────────────────────────────────────────────────────────────────────
   Carga de datos
   ───────────────────────────────────────────────────────────────────────── */

const qs = () => {
  const app = document.getElementById('filtroApp').value;
  const dias = document.getElementById('filtroDias').value;
  return `?dias=${dias}` + (app !== 'todas' ? `&app=${encodeURIComponent(app)}` : '');
};

async function traer(forzar) {
  const clave = pestana + qs();
  if (!forzar && datos[clave]) return datos[clave];
  const r = {};
  const p = (ruta) => api('/panel/analitica' + ruta);

  if (pestana === 'resumen') {
    const [res, apps] = await Promise.all([p('/resumen' + qs()), p('/apps' + qs())]);
    Object.assign(r, res, { apps: apps.apps });
  } else if (pestana === 'apps') {
    Object.assign(r, await p('/apps' + qs()));
  } else if (pestana === 'usuarios') {
    const [res, ret, ver] = await Promise.all([
      p('/resumen' + qs()), p('/retencion' + qs()), p('/versiones'),
    ]);
    Object.assign(r, res, { cohortes: ret.cohortes, versiones: ver.versiones });
  } else if (pestana === 'paises') {
    Object.assign(r, await p('/paises' + qs()));
  } else if (pestana === 'embudo') {
    Object.assign(r, await p('/embudo'));
  } else if (pestana === 'errores') {
    const app = document.getElementById('filtroApp').value;
    Object.assign(r, await p('/errores?limite=200' + (app !== 'todas' ? '&app=' + encodeURIComponent(app) : '')));
  } else if (pestana === 'usuarios2') {
    const q = new URLSearchParams(filtrosDir()).toString();
    const [rr, ll] = await Promise.all([
      api('/panel/directorio/resumen'), api('/panel/directorio?' + q),
    ]);
    Object.assign(r, { resumenDir: rr, lista: ll });
  } else if (pestana === 'conexiones') {
    const app = document.getElementById('filtroApp').value;
    const q = new URLSearchParams({ limite: '100' });
    if (app !== 'todas') q.set('app', app);
    if (conexPlataforma) q.set('plataforma', conexPlataforma);
    /* El reparto va aparte de la lista a propósito: la lista son las cien más
       recientes y el reparto es el total. Mezclarlos daría un porcentaje
       calculado sobre una página, que es la clase de cifra que se cita en una
       reunión y no significa nada. */
    const qr = new URLSearchParams();
    if (app !== 'todas') qr.set('app', app);
    const [ses, rep] = await Promise.all([
      p('/sesiones?' + q.toString()),
      p('/reparto?' + qr.toString()).catch(() => null),
    ]);
    Object.assign(r, ses, { reparto: rep });
  } else if (pestana === 'seguridad') {
    Object.assign(r, await p('/seguridad'));
  } else if (pestana === 'salud') {
    Object.assign(r, await p('/salud' + (forzar ? '?forzar=1' : '')));
  }
  datos[clave] = r;
  return r;
}

async function pintar(forzar) {
  if (cargando) return;
  cargando = true;
  const lienzo = document.getElementById('lienzo');
  if (forzar) datos = {};
  lienzo.innerHTML = '<div class="cargando">Cargando…</div>';
  try {
    const d = await traer(forzar);
    lienzo.innerHTML = ({
      resumen: vistaResumen, apps: vistaApps, usuarios: vistaUsuarios,
      paises: vistaPaises, embudo: vistaEmbudo, errores: vistaErrores,
      seguridad: vistaSeguridad, salud: vistaSalud, usuarios2: vistaDirectorio,
      conexiones: vistaConexiones,
    })[pestana](d);
  } catch (e) {
    lienzo.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    cargando = false;
  }
}

function avisoSinDatos(d) {

      El motor está listo y esperando. Falta que las apps empiecen a reportar:
      cada una manda sus eventos a <code>POST /api/v1/telemetria/eventos</code>
      con su cabecera <code>X-API-Key</code>. En <code>clientes/telemetria.js</code>
      está el cliente listo para pegar.

}

function vistaResumen(d) {
  const u = d.usuarios, e = d.errores, a = d.actividad;

  const volumen = Object.entries(a.volumen || {})
    .map(([m, v]) => `${n(Math.round(v * 100) / 100)} ${esc(m)}`).join(' · ') || '—';

  // Dos bloques, y en este orden: primero LA BASE (lo que la empresa tiene),
  // después EL MOVIMIENTO (lo que pasa hoy). Mezclarlos en una sola fila de
  // seis números hace que nadie sepa cuál mirar primero.
  const c = d.censo || { hay: false, registrados: 0, porApp: [] };

    <h2 style="margin-top:0">La base <span class="pista">lo que hay, según el padrón de cada app</span></h2>

    </div>` : `
    <div class="tarjeta p" style="border-color:rgba(201,169,97,.35);margin-bottom:18px">
      <b style="color:var(--gold)">Falta el padrón de las apps</b>
      <p style="color:var(--mut);font-size:13px;margin-top:6px">
        Aquí abajo solo se cuenta a quien abrió una app <b>desde que se encendió
        la analítica</b>. Los usuarios que ya tenías no aparecen hasta que cada
        app declare su padrón con una llamada a
        <code>POST /api/v1/telemetria/censo</code>. Sin eso, estas cifras
        subestiman la base — y una cifra que subestima se ve igual de bien que
        una correcta.
      </p></div>`;

  return avisoSinDatos(d) + base + `
  <h2>El movimiento <span class="pista">lo que pasó en la ventana elegida</span></h2>
  <div class="kpis">
    ${kpi('Activos hoy', corto(u.activosHoy), 'c',
        `<div class="d">${corto(u.activos7)} en 7 d · ${corto(u.activos30)} en 30 d</div>`,
        chispa(d.serie.map((s) => s.activos), '#4FD8E0'))}
    ${c.hay && c.registrados ? kpi('Alcance', Math.round((u.activos30 / c.registrados) * 100) + ' %', 'v',
        '<div class="d">de tu base entró este mes</div>') : ''}
    ${kpi('Altas hoy', corto(u.nuevosHoy), 'o', delta(u.nuevosHoy, u.nuevosAyer),
        chispa(d.serie.map((s) => s.nuevos), '#3ED9A0'))}
    ${kpi('Eventos hoy', corto(a.eventosHoy), '',
        `<div class="d">${corto(a.eventosVentana)} en la ventana</div>`)}
    ${kpi('Vistos por primera vez', corto(u.total), '',
        '<div class="d">desde que se encendió</div>')}
    ${kpi('Errores hoy', corto(e.hoy), e.criticosHoy ? 'b' : 'w',
        delta(e.hoy, e.ayer, true) +
        (e.criticosHoy ? `<div class="d baja">${e.criticosHoy} crítico(s)</div>` : ''),
        chispa(d.serie.map((s) => s.errores), '#F0776B'))}
    ${kpi('Tasa de error', e.tasaPorMil + ' <span style="font-size:13px;color:var(--faint)">/ mil</span>',
        e.tasaPorMil > 20 ? 'b' : e.tasaPorMil > 5 ? 'w' : 'o')}
  </div>

  <div class="rejilla dos">
    <div class="tarjeta p">
      <h2 style="margin-top:0">Personas <span class="pista">activos y altas por día</span></h2>
      ${grafLinea(etiquetas, [
        { nombre: 'Activos', color: '#4FD8E0', valores: d.serie.map((s) => s.activos) },
        { nombre: 'Altas nuevas', color: '#3ED9A0', valores: d.serie.map((s) => s.nuevos) },
      ])}
    </div>
    <div class="tarjeta p">
      <h2 style="margin-top:0">Uso y fallos <span class="pista">eventos contra errores</span></h2>
      ${grafLinea(etiquetas, [
        { nombre: 'Eventos', color: '#C9A961', valores: d.serie.map((s) => s.eventos) },
        { nombre: 'Errores', color: '#F0776B', valores: d.serie.map((s) => s.errores) },
      ])}
    </div>
  </div>

  <div class="rejilla dos" style="margin-top:14px">
    <div class="tarjeta">
      <h2 style="margin:16px 16px 4px">Por aplicación</h2>
      <div class="scroll"><table>
        <thead><tr><th>App</th><th>Usuarios</th><th>Activos 7 d</th><th>Errores</th><th>Tendencia</th></tr></thead>
        <tbody>${(d.apps || []).map((x) => `<tr>
          <td><b>${esc(x.app)}</b></td>
          <td class="num">${n(x.usuarios)}</td>
          <td class="num">${n(x.activos7)}</td>
          <td class="num">${x.errores ? `<span class="eti ${x.tasaPorMil > 20 ? 'bad' : 'warn'}">${n(x.errores)}</span>` : '<span class="eti ok">0</span>'}</td>
          <td>${chispa(x.serie, '#4FD8E0', 80, 26)}</td></tr>`).join('') ||
          `<tr><td colspan="5">${vacio('Sin apps reportando', 'Aparecerán solas al mandar su primer evento.')}</td></tr>`}
        </tbody></table></div>
    </div>
    <div class="tarjeta">
      <h2 style="margin:16px 16px 4px">Dónde está la gente</h2>
      <div class="scroll"><table>
        <thead><tr><th>País</th><th>Eventos</th><th></th><th>%</th></tr></thead>
        <tbody>${(d.paises || []).slice(0, 8).map((p) =>
          filaBarra(esc(p.clave), p.n, d.paises[0].n,
            Math.round((p.n / (d.paises.reduce((s, q) => s + q.n, 0) || 1)) * 1000) / 10 + ' %')).join('') ||
          `<tr><td colspan="4">${vacio('Sin datos de país', 'Llegan con el primer evento.')}</td></tr>`}
        </tbody></table></div>
      <div style="padding:12px 16px;color:var(--faint);font-size:11.5px">
        Volumen movido en la ventana: <b style="color:var(--mut)">${volumen}</b>
      </div>
    </div>
  </div>`;
}

function vistaApps(d) {

  return `<h2>Comparativa de aplicaciones <span class="pista">la ventana elegida</span></h2>
  <div class="tarjeta scroll"><table>
    <thead><tr><th>Aplicación</th><th>Usuarios</th><th>Activos 7 d</th><th>Altas</th>
      <th>Eventos</th><th>Errores</th><th>Tasa /mil</th><th>Actividad diaria</th></tr></thead>
    <tbody>${apps.map((x) => `<tr>
      <td><b>${esc(x.app)}</b></td>
      <td class="num">${n(x.usuarios)}</td>
      <td class="num">${n(x.activos7)}</td>
      <td class="num" style="color:var(--ok)">${n(x.nuevos)}</td>
      <td class="num">${n(x.eventos)}</td>
      <td class="num">${n(x.errores)}</td>
      <td><span class="eti ${x.tasaPorMil > 20 ? 'bad' : x.tasaPorMil > 5 ? 'warn' : 'ok'}">${x.tasaPorMil}</span></td>
      <td>${chispa(x.serie, '#C9A961', 130, 30)}</td></tr>`).join('')}
    </tbody></table></div>
  <p class="pie">La tasa por mil es errores por cada mil eventos. Es la cifra que
  se puede comparar entre apps y entre versiones — el número crudo de errores solo
  dice cuánta gente usó la app.</p>`;
}

    ${kpi('Pegajosidad', d.usuarios.activos30 ? Math.round((d.usuarios.activosHoy / d.usuarios.activos30) * 100) + ' %' : '—', 'v',

    <h2 style="margin-top:0">Altas y actividad</h2>

  <p class="pie">Los errores se agrupan por su patrón, no por su texto exacto: «no

  visto dos veces. Un error dado por resuelto que reaparece en una versión
  posterior se marca <b>reabierto</b> solo.</p>`;
}

  if (dirFiltros.orden === col) {

/* ── Exportar el directorio ───────────────────────────────────────────────
 *
 * POR QUE SE LE PIDE OTRA VEZ AL SERVIDOR EN VEZ DE USAR LO DE LA PANTALLA
 *
 * Esto bajaba `datos[...].lista.usuarios`, que es la página que se está
 * viendo. Y la pantalla pide `limite: 150`. O sea que con un filtro que daba
 * 900 personas, el título decía «900 personas» y el archivo traía 150 — sin
 * un aviso, sin un error, sin nada. Quien lo abría creía tener el padrón
 * entero.
 *
 * Un archivo incompleto que PARECE completo es peor que no poder bajarlo:
 * lo que sale de acá se usa para decidir. Así que la descarga PAGINA hasta
 * traer todas las filas del filtro, y si no las consigue todas lo dice antes
 * de bajar nada.
 *
 * El orden lo pone el servidor —el mismo `orden`/`direccion` de la pantalla—
 * y paginar lo respeta: la fila 700 del archivo es la fila 700 de la tabla.
 */

const EXPORT_POR_PAGINA = 500;   // el tope que admite la ruta
const EXPORT_TECHO = 20000;      // más que eso no es una consulta, es un volcado

/** Todas las filas del filtro puesto, no solo la página visible. */
async function traerTodoElDirectorio(avisar) {
  const base = filtrosDir();
  delete base.limite;
  const filas = [];
  let total = null;
  for (let desde = 0; desde < EXPORT_TECHO; desde += EXPORT_POR_PAGINA) {
    const q = new URLSearchParams({ ...base, limite: EXPORT_POR_PAGINA, desde });
    const r = await api('/panel/directorio?' + q.toString());
    if (total === null) total = r.total ?? 0;
    filas.push(...(r.usuarios || []));
    if (avisar) avisar(filas.length, total);
    // Se corta por lo que DEVOLVIÓ, no por la cuenta: si el servidor manda
    // menos de una página, ya no hay más que pedir. Fiarse solo del total
    // deja el bucle girando cuando el total y las filas no cuadran.
    if (!r.usuarios || r.usuarios.length < EXPORT_POR_PAGINA) break;
  }
  return { filas, total: total ?? filas.length };
}

/** Las columnas del archivo. Las monedas se agregan al final, una por una. */
function columnasDirectorio(filas) {
  const monedas = [...new Set(filas.flatMap((u) => Object.keys(u.saldos || {})))].sort();
  const fijas = [
    ['Correo', (u) => u.email],
    ['Nombre', (u) => u.nombre || u.usuario || ''],
    ['App', (u) => u.app],
    ['País', (u) => u.pais || ''],
    ['Billetera', (u) => u.direccionWallet || ''],
    ['Genesis ID', (u) => u.gid || ''],
    ['Estado Genesis', (u) => u.estadoGenesis || ''],
    ['Alta', (u) => u.creadoEn || ''],
    ['Última conexión', (u) => u.ultimoAcceso || ''],
    // El total va como NÚMERO, no como texto: es lo primero que alguien
    // quiere sumar u ordenar apenas abre el archivo.
    ['Saldo total', (u) => Object.values(u.saldos || {}).reduce((s, x) => s + x, 0)],
  ];
  return [...fijas, ...monedas.map((m) => [m, (u) => (u.saldos || {})[m] || 0])];
}

/* ── Un .xlsx de verdad, sin librería ──────────────────────────────────────
 *
 * Un .xlsx es un ZIP con unos XML adentro. Se arma a mano —unas cien líneas—
 * y a cambio el archivo se abre en Excel con sus columnas, con los saldos
 * como NÚMEROS (se suman y se ordenan solos), con la cabecera fija y con el
 * filtro ya puesto.
 *
 * El CSV se queda y sigue estando: hay quien lo carga en otra cosa. Pero un
 * CSV no tiene tipos, así que un saldo entra como texto y en Excel hay que
 * arreglarlo a mano cada vez.
 */

function _crc32(bytes) {
  let c, tabla = _crc32.tabla;
  if (!tabla) {
    tabla = _crc32.tabla = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      c = i;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      tabla[i] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = tabla[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/** ZIP sin comprimir (método 0). Excel lo acepta igual y ahorra un deflate. */
function _zip(archivos) {
  const cod = new TextEncoder();
  const trozos = [], central = [];
  let desplazamiento = 0;
  const u16 = (v) => [v & 0xFF, (v >>> 8) & 0xFF];
  const u32 = (v) => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];
  for (const [nombre, texto] of archivos) {
    const cuerpo = cod.encode(texto), nom = cod.encode(nombre);
    const crc = _crc32(cuerpo);
    const cabecera = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(cuerpo.length),
      ...u32(cuerpo.length), ...u16(nom.length), ...u16(0)];
    trozos.push(new Uint8Array(cabecera), nom, cuerpo);
    central.push([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(cuerpo.length), ...u32(cuerpo.length),
      ...u16(nom.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
      ...u32(desplazamiento), ...Array.from(nom)]);
    desplazamiento += cabecera.length + nom.length + cuerpo.length;
  }
  const dir = central.flat();
  const fin = [...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(central.length),
    ...u16(central.length), ...u32(dir.length), ...u32(desplazamiento), ...u16(0)];
  return new Blob([...trozos, new Uint8Array(dir), new Uint8Array(fin)],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const _xmlEsc = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  // Excel rechaza el archivo ENTERO si aparece un carácter de control. Un
  // nombre pegado desde otro sistema puede traerlos sin que se vean.
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

const _letraCol = (i) => {
  let s = '';
  for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
};

/** Una hoja con la cabecera fija, el filtro puesto y los números como números. */
function _hoja(cabeceras, filas) {
  const ultima = _letraCol(cabeceras.length - 1);
  const celda = (v, col, fila) => {
    const ref = _letraCol(col) + fila;
    if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${_xmlEsc(v)}</t></is></c>`;
  };
  const cuerpo = filas.map((f, i) =>
    `<row r="${i + 2}">${f.map((v, c) => celda(v, c, i + 2)).join('')}</row>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${ultima}${filas.length + 1}"/>
<sheetViews><sheetView workbookViewId="0" tabSelected="1">
<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>
</sheetView></sheetViews>
<cols>${cabeceras.map((c, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${Math.min(42, Math.max(12, String(c).length + 4))}" customWidth="1"/>`).join('')}</cols>
<sheetData><row r="1">${cabeceras.map((c, i) =>
      `<c r="${_letraCol(i)}1" s="1" t="inlineStr"><is><t>${_xmlEsc(c)}</t></is></c>`).join('')}</row>${cuerpo}</sheetData>
<autoFilter ref="A1:${ultima}${filas.length + 1}"/>
</worksheet>`;
}

function _libro(nombreHoja, cabeceras, filas) {
  return _zip([
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${_xmlEsc(nombreHoja).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets>
</workbook>`],
    // Un solo estilo: la cabecera en negrita. Todo lo demás por omisión.
    ['xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>
<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="1"><fill><patternFill patternType="none"/></fill></fills>

<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`],
    ['xl/worksheets/sheet1.xml', _hoja(cabeceras, filas)],
  ]);
}

function _bajar(blob, nombre) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a);   // Firefox no dispara un <a> suelto
  a.click();
  a.remove();
  // Se revoca DESPUÉS: revocarlo en la misma vuelta cancela la descarga en
  // algunos navegadores antes de que llegue a empezar.
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/** Un nombre que dice qué filtro se usó, para no confundir dos bajadas. */
function _nombreExport(ext) {
  const partes = Object.entries(dirFiltros)
    .filter(([k, v]) => k !== 'orden' && k !== 'direccion' && v !== '' && v !== 'todas')
    .map(([k, v]) => `${k}-${String(v).replace(/[^\w.-]+/g, '')}`);
  const cola = partes.length ? '-' + partes.join('-').slice(0, 70) : '';
  return `directorio-${new Date().toISOString().slice(0, 10)}${cola}.${ext}`;
}

async function exportar(boton, formato) {
  const original = boton.textContent;
  const hermanos = boton.parentElement.querySelectorAll('button');
  hermanos.forEach((b) => { b.disabled = true; });
  try {
    boton.textContent = 'Juntando…';
    const { filas, total } = await traerTodoElDirectorio((hechas, t) => {
      boton.textContent = t > EXPORT_POR_PAGINA ? `Juntando ${hechas} de ${t}…` : 'Juntando…';
    });
    if (!filas.length) { alert('No hay nada que exportar con estos filtros.'); return; }
    // NO SE BAJA UN ARCHIVO INCOMPLETO SIN DECIRLO. Es exactamente el fallo
    // que se está arreglando: un padrón al que le faltan filas y nadie lo nota.
    if (filas.length < total) {
      const seguir = confirm(
        `El filtro da ${total} personas y solo se pudieron traer ${filas.length}.\n\n`
        + 'Si bajás esto, el archivo va INCOMPLETO. Mejor achicá el filtro y probá de nuevo.\n\n'
        + '¿Bajarlo igual?');
      if (!seguir) return;
    }
    const cols = columnasDirectorio(filas);
    const cab = cols.map(([t]) => t);
    const cuerpo = filas.map((u) => cols.map(([, saca]) => saca(u)));
    if (formato === 'xlsx') {
      _bajar(_libro('Directorio', cab, cuerpo), _nombreExport('xlsx'));
    } else {
      const esc2 = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lineas = [cab.map(esc2).join(','),
        ...cuerpo.map((f) => f.map(esc2).join(','))];
      // El BOM es para que Excel abra los acentos bien; sin él, «México» sale roto.
      _bajar(new Blob(['\uFEFF' + lineas.join('\r\n')],
        { type: 'text/csv;charset=utf-8' }), _nombreExport('csv'));
    }
  } catch (e) {
    alert('No se pudo armar la descarga: ' + (e.message || e)
      + '\n\nNo se bajó nada — mejor eso que un archivo a medias.');
  } finally {
    boton.textContent = original;
    hermanos.forEach((b) => { b.disabled = false; });
  }
}

async function refrescarSaldos(boton) {
  boton.disabled = true; boton.textContent = 'Consultando la cadena…';
  try {
    const r = await api('/panel/directorio/saldos', { method: 'POST' });
    boton.textContent = r.mensaje;
    /* Si el nodo contestó otra cadena no se tocó ni un saldo, y los números de
       la pantalla son los de antes. Sin este aviso, quien aprieta el botón ve
       los mismos números y concluye que la cadena está así — que es como el
       panel llegó a enseñar saldos de la cadena vieja durante días. */
    if (r.cadenaEquivocada) {
      alert('NO se actualizó ningún saldo: el nodo respondió una cadena distinta '
        + 'de la esperada. Lo que ves en pantalla es la lectura anterior.\n\n'
        + 'Revisá GENESIS_RPC_URL y cadenaCoincide en /healthz.');
    }
  } catch (e) { boton.textContent = e.message; }
  setTimeout(() => { boton.disabled = false; boton.textContent = 'Actualizar saldos'; }, 8000);
}

/* ─────────────────────────────────────────────────────────────────────────
   Conexiones: quién entró, cuándo, desde dónde y con qué billetera

   Es la pregunta que más se hace del panel y la que peor se respondía: había
   que ir al directorio, ordenar por último acceso y adivinar la plataforma.
   Aquí sale directa, ordenada por lo más reciente, con el correo entero y la
   billetera — que es lo que ata a la persona con la cadena.

   El nombre sale de cruzar el padrón con la huella de telemetría, que es
   anónima. Quien no esté en el padrón sale como «sin identificar»: en una
   pantalla que se usa para decidir a quién llamar, adivinar es peor que no
   saber.
   ───────────────────────────────────────────────────────────────────────── */

function haceCuanto(iso) {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  if (!Number.isFinite(ms)) return null;
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.floor(h / 24)} d`;
}

/** Verde si entró en la última hora: la señal de «está dentro ahora». */
function claseFrescura(iso) {
  if (!iso) return 'mut';
  const min = (Date.now() - new Date(iso).getTime()) / 60000;
  if (min < 60) return 'ok';
  if (min < 60 * 24) return 'cyan';
  if (min < 60 * 24 * 7) return 'warn';
  return 'mut';
}

  conexPlataforma = v;

}

        </tbody></table></div>
      <h2 style="margin:18px 16px 4px">Operadores</h2>
      <div class="scroll"><table style="min-width:420px">
        <thead><tr><th>Operador</th><th>Rol</th><th>Estado</th></tr></thead>
        <tbody>${(d.operadores || []).map((o) => `<tr>
          <td>${esc(o.nombre)}<div style="font-size:11px;color:var(--faint)">${esc(o.email)}</div></td>
          <td><span class="eti gold">${esc(o.rol)}</span></td>
          <td><span class="eti ${o.activo ? 'ok' : 'mut'}">${o.activo ? 'activo' : 'inactivo'}</span></td>
          </tr>`).join('')}
        </tbody></table></div>
    </div>
  </div>

  <div class="rejilla dos" style="margin-top:14px">
    <div class="tarjeta p">
      <h2 style="margin-top:0">Actividad por operador</h2>
      <table style="min-width:0"><tbody>${(d.porActor || []).slice(0, 10).map((x) =>
        filaBarra(esc(x.clave), x.n, d.porActor[0].n)).join('')}</tbody></table>
    </div>
    <div class="tarjeta p">
      <h2 style="margin-top:0">Acciones más frecuentes</h2>
      <table style="min-width:0"><tbody>${(d.porAccion || []).map((x) =>
        filaBarra(esc(x.clave), x.n, d.porAccion[0].n)).join('')}</tbody></table>
    </div>
  </div>
  <p class="pie">Todo esto sale de la bitácora encadenada de Genesis ID: cada
  entrada lleva el hash de la anterior, así que borrar o alterar una vieja rompe
  la cadena y se nota.</p>`;
}

function vistaSalud(d) {
  const s = d.servicios || [];
  const caidos = s.filter((x) => x.estado === 'caido').length;
  const et = { arriba: 'ok', degradado: 'warn', caido: 'crit' };
  return `
  <div class="kpis">
    ${kpi('Servicios vigilados', n(s.length), '')}
    ${kpi('Arriba', n(s.filter((x) => x.estado === 'arriba').length), 'o')}
    ${kpi('Degradados', n(s.filter((x) => x.estado === 'degradado').length), 'w')}
    ${kpi('Caídos', n(caidos), caidos ? 'b' : 'o')}
    ${kpi('Almacén de telemetría', d.almacenTelemetria === 'mongodb' ? 'MongoDB' : 'Memoria',
      d.almacenTelemetria === 'mongodb' ? 'o' : 'w',
      `<div class="d">retiene ${d.retencionDias} días</div>`)}
  </div>
  <h2>Estado de los servicios <span class="pista">medido ahora, con caché de 45 s</span></h2>
  <div class="tarjeta scroll"><table>
    <thead><tr><th>Servicio</th><th>Estado</th><th>Código</th><th>Respuesta</th><th>Dirección</th></tr></thead>
    <tbody>${s.map((x) => `<tr>
      <td><b>${esc(x.nombre)}</b>${x.detalle ? `<div style="font-size:11.5px;color:var(--bad)">${esc(x.detalle)}</div>` : ''}</td>
      <td><span class="eti ${et[x.estado]}">${esc(x.estado)}</span></td>
      <td class="num">${x.codigo ?? '—'}</td>
      <td class="num" style="color:${x.ms > 3000 ? 'var(--warn)' : 'var(--mut)'}">${n(x.ms)} ms</td>
      <td style="font-size:11.5px;color:var(--faint);max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(x.url)}</td>
      </tr>`).join('')}
    </tbody></table></div>
  <p class="pie">Se puede cambiar qué se vigila sin tocar código, con la variable
  <code>GENESIS_SERVICIOS</code>: <code>clave|nombre|url,clave|nombre|url</code>.</p>`;
}

/* ─────────────────────────────────────────────────────────────────────────
   Detalle de un error
   ───────────────────────────────────────────────────────────────────────── */

async function verError(huella) {
  let d;
  try {
    d = await api('/panel/analitica/errores/' + encodeURIComponent(huella));
  } catch (e) { alert(e.message); return; }

  const maxSerie = Math.max(1, ...d.serie.map((x) => x.n));
  const puedeGestionar = yo && (yo.permisos.includes('*') || yo.permisos.includes('analitica.gestionar'));

  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.onclick = (ev) => { if (ev.target === velo) velo.remove(); };
  velo.innerHTML = `<div class="modal">
    <h3>${esc(d.titulo)}</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px">
      <span class="eti ${d.gravedad === 'critico' ? 'crit' : 'bad'}">${esc(d.gravedad)}</span>
      <span class="eti mut">${esc(d.app)}</span>
      <span class="eti cyan">${esc(d.estado)}</span>
      <span class="eti gold">${n(d.total)} veces</span>
      <span class="eti mut">${n(d.usuarios)} personas</span>
    </div>

    <div class="rejilla dos" style="margin-bottom:14px">
      <div><h3>Cuándo pasó</h3>${grafBarras(d.serie.map((x) => fechaCorta(x.dia)), d.serie.map((x) => x.n), '#F0776B', 130, 460)}</div>
      <div>
        <h3>Dónde</h3>
        <div style="font-size:12.5px;line-height:1.9">
          <div><span style="color:var(--faint)">Versiones:</span> ${d.versiones.map(esc).join(', ') || '—'}</div>
          <div><span style="color:var(--faint)">Plataformas:</span> ${d.plataformas.map(esc).join(', ') || '—'}</div>
          <div><span style="color:var(--faint)">Rutas:</span> ${(d.rutas || []).slice(0, 4).map(esc).join(', ') || '—'}</div>
          <div><span style="color:var(--faint)">Primera vez:</span> ${cuando(d.primera)}</div>
          <div><span style="color:var(--faint)">Última vez:</span> ${cuando(d.ultima)}</div>
          ${d.resueltaEn ? `<div style="color:var(--ok)">Resuelto por ${esc(d.resueltaPor)} ${cuando(d.resueltaEn)}${d.resueltaEnVersion ? ' en ' + esc(d.resueltaEnVersion) : ''}</div>` : ''}
          ${d.nota ? `<div style="margin-top:6px;color:var(--mut)"><b>Nota:</b> ${esc(d.nota)}</div>` : ''}
        </div>
      </div>
    </div>

    <h3>Mensaje</h3>
    <pre class="pila">${esc(d.mensaje)}</pre>
    ${d.pila ? `<h3>Pila</h3><pre class="pila">${esc(d.pila)}</pre>` : ''}

    <h3>Últimas veces que ocurrió</h3>
    <div class="scroll"><table style="min-width:0">
      <thead><tr><th>Cuándo</th><th>Versión</th><th>Mensaje</th></tr></thead>
      <tbody>${d.muestras.map((m) => `<tr>
        <td style="white-space:nowrap;font-size:12px;color:var(--faint)">${cuando(m.en)}</td>
        <td class="num" style="font-size:12px">${esc(m.version)}</td>
        <td style="font-size:12px;color:var(--mut)">${esc(String(m.mensaje).slice(0, 160))}</td>
        </tr>`).join('')}
      </tbody></table></div>

    ${puedeGestionar ? `
      <h3 style="margin-top:18px">Resolver</h3>
      <input id="notaErr" placeholder="Qué se hizo, o por qué se ignora (obligatorio para cerrar)">
      <input id="verErr" placeholder="Versión en la que queda arreglado — p. ej. 1.4.0" style="margin-top:8px">
      <div class="filaBtn">
        <button class="ok" onclick="cambiarError('${esc(d.huella)}','resuelto')">Marcar resuelto</button>
        <button onclick="cambiarError('${esc(d.huella)}','visto')">Visto, en curso</button>
        <button class="bad" onclick="cambiarError('${esc(d.huella)}','ignorado')">Ignorar</button>
        <button class="g" onclick="this.closest('.velo').remove()">Cerrar</button>
      </div>
      <p style="margin-top:10px;color:var(--faint);font-size:11.5px">
        Al resolver, anotá la versión: si el mismo error vuelve en una versión
        posterior, el panel lo marca <b>reabierto</b> solo. Si vuelve en una
        anterior, es alguien con la app vieja y no molesta.</p>
    ` : `<div class="filaBtn"><button class="g" onclick="this.closest('.velo').remove()">Cerrar</button></div>`}
  </div>`;
  document.body.appendChild(velo);
}

async function cambiarError(huella, estado) {
  const nota = document.getElementById('notaErr')?.value || '';
  const version = document.getElementById('verErr')?.value || '';
  try {
    await api(`/panel/analitica/errores/${encodeURIComponent(huella)}/estado`, {
      method: 'POST',
      body: JSON.stringify({ estado, nota, version }),
    });
    document.querySelector('.velo')?.remove();
    pintar(true);
  } catch (e) { alert(e.message); }
}

/* ─────────────────────────────────────────────────────────────────────────
   Arranque
   ───────────────────────────────────────────────────────────────────────── */

function pintarNav(pendientes = 0) {
  document.getElementById('nav').innerHTML = PESTANAS.map(([k, t]) =>
    `<button class="${k === pestana ? 'sel' : ''}" onclick="irA('${k}')">${t}${
      k === 'errores' && pendientes ? `<span class="pip">${pendientes}</span>` : ''}</button>`).join('');
}

function irA(k) {
  pestana = k;
  pintarNav();
  pintar();
  // «Conexiones» se refresca sola cada 30 s, y SOLO mientras se está mirando.
  // Un temporizador que sigue corriendo en otra pestaña gasta consultas y, lo
  // peor, repinta por debajo lo que el operador está leyendo.
  clearInterval(conexReloj);
  conexReloj = null;
  if (k === 'conexiones') {
    conexReloj = setInterval(() => {
      if (pestana === 'conexiones' && !cargando && !document.hidden) pintar(true);
    }, 30000);
  }
}

async function arrancar() {
  document.getElementById('entrada').classList.add('oculto');
  document.getElementById('app').classList.remove('oculto');
  document.getElementById('quien').textContent = yo ? yo.rol : '';

  // Las apps del selector salen de lo que de verdad reportó, no de una lista
  // fija: una app nueva aparece sola sin tocar nada aquí.
  try {
    const { apps } = await api('/panel/analitica/apps?dias=90');
    const sel = document.getElementById('filtroApp');
    sel.innerHTML = '<option value="todas">Todas las apps</option>' +
      apps.map((a) => `<option value="${esc(a.app)}">${esc(a.app)}</option>`).join('');
  } catch { /* sin apps todavía: el selector se queda con «todas» */ }

  // El contador rojo de la pestaña de errores: lo primero que hay que ver.
  let pendientes = 0;
  try {
    const { errores } = await api('/panel/analitica/errores?limite=300');
    pendientes = errores.filter((e) => e.estado === 'nuevo' || e.estado === 'reabierto').length;
  } catch { /* da igual, el contador es un lujo */ }

  pintarNav(pendientes);
  pintar();
}

(async function inicio() {
  if (!sesion) return;
  try {
    const r = await api('/sesion/yo');
    yo = r.operador;
    arrancar();
  } catch { salir(); }
})();
</script>
