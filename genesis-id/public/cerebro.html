<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orden Global · El cerebro</title>
<style>
:root{
  --bg:#02090f; --panel:rgba(8,26,34,.86); --linea:rgba(201,169,97,.22);
  --linea2:rgba(201,169,97,.14); --oro:#C9A961; --oroLt:#EAD79C; --oroHi:#F8EFCF;
  --cyan:#4FD8E0; --txt:#F1EAD6; --mut:#9BB6B2; --faint:#5d7d7a;
  --ok:#3ED9A0; --warn:#F5B62E; --bad:#F0776B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* El lienzo ocupa todo; los paneles flotan encima. */
#lienzo{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#lienzo.arrastrando{cursor:grabbing}

/* ── barra superior ─────────────────────────────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:linear-gradient(180deg,rgba(2,9,15,.94),rgba(2,9,15,0));
  pointer-events:none;
}
header > *{pointer-events:auto}
.marca b{font-size:15px;letter-spacing:.01em;display:block}
.marca span{font-size:9.5px;color:var(--faint);letter-spacing:.2em;text-transform:uppercase}
.marca b em{font-style:italic;color:var(--oro)}
.vivo{
  display:flex;align-items:center;gap:7px;margin-left:auto;
  background:var(--panel);border:1px solid var(--linea);border-radius:999px;
  padding:6px 13px;font-size:11.5px;backdrop-filter:blur(8px);
}
.pulso{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);animation:latir 2s ease-in-out infinite}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.3}}
.vivo.malo .pulso{background:var(--bad);box-shadow:0 0 8px var(--bad)}
#buscar{
  background:var(--panel);border:1px solid var(--linea);border-radius:999px;
  color:var(--txt);padding:7px 15px;width:190px;font-size:12.5px;backdrop-filter:blur(8px);
}
#buscar::placeholder{color:var(--faint)}
#buscar:focus{outline:none;border-color:var(--oro)}

/* ── panel de grupos (izquierda) ────────────────────────────────────────── */
#grupos{
  position:fixed;left:14px;top:64px;z-index:9;width:196px;
  background:var(--panel);border:1px solid var(--linea);border-radius:14px;
  padding:12px;backdrop-filter:blur(10px);max-height:calc(100vh - 150px);overflow-y:auto;
}
#grupos h3{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--oro);margin-bottom:9px;font-weight:700}
.grupo{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px;
  cursor:pointer;font-size:12px;user-select:none}
.grupo:hover{background:rgba(255,255,255,.05)}
.grupo.off{opacity:.34}
.punto{width:10px;height:10px;border-radius:50%;flex:none}
.grupo .n{color:var(--faint);font-size:10.5px;margin-left:auto}

/* ── ficha del nodo (derecha) ───────────────────────────────────────────── */
#ficha{
  position:fixed;right:14px;top:64px;z-index:9;width:330px;max-width:calc(100vw - 28px);
  background:var(--panel);border:1px solid var(--linea);border-radius:14px;
  padding:16px;backdrop-filter:blur(10px);max-height:calc(100vh - 150px);overflow-y:auto;
  transform:translateX(calc(100% + 20px));transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
#ficha.abierta{transform:none}
#ficha .cerrar{position:absolute;top:12px;right:13px;color:var(--mut);font-size:17px;line-height:1}
#ficha .tipo{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
#ficha h2{font-size:17px;margin:5px 0 9px;padding-right:22px;line-height:1.25}
#ficha p{font-size:12.5px;line-height:1.65;color:var(--mut)}
#ficha .datos{margin-top:13px;display:grid;gap:7px}
#ficha .dato{display:flex;justify-content:space-between;gap:12px;font-size:12px;
  padding-top:7px;border-top:1px solid rgba(255,255,255,.06)}
#ficha .dato span:first-child{color:var(--faint)}
#ficha .dato span:last-child{text-align:right;font-weight:600}
#ficha h4{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--oro);margin:15px 0 8px;font-weight:700}
.vecino{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;cursor:pointer}
.vecino:hover .vn{color:var(--oroHi);text-decoration:underline}
.vecino .vd{color:var(--faint);font-size:10.5px;margin-left:auto;text-align:right;max-width:44%}

/* ── controles (abajo) ──────────────────────────────────────────────────── */
#pie{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;
  display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--linea);border-radius:999px;padding:6px;backdrop-filter:blur(10px);
}
#pie button{padding:7px 13px;border-radius:999px;font-size:11.5px;color:var(--mut)}
#pie button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
#pie button.on{background:rgba(201,169,97,.18);color:var(--oro)}
#pie .sep{width:1px;height:18px;background:var(--linea2)}

#ayuda{
  position:fixed;left:14px;bottom:16px;z-index:9;font-size:10.5px;color:var(--faint);
  line-height:1.7;max-width:190px;
}
#ayuda b{color:var(--mut)}

@media(max-width:820px){
  #grupos{display:none}
  #grupos.movil{display:block;top:60px;left:14px;right:14px;width:auto;max-height:38vh}
  #ficha{right:0;left:0;bottom:0;top:auto;width:auto;max-width:none;border-radius:16px 16px 0 0;
    max-height:56vh;transform:translateY(calc(100% + 20px))}
  #ficha.abierta{transform:none}
  #ayuda{display:none}
  #buscar{width:120px}
  .marca span{display:none}
}
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<header>
  <div class="marca">
    <b>orden <em>global</em></b>
    <span>el cerebro del ecosistema</span>
  </div>
  <input id="buscar" placeholder="Buscar…" autocomplete="off" spellcheck="false">
  <div class="vivo" id="vivo"><span class="pulso"></span><span id="vivoTxt">conectando…</span></div>
</header>

<aside id="grupos"><h3>Capas</h3><div id="listaGrupos"></div></aside>

<aside id="ficha">
  <button class="cerrar" onclick="cerrarFicha()">✕</button>
  <div class="tipo" id="fTipo"></div>
  <h2 id="fNombre"></h2>
  <p id="fDesc"></p>
  <div class="datos" id="fDatos"></div>
  <div id="fVecinos"></div>
</aside>

<div id="pie">
  <button id="bGirar" class="on" onclick="alternarGiro()">Girar</button>
  <div class="sep"></div>
  <button onclick="centrar()">Centrar</button>
  <button onclick="reorganizar()">Reordenar</button>
  <div class="sep"></div>
  <button id="bCapas" onclick="alternarCapas()">Capas</button>
</div>

<div id="ayuda">
  <b>Arrastrar</b> gira el cerebro<br>
  <b>Rueda</b> acerca y aleja<br>
  <b>Clic</b> en un nodo lo abre<br>
  <b>Arrastrar un nodo</b> lo mueve
</div>

<script type="module">
import { GRUPOS, NODOS, ENLACES } from './cerebro-datos.js';

// ═══════════════════════════════════════════════════════════════════════════
// EL CEREBRO
//
// Un grafo del ecosistema entero, en tres dimensiones, movible.
//
// POR QUE ESCRITO A MANO Y NO CON UNA LIBRERIA
//
// Las librerías de grafos 3D pesan cientos de kilobytes y traen un motor
// completo de escena para resolver lo que aquí son tres cosas: separar nodos
// que se solapan, juntar los que están unidos, y proyectar el resultado a la
// pantalla. Escritas a mano son unas doscientas líneas, se entienden enteras y
// no hay que pelearse con el modelo de nadie para cambiar cómo se ve algo.
//
// EL ORDEN EN QUE PASAN LAS COSAS
//
//   1. cada nodo arranca en una esfera al azar (semilla fija: el mismo dibujo
//      cada vez, que es lo que permite reconocer «el racimo de la izquierda»);
//   2. la física los separa y los junta hasta que se estabiliza;
//   3. se rota el conjunto entero según cómo lo haya girado quien mira;
//   4. se proyecta con perspectiva y se dibuja de atrás hacia adelante.
// ═══════════════════════════════════════════════════════════════════════════

const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── el mundo ───────────────────────────────────────────────────────────────
const porId = new Map();
const nodos = NODOS.map((base, i) => {
  // Semilla fija en vez de Math.random: el cerebro tiene que salir IGUAL cada
  // vez que se abre. Un mapa que se redibuja distinto cada carga no se puede
  // memorizar, y memorizarlo es justo para lo que sirve.
  const s = (n) => { const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return x - Math.floor(x); };
  const r = 260 + s(1) * 90, th = s(2) * Math.PI * 2, ph = Math.acos(2 * s(3) - 1);
  const n = {
    ...base, peso: base.peso || 1,
    x: r * Math.sin(ph) * Math.cos(th), y: r * Math.sin(ph) * Math.sin(th), z: r * Math.cos(ph),
    vx: 0, vy: 0, vz: 0, grado: 0, fijo: false,
  };
  porId.set(n.id, n);
  return n;
});

const enlaces = [];
for (const [a, b, etiqueta, fuerte] of ENLACES) {
  const na = porId.get(a), nb = porId.get(b);
  if (!na || !nb) { console.warn('enlace a un nodo que no existe:', a, '→', b); continue; }
  enlaces.push({ a: na, b: nb, etiqueta, fuerte: Boolean(fuerte) });
  na.grado++; nb.grado++;
}

// El tamaño mezcla la importancia declarada con cuántas cosas dependen de él:
// un nodo del que cuelga medio ecosistema tiene que verse aunque nadie le haya
// puesto peso a mano.
for (const n of nodos) n.radio = 3.4 + n.peso * 2.6 + Math.min(6, Math.sqrt(n.grado) * 1.5);

// ── estado de la vista ─────────────────────────────────────────────────────
const vista = {
  giroY: 0.5, giroX: -0.22, zoom: 1, autoGiro: !quieto,
  centroX: 0, centroY: 0, dpr: Math.min(2, devicePixelRatio || 1),
};
let sel = null, resaltados = null, capasOcultas = new Set();
let arrastrando = null, arrastreVista = null, movio = false;

// ── física ─────────────────────────────────────────────────────────────────
//
// Tres fuerzas y nada más:
//   repulsión — todos se empujan, para que no se amontonen;
//   resorte  — los unidos se atraen, para que lo relacionado quede junto;
//   centro   — un tirón suave al origen, para que no se escape al infinito.
//
// El amortiguado hace que se calme solo. Sin él, el grafo late para siempre y
// marea a quien lo mira.
let energia = 1;
function fisica() {
  const REP = 5400, RESORTE = 0.0072, LARGO = 78, CENTRO = 0.0016, AMORT = 0.86;

  for (let i = 0; i < nodos.length; i++) {
    const a = nodos[i];
    for (let j = i + 1; j < nodos.length; j++) {
      const b = nodos[j];
      let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
      let d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < 1) { d2 = 1; dx = (i - j) || 1; }
      const d = Math.sqrt(d2);
      // La repulsión crece con el tamaño: los nodos grandes necesitan más aire
      // alrededor o sus etiquetas se pisan.
      const f = (REP * (0.5 + a.peso * 0.25) * (0.5 + b.peso * 0.25)) / d2;
      const ux = dx / d, uy = dy / d, uz = dz / d;
      a.vx += ux * f; a.vy += uy * f; a.vz += uz * f;
      b.vx -= ux * f; b.vy -= uy * f; b.vz -= uz * f;
    }
  }

  for (const e of enlaces) {
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, dz = e.b.z - e.a.z;
    const d = Math.hypot(dx, dy, dz) || 1;
    const f = (d - LARGO) * RESORTE * (e.fuerte ? 1.7 : 1);
    const ux = dx / d, uy = dy / d, uz = dz / d;
    e.a.vx += ux * f; e.a.vy += uy * f; e.a.vz += uz * f;
    e.b.vx -= ux * f; e.b.vy -= uy * f; e.b.vz -= uz * f;
  }

  // Un tirón suave hacia el centro de su propia capa.
  //
  // Sin esto el grafo sale correcto pero uniforme: una nube de colores
  // mezclados donde no se distingue nada de un vistazo. Con esto, cada capa
  // —los tokens, los nodos, la seguridad— se junta en su racimo y el cerebro
  // pasa a leerse por zonas, que es de lo que sirve mirarlo. Es flojo a
  // propósito: si tirara más, rompería las conexiones reales entre capas, que
  // son lo que de verdad cuenta la historia.
  const centros = {};
  for (const n of nodos) {
    const c = centros[n.g] || (centros[n.g] = { x: 0, y: 0, z: 0, n: 0 });
    c.x += n.x; c.y += n.y; c.z += n.z; c.n++;
  }
  const CAPA = 0.010;
  for (const n of nodos) {
    const c = centros[n.g];
    if (!c || c.n < 2) continue;
    n.vx += (c.x / c.n - n.x) * CAPA;
    n.vy += (c.y / c.n - n.y) * CAPA;
    n.vz += (c.z / c.n - n.z) * CAPA;
  }

  let mov = 0;
  for (const n of nodos) {
    if (n.fijo) { n.vx = n.vy = n.vz = 0; continue; }
    n.vx -= n.x * CENTRO; n.vy -= n.y * CENTRO; n.vz -= n.z * CENTRO;
    n.vx *= AMORT; n.vy *= AMORT; n.vz *= AMORT;
    n.x += n.vx * energia; n.y += n.vy * energia; n.z += n.vz * energia;
    mov += Math.abs(n.vx) + Math.abs(n.vy) + Math.abs(n.vz);
  }
  // Se enfría sola. Cuando ya casi no se mueve, deja de calcularse: sin esto
  // el ventilador del teléfono no para nunca.
  if (mov / nodos.length < 0.6) energia *= 0.94;
  return mov / nodos.length;
}

// Se resuelve casi entera antes del primer dibujo: ver un grafo explotando
// desde el centro es bonito una vez y molesto las cien siguientes.
for (let i = 0; i < 320; i++) fisica();

/**
 * Ajusta el acercamiento para que el cerebro ENTERO quepa en la pantalla.
 *
 * Sin esto, el grafo salía cortado por los bordes: había que alejar a mano
 * antes de poder ver nada, y en un teléfono ni eso. Se calcula sobre el radio
 * real de la nube de nodos, así que funciona igual con noventa piezas que con
 * trescientas el día que el ecosistema crezca.
 */
function encajar() {
  let r = 0;
  for (const n of nodos) r = Math.max(r, Math.hypot(n.x, n.y, n.z));
  const menor = Math.min(lienzo.clientWidth || innerWidth, lienzo.clientHeight || innerHeight);
  // 0.42 deja un margen para las etiquetas, que sobresalen del punto.
  vista.zoom = Math.max(0.35, Math.min(2.2, (menor * 0.42) / (r || 1)));
  vista.centroX = 0; vista.centroY = 0;
}

// ── proyección ─────────────────────────────────────────────────────────────
const DIST = 1150;
function proyectar(n) {
  const cy = Math.cos(vista.giroY), sy = Math.sin(vista.giroY);
  const cx = Math.cos(vista.giroX), sx = Math.sin(vista.giroX);
  // Giro sobre Y y luego sobre X. En ese orden se comporta como una bola que
  // se hace rodar con el dedo, que es lo que espera la mano.
  const x1 = n.x * cy + n.z * sy;
  const z1 = -n.x * sy + n.z * cy;
  const y1 = n.y * cx - z1 * sx;
  const z2 = n.y * sx + z1 * cx;
  const esc = (DIST / (DIST + z2)) * vista.zoom;
  return {
    px: lienzo.clientWidth / 2 + x1 * esc + vista.centroX,
    py: lienzo.clientHeight / 2 + y1 * esc + vista.centroY,
    esc, z: z2,
  };
}

// ── dibujo ─────────────────────────────────────────────────────────────────
function dibujar() {
  const A = lienzo.clientWidth, H = lienzo.clientHeight;
  ctx.setTransform(vista.dpr, 0, 0, vista.dpr, 0, 0);
  ctx.clearRect(0, 0, A, H);

  for (const n of nodos) { const p = proyectar(n); n.px = p.px; n.py = p.py; n.pesc = p.esc; n.pz = p.z; }

  const visible = (n) => !capasOcultas.has(n.g);
  const activo = (n) => !resaltados || resaltados.has(n.id);

  // Enlaces primero, de atrás hacia adelante.
  const ord = enlaces.filter((e) => visible(e.a) && visible(e.b))
    .sort((p, q) => (q.a.pz + q.b.pz) - (p.a.pz + p.b.pz));
  for (const e of ord) {
    const vivo = activo(e.a) && activo(e.b);
    const prof = Math.max(0, Math.min(1, (e.a.pesc + e.b.pesc) / 2 / vista.zoom));
    ctx.globalAlpha = (vivo ? 0.5 : 0.06) * (0.25 + prof * 0.75);
    ctx.strokeStyle = e.fuerte ? '#C9A961' : '#3f6a72';
    ctx.lineWidth = (e.fuerte ? 1.5 : 0.85) * prof;
    ctx.beginPath(); ctx.moveTo(e.a.px, e.a.py); ctx.lineTo(e.b.px, e.b.py); ctx.stroke();
  }

  // Nodos, también de atrás hacia adelante para que la perspectiva se sostenga.
  const nord = nodos.filter(visible).sort((p, q) => q.pz - p.pz);
  for (const n of nord) {
    const vivo = activo(n);
    const prof = Math.max(0.18, Math.min(1.25, n.pesc / vista.zoom));
    const r = Math.max(1.6, n.radio * n.pesc);
    const color = GRUPOS[n.g]?.color || '#888';

    ctx.globalAlpha = vivo ? 1 : 0.12;

    // Halo de los que están en primer plano: da la sensación de profundidad
    // sin necesidad de sombras de verdad.
    if (prof > 0.85 && vivo) {
      ctx.globalAlpha = vivo ? 0.16 : 0.04;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(n.px, n.py, r * 2.5, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(n.px, n.py, r, 0, 7); ctx.fill();

    if (n === sel) {
      ctx.strokeStyle = '#F8EFCF'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.px, n.py, r + 5, 0, 7); ctx.stroke();
    }

    // La etiqueta solo cuando de verdad aporta.
    //
    // Con noventa nombres a la vez el cerebro deja de leerse: se convierte en
    // una mancha de texto pisado. Se enseñan tres casos y ninguno más — lo
    // seleccionado y sus vecinos (que es lo que se está mirando), los nodos
    // importantes que están al frente, y todo cuando ya se acercó lo bastante
    // como para que quepan.
    const enfoco = n === sel || (resaltados && resaltados.has(n.id));
    const importante = n.radio > 11 && prof > 0.92;
    if (vivo && (enfoco || importante || vista.zoom > 1.9) && prof > 0.6) {
      ctx.globalAlpha = enfoco ? 1 : Math.min(0.92, (prof - 0.55) * 3);
      ctx.fillStyle = n === sel ? '#F8EFCF' : enfoco ? '#e8dcc4' : '#a9c2be';
      ctx.font = `${enfoco ? 600 : 400} ${Math.max(9.5, Math.min(13, 10.5 * prof))}px system-ui,sans-serif`;
      ctx.textAlign = 'center';
      // Un trazo oscuro detrás: sobre una zona con muchos nodos, el texto sin
      // contorno se pierde encima de los círculos de colores.
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,9,15,.85)';
      ctx.strokeText(n.n, n.px, n.py + r + 12);
      ctx.fillText(n.n, n.px, n.py + r + 12);
    }
  }
  ctx.globalAlpha = 1;
}

// ── bucle ──────────────────────────────────────────────────────────────────
let ultimo = 0;
function bucle(t) {
  requestAnimationFrame(bucle);
  if (t - ultimo < 16) return;
  ultimo = t;
  if (energia > 0.02) fisica();
  if (vista.autoGiro && !arrastrando && !arrastreVista) vista.giroY += 0.0016;
  dibujar();
}

// ── interacción ────────────────────────────────────────────────────────────
function tamano() {
  const A = innerWidth, H = innerHeight;
  lienzo.width = A * vista.dpr; lienzo.height = H * vista.dpr;
  lienzo.style.width = A + 'px'; lienzo.style.height = H + 'px';
  dibujar();
}
addEventListener('resize', () => { tamano(); encajar(); });

const bajo = (x, y) => {
  let mejor = null, mejorD = 26;
  for (const n of nodos) {
    if (capasOcultas.has(n.g)) continue;
    const d = Math.hypot(n.px - x, n.py - y);
    const r = Math.max(9, n.radio * n.pesc + 7);
    if (d < r && d < mejorD + r) { mejor = n; mejorD = d; }
  }
  return mejor;
};

function pos(e) {
  const t = e.touches?.[0] || e.changedTouches?.[0] || e;
  const c = lienzo.getBoundingClientRect();
  return { x: t.clientX - c.left, y: t.clientY - c.top };
}

function empezar(e) {
  const { x, y } = pos(e);
  const n = bajo(x, y);
  movio = false;
  if (n) { arrastrando = { n, x, y }; n.fijo = true; }
  else { arrastreVista = { x, y, gy: vista.giroY, gx: vista.giroX }; lienzo.classList.add('arrastrando'); }
}

function mover(e) {
  const { x, y } = pos(e);
  if (arrastrando) {
    e.preventDefault();
    movio = true;
    const n = arrastrando.n;
    // Se mueve en el plano de la pantalla, deshaciendo el giro: arrastrar
    // hacia la derecha tiene que llevar el nodo a la derecha aunque el cerebro
    // esté girado, o se vuelve imposible de manejar.
    const dx = (x - arrastrando.x) / n.pesc, dy = (y - arrastrando.y) / n.pesc;
    const cy = Math.cos(-vista.giroY), sy = Math.sin(-vista.giroY);
    const cx = Math.cos(-vista.giroX), sx = Math.sin(-vista.giroX);
    const my = dy * cx, mz = -dy * sx;
    n.x += dx * cy + mz * sy; n.y += my; n.z += -dx * sy + mz * cy;
    arrastrando.x = x; arrastrando.y = y;
    energia = Math.max(energia, 0.35);
  } else if (arrastreVista) {
    e.preventDefault();
    if (Math.abs(x - arrastreVista.x) + Math.abs(y - arrastreVista.y) > 4) movio = true;
    vista.giroY = arrastreVista.gy + (x - arrastreVista.x) * 0.0062;
    vista.giroX = Math.max(-1.35, Math.min(1.35, arrastreVista.gx + (y - arrastreVista.y) * 0.0062));
  }
}

function soltar(e) {
  if (arrastrando && !movio) abrir(arrastrando.n);
  else if (arrastreVista && !movio) { const { x, y } = pos(e); if (!bajo(x, y)) cerrarFicha(); }
  if (arrastrando) arrastrando.n.fijo = false;
  arrastrando = null; arrastreVista = null;
  lienzo.classList.remove('arrastrando');
}

lienzo.addEventListener('mousedown', empezar);
addEventListener('mousemove', mover);
addEventListener('mouseup', soltar);
lienzo.addEventListener('touchstart', empezar, { passive: true });
lienzo.addEventListener('touchmove', mover, { passive: false });
lienzo.addEventListener('touchend', soltar);

lienzo.addEventListener('wheel', (e) => {
  e.preventDefault();
  vista.zoom = Math.max(0.3, Math.min(4, vista.zoom * (e.deltaY > 0 ? 0.9 : 1.11)));
}, { passive: false });

// Pellizco para acercar en el teléfono.
let pellizco = null;
lienzo.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pellizco = { d: dist2(e), z: vista.zoom };
    arrastrando = null; arrastreVista = null;
  }
}, { passive: true });
lienzo.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pellizco) {
    e.preventDefault();
    vista.zoom = Math.max(0.3, Math.min(4, pellizco.z * (dist2(e) / pellizco.d)));
  }
}, { passive: false });
lienzo.addEventListener('touchend', () => { if (pellizco) pellizco = null; });
const dist2 = (e) => Math.hypot(
  e.touches[0].clientX - e.touches[1].clientX,
  e.touches[0].clientY - e.touches[1].clientY);

// ── la ficha ───────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function abrir(n) {
  sel = n;
  // Al abrir uno, el resto se apaga: lo que importa de un grafo no es el nodo
  // sino con qué está conectado, y eso solo se ve si lo demás se aparta.
  resaltados = new Set([n.id]);
  const vecinos = [];
  for (const e of enlaces) {
    if (e.a === n) { resaltados.add(e.b.id); vecinos.push({ n: e.b, t: e.etiqueta, dir: '→' }); }
    else if (e.b === n) { resaltados.add(e.a.id); vecinos.push({ n: e.a, t: e.etiqueta, dir: '←' }); }
  }
  const g = GRUPOS[n.g] || { nombre: n.g, color: '#888' };
  document.getElementById('fTipo').textContent = g.nombre;
  document.getElementById('fTipo').style.color = g.color;
  document.getElementById('fNombre').textContent = n.n;
  document.getElementById('fDesc').textContent = n.d || '';

  const datos = [];
  const v = n.vivo && enVivo[n.vivo];
  if (v) for (const [k, val] of Object.entries(v)) datos.push(`<div class="dato"><span>${esc(k)}</span><span>${esc(val)}</span></div>`);
  datos.push(`<div class="dato"><span>Conexiones</span><span class="num">${n.grado}</span></div>`);
  document.getElementById('fDatos').innerHTML = datos.join('');

  document.getElementById('fVecinos').innerHTML = vecinos.length
    ? `<h4>Conectado con (${vecinos.length})</h4>` + vecinos.map((x) =>
        `<div class="vecino" data-ir="${esc(x.n.id)}">
           <span class="punto" style="background:${GRUPOS[x.n.g]?.color || '#888'}"></span>
           <span class="vn">${esc(x.n.n)}</span>
           <span class="vd">${esc(x.t || '')}</span>
         </div>`).join('')
    : '';
  document.getElementById('ficha').classList.add('abierta');
}

document.getElementById('fVecinos').addEventListener('click', (e) => {
  const f = e.target.closest('[data-ir]');
  if (f) { const n = porId.get(f.dataset.ir); if (n) { abrir(n); mirarA(n); } }
});

/** Gira el cerebro para poner un nodo de frente. */
function mirarA(n) {
  const objY = Math.atan2(-n.x, n.z === 0 ? 0.001 : n.z) + Math.PI;
  const desde = { y: vista.giroY, x: vista.giroX }, t0 = performance.now();
  vista.autoGiro = false; document.getElementById('bGirar').classList.remove('on');
  (function paso(t) {
    const k = Math.min(1, (t - t0) / 620);
    const s = 1 - Math.pow(1 - k, 3);
    vista.giroY = desde.y + (objY - desde.y) * s;
    vista.giroX = desde.x + (0 - desde.x) * s;
    if (k < 1) requestAnimationFrame(paso);
  })(performance.now());
}

/**
 * Enlace directo a un nodo: /cerebro#validador abre ese nodo al cargar.
 * Sirve para mandarle a alguien exactamente la pieza de la que se le habla.
 */
window.__abrir = (id) => { const n = porId.get(id); if (n) { abrir(n); mirarA(n); } };
addEventListener('hashchange', () => window.__abrir(location.hash.slice(1)));
window.cerrarFicha = () => {
  sel = null; resaltados = null;
  document.getElementById('ficha').classList.remove('abierta');
};

// ── capas ──────────────────────────────────────────────────────────────────
const cuentaGrupo = {};
for (const n of nodos) cuentaGrupo[n.g] = (cuentaGrupo[n.g] || 0) + 1;
document.getElementById('listaGrupos').innerHTML = Object.entries(GRUPOS)
  .filter(([k]) => cuentaGrupo[k])
  .map(([k, g]) => `<div class="grupo" data-g="${k}">
      <span class="punto" style="background:${g.color}"></span>
      <span>${esc(g.nombre)}</span><span class="n">${cuentaGrupo[k]}</span>
    </div>`).join('');
document.getElementById('listaGrupos').addEventListener('click', (e) => {
  const f = e.target.closest('[data-g]');
  if (!f) return;
  const g = f.dataset.g;
  capasOcultas.has(g) ? capasOcultas.delete(g) : capasOcultas.add(g);
  f.classList.toggle('off', capasOcultas.has(g));
});

// ── buscar ─────────────────────────────────────────────────────────────────
document.getElementById('buscar').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { resaltados = sel ? resaltados : null; return; }
  const hallados = nodos.filter((n) =>
    n.n.toLowerCase().includes(q) || (n.d || '').toLowerCase().includes(q));
  resaltados = new Set(hallados.map((n) => n.id));
  if (hallados.length === 1) { abrir(hallados[0]); mirarA(hallados[0]); }
});

// ── botones ────────────────────────────────────────────────────────────────
window.alternarGiro = () => {
  vista.autoGiro = !vista.autoGiro;
  document.getElementById('bGirar').classList.toggle('on', vista.autoGiro);
};
window.centrar = () => {
  encajar();
  vista.giroY = 0.5; vista.giroX = -0.22;
  cerrarFicha(); document.getElementById('buscar').value = '';
};
window.reorganizar = () => { energia = 1; for (const n of nodos) n.fijo = false; };
window.alternarCapas = () => {
  const g = document.getElementById('grupos');
  g.classList.toggle('movil');
  document.getElementById('bCapas').classList.toggle('on', g.classList.contains('movil'));
};

// ═══════════════════════════════════════════════════════════════════════════
// LO QUE ESTA VIVO
//
// La estructura del ecosistema está escrita; el ESTADO se pregunta al abrir.
// Ninguna cifra que pueda mirarse en vivo está escrita a mano: un cerebro que
// dice «6 validadores» cuando hay uno es peor que uno que no dice nada.
// ═══════════════════════════════════════════════════════════════════════════

const enVivo = {};
const RPC = 'https://rpc.ordenglobal-rpc.com';

async function rpc(metodo, params = []) {
  const r = await fetch(RPC, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: metodo, params }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.result;
}

/**
 * Decodificador RLP mínimo, para sacar el conjunto validador del bloque.
 *
 * Los validadores no se publican por ninguna ruta del RPC —`ibft_getSnapshot`
 * no existe en este cliente— pero van dentro del `extraData` de cada bloque,
 * que sí se puede pedir. Es la única fuente que no puede mentir: es lo que la
 * cadena usa para decidir quién puede firmar.
 */
function rlp(b, i = 0) {
  const p = b[i];
  if (p < 0x80) return [b.slice(i, i + 1), i + 1];
  if (p <= 0xb7) { const n = p - 0x80; return [b.slice(i + 1, i + 1 + n), i + 1 + n]; }
  if (p <= 0xbf) {
    const ln = p - 0xb7; let n = 0;
    for (let k = 0; k < ln; k++) n = n * 256 + b[i + 1 + k];
    return [b.slice(i + 1 + ln, i + 1 + ln + n), i + 1 + ln + n];
  }
  const larga = p > 0xf7;
  const ln = larga ? p - 0xf7 : 0;
  let n = larga ? 0 : p - 0xc0;
  for (let k = 0; k < ln; k++) n = n * 256 + b[i + 1 + k];
  const fin = i + 1 + ln + n; const out = []; let j = i + 1 + ln;
  while (j < fin) { const [v, k] = rlp(b, j); out.push(v); j = k; }
  return [out, fin];
}

const hex = (u8) => '0x' + [...u8].map((x) => x.toString(16).padStart(2, '0')).join('');

function validadoresDe(extraData) {
  try {
    const b = new Uint8Array(extraData.slice(2).match(/../g).map((h) => parseInt(h, 16)));
    const [datos] = rlp(b.slice(32));   // los 32 primeros bytes son relleno
    const dirs = [];
    (function buscar(x) {
      if (x instanceof Uint8Array) { if (x.length === 20) dirs.push(hex(x)); }
      else if (Array.isArray(x)) x.forEach(buscar);
    })(datos[0]);
    return dirs;
  } catch (e) { return []; }
}

const nf = (n) => Number(n).toLocaleString('es');

async function traerCadena() {
  const [alturaHex, peersHex, bloque] = await Promise.all([
    rpc('eth_blockNumber'), rpc('net_peerCount'), rpc('eth_getBlockByNumber', ['latest', false]),
  ]);
  const altura = parseInt(alturaHex, 16);
  const anterior = await rpc('eth_getBlockByNumber', ['0x' + (altura - 20).toString(16), false]);
  const seg = (parseInt(bloque.timestamp, 16) - parseInt(anterior.timestamp, 16)) / 20;
  const vals = validadoresDe(bloque.extraData);

  enVivo.cadena = {
    'Altura': nf(altura), 'Chain ID': parseInt(bloque.number ? '0x2154' : '0', 16) || 8532,
    'Entre bloques': seg.toFixed(1) + ' s', 'Gas límite': nf(parseInt(bloque.gasLimit, 16)),
  };
  enVivo.rpc = { 'Estado': 'responde', 'Peers': parseInt(peersHex, 16), 'Altura': nf(altura) };
  enVivo.validadores = {
    'Validadores activos': vals.length,
    'Nodos en la red': parseInt(peersHex, 16) + 1,
    'Dirección': vals[0] ? vals[0].slice(0, 10) + '…' + vals[0].slice(-6) : 'no se pudo leer',
  };

  // El nodo del problema abierto se pinta con la verdad de la cadena, no con
  // lo que alguien escribió hace un mes.
  const a = porId.get('a-validador');
  if (a && vals.length) {
    a.d = `El conjunto validador de la cadena tiene ${vals.length === 1 ? 'UNA sola dirección' : vals.length + ' direcciones'}: `
      + `${vals.map((v) => v.slice(0, 10) + '…').join(', ')}. `
      + `Hay ${parseInt(peersHex, 16) + 1} nodos en la red, pero los demás solo sincronizan y sirven RPC — no firman. `
      + 'Es centralización real, no de papel. Ponerlos a validar mueve tesorería: necesita la Junta.';
  }
  return { altura, peers: parseInt(peersHex, 16), vals: vals.length };
}

async function traerGenesis() {
  try {
    const s = await (await fetch('/healthz')).json();
    const c = s.comprobaciones || {};
    enVivo['genesis-salud'] = {
      'Estado': s.estado, 'Datos persistentes': c.almacenPersistente ? 'sí' : 'NO',
      'Listas de sanciones': c.listasCargadas ? 'cargadas' : 'SIN CARGAR',
      'Biometría': c.proveedorBiometria || (c.biometria ? 'sí' : 'no'),
      'Bitácora íntegra': c.bitacoraIntegra ? 'sí' : 'NO',
      'Sesión única': c.ssoConfigurado ? 'activa' : 'apagada',
    };
    enVivo.genesis = enVivo['genesis-salud'];
  } catch (e) { /* si no responde, la ficha simplemente no trae estado */ }

  // Si el operador ya entró por el panel, su sesión sirve aquí también.
  const t = localStorage.getItem('gid.sesion');
  if (!t) return;
  try {
    const cab = { Authorization: 'Bearer ' + t };
    const [dir, res] = await Promise.all([
      fetch('/api/panel/directorio/resumen', { headers: cab }).then((r) => r.ok ? r.json() : null),
      fetch('/api/panel/resumen', { headers: cab }).then((r) => r.ok ? r.json() : null),
    ]);
    if (dir) enVivo.padron = {
      'Personas': nf(dir.total), 'Con billetera': nf(dir.conWallet),
      'Con Genesis ID': nf(dir.conGid), 'Con saldo': nf(dir.conSaldo),
    };
    if (res) {
      enVivo.telemetria = { 'Identidades': nf(res.identidades.total), 'Verificadas': nf(res.identidades.verificadas) };
      enVivo.genesis = { ...enVivo.genesis, 'Identidades': nf(res.identidades.total),
        'Verificadas': nf(res.identidades.verificadas), 'En revisión': nf(res.identidades.enRevision) };
    }
  } catch (e) { /* sin sesión válida se sigue con lo público */ }
}

async function traerDominios() {
  // Se comprueban con `no-cors`: no se puede leer la respuesta, pero si la
  // petición no revienta el dominio está sirviendo. Es todo lo que hace falta
  // saber aquí, y evita pedirle a nadie que abra CORS solo para esto.
  const sitios = { 'dom-app': 'https://app.vetawallet.com/', 'dom-legal': 'https://legal.vetawallet.com/', 'dom-www': 'https://www.vetawallet.com/' };
  await Promise.all(Object.entries(sitios).map(async ([k, url]) => {
    try {
      await fetch(url, { mode: 'no-cors', cache: 'no-store' });
      enVivo[k] = { 'Estado': 'responde', 'Comprobado': new Date().toLocaleTimeString('es') };
    } catch (e) {
      enVivo[k] = { 'Estado': 'no responde', 'Comprobado': new Date().toLocaleTimeString('es') };
    }
  }));
}

async function refrescar() {
  const chip = document.getElementById('vivo');
  const txt = document.getElementById('vivoTxt');
  try {
    const [c] = await Promise.all([traerCadena(), traerGenesis(), traerDominios()]);
    chip.classList.remove('malo');
    txt.innerHTML = `bloque <b class="num">${nf(c.altura)}</b> · ${c.peers} peers · `
      + `<b style="color:${c.vals === 1 ? 'var(--bad)' : 'var(--ok)'}">${c.vals} validador${c.vals === 1 ? '' : 'es'}</b>`;
    if (sel) abrir(sel);   // la ficha abierta se actualiza sola
  } catch (e) {
    chip.classList.add('malo');
    txt.textContent = 'sin conexión con la cadena';
  }
}

// ── arranque ───────────────────────────────────────────────────────────────
tamano();
encajar();
requestAnimationFrame(bucle);
refrescar();
setInterval(refrescar, 30000);
