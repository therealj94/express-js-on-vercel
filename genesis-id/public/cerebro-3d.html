<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis Core · el cerebro del ecosistema</title>
<meta name="theme-color" content="#02060B">
<!-- Embebido: sin esto el navegador pide /favicon.ico y se lleva un 404 en
     cada carga, y en una proyección la pestaña queda con el icono genérico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' rx=\'8\' fill=\'%2302060B\'/%3E%3Ccircle cx=\'16\' cy=\'16\' r=\'5\' fill=\'%236FE3F5\'/%3E%3Ccircle cx=\'7\' cy=\'9\' r=\'2.2\' fill=\'%23C9A961\'/%3E%3Ccircle cx=\'25\' cy=\'10\' r=\'2.2\' fill=\'%237BE0C0\'/%3E%3Ccircle cx=\'24\' cy=\'24\' r=\'2.2\' fill=\'%239B8FD8\'/%3E%3Ccircle cx=\'8\' cy=\'24\' r=\'2.2\' fill=\'%23F0776B\'/%3E%3Cg stroke=\'%236FE3F5\' stroke-width=\'1\' opacity=\'.55\'%3E%3Cpath d=\'M16 16 7 9M16 16l9-6M16 16l8 8M16 16l-8 8\'/%3E%3C/g%3E%3C/svg%3E">
<!-- Esta pantalla es para ENSEÑAR, y por eso no se indexa: la versión que
     circula es la que se proyecta en una reunión, no una que aparezca en una
     búsqueda con el mapa de la casa dentro. -->
<meta name="robots" content="noindex,nofollow">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' https://cerebro.ordenscan.com;
  media-src 'self' https://cerebro.ordenscan.com;
  form-action 'none';
  base-uri 'self'">
<!-- `media-src` y `connect-src` abren UN origen y solo uno: cerebro.ordenscan.com,
     que es donde vive el banco de voz grabado de la casa. No se abre a `*`: la
     gracia de esta cabecera es que si alguien colara una etiqueta en esta
     página, no pudiera sacar nada hacia donde quisiera. El banco sirve con
     `access-control-allow-origin: *`, así que además se puede ANALIZAR la
     señal para mover la boca al ritmo del audio de verdad. -->

<style>
/* ═══ GENESIS CORE · LA VISTA DE PRESENTACIÓN ════════════════════════════════

   QUÉ ES Y QUÉ NO ES

   El cerebro de trabajo es `cerebro.html`: tiene panel de capas, ficha de cada
   pieza y los datos en vivo. Es una herramienta interna y se sigue usando para
   eso.

   Esta pantalla es otra cosa: es la que se PROYECTA. No tiene panel, no tiene
   ficha, no se puede hurgar. Enseña la ARQUITECTURA —cuántas piezas hay, cómo
   se agrupan, cómo se hablan— y no el contenido de ninguna.

   Esa distinción es la que respeta la regla que ya tenía la casa («Genesis
   Core no se fotografía»): lo que no se enseña es lo que el cerebro SABE. Que
   existe, cuántas piezas tiene y cómo laten, se puede enseñar — de hecho es
   justo lo que impresiona, y no revela nada que sirva para atacarnos.

   LOS NÚMEROS SON REALES. Cada etiqueta cuenta las piezas de verdad que hay en
   `cerebro-datos.js`. Las dendritas que salen de cada neurona son TEXTURA, no
   piezas: por eso no se cuentan ni se etiquetan. Inflar el recuento para que
   se vea más grande sería exactamente lo que esta casa no hace. */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02060B;
  /* Sin esto, en el móvil el arrastre para girar el cerebro también tira de la
     página: el navegador la desplaza, la refresca al tirar hacia abajo, y el
     gesto se pierde a la mitad. */
  overscroll-behavior:none;touch-action:none}
body{font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#DCE7F5;
  -webkit-font-smoothing:antialiased;
  /* El texto no se selecciona: mantener el dedo apoyado sobre el lienzo
     mientras se gira sacaba la lupa y el menú de copiar. */
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}

/* El sello: qué es esto, en una línea, arriba a la izquierda. En una
   proyección la gente entra a mitad de la explicación y hay que decirle qué
   está mirando sin que nadie tenga que decirlo en voz alta. */
#sello{position:fixed;top:26px;left:30px;z-index:10;pointer-events:none}
#sello .t{font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:#6FE3F5;text-shadow:0 0 18px rgba(111,227,245,.6)}
#sello .s{margin-top:9px;font-size:12.5px;color:#5B7085;letter-spacing:.05em}

/* El pie: el pulso y la ayuda. */
#pie{position:fixed;bottom:24px;left:30px;right:30px;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  font-size:11.5px;color:#4C6076;letter-spacing:.08em;pointer-events:none}
#pulso{display:flex;align-items:center;gap:10px;color:#6FE3F5}
#pulso i{width:8px;height:8px;border-radius:50%;background:#6FE3F5;
  box-shadow:0 0 14px #6FE3F5;animation:latir 2.4s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(.75);opacity:.55}12%{transform:scale(1.5);opacity:1}}
#ayuda{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
#ayuda .nota{color:#3C4E60}

/* ══ EL TELÉFONO ══════════════════════════════════════════════════════════
   Misma pieza, no una versión recortada. Lo que cambia es lo que en una
   pantalla de seis pulgadas estorba: los márgenes grandes, el texto de
   proyector y la ayuda en dos líneas al lado del pulso.

   Los márgenes salen de `env(safe-area-inset-*)` porque esto se abre DENTRO
   de la app: sin eso el sello se mete debajo de la muesca y el pie debajo de
   la barra de gestos. */
/* La misma regla que el guion: manda el lado corto. Un teléfono acostado
   entra por `max-height`. */
@media (max-width:620px), (max-height:620px){
  #sello{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left))}
  #sello .t{font-size:11px;letter-spacing:.26em}
  #sello .s{margin-top:6px;font-size:10.5px}
  #pie{
    bottom:calc(12px + env(safe-area-inset-bottom));
    left:calc(16px + env(safe-area-inset-left));
    right:calc(16px + env(safe-area-inset-right));
    /* En vertical las dos mitades no caben en una línea: el pulso arriba y la
       ayuda debajo, ambos a la izquierda. Forzarlas en fila las parte a mitad
       de palabra. */
    flex-direction:column;align-items:flex-start;gap:5px;font-size:10px}
  #ayuda{align-items:flex-start;text-align:left;gap:3px;line-height:1.45}
  /* La nota de honestidad se queda; lo que se acorta es el margen alrededor,
     no el texto. Que quepa en dos renglones es aceptable — quitarla no. */
  #ayuda .nota{max-width:100%}
}
@media (prefers-reduced-motion:reduce){#pulso i{animation:none}}

/* ══ LA FICHA DE UNA PIEZA ══════════════════════════════════════════════════ */
#ficha{position:fixed;left:30px;top:96px;z-index:12;width:min(340px,calc(100vw - 60px));
  background:rgba(4,12,20,.93);border:1px solid rgba(111,227,245,.34);border-radius:10px;
  padding:14px 16px 15px;backdrop-filter:blur(8px)}
#ficha[hidden]{display:none}
#ficha .cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
#ficha .reg{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#6FE3F5}
#ficha .x{background:none;border:0;color:#5B7085;font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
#ficha .x:hover{color:#DCE7F5}
#ficha h2{margin:7px 0 8px;font-size:15px;font-weight:600;color:#EAF3FB;letter-spacing:.02em}
#ficha .txt{font-size:12.5px;line-height:1.62;color:#B6CADA}
#ficha .pie{margin-top:10px;font-size:10px;line-height:1.5;color:#4C6076;letter-spacing:.04em}

/* ══ LOS TEMAS ══════════════════════════════════════════════════════════════ */
#temas{position:fixed;left:30px;bottom:74px;z-index:11;
  display:flex;flex-wrap:wrap;gap:6px;max-width:min(430px,calc(100vw - 320px))}
#temas button{
  padding:6px 12px;border-radius:999px;cursor:pointer;
  background:rgba(3,12,20,.78);border:1px solid rgba(111,227,245,.24);
  color:#7E9AB0;font:600 10px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.13em;text-transform:uppercase}
#temas button:hover{border-color:rgba(111,227,245,.6);color:#BFDCEA}
#temas button.viva{border-color:#6FE3F5;color:#6FE3F5;background:rgba(8,30,44,.9)}
#temas button:focus-visible{outline:2px solid #6FE3F5;outline-offset:2px}

/* ══ LA CARA Y LO QUE DICE ══════════════════════════════════════════════════ */
#cara{position:fixed;right:26px;bottom:74px;z-index:11;
  display:flex;flex-direction:column;align-items:center;gap:8px}
#lienzoCara{width:210px;height:248px;display:block;pointer-events:none}
#botonHablar{
  display:flex;align-items:center;gap:8px;
  padding:7px 15px 7px 12px;border-radius:999px;cursor:pointer;
  background:rgba(3,12,20,.82);border:1px solid rgba(111,227,245,.5);
  color:#6FE3F5;font:600 11px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.16em;text-transform:uppercase}
#botonHablar:hover{border-color:#6FE3F5;background:rgba(8,26,38,.9)}
#botonHablar:focus-visible{outline:2px solid #6FE3F5;outline-offset:3px}
/* El triángulo/cuadrado del botón se dibuja con bordes en vez de con un
   carácter: «▶» y «■» salen de tamaños distintos en cada sistema y el botón
   daba un salto al cambiar de estado. */
#botonHablar .pico{width:0;height:0;border-left:8px solid currentColor;
  border-top:5px solid transparent;border-bottom:5px solid transparent}
#botonHablar.hablando .pico{width:9px;height:9px;border:0;background:currentColor}

#dice{position:fixed;left:50%;transform:translateX(-50%);
  bottom:74px;z-index:11;width:min(760px,calc(100vw - 300px));
  text-align:center;font-size:14px;line-height:1.55;color:#CFE2F2;
  text-shadow:0 2px 18px rgba(0,0,0,.95);pointer-events:none;
  opacity:0;transition:opacity .25s}
#dice.viva{opacity:1}

@media (max-width:620px), (max-height:620px){
  /* En el teléfono las tres cosas se APILAN, de abajo arriba: el pie, la cara
     con su botón, y encima el subtítulo a todo el ancho.

     En horizontal, como en el escritorio, no cabían: el subtítulo caía justo
     encima de la cara y se leía el texto sobre la malla. Con cuatrocientos
     píxeles de ancho no hay sitio para dos columnas — hay sitio para una. */
  /* 86 y no 70: a 70 el botón quedaba justo encima del renglón del pulso y se
     leía «13 regiones PARAR» de corrido. */
  #cara{right:10px;bottom:calc(86px + env(safe-area-inset-bottom));gap:5px}
  #lienzoCara{width:100px;height:118px}
  #botonHablar{padding:5px 11px 5px 9px;font-size:9.5px;letter-spacing:.12em}
  /* La ficha ocupa el ancho y sale por abajo, encima de todo: en el teléfono
     una tarjeta flotando a un lado deja cuatro palabras por renglón. */
  #ficha{left:12px;right:12px;width:auto;top:auto;
    bottom:calc(70px + env(safe-area-inset-bottom));padding:12px 13px 13px}
  #ficha h2{font-size:14px}
  #ficha .txt{font-size:12px;line-height:1.55}
  /* Los temas se hacen una tira que se desliza: siete botones no caben en
     cuatrocientos píxeles, y apilarlos en tres filas se come la pantalla. */
  #temas{left:0;right:0;max-width:none;padding:0 14px;
    bottom:calc(196px + env(safe-area-inset-bottom));
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
  #temas::-webkit-scrollbar{display:none}
  #temas button{flex:0 0 auto;font-size:9px;padding:5px 10px}
  /* Con la ficha abierta, los temas se van. En cuatrocientos píxeles de ancho
     no caben las dos cosas: la ficha les caía justo encima y el botón de abajo
     dejaba de responder — el toque se lo comía la tarjeta. Y apilarlas obliga a
     subir la ficha hasta la mitad de la pantalla, encima del cerebro.
     Cerrar la ficha —tocando el fondo— devuelve los temas. */
  body.ficha-abierta #temas{display:none}
  #dice{width:calc(100vw - 32px);left:16px;transform:none;
    bottom:calc(238px + env(safe-area-inset-bottom));
    font-size:12.5px;line-height:1.5;text-align:left}
}
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<div id="sello">
  <div class="t">Genesis Core</div>
  <div class="s">El cerebro del ecosistema Orden Global</div>
</div>

<!-- ══ LA FICHA ════════════════════════════════════════════════════════════
     Lo que se abre al tocar una pieza. Va a la izquierda, lejos de la cara, y
     se cierra sola al tocar el fondo: en una proyección nadie quiere buscar
     una equis. -->
<aside id="ficha" hidden>
  <div class="cab"><span class="reg"></span><button class="x" type="button" aria-label="Cerrar">✕</button></div>
  <h2></h2>
  <p class="txt"></p>
  <p class="pie"></p>
</aside>

<!-- ══ LOS TEMAS ═══════════════════════════════════════════════════════════
     Siete cosas de las que la voz puede hablar. Botones y no un desplegable:
     en una reunión hay que poder saltar a «lo legal» de un toque, sin abrir
     un menú delante de todos. -->
<nav id="temas" aria-label="De qué puede hablar"></nav>

<!-- ══ LA CARA ═════════════════════════════════════════════════════════════
     Va debajo del cerebro y a un lado, no en el medio: en el medio tapa
     justo la masa que hay que mirar mientras habla de ella. -->
<div id="cara">
  <canvas id="lienzoCara"></canvas>
  <button id="botonHablar" type="button" aria-label="Que Genesis Core presente el ecosistema">
    <span class="pico"></span><span class="rot">Presentar</span>
  </button>
</div>

<!-- El subtítulo. Está siempre que se habla, y no como accesorio: en una sala
     con ruido —o con alguien que no oye bien— el subtítulo ES la
     presentación. Y es lo que permite comprobar de un vistazo que el audio
     dice lo que pone. -->
<div id="dice" aria-live="polite"></div>

<div id="pie">
  <div id="pulso"><i></i><span id="txtPulso">—</span></div>
  <!-- Esta línea no es decoración. Si alguien en la sala pregunta «¿esos miles
       de puntos son piezas?», la respuesta ya está en pantalla y no depende de
       que quien proyecta se acuerde de aclararlo. -->
  <div id="ayuda">
    <span class="nota">El tejido es textura · lo contado son las piezas del mapa</span>
    <!-- El texto del gesto lo pone el guion: en un teléfono no hay rueda de
         ratón, y decirle a alguien que use una que no tiene es peor que no
         decir nada. -->
    <span id="gesto">Arrastrá para girar · rueda para acercar</span>
  </div>
</div>

<script type="module" src="cerebro-3d.js"></script>
</body>
</html>
